name: test

on:
  push:
    branches: [main]
  pull_request:

# Testler yalnızca kodu okur; iş akışı jetonu depoya yazamasın.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Bağımlılıklar
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Tip denetimi
        run: uv run mypy src
      - name: Kural setleri
        run: uv run python tools/validate_rulesets.py
      - name: Testler
        run: uv run pytest -q

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Bağımlılık açıkları
        run: |
          uv export --frozen --no-hashes --no-emit-project -o requirements-audit.txt
          uvx pip-audit==2.10.1 -r requirements-audit.txt --no-deps --disable-pip
