name: test

on:
  push:
    branches: [main]
  pull_request:

# Testler yalnızca kodu okur; iş akışı jetonu depoya yazamasın.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
      - name: Bağımlılıklar
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Tip denetimi
        run: uv run mypy src
      - name: Kural setleri
        run: uv run python tools/validate_rulesets.py
      - name: Testler
        run: uv run pytest -q

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
      - name: Bağımlılık açıkları
        run: |
          uv export --frozen --no-hashes --no-emit-project -o requirements-audit.txt
          uvx pip-audit==2.10.1 -r requirements-audit.txt --no-deps --disable-pip
