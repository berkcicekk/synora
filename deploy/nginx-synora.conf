# /etc/nginx/sites-available/synora — TLS sonlandırma ve ters vekil.
# Erişim kaydında sorgu dizesi YOK: /auth?token=… giriş bağlantısı 15 dakika geçerlidir.
log_format synora_noquery '$time_iso8601 $status $request_method $uri $body_bytes_sent $request_time';

# Giriş/kayıt isteği sınırı (IP başına; ONERILER Ö7 için ilk katman).
limit_req_zone $binary_remote_addr zone=synora_login:10m rate=20r/h;

server {
    listen 80;
    server_name synora.example.edu.tr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name synora.example.edu.tr;

    ssl_certificate     /etc/letsencrypt/live/synora.example.edu.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/synora.example.edu.tr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/synora.access.log synora_noquery;

    # Tez yükleme sınırı 50 MB (uygulama da denetler); kopya üretimi 120 sn'ye kadar sürebilir.
    client_max_body_size 51m;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    location = /login { limit_req zone=synora_login burst=5 nodelay; limit_req_status 429; include /etc/nginx/synora_proxy.conf; }
    location = /kayit { limit_req zone=synora_login burst=5 nodelay; limit_req_status 429; include /etc/nginx/synora_proxy.conf; }

    location / {
        include /etc/nginx/synora_proxy.conf;
    }
}

# /etc/nginx/synora_proxy.conf içeriği:
#   proxy_pass http://127.0.0.1:8000;
#   proxy_set_header Host $host;
#   proxy_set_header X-Forwarded-For $remote_addr;
#   proxy_set_header X-Forwarded-Proto https;
#   proxy_request_buffering off;   # ZORUNLU: açıkken nginx büyük gövdeyi (tezi) geçici dosyaya yazar
