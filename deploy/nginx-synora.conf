# /etc/nginx/sites-available/synora — TLS sonlandırma ve ters vekil.
# Erişim kaydında sorgu dizesi YOK: /auth?token=… giriş bağlantısı 15 dakika geçerlidir.
log_format synora_noquery '$time_iso8601 $status $request_method $uri $body_bytes_sent $request_time';

# Giriş/kayıt isteği sınırı (IP başına, yalnızca POST; ONERILER Ö7 için ilk katman). Kampüste
# öğrenciler ortak bir IP arkasında olabilir: sınır cömert, asıl sınır uygulamada e-posta başına.
map $request_method $synora_login_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $synora_login_key zone=synora_login:10m rate=30r/m;

server {
    listen 80;
    server_name synora.example.edu.tr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;  # nginx < 1.25.1 (Ubuntu 24.04, Debian 12) "http2 on;" bilmez
    server_name synora.example.edu.tr;

    ssl_certificate     /etc/letsencrypt/live/synora.example.edu.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/synora.example.edu.tr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/synora.access.log synora_noquery;
    # Hata kaydı istek satırını (sorgu dizesi dahil) yazabilir: yalnızca ciddi hatalar.
    error_log /var/log/nginx/synora.error.log crit;

    # Tez yükleme sınırı 100 MB + 1 MB pay. Uygulamadaki max_upload_bytes ile birlikte
    # değişmeli; nginx'inki küçük kalırsa öğrenci nginx'in İngilizce 413 sayfasını görür.
    # Kopya üretimi 120 sn'ye kadar sürebilir.
    client_max_body_size 101m;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    location = /login { limit_req zone=synora_login burst=20 nodelay; limit_req_status 429; include /etc/nginx/synora_proxy.conf; }
    location = /kayit { limit_req zone=synora_login burst=20 nodelay; limit_req_status 429; include /etc/nginx/synora_proxy.conf; }

    location / {
        include /etc/nginx/synora_proxy.conf;
    }
}

# /etc/nginx/synora_proxy.conf içeriği:
#   proxy_pass http://127.0.0.1:8000;
#   proxy_http_version 1.1;          # gerekli: yoksa parçalı gövde yine tamponlanır
#   proxy_set_header Host $host;
#   proxy_set_header X-Forwarded-For $remote_addr;
#   proxy_set_header X-Forwarded-Proto https;
#   proxy_set_header X-Real-IP $remote_addr;   # hız sınırları (SYNORA_CLIENT_IP_HEADER=x-real-ip)
#   proxy_set_header CF-Connecting-IP "";      # istemcinin uydurduğu başlık uygulamaya geçmesin
#   proxy_request_buffering off;   # ZORUNLU: açıkken nginx büyük gövdeyi (tezi) geçici dosyaya yazar
