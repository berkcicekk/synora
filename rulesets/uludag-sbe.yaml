# Bursa Uludağ Üniversitesi Sosyal Bilimler Enstitüsü — Lisansüstü Tez/Proje Yazım Kılavuzu (2021)
# Kaynak: https://uludag.edu.tr/dosyalar/sosyalbilimler/2020%20KLAS%C3%96R/Tez%20Yazim%20Kilavuzu%2015.03.2021%20g%C3%BCncelleme/tez_yazim_kilavuzu_2.pdf
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
# Not: Kılavuz Times New Roman 12 (dipnot 10) ya da Arial 11 (dipnot 9) seçeneği verir; metin/dipnot puntosu
# yazı tipine bağlı olduğundan burada denetlenmez. Hizalama "iki yana yasla" veya "sola hizala" olabilir (II.B.5).
# Başlık biçimi iki maddeleştirme sisteminden birine göre değişir (II.B.7); yalnızca ortak kurallar alındı.
ruleset: uludag-sbe
version: 1
name: "Bursa Uludağ Üniversitesi · Sosyal Bilimler Enstitüsü"
source: "BUÜ Sosyal Bilimler Enstitüsü Lisansüstü Tez Yazım Kılavuzu, 2021"
institution: "Bursa Uludağ Üniversitesi"
source_url: https://uludag.edu.tr/dosyalar/sosyalbilimler/2020%20KLAS%C3%96R/Tez%20Yazim%20Kilavuzu%2015.03.2021%20g%C3%BCncelleme/tez_yazim_kilavuzu_2.pdf

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # II.A "A4 boyutunda"
  margins_cm: { top: 3.0, bottom: 3.0, left: 4.0, right: 2.0 }  # II.B.1 "sol 4 cm, üst ve alt 3 cm, sağ 2 cm"

fonts:
  allowed: [Times New Roman, Arial]  # II.B.4 "Times New Roman 12 ... ; Arial 11"

roles:
  body:
    line_spacing: 1.5           # II.B.5 "1.5 aralıklı"
  heading_1:
    size_pt: 14                 # II.B.4 "bölüm, alt bölümlerinin başlıkları için 14 punto"
    bold: true                  # II.B.7 her iki sistemde ana başlıklar "tümü büyük harf ve yazılar koyu"
    all_caps: true              # II.B.7
    page_break_before: true     # II.B.7 "Bölümler daima yeni bir sayfadan başlar"
  heading_2:
    size_pt: 14                 # II.B.4
    all_caps: true              # II.B.7 her iki sistemde birinci alt başlıklar "tümü büyük harf"
  heading_3:
    size_pt: 14                 # II.B.4
  figure_caption:
    line_spacing: 1.0           # II.B.5 "tablo ve şekillerin isim ve açıklamaları ... tek aralıklı"
  table_caption:
    line_spacing: 1.0           # II.B.5
  block_quote:
    line_spacing: 1.0           # III.B.2 "tek aralıkla yazılır"
    indent_left_cm: 1.25        # III.B.2 "her iki kenar boşluğundan 1.25 cm içeriden"
    first_line_indent_cm: 0     # III.B.2 "Paragraf başı yapılmayan"
    space_before_pt: 12         # III.B.2 "önce ve sonra 12 nokta (punto) boşluk"
    space_after_pt: 12          # III.B.2
  reference_entry:
    line_spacing: 1.0           # II.B.5 "kaynaklar ... tek aralıklı"
    indent_left_cm: 1.0         # III.C.1 "Yazar adlarından sonraki satırlar 1 cm girintili"
    first_line_indent_cm: -1.0  # III.C.1 asılı girinti
  footnote:
    line_spacing: 1.0           # II.B.5 "dipnotlar tek aralıklı"

page_numbering:
  # II.B.3: girişe kadar küçük Romen (i, ii…), girişten itibaren 1, 2, 3…
  formats_in_order: [lowerRoman, decimal]
  position: bottom_center       # II.B.2 "alt kenarından 1.5 cm yukarıda ortada"
  forbid_decoration: true       # II.B.2 "parantez, çizgi vb. işaretler kullanılmadan"

document:
  forbid_tracked_changes: true
