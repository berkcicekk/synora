# ÖRNEK kural seti — herhangi bir enstitünün resmi kuralları DEĞİLDİR.
# Türkiye'deki lisansüstü tez kılavuzlarında sık görülen değerlerle hazırlanmıştır.
# ZBEÜ kural seti (rulesets/zbeu.yaml) enstitünün güncel kılavuzundan çıkarılacak.
ruleset: example
version: 1
name: Örnek Enstitü
source: Yaygın değerlerden derlenmiş örnek; resmi kaynak yok

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4
  orientation: portrait
  margins_cm: { top: 3.0, bottom: 2.5, left: 3.5, right: 2.5 }

fonts:
  allowed: [Times New Roman]

roles:
  body:
    size_pt: 12
    alignment: justify
    line_spacing: 1.5
    first_line_indent_cm: 1.25
    space_before_pt: 0
    space_after_pt: 6
  heading_1:
    size_pt: 14
    bold: true
    all_caps: true
    alignment: center
    page_break_before: true
    space_after_pt: 12
  heading_2:
    size_pt: 12
    bold: true
    alignment: left
  heading_3:
    size_pt: 12
    bold: true
    italic: true
    alignment: left
  figure_caption:
    size_pt: 10
    alignment: center
  table_caption:
    size_pt: 10
    alignment: left
  block_quote:
    size_pt: 11
    line_spacing: 1.0
    indent_left_cm: 1.0
  footnote:
    size_pt: 10
    line_spacing: 1.0
  reference_entry:
    size_pt: 12
    line_spacing: 1.0
    first_line_indent_cm: -1.0
    space_after_pt: 6

page_numbering:
  formats_in_order: [lowerRoman, decimal]

document:
  forbid_tracked_changes: true
