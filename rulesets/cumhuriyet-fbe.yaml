# Sivas Cumhuriyet Üniversitesi Fen Bilimleri Enstitüsü — Tez Yazım Kılavuzu (Temmuz 2014; Senato 20.08.2014, 7 sayılı karar)
# Kaynak: https://fenbilenst.cumhuriyet.edu.tr/webdosya/79_tez_yazim_kilavuzue06e7f5b7285aa53f6ea6971313c9b6d.zip
#   (zip içindeki Tez_Yazim_Kilavuzu.doc; sayfa: https://fenbilenst.cumhuriyet.edu.tr/79-tez-yazim-kilavuzu)
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
# Not: Kılavuz iki yazı tipine izin veriyor (Times New Roman 12 pt ya da Arial 10 pt, 2.5);
# punto yazı tipine bağlı olduğundan gövde puntosu burada denetlenmez.
ruleset: cumhuriyet-fbe
version: 1
name: "Sivas Cumhuriyet Üniversitesi · Fen Bilimleri Enstitüsü"
source: "Sivas Cumhuriyet Üniversitesi Fen Bilimleri Enstitüsü Tez Yazım Kılavuzu, 2014"
institution: "Sivas Cumhuriyet Üniversitesi"
source_url: https://fenbilenst.cumhuriyet.edu.tr/webdosya/79_tez_yazim_kilavuzue06e7f5b7285aa53f6ea6971313c9b6d.zip

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 2.1 "A4 boyutundaki (210 mm x 297 mm)"
  # 2.4: dikey sayfalarda sol 35 mm, diğer kenarlar 25 mm; ayrıca soldan 5 mm cilt payı (oluk) — burada denetlenmez
  margins_cm: { top: 2.5, bottom: 2.5, left: 3.5, right: 2.5 }

fonts:
  allowed: [Times New Roman, Arial]   # 2.5

roles:
  body:
    line_spacing: 1.5           # 2.7
    alignment: justify          # 2.4 "iki yana yasla"
    space_before_pt: 6          # 2.7 "paragraflardan önce ve sonra 6 punto aralık"
    space_after_pt: 6           # 2.7
  heading_1:
    bold: true                  # 2.6, 5.1 "tüm başlıklar koyu"
    all_caps: true              # 5.1 "büyük harfle"
    alignment: left             # 5.1 "sola yanaşık"
    page_break_before: true     # 5.1 "bulunduğu sayfanın başında yer alacak şekilde"
  heading_2:
    bold: true                  # 2.6, 5.1
    case: title                 # 2.6, 5.1 "tüm kelimelerinin ilk harfleri büyük"
    alignment: left             # 5.1 "sola yaslı"
  heading_3:
    bold: true                  # 2.6, 5.1
    alignment: left             # 5.1
    # ÇELİŞKİ: 2.6 "ilk harf büyük diğerleri küçük" (cümle düzeni), 5.1 "kelimelerin ilk harfleri büyük" — büyük/küçük harf denetlenmez.
  figure_caption:
    line_spacing: 1.0           # 2.7, 5.3 "tek satır aralığı"
    alignment: center           # 5.3 "sayfanın ortasına gelecek şekilde"
    case: sentence              # 5.3 "başlığın ilk harfi büyük, diğer tüm harfleri küçük"
    position: below             # 5.3 "şeklin altına"
  table_caption:
    line_spacing: 1.0           # 2.7, 5.4
    alignment: center           # 5.4 "sayfanın ortasına gelecek şekilde"
    case: sentence              # 5.4
    position: above             # 5.4 "çizelge başlıklarından önce ve çizelgelerden sonra" boşluk (başlık çizelgenin üstünde)
  reference_entry:
    line_spacing: 1.0           # 2.7, 5.8 "tek satır aralığı"
    first_line_indent_cm: -1.0  # 5.8 "10 mm'lik asılı girinti"
    space_after_pt: 0           # 5.8 "kaynaklar arasında boşluk bırakılmamalıdır"
  footnote:
    line_spacing: 1.0           # 2.7, 5.7 "tek satır aralığı"
    alignment: left             # 5.7 "sola yaslı"

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # 2.9 girişten önce küçük Romen, girişten itibaren 1, 2, 3
  position: bottom_center       # 2.4, 2.9 "sayfanın altına ve orta kısma"
  forbid_decoration: true       # 2.9 "önü ve arkasında herhangi bir işaret bulunmamalıdır"

document:
  forbid_tracked_changes: true
