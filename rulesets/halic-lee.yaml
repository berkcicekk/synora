# Haliç Üniversitesi Lisansüstü Eğitim Enstitüsü — Tez Yazım Kılavuzu (ENS.FR.026, İstanbul 2024)
# Kaynak: https://halic.edu.tr/tr/s-akademik/s-enstituler/s-lisansustu-egitim-enstitusu/docs/ENS.FR.026-tez-yazim-kilavuzu.pdf
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
# Not: Kenar boşlukları yalnızca Şekil 1.1/1.2'de görsel olarak verilmiş (metinde değer yok) → denetlenmez.
ruleset: halic-lee
version: 1
name: "Haliç Üniversitesi · Lisansüstü Eğitim Enstitüsü"
source: "Haliç Üniversitesi Lisansüstü Eğitim Enstitüsü Tez Yazım Kılavuzu, 2024"
institution: "Haliç Üniversitesi"
source_url: "https://halic.edu.tr/tr/s-akademik/s-enstituler/s-lisansustu-egitim-enstitusu/docs/ENS.FR.026-tez-yazim-kilavuzu.pdf"

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 1.1 "A4 (21 x 29,7 cm)"

fonts:
  allowed: [Times New Roman]    # 1.3 "sadece Times New Roman"

roles:
  body:
    size_pt: 12                 # 1.3 "yazı büyüklüğü 12 punto"
    line_spacing: 1.5           # 1.5 "1,5 satır aralıklı"
    alignment: justify          # 1.2 "iki yana yasla"
    space_before_pt: 6          # 1.5 "Paragraflardan önce ve sonra 6 nk"
    space_after_pt: 6           # 1.5
  heading_1:
    size_pt: 16                 # 1.5 "Birinci derece başlık ve numarası 16 punto"
    bold: true                  # 1.5 "hepsi koyudur"
    all_caps: true              # 1.5 "büyük harfle"
    space_before_pt: 72         # 1.5 "önce 72 nk"
    space_after_pt: 18          # 1.5 "sonra 18 nk"
    page_break_before: true     # 1.5 "yeni sayfa başında olmalıdır"
  heading_2:
    size_pt: 14                 # 1.5 "İkinci derece alt başlık ve numarası 14 punto"
    bold: true                  # 1.5
    case: title                 # 1.5 "her sözcüğün ilk harfi büyük", bağlaçlar küçük
    space_before_pt: 18         # 1.5
    space_after_pt: 12          # 1.5
  heading_3:
    size_pt: 12                 # 1.5 "Üçüncü ve dördüncü derece ... 12 punto"
    bold: true                  # 1.5
    case: title                 # 1.5
    space_before_pt: 12         # 1.5
    space_after_pt: 6           # 1.5
  figure_caption:
    alignment: center           # 1.7 "şeklin altına yazılmalı ve ortalanmalıdır"
    position: below             # 1.7
    case: sentence              # 1.7 "yalnızca baştaki sözcüğün ilk harfi büyük"
    line_spacing: 1.0           # 1.5 "çizelge ve şekillerin isim ve açıklamaları ... 1 satır"
    space_before_pt: 6          # 1.5 "öncesi 6 nk"
    space_after_pt: 12          # 1.5 "sonrasında 12 nk"
  table_caption:
    alignment: center           # 1.7 "çizelgenin üstüne yazılmalı ve ortalanmalıdır"
    position: above             # 1.7
    case: sentence              # 1.7
    line_spacing: 1.0           # 1.5
    space_before_pt: 6          # 1.5 "üstte (çizelge) ise; öncesi 6 nk"
    space_after_pt: 12          # 1.5 "sonrasında 12 nk"
  front_matter:
    line_spacing: 1.0           # 1.5 teşekkür, özetler, içindekiler, listeler 1 satır
  block_quote:
    size_pt: 10                 # 3.3.1 "10 punto karakter"
    indent_left_cm: 1.27        # 3.3.1 "soldan 1 sekme (1,27 cm) içerden"
  footnote:
    size_pt: 8                  # 1.10 "8 punto" — ÇELİŞKİ: 1.3 dipnotlarda "8-10 punto"
    line_spacing: 1.0           # 1.10 "bir satır aralığı"
  reference_entry:
    line_spacing: 1.0           # 1.5 "kaynaklar ... 1 satır aralıklı"

page_numbering:
  # 1.6: Giriş'ten önce Romen rakamı (örnekler büyük harf: "I", "IV"), Giriş'ten itibaren Latin (Arap) rakamı
  formats_in_order: [upperRoman, decimal]
  position: bottom_center       # 1.6 "kâğıdın alt orta kısmına"
  forbid_decoration: true       # 1.6 "nokta, parantez, çizgi vb. hiçbir işaret kullanılmadan"

document:
  forbid_tracked_changes: true
