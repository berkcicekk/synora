# Amasya Üniversitesi Fen Bilimleri Enstitüsü — Lisansüstü Eğitim-Öğretim Tez Yazım Kılavuzu (Mayıs 2018; sitede "güncel" olarak yayımlanan PDF 2022)
# Kaynak: https://fbe.amasya.edu.tr/media/69921/fbe-tez-yazim-kilavuzu_guncel.pdf
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: amasya-fbe
version: 1
name: "Amasya Üniversitesi · Fen Bilimleri Enstitüsü"
source: "Amasya Üniversitesi FBE Lisansüstü Eğitim-Öğretim Tez Yazım Kılavuzu, 2018"
institution: "Amasya Üniversitesi"
source_url: https://fbe.amasya.edu.tr/media/69921/fbe-tez-yazim-kilavuzu_guncel.pdf

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 4.1 "DIN-A4 (21 x29,7cm)"
  margins_cm: { top: 3.0, bottom: 2.0, left: 2.75, right: 2.75 }   # 4.2

fonts:
  allowed: [Times New Roman]    # 4.4 "Times New Roman (12)"

roles:
  body:
    size_pt: 12                 # 4.4, Çizelge 4.1 "Metin 12"
    line_spacing: 1.5           # 4.5 "Tez metninin yazımında 1,5 satır aralığı" — ÇELİŞKİ: Çizelge 4.2 "Ana metin kısmında tek satır aralık"
    first_line_indent_cm: 0     # 4.5 "girinti verilmeden başlamalıdır"
    space_before_pt: 0          # 4.5 "önce ve sonra 0 nk"
    space_after_pt: 0           # 4.5
  heading_1:
    size_pt: 14                 # Çizelge 4.3 "Büyük harf, koyu ve 14 punto"
    bold: true                  # Çizelge 4.3
    all_caps: true              # Çizelge 4.3
    page_break_before: true     # 4.5 "Ana bölümlerin yazımına daima yeni ve tek numaralı bir sayfadan"
  heading_2:
    size_pt: 12                 # Çizelge 4.3
    bold: true                  # Çizelge 4.3 "tamamı koyu"
    case: title                 # Çizelge 4.3 "Her sözcüğün ilk harfi büyük"
  heading_3:
    size_pt: 12                 # Çizelge 4.3
    bold: true                  # Çizelge 4.3
    case: sentence              # Çizelge 4.3 "Yalnızca birinci sözcüğün ilk harfi büyük"
  table_caption:
    size_pt: 12                 # Çizelge 4.1 "Çizelge, Şekil, Resim, Harita Açıklamaları 12"
    line_spacing: 1.0           # 4.5 "Çizelge üst yazıları tek satır aralığı"
    position: above             # 4.5 "Çizelge üst yazıları"
  figure_caption:
    size_pt: 12                 # Çizelge 4.1
    line_spacing: 1.0           # 4.5 "Şekil, Resim alt yazıları ... tek satır aralığı"
    position: below             # 4.5 "alt yazıları"
  footnote:
    size_pt: 8                  # 4.4, Çizelge 4.1 "Dipnot 8"
    line_spacing: 1.0           # 4.5 "dipnot ve kaynaklarda tek satır aralığı"
  reference_entry:
    line_spacing: 1.0           # 4.5

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # 4.6 ön sayfalar küçük Romen, Giriş'ten 1, 2, 3
  position: top_right           # 4.6 tek numaralı sayfalarda "üstten 1,5 cm ve sağdan 2,75 cm" (çift sayfalarda solda)
  forbid_decoration: true       # 4.6 "ayraç, çizgi gibi bir işaret kullanılmamalıdır"

document:
  forbid_tracked_changes: true
