# Fırat Üniversitesi Sosyal Bilimler Enstitüsü — Lisansüstü Tez Yazım Kılavuzu (Ocak 2026)
# Kaynak: https://sosyal.firat.edu.tr/subdomain_files/sosyal.firat.edu.tr/files/68/Tez%20Yaz%C4%B1m%20Klavuzu%20ve%20%C5%9Eablonu%20(2026).docx
# (bağlantı sayfası: https://sosyal.firat.edu.tr/page/9259)
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: firat-sbe
version: 1
name: "Fırat Üniversitesi · Sosyal Bilimler Enstitüsü"
source: "Fırat Üniversitesi Sosyal Bilimler Enstitüsü Lisansüstü Tez Yazım Kılavuzu, 2026"
institution: "Fırat Üniversitesi"
source_url: https://sosyal.firat.edu.tr/subdomain_files/sosyal.firat.edu.tr/files/68/Tez%20Yaz%C4%B1m%20Klavuzu%20ve%20%C5%9Eablonu%20(2026).docx

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 2.1 "210 mm x 297 mm boyutunda (A4)"
  margins_cm: { top: 2.5, bottom: 2.5, left: 3.0, right: 2.5 }  # 2.2 "üst 2,5 cm, sol 3 cm, diğer kenarlar 2,5 cm"

fonts:
  allowed: [Times New Roman]    # 2.4 "Tezin temel yazı tipi Times New Roman"

roles:
  body:
    size_pt: 11                 # 2.4 "Giriş ile Kaynaklar Bölümleri arasında ... 11 punto"
    line_spacing: 1.25          # 2.4 "1,25 satır aralığı"
    alignment: justify          # 2.4 "iki yana yaslı"
    first_line_indent_cm: 1.0   # 2.4 "soldan 1 cm paragraf girintisi"
  heading_1:
    size_pt: 12                 # 2.3.1 "12 punto"
    bold: true                  # 2.3.1 "bold"
    all_caps: true              # 2.3.1 "büyük harflerle"
    alignment: justify          # 2.3.1 "iki yana yaslı"
    first_line_indent_cm: 0     # 2.3.1 "soldan boşluksuz"
    line_spacing: 1.0           # 2.3.1 "tek satır aralıklı"
    space_before_pt: 12         # 2.3.1 "öncesinde 12 nk"
    space_after_pt: 6           # 2.3.1 "sonrasında 6 nk"
    page_break_before: true     # 2.3.1 "daima yeni bir sayfada başlamalı"
  heading_2:
    size_pt: 12                 # 2.3.2 "12 punto"
    bold: true                  # 2.3.2 "koyu"
    alignment: justify          # 2.3.2 "iki yana yaslı"
    indent_left_cm: 1.0         # 2.3.2 "soldan 1 cm boşluklu"
    line_spacing: 1.0           # 2.3.2 "tek satır aralıklı"
    space_before_pt: 12         # 2.3.2 "öncesinde 12 nk"
    space_after_pt: 6           # 2.3.2 "sonrasında 6 nk"
  heading_3:
    size_pt: 12                 # 2.3.2
    bold: true                  # 2.3.2
    alignment: justify          # 2.3.2
    indent_left_cm: 1.0         # 2.3.2
    line_spacing: 1.0           # 2.3.2
    space_before_pt: 12         # 2.3.2
    space_after_pt: 6           # 2.3.2
  figure_caption:
    size_pt: 10                 # 2.4, 2.5 "10 punto"
    line_spacing: 1.0           # 2.4 "tek satır aralığı"
    position: below             # 2.5 "Şekil başlıkları şeklin altına"
  table_caption:
    size_pt: 10                 # 2.4, 2.5
    line_spacing: 1.0           # 2.4
    position: above             # 2.5 "Tablo numarası ve başlıkları tablo üzerinde"
  reference_entry:
    size_pt: 10                 # Kaynaklar "10 punto"
    alignment: justify          # Kaynaklar "iki yana yaslı"
    indent_left_cm: 1.0         # Kaynaklar "İlk satırdan sonraki satırlarda 1 cm girinti"
    first_line_indent_cm: -1.0  # Kaynaklar (asılı girinti)
    space_after_pt: 6           # Kaynaklar "sonra = 6 nk"
    # ÇELİŞKİ: aynı paragrafta "1,25 aralık ayarı" ve "1 satır aralık ayarı" yazıyor → satır aralığı denetlenmez
  footnote:
    size_pt: 9                  # Dipnotlar "9 punto"
    alignment: justify          # Dipnotlar "iki yana yaslı"
    line_spacing: 1.0           # Dipnotlar "tek satır aralıklı"

page_numbering:
  # 2.4.2: ön bölümler büyük Romen ("IV, V, VI…"), Giriş'ten itibaren 1, 2, 3…
  formats_in_order: [upperRoman, decimal]
  position: bottom_center       # 2.4.2 "sayfanın altında, ortada"

document:
  forbid_tracked_changes: true
