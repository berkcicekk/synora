# Dicle Üniversitesi Eğitim Bilimleri Enstitüsü — Tez Yazım Kılavuzu (2021)
# Kaynak: https://www.dicle.edu.tr/Contents/pages/Files/4d76d61d-fb40-48de-bb8d-380f5a0dd761/bd5769d7628d44149d0cfccbcdf68e9b_TEZ%20YAZIM%20KILAVUZU.pdf
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
# Not: Sayfa numarası konumu bölüme göre değişir (1.3: ön bölüm altta ortada, metin kısmı sağ üst köşede);
# şema tek konum desteklediğinden konum denetlenmez.
ruleset: dicle-ebe
version: 1
name: "Dicle Üniversitesi · Eğitim Bilimleri Enstitüsü"
source: "Dicle Üniversitesi Eğitim Bilimleri Enstitüsü Tez Yazım Kılavuzu, 2021"
institution: "Dicle Üniversitesi"
source_url: https://www.dicle.edu.tr/Contents/pages/Files/4d76d61d-fb40-48de-bb8d-380f5a0dd761/bd5769d7628d44149d0cfccbcdf68e9b_TEZ%20YAZIM%20KILAVUZU.pdf

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  margins_cm: { top: 3.0, bottom: 2.5, left: 3.0, right: 2.5 }  # 1.2 "üst ve sol 3 cm, alt ve sağ 2,5 cm"

fonts:
  allowed: [Times New Roman]    # 1.1 "Times New Roman seçilmeli"

roles:
  body:
    size_pt: 12                 # 1.1 "12 punto"
    line_spacing: 1.5           # 1.5 "1,5 satır aralıkla"
    alignment: justify          # 1.5 "iki yana yasla ile hizalanır"
    first_line_indent_cm: 1.25  # 1.5 "ilk satır soldan 1,25 cm girintili"
    space_before_pt: 0          # 1.5 "Paragraf öncesi 0 nk"
    space_after_pt: 6           # 1.5 "sonrasında 6 nk"
  heading_1:
    size_pt: 12                 # 1.6 "12 punto"
    bold: true                  # 1.6 "kalın (bold)"
    all_caps: true              # 1.6 "tamamı büyük harflerle"
    alignment: center           # 1.6 "ortalı"
    line_spacing: 1.0           # 1.6 "tek satır"
    space_before_pt: 48         # 1.6 "öncesinde 48 nk"
    space_after_pt: 24          # 1.6 "sonrasında 24 nk"
    page_break_before: true     # 1.2 "ana bölüm başlıkları, yeni bir sayfadan başlamak üzere"
  heading_2:
    size_pt: 12                 # 1.1 "bütün ana ve alt başlıklar 12 punto ve kalın"
    bold: true                  # 1.6 "kalın"
    alignment: left             # 1.6 "sola yaslı"
    line_spacing: 1.0           # 1.6 "tek satır aralığı"
    space_before_pt: 12         # 1.6 "öncesinde 12 nk"
    space_after_pt: 12          # 1.6 "sonrasında 12 nk"
    # 1.6 "her sözcük büyük harflerle yazılır" — tümü büyük harf mi, sözcük başları mı belirsiz; denetlenmez
  heading_3:
    size_pt: 12                 # 1.1
    bold: true                  # 1.6 "kalın"
    italic: true                # 1.6 "italik"
    case: title                 # 1.6 "her sözcüğün ilk harfi büyük (bağlaçlar hariç)"
    alignment: left             # 1.6 "sola yaslı"
    first_line_indent_cm: 0     # 1.6 "paragraf girintisi olmadan"
    line_spacing: 1.0           # 1.6 "tek satır aralığı"
    space_before_pt: 12         # 1.6
    space_after_pt: 12          # 1.6
  figure_caption:
    alignment: justify          # 3.2.5 "şeklin altına iki yana yaslanarak"
    position: below             # 3.2.5 "şekil numarası ve açıklayıcı bilgileri ise şeklin altına"
  table_caption:
    size_pt: 12                 # 3.2.5 "12 punto"
    case: title                 # 3.2.5 "tablo adı her sözcüğün ilk harfi büyük (bağlaçlar hariç)"
    line_spacing: 1.0           # 3.2.5 "tek satır aralığı"
    space_before_pt: 6          # 3.2.5 "öncesinde 6 nk"
    space_after_pt: 6           # 3.2.5 "sonrasında 6 nk"
    position: above             # 3.2.5 "tablonun sol üst kısmında"
  block_quote:
    line_spacing: 1.0           # 1.5 "tek satır aralıklı"
    indent_left_cm: 1.25        # 1.5 "soldan 1,25 cm ve sağdan 1 cm girintili"
    first_line_indent_cm: 0     # 1.5 "ilk satır girintisi verilmeden"

page_numbering:
  # 1.3: ön bölüm küçük Romen (i, ii…), metin kısmı Arap rakamı
  formats_in_order: [lowerRoman, decimal]

document:
  forbid_tracked_changes: true
