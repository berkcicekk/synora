# İstanbul Medipol Üniversitesi Sağlık Bilimleri Enstitüsü — Tez Yazım Kılavuzu (İstanbul, 2021)
# Kaynak: https://www.medipol.edu.tr/sites/default/files/2022-08/Saglik_Bilimleri_Enstitusu_Tez_Yazim_Kilavuzu.pdf
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: medipol-sabe
version: 1
name: "İstanbul Medipol Üniversitesi · Sağlık Bilimleri Enstitüsü"
source: "Sağlık Bilimleri Enstitüsü Tez Yazım Kılavuzu, 2021"
institution: "İstanbul Medipol Üniversitesi"
source_url: https://www.medipol.edu.tr/sites/default/files/2022-08/Saglik_Bilimleri_Enstitusu_Tez_Yazim_Kilavuzu.pdf

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 2.2 "A4 standardında, 21x29,7 cm"
  margins_cm: { top: 3.0, bottom: 3.0, left: 4.0, right: 2.5 }   # 2.5

fonts:
  allowed: [Times New Roman]    # 2.3

roles:
  body:
    size_pt: 12                 # 2.3
    line_spacing: 1.5           # 2.4
    alignment: justify          # 2.4 "iki yana yaslanmış"
    first_line_indent_cm: 1.0   # 2.4 "soldan 1 cm içeriden"
  heading_1:
    size_pt: 14                 # 2.6, Tablo 1
    bold: true                  # 2.6
    all_caps: true              # 2.6 "büyük harf"
    alignment: left             # Tablo 1 "Sola dayalı"
    line_spacing: 1.0           # 2.4 "Bölüm ve alt bölüm başlıkları ... bir satır aralığı"
    page_break_before: true     # 3.2 "her bir bölüm ... yeni bir sayfadan başlamalıdır"
  heading_2:
    size_pt: 12                 # 2.6
    bold: true                  # 2.6
    alignment: left             # Tablo 1
    line_spacing: 1.0           # 2.4
    case: title                 # 2.6 "her sözcüğün baş harfleri büyük"
  heading_3:
    size_pt: 12                 # 2.6
    bold: true                  # 2.6
    alignment: left             # Tablo 1
    line_spacing: 1.0           # 2.4
    case: sentence              # 2.6 "sadece baş harfi büyük diğerleri küçük"
  table_caption:
    line_spacing: 1.0           # 2.4, 2.8 "başlıklarda bir satır aralığı"
    position: above             # 2.8 "Tablo başlıkları tablonun üstüne"
  figure_caption:
    line_spacing: 1.0           # 2.4, 2.8
    position: below             # 2.8 "şekil açıklamaları ise şeklin altına"
  footnote:
    size_pt: 10                 # 2.3, 2.6 "10 punto"
    line_spacing: 1.0           # 2.4
  block_quote:
    size_pt: 10                 # 2.3 "uzun alıntılarda ... 10 punto"
    line_spacing: 1.0           # 2.4
    indent_left_cm: 2.0         # 2.4 "soldan 2 cm içeriden"

page_numbering:
  # 2.7: özete kadar küçük Romen (i, ii…), özet sayfasından itibaren Arap (1, 2…)
  formats_in_order: [lowerRoman, decimal]
  position: bottom_right        # 2.7 "alt ve sağ tarafında"
  forbid_decoration: true       # 2.7 "önünde ve arkasında ayıraç ve çizgi gibi işaretler kullanılmamalıdır"

document:
  forbid_tracked_changes: true
