# Jandarma ve Sahil Güvenlik Akademisi — Lisansüstü Tez / Proje Yazım Kılavuzu (Ankara 2024, Word belgesi)
# Kaynak: https://www.jsga.edu.tr/kurumlar/jsga.edu.tr/IcSite/guvben/TezYazimKlavuzu/JSGA-Lisansustu-Tez-_-Proje-Yazim-Kilavuzu.docx
# Sayfa: https://www.jsga.edu.tr/guvben/tez-yazim-kilavuzu
# Kılavuz Güvenlik Bilimleri Enstitüsü ve Adli Bilimler Enstitüsü için ortaktır (bkz. 2. bölüm).
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: jsga-enstitu
version: 1
name: "Jandarma ve Sahil Güvenlik Akademisi · Güvenlik Bilimleri ve Adli Bilimler Enstitüleri"
source: "JSGA Lisansüstü Tez / Proje Yazım Kılavuzu, 2024"
institution: "Jandarma ve Sahil Güvenlik Akademisi"
source_url: https://www.jsga.edu.tr/kurumlar/jsga.edu.tr/IcSite/guvben/TezYazimKlavuzu/JSGA-Lisansustu-Tez-_-Proje-Yazim-Kilavuzu.docx

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 3.1 "A4 (210 x 297 mm)"
  margins_cm: { top: 2.54, bottom: 2.54, left: 2.54, right: 2.54 }   # 3.2 "tüm kenarlardan 2,54 cm"

fonts:
  allowed: [Times New Roman]    # 4.1.1 (şekil görselleri ve bilgisayar kodu istisna, Tablo 4.1)

roles:
  body:
    size_pt: 12                 # 4.1.1 "12 punto"
    line_spacing: 1.5           # 4.1.2 "tüm yazı 1,5 satır aralığında"
    first_line_indent_cm: 1.25  # 4.1.2 "Paragrafların 1 tab (1,25 cm) içeriden başlaması"
    alignment: justify          # 4.1.2 "Paragraflar iki yana yaslı"
  heading_1:
    size_pt: 12                 # 4.4 Tablo 4.3 "Ana bölüm başlıkları ... 12 punto ve ortalı"
    bold: true                  # 4.4 Tablo 4.3 "koyu"
    all_caps: true              # 4.4 Tablo 4.3 "Her sözcüğün her harfi büyük"
    alignment: center           # 4.4 Tablo 4.3 "ortalı"
    page_break_before: true     # 4.4 "Ana bölümlerin yazımına daima yeni ve tek numaralı bir sayfadan"
    line_spacing: 1.5           # 4.1.2 "başlıklar ... dahil ... 1,5 satır aralığında"
  heading_2:
    size_pt: 12                 # 4.4 Tablo 4.3 "Birinci derece alt bölüm başlıkları"
    bold: true                  # 4.4 Tablo 4.3 "koyu, italik"
    italic: true                # 4.4 Tablo 4.3
    case: title                 # 4.4 Tablo 4.3 "Her sözcüğün ilk harfi büyük"
  heading_3:
    size_pt: 12                 # 4.4 Tablo 4.3 "İkinci derece alt bölüm başlıkları"
    case: title                 # 4.4 Tablo 4.3
  table_caption:
    italic: true                # 4.5.4 "italik tipte"
    alignment: left             # 4.5.4 "sola yaslı, girintisiz"
    position: above             # 4.5.4 "tablo numarası ile tablonun arasına"
  figure_caption:
    italic: true                # 4.5.4
    alignment: left             # 4.5.4
    position: above             # 4.5.4 "Tablo ve şekil başlıkları, tablo numarası ile tablonun arasına"
  footnote:
    size_pt: 10                 # 4.3, Tablo 4.1 "10 puntoda tek satır aralığı"
    line_spacing: 1.0           # 4.3
    alignment: justify          # 4.3 "iki yana yaslı"
    first_line_indent_cm: 1.25  # 4.3 "İlk satır ayarında 1,25 cm"
  reference_entry:
    line_spacing: 1.0           # 4.1.2 "Kaynakça bölümlerinde de tek satır aralığı" — ÇELİŞKİ: aynı paragrafta "referanslar dahil ... 1,5 satır"

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # 3 giriş "Küçük Romen rakamları ile ... tez özel sayfaları", 3.3 GİRİŞ'ten 1, 2, 3
  position: top_right           # 3.3 "tek sayılarda sağ üst, çift sayılarda ise sol üstte"

document:
  forbid_tracked_changes: true
