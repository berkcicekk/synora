ruleset: gop-sbe
version: 1
name: "Tokat Gaziosmanpaşa Üniversitesi · Lisansüstü Eğitim Enstitüsü (Sosyal Bilimler)"
source: "TOGÜ Lisansüstü Eğitim Enstitüsü Tez Yazım Kılavuzu (Sosyal Bilimler), 2023"
institution: "Tokat Gaziosmanpaşa Üniversitesi"
source_url: https://lisansustu.gop.edu.tr/depo/menuler/birim_12112/formlar_ve_belgeler_v2_955/dosya_icerik/2395162/formlar_ve_belgeler_v2_20241008165346.docx

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # Genel Biçim Esasları "A4 (21 x 29,7 cm)"
  margins_cm: { top: 3.5, bottom: 2.5, left: 3.5, right: 2.5 }   # Genel Biçim Esasları: üst ve sol 3,5 cm, sağ ve alt 2,5 cm

fonts:
  allowed: [Times New Roman]    # Genel Biçim Esasları "Yazı Tipi ve Boyutu"

roles:
  body:
    size_pt: 12                 # Yazı Tipi ve Boyutu
    line_spacing: 1.5           # Satır Araları "1,5 satır (18 nk)"
    alignment: justify          # Paragraflar "iki yana yaslanmış"
    first_line_indent_cm: 1.25  # Paragraflar "1,25 cm girinti ile"
  heading_1:
    size_pt: 12                 # Bölüm Başlıkları — ÇELİŞKİ: "SONUÇ" başlığı için 14 punto deniyor
    bold: true                  # Bölüm Başlıkları
    all_caps: true              # Bölüm Başlıkları "bütün sözcükleri büyük harfle"
    alignment: center           # Bölüm Başlıkları "ortalı"
    line_spacing: 1.5           # "satır aralığı 1,5"
    space_before_pt: 12         # "önce:12 nk"
    space_after_pt: 0           # "sonra:0"
    page_break_before: true     # Bölüm Başlıkları "yeni sayfadan"
  heading_2:
    size_pt: 12                 # İkinci Derece başlıklar
    bold: true                  # İkinci Derece başlıklar
    all_caps: true              # İkinci Derece başlıklar "bütün sözcükleri büyük harfle"
    alignment: left             # İkinci Derece başlıklar "sola yaslı"
    first_line_indent_cm: 1.25  # İkinci Derece başlıklar "1,25 cm girinti"
    line_spacing: 1.5           # "satır aralığı 1,5"
    space_before_pt: 12         # "önce:12 nk"
    space_after_pt: 0           # "sonra:0"
  heading_3:
    size_pt: 12                 # Üçüncü Derece başlıklar
    bold: true                  # Üçüncü Derece başlıklar
    case: title                 # Üçüncü Derece başlıklar "bütün sözcüklerin ilk harfleri büyük"
    alignment: left             # Üçüncü Derece başlıklar
    first_line_indent_cm: 1.25  # Üçüncü Derece başlıklar
    line_spacing: 1.5           # "satır aralığı 1,5"
    space_before_pt: 12         # "önce:12 nk"
    space_after_pt: 0           # "sonra:0"
  figure_caption:
    size_pt: 12                 # Şekiller Listesi "12 punto"
    line_spacing: 1.5           # Şekiller Listesi "1,5 satır aralığı"
    alignment: center           # Şekiller Listesi "şeklin altında ve ortalı"
    case: title                 # Şekiller Listesi "her sözcüğün ilk harfi büyük"
    position: below             # Şekiller Listesi
  table_caption:
    alignment: center           # Tablolar Listesi "tablonun üstünde ve ortalı"
    case: title                 # Tablolar Listesi "her sözcüğün ilk harfi büyük"
    position: above             # Tablolar Listesi
  block_quote:
    size_pt: 10                 # Yazı Tipi ve Boyutu; Paragraflar "10 punto"
    line_spacing: 1.0           # Satır Araları "bloklanmış alıntılarda 1 satır"
    first_line_indent_cm: 0     # Paragraflar "paragraf (ilk satır) girintisi olmadan"
    # ÇELİŞKİ: girinti "soldan ve sağdan 1 cm ek girintili" (Paragraflar) ve "1,25 cm girintili" (Doğrudan alıntı); sol girinti denetlenmez.
  reference_entry:
    size_pt: 12                 # Kaynakça "12 punto"
    line_spacing: 1.5           # Kaynakça "1,5 satır aralığı"
    alignment: justify          # Kaynakça "iki yana yaslı"
  footnote:
    size_pt: 10                 # Yazı Tipi ve Boyutu
    line_spacing: 1.0           # Satır Araları "dipnotlarda ... 1 satır"

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # Sayfa Numaraları: girişe kadar küçük Romen, girişten itibaren 1, 2, 3
  position: top_right           # Sayfa Numaraları "sağ üst köşesinden 1,5 cm aşağıya"

document:
  forbid_tracked_changes: true
