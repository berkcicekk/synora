# Bandırma Onyedi Eylül Üniversitesi Lisansüstü Eğitim Enstitüsü — Tez / Dönem Projesi Yazım Kılavuzu (Eylül 2025)
# Kaynak: https://lee.bandirma.edu.tr/Content/Web/Yuklemeler/DosyaYoneticisi/1189/files/Tez%20yaz%C4%B1m%20K%C4%B1lavuzu_5Eylu%CC%88l%20%283%29.docx
# ("Tez Yazım Kılavuzları" sayfasındaki "Tez / Dönem Projesi Yazım Kılavuzu")
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
# Not: Sayfa numarası konumu "alt ortada veya alt sağda" (seçmeli) → position yazılmadı (1).
ruleset: bandirma-lee
version: 1
name: "Bandırma Onyedi Eylül Üniversitesi · Lisansüstü Eğitim Enstitüsü"
source: "Bandırma Onyedi Eylül Üniversitesi Lisansüstü Eğitim Enstitüsü Tez Yazım Kılavuzu, 2025"
institution: "Bandırma Onyedi Eylül Üniversitesi"
source_url: https://lee.bandirma.edu.tr/Content/Web/Yuklemeler/DosyaYoneticisi/1189/files/Tez%20yaz%C4%B1m%20K%C4%B1lavuzu_5Eylu%CC%88l%20%283%29.docx

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 1
  margins_cm: { top: 4.0, bottom: 2.5, left: 4.0, right: 2.5 }   # 1 (Şekil 4)

fonts:
  allowed: [Times New Roman]    # 1

roles:
  body:
    size_pt: 12                 # 1
    line_spacing: 1.5           # 1
    alignment: justify          # 1 "iki yana yaslı (justified)"
    first_line_indent_cm: 1.25  # 1
    space_before_pt: 0          # 1 "önce ve sonra değerleri 0 nk"
    space_after_pt: 0           # 1
  heading_1:
    size_pt: 14                 # 1 "Bölüm başlıkları ... 14 punto"
    bold: true                  # 1
    italic: false               # 1 "Başlıkların tüm düzeylerinde italik kullanılmaz"
    all_caps: true              # 1 "tüm harfleri büyük"
    alignment: center           # 1 "ortalanmış"
    space_before_pt: 12         # 1 (Şekil 2)
    space_after_pt: 6           # 1 (Şekil 2)
  heading_2:
    size_pt: 12                 # 1
    bold: true                  # 1
    italic: false               # 1
    alignment: left             # 1 "sola dayalı"
    case: title                 # 1 "ilk harfleri büyük"
    space_before_pt: 6          # 1 (Şekil 3)
    space_after_pt: 3           # 1 (Şekil 3)
  heading_3:
    size_pt: 12                 # 1
    bold: true                  # 1
    italic: false               # 1
    alignment: left             # 1 "mutlaka sola dayalı"
  figure_caption:
    size_pt: 10                 # 1, 4
    line_spacing: 1.0           # 1, 4
    position: below             # 4 "şeklin altında"
  table_caption:
    size_pt: 10                 # 1, 4
    line_spacing: 1.0           # 1, 4
    position: above             # 4 "tablonun üstünde"
  reference_entry:
    size_pt: 12                 # 6
    line_spacing: 1.0           # 1
  footnote:
    size_pt: 10                 # 1
    line_spacing: 1.0           # 1

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # 1

document:
  forbid_tracked_changes: true
