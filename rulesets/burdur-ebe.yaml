tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # Basımda Kullanılacak Kâğıdın Niteliği "A4 boyutlarında (21 cm × 29,7 cm)"
  margins_cm: { top: 2.5, bottom: 2.5, left: 3.0, right: 2.5 }  # Kenar Boşlukları "alt, üst ve sağ 2,5 cm, sol 3 cm"

fonts:
  allowed: [Arial]              # Kullanılacak Yazı Tipi Özellikleri "Arial yazı tipi"

roles:
  body:
    size_pt: 11                 # Kullanılacak Yazı Tipi Özellikleri "11 punto büyüklüğünde"
    line_spacing: 2.0           # Satır Aralıkları ve Boşluklar "Satır aralıkları 2 satır olmalıdır"
    alignment: justify          # Kenar Boşlukları "iki yana yasla"
  block_quote:
    size_pt: 11                 # Yazı Tipi "blok alıntı formatında, aynı puntoda"
    line_spacing: 2.0           # Satır Aralıkları "Blok alıntılar da çift satır aralığıyla"
    indent_left_cm: 1.25        # Yazı Tipi "her iki yandan bir tab (1.25 cm) girintili"

page_numbering:
  position: bottom_right        # Kenar Boşlukları "sayfanın sağ alt köşesinde"

document:
  forbid_tracked_changes: true
