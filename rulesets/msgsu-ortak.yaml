# Mimar Sinan Güzel Sanatlar Üniversitesi — FBE–SBE–GSE Tez / Eser Metni Yazım Kılavuzu (2017)
# Fen Bilimleri, Sosyal Bilimler ve Güzel Sanatlar enstitüleri için ortak kılavuz.
# Kaynak: https://msgsu.edu.tr/Assets/UserFiles/doc_enstit%C3%BC_icerik_guzsan/2017TezYazimKilavuzu/msgsu_lisansustu_tez_eser_metni_yazim_klavuzu.pdf
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: msgsu-ortak
version: 1
name: "Mimar Sinan Güzel Sanatlar Üniversitesi · Fen Bilimleri, Sosyal Bilimler ve Güzel Sanatlar Enstitüleri"
source: "MSGSÜ FBE–SBE–GSE Tez / Eser Metni Yazım Kılavuzu, 2017"
institution: "Mimar Sinan Güzel Sanatlar Üniversitesi"
source_url: "https://msgsu.edu.tr/Assets/UserFiles/doc_enstit%C3%BC_icerik_guzsan/2017TezYazimKilavuzu/msgsu_lisansustu_tez_eser_metni_yazim_klavuzu.pdf"

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 4.2 "A4 standardında (21 x 29.7 cm)"
  # 4.3.1: sol (cilt payı) 4 cm, diğer kenarlar 2,5 cm; çift yüz basımda cilt payı tarafı 4 cm (aynalı)
  margins_cm: { top: 2.5, bottom: 2.5, left: 4.0, right: 2.5 }

fonts:
  # 4.4: 12 pt Times New Roman / Calibri ya da 11 pt Arial / Verdana / Helvetica (puntosu yazı tipine bağlı; metin puntosu bu yüzden denetlenmez)
  allowed: [Times New Roman, Calibri, Arial, Verdana, Helvetica]

roles:
  body:
    line_spacing: 1.5           # 4.3.3 "1,5 satır aralıklı yazılır"
    alignment: justify          # 4.3.2, 4.3.3 "iki yana yaslanmış"
    first_line_indent_cm: 0     # 4.3.3 "Paragraf başları içeriden başlamaz"
    space_before_pt: 6          # 4.3.3 "önce ve sonra 6 punto aralık"
    space_after_pt: 6           # 4.3.3
  heading_1:
    bold: true                  # 4.5 "büyük ve koyu harflerle"
    all_caps: true              # 4.5
    alignment: justify          # 4.5 "diğer bütün başlıklar ise iki yana yaslanmış" (özet başlıkları hariç)
    space_before_pt: 72         # 4.5 "önce 72 punto"
    space_after_pt: 18          # 4.5 "sonra 18 punto"
    page_break_before: true     # 4.3 "her ana bölüm yeni bir sağ sayfayla başlatılır"
  heading_2:
    bold: true                  # 4.5
    case: title                 # 4.5 "kelimelerin ilk harfleri büyük", bağlaçlar küçük
    alignment: justify          # 4.5
    space_before_pt: 18         # 4.5
    space_after_pt: 12          # 4.5
  heading_3:
    bold: true                  # 4.5
    case: sentence              # 4.5 "sadece ilk harfi büyük"
    alignment: justify          # 4.5
    space_before_pt: 12         # 4.5
    space_after_pt: 6           # 4.5
  table_caption:
    alignment: center           # 4.6 "çizelgenin üstüne satırda ortalı"
    position: above             # 4.6
    line_spacing: 1.0           # 4.6 "bir satır aralığı kullanılarak"
    space_before_pt: 12         # 4.6 "yazıdan önce 12 punto"
    space_after_pt: 6           # 4.6 "sonra 6 punto"
  figure_caption:
    alignment: center           # 4.6 "şeklin altına, satırda ortalı"
    position: below             # 4.6
    line_spacing: 1.0           # 4.3.3, 4.6 "bir aralık"
  front_matter:
    line_spacing: 1.0           # 4.3.3 özel sayfalar 1 satır aralıklı
  footnote:
    line_spacing: 1.0           # 4.3.3 "dipnotlar ... 1 satır aralıklı"
  reference_entry:
    line_spacing: 1.0           # 4.3.3 "Kaynakça ... 1 satır aralıklı"

page_numbering:
  # 4.3.4: özel sayfalar Roma rakamı (i, ii…), metin Arap rakamı
  formats_in_order: [lowerRoman, decimal]
  position: bottom_center       # 4.3.4 "sayfanın alt-ortasına"

document:
  forbid_tracked_changes: true
