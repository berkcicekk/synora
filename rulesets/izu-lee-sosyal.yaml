# İstanbul Sabahattin Zaim Üniversitesi Lisansüstü Eğitim Enstitüsü — Lisansüstü Tez Yazım Kılavuzu (Sosyal Bilimler Alanı), İstanbul 2020
# Kaynak: https://www.izu.edu.tr/docs/default-source/enstituler/sosyal-bilimler-enstit%C3%BCs%C3%BC-formlar%C4%B1/tez-proje-haz%C4%B1rlama-k%C4%B1lavuzu/k%C4%B1lavuzlar/sosyal-bilimler-alan%C4%B1-tez-yaz%C4%B1m-k%C4%B1lavuzu.pdf?sfvrsn=e36d9e89_12
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: izu-lee-sosyal
version: 1
name: "İstanbul Sabahattin Zaim Üniversitesi · Lisansüstü Eğitim Enstitüsü (Sosyal Bilimler)"
source: "Lisansüstü Tez Yazım Kılavuzu (Sosyal Bilimler Alanı), 2020"
institution: "İstanbul Sabahattin Zaim Üniversitesi"
source_url: "https://www.izu.edu.tr/docs/default-source/enstituler/sosyal-bilimler-enstit%C3%BCs%C3%BC-formlar%C4%B1/tez-proje-haz%C4%B1rlama-k%C4%B1lavuzu/k%C4%B1lavuzlar/sosyal-bilimler-alan%C4%B1-tez-yaz%C4%B1m-k%C4%B1lavuzu.pdf?sfvrsn=e36d9e89_12"

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 3.4 "A4 boyutunda"
  margins_cm: { top: 2.5, bottom: 2.5, left: 4.0, right: 2.5 }   # 3.5

fonts:
  allowed: [Times New Roman]    # 3.1

roles:
  body:
    size_pt: 12                 # 3.1 (Arapça alıntılı tezlerde 14 punto olabilir)
    line_spacing: 1.5           # 3.2
    alignment: justify          # 3.5 "Metin iki kenara yaslanarak hizalanır"
    first_line_indent_cm: 0     # 3.1 "paragraflar ve alt başlıklarda girinti yapılmaksızın"
    space_before_pt: 6          # 3.2 "yukarıdan 6 nk"
    space_after_pt: 6           # 3.2 "aşağıdan da 6 nk"
  heading_1:
    size_pt: 14                 # 3.1, 3.7
    bold: true                  # 3.7 "koyu"
    all_caps: true              # 3.7 "kelimelerin tümü büyük harfler ile"
    alignment: center           # 3.7 "ortalı"
    page_break_before: true     # 3.5 "Ana bölümler yeni bir sayfadan başlar"
  heading_2:
    size_pt: 12                 # 3.7
    bold: true                  # 3.7
    alignment: left             # 3.7 "sola yaslı"
    first_line_indent_cm: 0     # 3.1
    case: title                 # 3.7 "tüm kelimelerin sadece ilk harfleri büyük"
  heading_3:
    size_pt: 12                 # 3.7
    bold: true                  # 3.7
    alignment: left             # 3.7
    first_line_indent_cm: 0     # 3.1
    case: title                 # 3.7
  table_caption:
    alignment: left             # 3.7 "sola yaslı bir biçimde"
    position: above             # 3.7 "ilgili tablonun üzerinde"
  figure_caption:
    alignment: left             # 3.7
    position: below             # 3.7 "şekil veya resmin altında"
  footnote:
    size_pt: 11                 # 3.1 "Dipnotlarda ise 11 punto"
    line_spacing: 1.5           # 3.2 "Satır aralığı ise 1.5"
    space_before_pt: 6          # 3.2 "alttan ve üstten 6 nk"
    space_after_pt: 6           # 3.2
  block_quote:
    italic: true                # 3.3 "italik olarak verilir"
    line_spacing: 1.5           # 3.3
  reference_entry:
    line_spacing: 1.5           # 3.2
    space_before_pt: 6          # 3.2
    space_after_pt: 6           # 3.2

page_numbering:
  # 3.6: Giriş'e kadar küçük Roma (i, ii…), Giriş'ten itibaren 1, 2, 3
  formats_in_order: [lowerRoman, decimal]
  position: bottom_center       # 3.6 "her sayfanın altında ortalanarak"

document:
  forbid_tracked_changes: true
