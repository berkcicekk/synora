# Abdullah Gül Üniversitesi Lisansüstü Eğitim Enstitüsü (Graduate School) — Thesis Writing Guideline (2026)
# Kaynak: http://gs.agu.edu.tr/uploads/Formlar/FORMLAR/FORMLAR%C3%9C/Tez_Yaz%C4%B1m_K%C4%B1lavuzu.pdf
# (İngilizce kılavuz, "Updated: Feb 2026"; aynı sayfada 30.04.2026 tarihli .docx kopyası da var, kurallar aynı)
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: agu-lee
version: 1
name: "Abdullah Gül Üniversitesi · Lisansüstü Eğitim Enstitüsü"
source: "AGÜ Graduate School Thesis Writing Guideline, 2026"
institution: "Abdullah Gül Üniversitesi"
source_url: http://gs.agu.edu.tr/uploads/Formlar/FORMLAR/FORMLAR%C3%9C/Tez_Yaz%C4%B1m_K%C4%B1lavuzu.pdf

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                                  # 1 "A4 paper"
  # 3: "page margins will be 2.5cm on all sides. A 1.0cm margin will be left for binding"
  # (cilt payı 1 cm ayrıca; çift yüz baskı olduğu için cilt tarafı değişir → gutter olarak düşünülmeli)
  margins_cm: { top: 2.5, bottom: 2.5, left: 2.5, right: 2.5 }

fonts:
  allowed: [Times New Roman]                # 2

roles:
  body:
    size_pt: 12                             # 2 "font size should be 12 throughout the text"
    line_spacing: 1.5                       # 4 "1.5 line spacing"
    alignment: justify                      # 3 "All text must be justified"
    first_line_indent_cm: 1.0               # 5 "with 1 cm indentation"
  heading_1:
    size_pt: 20                             # 13 "chapter name and title ... 20 pt. fonts"
    page_break_before: true                 # 13 "Each chapter must start with a new page"
    # 13 "first character capitalized" — ÇELİŞKİ: örnek içindekilerde bölüm adları tamamı büyük harf; yazım denetlenmez
  heading_2:
    size_pt: 18                             # 13 "subtitles ... 18 pt."
  heading_3:
    size_pt: 14                             # 13 "sub-subsections ... 14 pt."
  figure_caption:
    size_pt: 12                             # 14
    line_spacing: 1.0                       # 4 "Single spacing must be used for figure and table captions"
    alignment: justify                      # 14 "captions ... must be justified"
  table_caption:
    size_pt: 12                             # 14
    line_spacing: 1.0                       # 4
    alignment: justify                      # 14
  reference_entry:
    size_pt: 12                             # 16 "12-point font size"
    line_spacing: 1.0                       # 4, 16 "single-spaced"
    alignment: justify                      # 16 "justified alignment"
  footnote:
    line_spacing: 1.0                       # 4 "Single spacing ... footnotes"

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # 6 ÖZET/ABSTRACT'tan itibaren i, ii…; ilk bölümden 1, 2…
  position: bottom_center                   # 6 "bottom of each page, centered"

document:
  forbid_tracked_changes: true
