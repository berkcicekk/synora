# Mersin Üniversitesi Sosyal Bilimler Enstitüsü — Lisansüstü Tez Yazım Kılavuzu (Tez Hazırlama ve Yazım Kılavuzu), 2023
# Kaynak: https://www.mersin.edu.tr/bulut/birim_611/Tez_Yazm_Yonergesi/tez_hazrlama_klavuzu.pdf
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: mersin-sbe
version: 1
name: "Mersin Üniversitesi · Sosyal Bilimler Enstitüsü"
source: "Mersin Üniversitesi Sosyal Bilimler Enstitüsü Lisansüstü Tez Yazım Kılavuzu, 2023"
institution: "Mersin Üniversitesi"
source_url: https://www.mersin.edu.tr/bulut/birim_611/Tez_Yazm_Yonergesi/tez_hazrlama_klavuzu.pdf

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 4.2.1 (1)
  margins_cm: { top: 2.5, bottom: 2.5, left: 2.5, right: 2.5 }   # 4.2.1 (1)

fonts:
  allowed: [Times New Roman]    # 4.2.1 (1)

roles:
  body:
    size_pt: 11                 # 4.2.1 (1), (3)
    line_spacing: 1.5           # 4.2.1 (1), (3)
    alignment: justify          # 4.2.1 (4) "iki yana yaslı"
    first_line_indent_cm: 1.25  # 4.2.1 (5)
    space_after_pt: 6           # 4.2.1 (1) "Paragraf arasındaki boşluk 6 nk"
  heading_1:
    size_pt: 11                 # 4.2.1 (8)
    bold: true                  # 4.2.1 (8)
    all_caps: true              # 4.2.1 (8) "büyük harf ile"
    alignment: left             # 4.2.1 (8) "sola hizalı"
    page_break_before: true     # 4.2.1 (8) "her defasında yeni bir sayfadan"
    space_after_pt: 6           # 4.2.1 (8)
  heading_2:
    size_pt: 11                 # 4.2.1 (9)
    bold: true                  # 4.2.1 (9) "koyu"
    alignment: left             # 4.2.1 (9)
    case: title                 # 4.2.1 (9) "sözcüklerin ilk harfleri büyük"
    space_before_pt: 6          # 4.2.1 (9)
    space_after_pt: 6           # 4.2.1 (9)
  heading_3:
    size_pt: 11                 # 4.2.1 (9)
    bold: true                  # 4.2.1 (9)
    alignment: left             # 4.2.1 (9)
    case: title                 # 4.2.1 (9)
    space_before_pt: 6          # 4.2.1 (9)
    space_after_pt: 6           # 4.2.1 (9)
  figure_caption:
    size_pt: 10                 # 4.2.3 (1)
    line_spacing: 1.0           # 4.2.3 (1)
    alignment: center           # 4.2.3 (1) "altta ve ortalı"
    case: title                 # 4.2.3 (1)
    position: below             # 4.2.3 (1), (7)
  table_caption:
    size_pt: 10                 # 4.2.3 (1)
    line_spacing: 1.0           # 4.2.3 (1)
    alignment: left             # 4.2.3 (1) "üstte sola yaslı"
    case: title                 # 4.2.3 (1)
    position: above             # 4.2.3 (1), (7)
  block_quote:
    size_pt: 10                 # 4.2.1 (6) "Açıklama ve alıntılar 10 punto"
  footnote:
    size_pt: 10                 # 5 (dipnot) "10 punto büyüklüğünde"
    italic: true                # 5 (dipnot) "italik" (Chicago bölümünde italik anılmıyor)
    line_spacing: 1.0           # 5 (dipnot) "bir satır aralığı"
  reference_entry:
    line_spacing: 1.0           # Kaynaklar "tek satır aralığında"; 4.2.1 (2)
    space_before_pt: 3          # Kaynaklar "önce 3 nk"
    space_after_pt: 3           # Kaynaklar "sonra 3 nk"

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # 4.2.2 (1), (2)
  position: bottom_right        # 4.2.2 (3) "alt sağ köşesine"
  forbid_decoration: true       # 4.2.2 (4)

document:
  forbid_tracked_changes: true
