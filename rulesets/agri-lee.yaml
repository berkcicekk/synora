# Ağrı İbrahim Çeçen Üniversitesi Lisansüstü Eğitim Enstitüsü — Tez Yazım Kılavuzu (2021)
# Kaynak: https://www.agri.edu.tr/upload/lisansustuenstitusudetay/lisans%C3%BCst%C3%BC%20tez%20yaz%C4%B1mm.pdf?dil=tr-TR
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: agri-lee
version: 1
name: "Ağrı İbrahim Çeçen Üniversitesi · Lisansüstü Eğitim Enstitüsü"
source: "AİÇÜ LEE Tez Yazım Kılavuzu, 2021"
institution: "Ağrı İbrahim Çeçen Üniversitesi"
source_url: https://www.agri.edu.tr/upload/lisansustuenstitusudetay/lisans%C3%BCst%C3%BC%20tez%20yaz%C4%B1mm.pdf?dil=tr-TR

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 2.1 "A4 boyutunda (210 X 297 mm)"
  margins_cm: { top: 3.0, bottom: 3.0, left: 4.0, right: 2.5 }   # 2.4

fonts:
  allowed: [Times New Roman]    # 2.3

roles:
  body:
    size_pt: 12                 # 2.3 "Ana metnin harf büyüklüğü 12 punto"
    line_spacing: 1.5           # 2.6 "Ana metinde satır araları 1,5 satır"
    alignment: justify          # 2.4 "tüm satırlar aynı hizada bloklanmalıdır"
    first_line_indent_cm: 1.25  # 2.6 "her yeni paragraf 1.25 cm içeriden"
  heading_1:
    size_pt: 12                 # 2.7 "BÜYÜK HARF, 12 PUNTO, KOYU HARFLERLE, ORTALI"
    bold: true                  # 2.7
    all_caps: true              # 2.7
    alignment: center           # 2.7
    space_before_pt: 24         # 2.7 "önce 24 nk, sonra 12 nk"
    space_after_pt: 12          # 2.7
    page_break_before: true     # 2.6 "Birinci dereceden bölüm başlıkları ... sayfa başı"
  heading_2:
    size_pt: 12                 # 2.7
    bold: true                  # 2.7
    case: title                 # 2.7 "her kelimenin ilk harfi büyük", bağlaçlar küçük
    alignment: left             # 2.7 "sola dayalı"
    space_before_pt: 12         # 2.7 "önce 12 nk, sonra 6 nk"
    space_after_pt: 6           # 2.7
  heading_3:
    size_pt: 12                 # 2.7
    bold: true                  # 2.7
    case: sentence              # 2.7 "birinci kelimenin ilk harfi büyük, diğer tüm kelimeler küçük"
    first_line_indent_cm: 1.25  # 2.6 "üçüncü dereceden başlıklar 1.25 cm içeriden"
    space_before_pt: 12         # 2.7 "önce 12 nk, sonra 6 nk"
    space_after_pt: 6           # 2.7
  figure_caption:
    line_spacing: 1.5           # 2.6, 3.4 "1.5 tam satır aralığı"
    position: below             # 3.4 "Şekil ismi şeklin hemen altına"
  table_caption:
    line_spacing: 1.5           # 2.6, 3.4
    position: above             # 3.4 "Çizelge ismi çizelgenin üstüne"
  block_quote:
    italic: true                # 2.11 "ayrı bir paragraf halinde ... italik harflerle"
    indent_left_cm: 1.25        # 2.11 "her iki taraftan 1.25 cm içeri"
    line_spacing: 1.5           # 2.6 "alıntılar ... aynı aralık"
  footnote:
    size_pt: 10                 # 2.3, 2.12 "10 punto"
    line_spacing: 1.0           # 2.6, 2.12 "bir satır aralığı"
  reference_entry:
    # 5.6: ikinci ve sonraki satırlar 1,25 cm içeriden (asılı) — şemada karşılığı yok
    line_spacing: 1.0           # 5.6 "1 tam aralık" — ÇELİŞKİ: 2.6 kaynaklar dizini için 1,5 diyor

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # 2.5 ön sayfalar küçük Romen, Giriş'ten 1, 2, 3
  position: bottom_center       # 2.5 "sayfa altında, orta kısma"
  forbid_decoration: true       # 2.5 "parantez, çizgi gibi işaretler bulunmamalıdır"

document:
  forbid_tracked_changes: true
