# İstanbul Topkapı Üniversitesi Lisansüstü Eğitim Enstitüsü — Tez ve Proje Yazım Kılavuzu (15.05.2025)
# Kaynak: https://www.topkapi.edu.tr/resources/files/enstitu/dosyalar/TezVeProjeYazimKilavuzu15.05.2025.pdf
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: topkapi-lee
version: 1
name: "İstanbul Topkapı Üniversitesi · Lisansüstü Eğitim Enstitüsü"
source: "Tez ve Proje Yazım Kılavuzu, 2025"
institution: "İstanbul Topkapı Üniversitesi"
source_url: https://www.topkapi.edu.tr/resources/files/enstitu/dosyalar/TezVeProjeYazimKilavuzu15.05.2025.pdf

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 3.1 "A4 standardında"
  # 3.3: devam eden sayfalarda sol 4, sağ 2,5, üst 2,5, alt 2,5 cm.
  # Ana başlıklı sayfalarda üstten 5 cm (bölüm 2, 3.3) — başlık öncesi boşluk olarak denetlenmez.
  margins_cm: { top: 2.5, bottom: 2.5, left: 4.0, right: 2.5 }   # 3.3

fonts:
  allowed: [Times New Roman]    # 3.2

roles:
  body:
    size_pt: 12                 # 3.2
    line_spacing: 1.5           # 3.2, 3.4
    alignment: justify          # 3.2 "iki yana yaslı"
    first_line_indent_cm: 1.0   # 3.4 "paragrafın ilk satırı 1 cm içeriden"
  heading_1:
    size_pt: 12                 # 3.3
    bold: true                  # 3.3 "tümü büyük ve koyu harfle"
    all_caps: true              # 3.3
    page_break_before: true     # 2 "Tüm ana başlıklar yeni sayfadan başlamalıdır"
  heading_2:
    size_pt: 12                 # 3.3
    bold: true                  # 3.3
    first_line_indent_cm: 1.0   # 3.3 "tüm başlıklar 1 cm girinti bırakılarak", 3.4
    case: title                 # 3.3 "2. Derece alt başlıkta kelimelerin ilk harfi büyük"
  heading_3:
    size_pt: 12                 # 3.3
    bold: true                  # 3.3
    first_line_indent_cm: 1.0   # 3.3, 3.4
    case: sentence              # 3.3 "3. Derece başlıklarda ilk kelimenin ilk harfi büyük"
  table_caption:
    size_pt: 12                 # 3.6
    line_spacing: 1.0           # 3.4 "tablo ve şekillerin isim ve açıklamaları ... 1 satır aralığı"
    alignment: left             # 3.6 "tablonun üstüne ve sola yaslı"
    position: above             # 3.6
  figure_caption:
    size_pt: 12                 # 3.6 "Aynı kural şekiller için de geçerlidir"
    line_spacing: 1.0           # 3.4
    alignment: center           # 3.6 "şeklin altına ortalanarak"
    position: below             # 3.6
  footnote:
    line_spacing: 1.0           # 3.4
  block_quote:
    # ÇELİŞKİ: 3.2 "sol ve sağ taraftan en az 1 cm girinti"; EK12 "soldan 1,25 cm girinti" → girinti denetlenmez
    size_pt: 10                 # EK12 "Blok Alıntılar ... 10 punto olarak yazılır"
  reference_entry:
    size_pt: 12                 # EK12 Kaynakça Oluşturma Kuralları
    alignment: justify          # EK12 "iki yana yaslı"
    line_spacing: 1.0           # 3.4; EK12 "satır aralığı tek"
    space_before_pt: 6          # EK12 "önce bölümü 6 nk"
    space_after_pt: 0           # EK12 "sonra bölümü 0 nk"

page_numbering:
  # 3.5: başlangıç kısmı küçük Romen (ii, iii…), ana metin Arap (1, 2…)
  formats_in_order: [lowerRoman, decimal]
  position: bottom_center       # 3.5 "sayfanın alt orta kısmında"

document:
  forbid_tracked_changes: true
