# Ankara Yıldırım Beyazıt Üniversitesi Sağlık Bilimleri Enstitüsü — Lisansüstü Tez Yazım Kılavuzu (Ankara, 2026)
# Kaynak: https://aybu.edu.tr/GetFile?id=Upload/c3ab2dfa-67d6-4782-8e84-8aa95646e2db.pdf
# Sayfa: https://aybu.edu.tr/saglikbe/tr/sayfa/254
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: aybu-sabe
version: 1
name: "Ankara Yıldırım Beyazıt Üniversitesi · Sağlık Bilimleri Enstitüsü"
source: "AYBÜ Sağlık Bilimleri Enstitüsü Lisansüstü Tez Yazım Kılavuzu, 2026"
institution: "Ankara Yıldırım Beyazıt Üniversitesi"
source_url: https://aybu.edu.tr/GetFile?id=Upload/c3ab2dfa-67d6-4782-8e84-8aa95646e2db.pdf

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 1.2, 1.8 "A4"
  margins_cm: { top: 2.5, bottom: 2.5, left: 4.0, right: 2.5 }   # 1.4, 1.8 "sol (cilt) kenarında 4 cm, üst, alt ve sağ ... 2,5 cm"

fonts:
  allowed: [Times New Roman]    # 1.1 Yazı Tipi

roles:
  body:
    size_pt: 12                 # 1.1 Yazı Boyutu "12 punto"
    line_spacing: 1.5           # 1.8 "1,5 satır aralığı"
    alignment: justify          # 1.4, 1.8 "her iki yana yaslanmış"
    first_line_indent_cm: 1.25  # 1.1, 1.8 "1 tab (1,25 cm) içeriden"
  heading_1:
    size_pt: 14                 # 1.9 "ana bölüm başlıkları 14 punto boyutunda koyu" — ÇELİŞKİ: 1.1 "Kapak sayfaları hariç tüm yazılarda ... 12 punto"
    bold: true                  # 1.1 Yazı Rengi, 1.9
    all_caps: true              # 1.1 Ana ve Ara Başlıklar, 1.9 "büyük harfle"
    indent_left_cm: 1.25        # 1.1, 1.9 "sol taraftan 1 tab içeriden"
    page_break_before: true     # 1.3, 1.9 "Bütün ana bölümler yeni bir sayfadan"
  heading_2:
    size_pt: 12                 # 1.9 "alt bölüm başlıkları ise 12 punto boyutunda koyu"
    bold: true                  # 1.9
    case: title                 # 1.1, 1.9 "her sözcüğün ilk harfi büyük"
    indent_left_cm: 1.25        # 1.1, 1.9
  heading_3:
    size_pt: 12                 # 1.9
    bold: true                  # 1.9
    case: title                 # 1.1 "İkinci ve daha ileri derece ... her sözcüğün ilk harfi büyük"
    indent_left_cm: 1.25        # 1.1, 1.9
  table_caption:
    size_pt: 12                 # 1.7 "Başlıkların yazım boyutu 12 puntodur"
    line_spacing: 1.0           # 1.7 "başlık yazımında 1 satır aralığı"
    italic: true                # 1.1, 1.7 "Tablo ismi açık (bold olmayan) renk ve italik" (numara koyu)
    case: title                 # 1.7 "her sözcüğün ilk harfi büyük"
    position: above             # 1.7 "tabloların üst kısmına sola yaslı"
    indent_left_cm: 1.25        # 1.7 "1 tab içerden"
  figure_caption:
    size_pt: 12                 # 1.7
    line_spacing: 1.0           # 1.7
    italic: true                # 1.1, 1.7
    case: title                 # 1.7
    position: below             # 1.7 "şekillerin alt kısmına sola yaslı"
    indent_left_cm: 1.25        # 1.7

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # 1.5 "küçük harf Romen" / Giriş'ten "1, 2, 3"
  position: bottom_center       # 1.5 "aşağı kısmına metin bloğunun orta hizasında"
  forbid_decoration: true       # 1.5 "parantez, çizgi gibi işaretler kullanılmamalıdır"

document:
  forbid_tracked_changes: true
