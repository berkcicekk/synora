# Trabzon Üniversitesi Lisansüstü Eğitim Enstitüsü — Tez Yazım Kılavuzu (Ocak 2020)
# Kaynak: https://lisansustu.trabzon.edu.tr/Share/6961C7ED152F5686D108AD6C04A1E948
#   ("Tez Yazım İşlemleri" sayfasındaki "Yeni kılavuz" bağlantısı: https://lisansustu.trabzon.edu.tr/S/3342)
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
# Not: Sayfa numarası konumu bölüme göre değişiyor (ön bölüm alt orta, metin sağ üst; s. 5);
# tek bir konum alanı olduğundan position verilmedi.
ruleset: trabzon-lee
version: 1
name: "Trabzon Üniversitesi · Lisansüstü Eğitim Enstitüsü"
source: "Trabzon Üniversitesi Lisansüstü Eğitim Enstitüsü Tez Yazım Kılavuzu, 2020"
institution: "Trabzon Üniversitesi"
source_url: https://lisansustu.trabzon.edu.tr/Share/6961C7ED152F5686D108AD6C04A1E948

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # s. 4 "DIN-A4 normuna uygun (210 x 297)"
  margins_cm: { top: 3.0, bottom: 2.5, left: 3.0, right: 2.5 }   # s. 5 "üst ve sol 3 cm, alt ve sağ 2,5 cm"

fonts:
  allowed: [Times New Roman]    # s. 4 "Tezin tamamında ... Times New Roman"

roles:
  body:
    size_pt: 11                 # s. 4 "metin içerisindeki yazıların boyutu 11 punto"
    line_spacing: 1.5           # s. 6
    alignment: justify          # s. 6 "iki yana yaslı"
    first_line_indent_cm: 1.0   # s. 6 "satır başından 1 cm boşluk"
    space_after_pt: 0           # s. 6 "paragraflar arasında boşluk bırakılmamalıdır"
  heading_1:
    size_pt: 12                 # s. 4
    bold: true                  # s. 4
    all_caps: true              # s. 4 "ana bölümlerin yazımında bütün harfler büyük"
    alignment: left             # s. 4 "sola hizalı"
    first_line_indent_cm: 1.0   # s. 4 "paragraf başından (1 cm içeriden)"
    page_break_before: true     # s. 5 "yeni bir sayfadan başlamak üzere"
  heading_2:
    size_pt: 12                 # s. 4
    bold: true                  # s. 4, s. 6
    case: title                 # s. 4 "her kelimenin ilk harfi büyük"
    alignment: left             # s. 4
    first_line_indent_cm: 1.0   # s. 4
  heading_3:
    size_pt: 12                 # s. 4
    bold: true                  # s. 4, s. 6
    case: title                 # s. 6 "alt başlıkların tümü ... kelimelerin sadece ilk harfleri büyük"
    alignment: left             # s. 4
    first_line_indent_cm: 1.0   # s. 4
  figure_caption:
    bold: false                 # s. 11 "koyu ya da italik yazılmaz"
    italic: false               # s. 11
    case: sentence              # s. 11 "sadece ilk kelimenin ilk harfi büyük"
    alignment: left             # s. 11 "sola dayalı"
    first_line_indent_cm: 1.0   # s. 11 "paragraf başından yazılarak"
    position: below             # s. 11 "gösterimin altına"
  table_caption:
    size_pt: 11                 # s. 10 "metinle aynı puntoda"
    bold: false                 # s. 10 "koyu ya da italik yazılmaz"
    italic: false               # s. 10
    case: title                 # s. 10 "tüm kelimelerin ilk harfi büyük"
    alignment: left             # s. 10 "sola hizalı"
    position: above             # s. 10 "tablonun üstüne"
  block_quote:
    size_pt: 10                 # s. 22 "10 punto"
    line_spacing: 1.0           # s. 22 "tek satır aralığı"
    alignment: justify          # s. 22 "iki yana yaslı"
    indent_left_cm: 1.0         # s. 22 "sağdan ve soldan 1 cm içeri girinti"
  reference_entry:
    line_spacing: 1.0           # s. 18 "tek satır aralıklı"
    alignment: justify          # s. 18 "iki yana yaslı"
    first_line_indent_cm: -1.0  # s. 18 ikinci ve sonraki satırlar "1 cm içeriden"

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # s. 5 ön bölüm küçük Romen, metin 1, 2, 3

document:
  forbid_tracked_changes: true
