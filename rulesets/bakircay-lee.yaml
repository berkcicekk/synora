# İzmir Bakırçay Üniversitesi Lisansüstü Eğitim Enstitüsü — Lisansüstü Tez Yazım Kılavuzu (Temmuz 2020)
# Kaynak: https://enstitu.bakircay.edu.tr/Yuklenenler/ENST%C4%B0T%C3%9C/Bak%C4%B1r%C3%A7ay_%C3%9Cni.%20lee%20-%20tez%20yazim-kilavuzu_son.pdf
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: bakircay-lee
version: 1
name: "İzmir Bakırçay Üniversitesi · Lisansüstü Eğitim Enstitüsü"
source: "İzmir Bakırçay Üniversitesi Lisansüstü Tez Yazım Kılavuzu, 2020"
institution: "İzmir Bakırçay Üniversitesi"
source_url: https://enstitu.bakircay.edu.tr/Yuklenenler/ENST%C4%B0T%C3%9C/Bak%C4%B1r%C3%A7ay_%C3%9Cni.%20lee%20-%20tez%20yazim-kilavuzu_son.pdf

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 2.1
  margins_cm: { top: 3.0, bottom: 2.5, left: 3.5, right: 2.5 }   # 2.1

fonts:
  allowed: [Times New Roman]    # 2.2

roles:
  body:
    size_pt: 12                 # 2.2
    line_spacing: 1.5           # 2.6 "1,5 satır aralığında"
    alignment: justify          # 2.6 "iki yana yaslanmış biçimde (blok)"
    first_line_indent_cm: 1.0   # 2.7 "soldan 1 cm içeriden"
    space_after_pt: 0           # 2.7 "Paragraflar arasında boşluk bırakılmaz"
  heading_1:
    bold: true                  # 2.3 Tablo 2.1 düzey 1
    all_caps: true              # 2.3 Tablo 2.1 "tamamı büyük harf"
    alignment: left             # 2.3 "tamamı sola dayalı"
    line_spacing: 1.0           # 2.3 "başlıkların satır aralığı tek"
    space_before_pt: 24         # 2.3 "24 nokta (24 nk)"
    space_after_pt: 18          # 2.3 "18 nokta (18 nk)"
    page_break_before: true     # 2.3 "Birinci düzey başlıklar yeni bir sayfadan"
  heading_2:
    bold: true                  # 2.3 Tablo 2.1 düzey 2
    alignment: left             # 2.3
    case: title                 # 2.3 "her sözcüğün baş harfi büyük"
    line_spacing: 1.0           # 2.3
    space_before_pt: 24         # 2.3
    space_after_pt: 18          # 2.3
  heading_3:
    bold: true                  # 2.3 Tablo 2.1 düzey 3
    alignment: left             # 2.3
    case: sentence              # 2.3 "sadece ilk sözcüğün baş harfi büyük"
    line_spacing: 1.0           # 2.3
    space_before_pt: 24         # 2.3
    space_after_pt: 18          # 2.3
  figure_caption:
    size_pt: 12                 # 2.4 "başlık ve açıklamalar ... 12 pt"
    alignment: center           # 2.4 "şeklin ve görselin altına ortalı"
    position: below             # 2.4
  table_caption:
    size_pt: 12                 # 2.4
    alignment: left             # 2.4 "tablo/çizelgenin üstüne sola dayalı"
    position: above             # 2.4
  block_quote:
    size_pt: 10                 # 2.2, 2.6 "10 pt"
    indent_left_cm: 2.0         # 2.6 "soldan 2 cm içeriden"
  reference_entry:
    line_spacing: 1.0           # 3.3.1 Kaynakça "satır aralığı tek olmalıdır"
  footnote:
    size_pt: 10                 # 2.2, 2.5
    line_spacing: 1.0           # 2.5 "tek satır aralığı"

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # 2.8
  position: bottom_center       # 2.8 "alt bilgi kısmında ve ortada"
  forbid_decoration: true       # 2.8 "rakam dışında herhangi bir işaret kullanılmaz"

document:
  forbid_tracked_changes: true
