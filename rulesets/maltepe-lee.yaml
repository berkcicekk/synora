# Maltepe Üniversitesi Lisansüstü Eğitim Enstitüsü — Tez Yazım Kılavuzu (Yeni Hâli, 28.04.2026)
# Kaynak: https://www.maltepe.edu.tr/Content/Media/CkEditor/28042026112116361-Tez%20Yaz%C4%B1m%20K%C4%B1lavuzu%20(YEN%C4%B0%20HAL%C4%B0)%2028.04.2026.docx
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
# Kılavuz .docx; madde numaraları çoğunlukla otomatik numaralandırma olduğundan kaynak olarak alt başlıklar verildi.
ruleset: maltepe-lee
version: 1
name: "Maltepe Üniversitesi · Lisansüstü Eğitim Enstitüsü"
source: "Maltepe Üniversitesi Lisansüstü Eğitim Enstitüsü Tez Yazım Kılavuzu, 2026"
institution: "Maltepe Üniversitesi"
source_url: https://www.maltepe.edu.tr/Content/Media/CkEditor/28042026112116361-Tez%20Yaz%C4%B1m%20K%C4%B1lavuzu%20(YEN%C4%B0%20HAL%C4%B0)%2028.04.2026.docx

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # Kullanılacak Kâğıt "A4 standardında (21 x 29.7 cm)"
  margins_cm: { top: 3.0, bottom: 3.0, left: 3.5, right: 2.5 }   # Sayfa Düzeni

fonts:
  allowed: [Times New Roman]    # Yazı Karakteri

roles:
  body:
    size_pt: 12                 # Yazı Karakteri
    line_spacing: 1.5           # Satır Aralıkları ve Düzeni "1,5 satır aralık"
    alignment: justify          # Satır Aralıkları ve Düzeni "iki yana yaslı"
    first_line_indent_cm: 0     # Satır Aralıkları ve Düzeni "paragraf girintisi yapılmamalıdır"
    space_before_pt: 12         # Satır Aralıkları ve Düzeni "Paragraf öncesi 12 nk"
    space_after_pt: 6           # Satır Aralıkları ve Düzeni "sonrası 6 nk"
  heading_1:
    size_pt: 14                 # Yazı Karakteri, Satır Aralıkları ve Düzeni
    bold: true                  # Yazı Karakteri "koyu"
    all_caps: true              # Satır Aralıkları ve Düzeni "tamamı büyük harf"
    alignment: justify          # Satır Aralıkları ve Düzeni "iki yana yaslı şekilde" (İçindekiler örneğinde ortalı)
    space_before_pt: 0          # Satır Aralıkları ve Düzeni "önce 0 nk"
    space_after_pt: 12          # Satır Aralıkları ve Düzeni "sonra 12 nk"
    page_break_before: true     # Metin Kısmı "Her bölüm yeni bir sayfadan başlatılmalıdır"
  heading_2:
    size_pt: 12                 # Yazı Karakteri
    bold: true                  # Satır Aralıkları ve Düzeni "bütün başlıklar ... koyu"
    case: title                 # Yazı Karakteri "kelimelerin baş harfleri büyük"
    alignment: justify          # Satır Aralıkları ve Düzeni
    space_before_pt: 0          # Satır Aralıkları ve Düzeni
    space_after_pt: 12          # Satır Aralıkları ve Düzeni
  heading_3:
    size_pt: 12                 # Yazı Karakteri
    bold: true                  # Satır Aralıkları ve Düzeni
    case: title                 # Yazı Karakteri
    alignment: justify          # Satır Aralıkları ve Düzeni
    space_before_pt: 0          # Satır Aralıkları ve Düzeni
    space_after_pt: 12          # Satır Aralıkları ve Düzeni
  figure_caption:
    size_pt: 12                 # Tablolar ve Şekiller Listesi "12 punto"
    space_after_pt: 12          # Tablo ve Şekiller "sonrasında 12 nk" (öncesi: "12 nk" ile "0 nk" — ÇELİŞKİ, denetlenmez)
    position: below             # Tablo ve Şekiller "şeklin altına"
  table_caption:
    size_pt: 12                 # Tablolar ve Şekiller Listesi
    space_after_pt: 12          # Tablo ve Şekiller
    position: above             # Tablo ve Şekiller "tablonun ise üstüne"
  block_quote:
    indent_left_cm: 1.5         # Alıntılar "sol kenardan bir tab (1,5 cm) içerden"

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # 1.2.4 Sayfa Numaralama
  position: bottom_center       # 1.2.4 "sayfanın alt orta kısmına"

document:
  forbid_tracked_changes: true
