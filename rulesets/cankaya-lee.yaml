# Çankaya University — A Style Manual for Writing Graduate Theses and Dissertations (Ocak 2025 sürümü)
# Kaynak: https://gs.cankaya.edu.tr/wp-content/uploads/sites/54/2025/01/Thesis-Manual.docx
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
# Not: Kılavuz "Times New Roman 12, Arial 11 veya herhangi bir standart yazı tipi (12)" diyor; yazı tipi listesi
# kapalı olmadığı ve punto yazı tipine bağlı olduğu için fonts.allowed ve size_pt yazılmadı (1.1.2).
ruleset: cankaya-lee
version: 1
name: "Çankaya Üniversitesi · Lisansüstü Eğitim Enstitüsü"
source: "Çankaya University A Style Manual for Writing Graduate Theses and Dissertations, 2025"
institution: "Çankaya Üniversitesi"
source_url: https://gs.cankaya.edu.tr/wp-content/uploads/sites/54/2025/01/Thesis-Manual.docx

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 1.1.1
  # 1.1.3.1: sol 4, sağ 2,5, alt 2,5; üst 2,5 (ana başlıklı sayfalarda 5 cm — bölüm düzeyinde denetlenemez)
  margins_cm: { top: 2.5, bottom: 2.5, left: 4.0, right: 2.5 }

roles:
  body:
    line_spacing: 1.5           # 1.1.3.2
    alignment: justify          # 1.1.2 "The text must be justified"
    first_line_indent_cm: 1.25  # 1.1.3.3
    space_before_pt: 0          # 1.1.3.2 Before = 0
    space_after_pt: 0           # 1.1.3.2, 1.1.3.3 "No extra spacing is allowed between paragraphs"
  heading_1:
    bold: true                  # 1.1.3.4.1
    all_caps: true              # 1.1.3.4.1 "All the words are capitalized"
    alignment: center           # 1.1.3.4.1 "centred between both margins"
    page_break_before: true     # 1.1.3.4.1 "begin on a new page"
  heading_2:
    bold: true                  # 1.1.3.4.2
    all_caps: true              # 1.1.3.4 örnek "Left-aligned, Bold, ALL CAPITALS"
    alignment: left             # 1.1.3.4.2
  heading_3:
    bold: true                  # 1.1.3.4.3
    alignment: left             # 1.1.3.4.3
    case: title                 # 1.1.3.4.3 "capitals for the first letters of all words"
  table_caption:
    position: above             # 1.2.2.3 "placed above tables"
  block_quote:
    line_spacing: 1.5           # 2.1.4 "1.5 line spacing"
    indent_left_cm: 1.25        # 2.1.4 "indenting 1 TAB (1.25 cm) from the left"
    first_line_indent_cm: 0     # 2.1.4 "not indented on the first line"
  footnote:
    line_spacing: 1.0           # 1.2.2.4
    alignment: justify          # 1.2.2.4
    first_line_indent_cm: 0     # 1.2.2.4 "without indenting the first line"

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # 1.1.6.2, 1.1.6.3
  position: bottom_center       # 1.1.6 "centered at the bottom"

document:
  forbid_tracked_changes: true
