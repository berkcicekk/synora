# Muğla Sıtkı Koçman Üniversitesi Fen Bilimleri Enstitüsü — Tez Yazım Kılavuzu, 2025
# Kaynak: https://fenbilimleri.mu.edu.tr/Newfiles/115/Content/MSK%C3%9C_FBE_Tez_Yaz%C4%B1m_Klavuzu%20(_pdf).pdf
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
# Not: başlık öncesi boşluklar sayfa başında uygulanmaz (2.6); burada genel değerler kodlandı.
ruleset: mu-fbe
version: 1
name: "Muğla Sıtkı Koçman Üniversitesi · Fen Bilimleri Enstitüsü"
source: "Muğla Sıtkı Koçman Üniversitesi Fen Bilimleri Enstitüsü Tez Yazım Kılavuzu, 2025"
institution: "Muğla Sıtkı Koçman Üniversitesi"
source_url: https://fenbilimleri.mu.edu.tr/Newfiles/115/Content/MSK%C3%9C_FBE_Tez_Yaz%C4%B1m_Klavuzu%20(_pdf).pdf

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  margins_cm: { top: 2.5, bottom: 2.5, left: 4.0, right: 2.5 }   # 2.2

fonts:
  allowed: [Times New Roman]    # 2.3

roles:
  body:
    size_pt: 12                 # 2.3
    line_spacing: 1.5           # 2.5
    alignment: justify          # 2.5 "iki yana yaslanmış"
    first_line_indent_cm: 0     # 2.5 "Paragraf başlarında sekme (girinti) bırakılmamalı"
    space_after_pt: 6           # 2.5 "Her paragraf sonrasında 6 nk"
  heading_1:
    size_pt: 14                 # 2.3, 2.6
    bold: true                  # 2.3, 2.6
    all_caps: true              # 2.3, 2.6 "BÜYÜK HARF"
    alignment: center           # 2.6 "ORTAYA HİZALI"
    space_before_pt: 60         # 2.6
    space_after_pt: 36          # 2.6
  heading_2:
    size_pt: 12                 # 2.3, 2.6
    bold: true                  # 2.3, 2.6
    case: title                 # 2.6 "Her Kelimenin Baş Harfi Büyük"
    alignment: justify          # 2.6 "İki Yana Yaslanmış"
    space_before_pt: 36         # 2.6
    space_after_pt: 24          # 2.6
  heading_3:
    size_pt: 12                 # 2.3, 2.6
    bold: true                  # 2.3, 2.6
    case: sentence              # 2.6 "Sadece ilk kelimenin baş harfi büyük"
    alignment: justify          # 2.6
    space_before_pt: 24         # 2.6
    space_after_pt: 18          # 2.6
  figure_caption:
    size_pt: 10                 # 2.3, 2.7
    bold: true                  # 2.3, 2.7
    line_spacing: 1.0           # 2.5
    alignment: center           # 2.5, 2.7
    space_before_pt: 9          # 2.7 "şekil başlıklarından önce 9 nk"
    space_after_pt: 18          # 2.7 "sonra ise 18 nk"
    position: below             # 2.7
  table_caption:
    size_pt: 10                 # 2.3, 2.7
    bold: true                  # 2.3, 2.7
    line_spacing: 1.0           # 2.5
    alignment: center           # 2.5, 2.7
    space_before_pt: 18         # 2.7 "çizelge başlıklarından önce 18 nk"
    space_after_pt: 9           # 2.7 "sonra 9 nk"
    position: above             # 2.7
  reference_entry:
    size_pt: 12                 # 3.3.1
    alignment: justify          # 3.3.1
    line_spacing: 1.0           # 2.5, 3.3.1 "bir satır aralığı"
    space_after_pt: 6           # 3.3.1

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # 2.4
  position: bottom_center       # 2.4 "sayfanın altında, ortaya hizalanmış"

document:
  forbid_tracked_changes: true
