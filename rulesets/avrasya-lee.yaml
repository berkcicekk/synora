# Avrasya Üniversitesi Lisansüstü Eğitim Enstitüsü — Tez Yazım Kılavuzu (Trabzon 2026)
# Kaynak: https://lee.avrasya.edu.tr/wp-content/uploads/2026/07/AVU-LEE-Tez-Yazim-Kilavuzu-2026.pdf
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: avrasya-lee
version: 1
name: "Avrasya Üniversitesi · Lisansüstü Eğitim Enstitüsü"
source: "Avrasya Üniversitesi Lisansüstü Eğitim Enstitüsü Tez Yazım Kılavuzu, 2026"
institution: "Avrasya Üniversitesi"
source_url: https://lee.avrasya.edu.tr/wp-content/uploads/2026/07/AVU-LEE-Tez-Yazim-Kilavuzu-2026.pdf

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 2.1 "iyi kalite A-4 kâğıda"
  margins_cm: { top: 2.5, bottom: 2.5, left: 4.0, right: 2.5 }   # 2.2 sol 4 cm, diğer üç kenar 2,5 cm

fonts:
  allowed: [Times New Roman]    # 2.4

roles:
  body:
    size_pt: 12                 # 2.4
    line_spacing: 1.5           # 2.5
    alignment: justify          # 2.5 "iki yana yaslı"
    first_line_indent_cm: 1.0   # 2.5 "1 cm ilk satır girintisi"
    space_after_pt: 6           # 2.5 "her paragraftan sonra 6 nk"
  heading_1:
    size_pt: 14                 # 2.4 "bölüm başlıkları 14 punto"
    bold: true                  # 2.4, 2.6
    all_caps: true              # 2.6 "BÜTÜN HARFLER BÜYÜK"
    alignment: justify          # 2.6 "iki yana dayalı" — ÇELİŞKİ: 3.3.2 bölüm numarası "sayfanın başına ortalanacak"
    first_line_indent_cm: 1.0   # 2.6 başlıklarda da 1 cm ilk satır girintisi
    space_before_pt: 6          # 2.6
    space_after_pt: 6           # 2.6
    page_break_before: true     # 2.6 "her ana bölüm yeni bir sayfada başlar"
  heading_2:
    size_pt: 12                 # 2.4 "alt başlıklar metin ile aynı boyutta"
    bold: true                  # 2.6
    case: title                 # 2.6 "Sadece Baş Harfleri Büyük"
    alignment: justify          # 2.6
    first_line_indent_cm: 1.0   # 2.6
    space_before_pt: 6          # 2.6
    space_after_pt: 6           # 2.6
  heading_3:
    size_pt: 12                 # 2.4
    bold: true                  # 2.6
    case: title                 # 2.6
    alignment: justify          # 2.6
    first_line_indent_cm: 1.0   # 2.6
    space_before_pt: 6          # 2.6
    space_after_pt: 6           # 2.6
  figure_caption:
    size_pt: 10                 # 2.7 "şekillerin başlıkları ... 10 punto"
    line_spacing: 1.0           # 2.5, 2.7
    alignment: center           # 2.7 "satırı ortalayacak biçimde"
    position: below             # 2.7 "şekil altına"
  table_caption:
    size_pt: 10                 # 2.7
    line_spacing: 1.0           # 2.5, 2.7
    alignment: center           # 2.7
    position: above             # 2.7 "tablo üstüne"
  block_quote:
    size_pt: 10                 # 2.5, 4
    line_spacing: 1.0           # 2.5
    alignment: justify          # 2.5
    indent_left_cm: 2.0         # 2.5 "soldan 2 cm, sağdan 1 cm ek girinti"
    first_line_indent_cm: 0.5   # 2.5 "paragraf başı olarak 0.5 cm"
    space_after_pt: 6           # 2.5
  reference_entry:
    size_pt: 11                 # 3.4.1
    line_spacing: 1.0           # 3.4.1, 4.2
    alignment: justify          # 3.4.1
    first_line_indent_cm: -1.0  # 3.4.1 "1 cm asılı paragraf girintisi"
    space_after_pt: 6           # 3.4.1 — ÇELİŞKİ: 4.2 "iki kaynak arasında bir satır boşluk"
  footnote:
    size_pt: 10                 # 2.4, 2.8
    line_spacing: 1.0           # 2.8
    alignment: justify          # 2.8
    space_after_pt: 0           # 2.8 "sıfır nk"

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # 2.3 ön kısım Romen (i, ii, iii), metin Arap rakamı
  position: bottom_center       # 2.3 "sayfanın altında ve ortalanmış"

document:
  forbid_tracked_changes: true
