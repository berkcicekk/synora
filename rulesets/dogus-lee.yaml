# Doğuş Üniversitesi Lisansüstü Eğitim Enstitüsü — Tez ve Proje Yazım Kılavuzu (2026)
# 2026-2027 öğretim yılından itibaren yalnızca bu (yeni) kılavuz geçerli (enstitü sayfası).
# Kaynak: https://lisansustu.dogus.edu.tr/docs/librariesprovider9/tez-kilavuz-tr/tez-ve-proje-yaz%C4%B1m-k%C4%B1lavuzu-2026.pdf
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: dogus-lee
version: 1
name: "Doğuş Üniversitesi · Lisansüstü Eğitim Enstitüsü"
source: "Doğuş Üniversitesi Lisansüstü Eğitim Enstitüsü Tez ve Proje Yazım Kılavuzu, 2026"
institution: "Doğuş Üniversitesi"
source_url: "https://lisansustu.dogus.edu.tr/docs/librariesprovider9/tez-kilavuz-tr/tez-ve-proje-yaz%C4%B1m-k%C4%B1lavuzu-2026.pdf"

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 2.1 "21cm x 29,7cm ebatlarında A-4"
  margins_cm: { top: 3.0, bottom: 3.0, left: 3.5, right: 3.0 }   # 2.2, 2.3 "üst, alt ve sağdan 3 cm ve sol taraftan 3,5 cm"

fonts:
  allowed: [Times New Roman]    # 2.2

roles:
  body:
    size_pt: 12                 # 2.2 "Yazı boyutu 12 puntodur"
    line_spacing: 1.5           # 2.3 "Satır aralıkları 1,5 satır"
    alignment: justify          # 2.3 "iki yanına yaslanmış"
    first_line_indent_cm: 1.25  # 2.3 "Özel (ilk satır) Değer (1,25cm)"
    space_before_pt: 0          # 2.3 "Önce (0nk)"
    space_after_pt: 6           # 2.3 "Sonra (6nk)"
  heading_1:
    size_pt: 12                 # 3.1 "Bölüm Başlığı 12 punto"
    bold: true                  # 3.1 "koyu"
    all_caps: true              # 3.1 "büyük harflerle"
    alignment: center           # 3.1 "sayfa ortalanarak" — ÇELİŞKİ: 3.1/iv "başlıkların tümü ... sola yaslı olur"
    page_break_before: true     # 3.1/i "yeni bir sayfadan başlar"
  heading_2:
    size_pt: 12                 # 3.1/iii
    case: sentence              # 3.1/iii "büyük harfle başlayıp küçük harflerle devam"
    alignment: left             # 3.1/iv "sola yaslı"
  heading_3:
    size_pt: 12                 # 3.1/iii
    case: sentence              # 3.1/iii
    alignment: left             # 3.1/iv
  table_caption:
    bold: true                  # 2.11 "tablonun üstünde, koyu harflerle ve ortalanmış"
    alignment: center           # 2.11
    position: above             # 2.11
  figure_caption:
    bold: true                  # 2.11 "şeklin altında, koyu harflerle ve ortalanarak"
    alignment: center           # 2.11
    position: below             # 2.11
  footnote:
    size_pt: 10                 # 2.3 "Dipnotlarda ... 10 punto"
    line_spacing: 1.0           # 2.3 "satır aralığı (tek)"

page_numbering:
  # 2.4: İçindekiler'den Giriş'e kadar küçük Roma (i, ii, iii…), Giriş'ten itibaren 1, 2, 3…
  formats_in_order: [lowerRoman, decimal]
  position: bottom_center       # 2.4 "sayfanın altına ortalanarak"

document:
  forbid_tracked_changes: true
