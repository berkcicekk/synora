# Burdur Mehmet Akif Ersoy Üniversitesi Sağlık Bilimleri Enstitüsü — Lisansüstü Tez Yazım Kılavuzu (2026)
# Kaynak: https://depo2.mehmetakif.edu.tr//storage/sagbil/contents/27084/56_27084_2026-02-10-08-30-39-608016_tez-yazim-kilavuzu.pdf
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: burdur-sabe
version: 1
name: "Burdur Mehmet Akif Ersoy Üniversitesi · Sağlık Bilimleri Enstitüsü"
source: "MAKÜ Sağlık Bilimleri Enstitüsü Lisansüstü Tez Yazım Kılavuzu, 2026"
institution: "Burdur Mehmet Akif Ersoy Üniversitesi"
source_url: https://depo2.mehmetakif.edu.tr//storage/sagbil/contents/27084/56_27084_2026-02-10-08-30-39-608016_tez-yazim-kilavuzu.pdf

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 1.1, 1.4 "standart A4 (210 x 297 mm)"
  margins_cm: { top: 3.0, bottom: 3.0, left: 4.0, right: 2.5 }  # 1.4 "sol 4 cm, alt ve üst 3 cm, sağ 2,5 cm"

fonts:
  allowed: [Times New Roman]    # 1.3 "Times New Roman yazı karakteri"

roles:
  body:
    size_pt: 12                 # 1.3 "12 punto ile yazılmalıdır"
    line_spacing: 1.5           # 1.6 "ana metin (başlıklar dahil) 1,5 satır aralıklı"
    alignment: justify          # 1.4 "iki yana yaslı formatında"
    first_line_indent_cm: 1.25  # 1.6 "1,25 cm içeriden satır başı"
    space_after_pt: 18          # 1.6 "iki paragraf arası 18 nk boşluk"
  heading_1:
    size_pt: 12                 # 1.7 "12 punto ile koyu (Bold)"
    bold: true                  # 1.7
    all_caps: true              # 1.7 "birinci derecede bölüm başlıkları büyük harfle"
    line_spacing: 1.5           # 1.6 "başlıklar dahil"
    first_line_indent_cm: 0     # 1.7 "metin bloğunun sol kenarından başlatılmalıdır (1,25 cm boşluk bırakılmamalıdır)"
    page_break_before: true     # 1.6 "birinci dereceden bölüm başlıkları ... yeni sayfadan başlamalıdır"
    space_after_pt: 18          # 1.6 "başlıklardan sonra 18 nk boşluk"
  heading_2:
    size_pt: 12                 # 1.7
    bold: true                  # 1.7
    case: title                 # 1.7 "her kelimenin ilk harfi büyük", bağlaçlar küçük
    line_spacing: 1.5           # 1.6
    first_line_indent_cm: 0     # 1.7
    space_after_pt: 18          # 1.6
  heading_3:
    size_pt: 12                 # 1.7
    bold: true                  # 1.7
    case: title                 # 1.7
    line_spacing: 1.5           # 1.6
    first_line_indent_cm: 0     # 1.7
    space_after_pt: 18          # 1.6
  figure_caption:
    line_spacing: 1.0           # 1.6, 2.7 "tek satır aralık"
    first_line_indent_cm: 0     # 2.7 "sol kenarından başlatılmalıdır (1,25 cm boşluk bırakılmamalıdır)"
    case: sentence              # 2.7 "ilk kelimesinin ilk harfi büyük; diğer kelimeleri küçük"
    space_before_pt: 12         # 2.7 "Şekil ile şekil altı metin açıklaması arasında 12 nk"
    space_after_pt: 18          # 1.6, 2.7 "şekil altı açıklamaları ile ana metin arasında 18 nk"
    position: below             # 2.7 "şekil altı açıklaması"
  table_caption:
    line_spacing: 1.0           # 1.6 "Şekil ve Tablo başlıklarında tek satır aralık"
    first_line_indent_cm: 0     # 2.8 "satır başında 1,25 cm girinti bırakılmamalı"
    case: sentence              # 2.8 "ilk kelimesinin ilk harfi büyük; diğer kelimeleri küçük"
    space_before_pt: 18         # 1.6, 2.8 "Ana metin ile tablo başlığı arasında 18 nk"
    space_after_pt: 12          # 1.6, 2.8 "Tablo başlığı ile tablo arasında 12 nk"
    position: above             # 2.8 "tablo başlığı tablonun üstünde"
  reference_entry:
    line_spacing: 1.0           # 2.18 "tek satır aralık ile"
    space_after_pt: 12          # 2.18 "Kaynaklar arasında 12 nk boşluk"
  footnote:
    line_spacing: 1.0           # 1.6 "dipnotların yazımında tek satır aralık"

page_numbering:
  # 1.5: ön sayfalar Roma (i, ii, iii…), giriş bölümünden itibaren Arap rakamı
  formats_in_order: [lowerRoman, decimal]
  position: bottom_center       # 1.5 "sayfanın alt kısmına metin bloğunun ortasında"
  forbid_decoration: true       # 1.5 "önünde ve arkasında parantez ve çizgi gibi işaretler olmamalıdır"

document:
  forbid_tracked_changes: true
