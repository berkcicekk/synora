# İstanbul Ticaret Üniversitesi Lisansüstü Eğitim Enstitüsü / Ticaret ve Finans Enstitüsü — Lisansüstü Tez Yazım Kılavuzu (Mart 2026)
# Kaynak: http://ticaret.edu.tr/ticaret-ve-finans-enstitusu/wp-content/uploads/sites/36/2026/03/Guncel-Tez-Yazim-Kilavuzu-Mart-2026-1.pdf
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: ticaret-lee
version: 1
name: "İstanbul Ticaret Üniversitesi · Lisansüstü Eğitim Enstitüsü"
source: "Lisansüstü Tez Yazım Kılavuzu, 2026"
institution: "İstanbul Ticaret Üniversitesi"
source_url: http://ticaret.edu.tr/ticaret-ve-finans-enstitusu/wp-content/uploads/sites/36/2026/03/Guncel-Tez-Yazim-Kilavuzu-Mart-2026-1.pdf

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 3.1 "A4 boyutunda (210 mm x 297mm)"
  margins_cm: { top: 2.5, bottom: 2.5, left: 4.0, right: 2.5 }   # 3.2

fonts:
  allowed: [Times New Roman]    # 3.4

roles:
  body:
    size_pt: 12                 # 3.4
    line_spacing: 1.5           # 3.6
    alignment: justify          # 3.2 "iki yana yaslanarak yazılır"
    first_line_indent_cm: 0     # 3.6 "paragraf başları girintisiz olmalı"
    space_before_pt: 6          # 3.6 "yukarıdan 6 nk"
    space_after_pt: 6           # 3.6 "aşağıdan da 6 nk"
  heading_1:
    size_pt: 12                 # 3.14 bölüm başlığı
    bold: true                  # 3.14
    all_caps: true              # 3.14 "büyük karakter"
    alignment: center           # 3.14 "sayfa ortalanarak"
    page_break_before: true     # 3.2, 3.6 "Ana bölümler daima yeni bir sayfa ile başlamalıdır"
  heading_2:
    size_pt: 12                 # 3.14.1
    bold: true                  # 3.14.1
    alignment: justify          # 3.14.1 "ana metinle aynı hizada ... iki yana yaslanarak"
    first_line_indent_cm: 0     # 3.6 "Başlıklar, alt başlıklar ... girintisiz"
    # ÇELİŞKİ: 3.14.1 "Ana başlık büyük karakter"; Tablo 3.1 örneği "3.1. Birinci Derece Başlık" → yazım biçimi denetlenmez
  heading_3:
    size_pt: 12                 # 3.14.1
    bold: true                  # 3.14.1
    alignment: justify          # 3.14.1
    first_line_indent_cm: 0     # 3.6
    case: title                 # 3.14.1 "alt başlıklarda yer alan sözcüklerin ilk harflerinde büyük"
  table_caption:
    size_pt: 12                 # 3.9
    bold: true                  # 3.9 "başlık koyu (bold)"
    position: above             # 3.9 "Tablo başlığı tablonun üzerinde"
  figure_caption:
    size_pt: 12                 # 3.9
    bold: true                  # 3.9
    line_spacing: 1.0           # 3.9 "Şekil, grafik ve resim başlıklarında satır aralığı 1"
    position: below             # 3.9 "görsellerin başlığı ise altında"
  footnote:
    size_pt: 11                 # 3.4 "Dipnotlarda 11 punto"
    line_spacing: 1.0           # 3.8
    space_before_pt: 6          # 3.8 "alttan ve üstten 6 nk"
    space_after_pt: 6           # 3.8
  block_quote:
    italic: true                # 3.10 "italik olarak verilir"
    line_spacing: 1.5           # 3.10
  reference_entry:
    line_spacing: 1.5           # 3.8 "Kaynakçada satır aralığı 1.5"
    space_before_pt: 6          # 3.8
    space_after_pt: 6           # 3.8

page_numbering:
  # 3.3: Giriş'e kadar küçük Romen (i, ii…), Giriş'ten itibaren 1, 2, 3…
  formats_in_order: [lowerRoman, decimal]
  position: bottom_center       # 3.3 "her sayfanın altında ortalanarak"
  forbid_decoration: true       # 3.3 "yanına parantez veya çizgi gibi işaretler konulmaz"

document:
  forbid_tracked_changes: true
