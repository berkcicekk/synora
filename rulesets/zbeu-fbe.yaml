# Zonguldak Bülent Ecevit Üniversitesi Fen Bilimleri Enstitüsü — Lisansüstü Tezleri Yazım Kılavuzu (2026; 17.02.2026 güncellemesi)
# Kaynak: https://cdn1.beun.edu.tr/fbe/b9e51a10b98acce3f16cb5ff32af319e/beufbetezyazimklavuzutr-03.04.2026.pdf
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
# Not: ZBEÜ'de tek bir Lisansüstü Eğitim Enstitüsü yerine ayrı enstitüler var (FBE, SBE, SABE); bkz. zbeu-sbe, zbeu-sabe.
ruleset: zbeu-fbe
version: 1
name: "ZBEÜ · Fen Bilimleri Enstitüsü"
source: "ZBEÜ Fen Bilimleri Enstitüsü Lisansüstü Tezleri Yazım Kılavuzu, 2026"
institution: "Zonguldak Bülent Ecevit Üniversitesi"
source_url: https://cdn1.beun.edu.tr/fbe/b9e51a10b98acce3f16cb5ff32af319e/beufbetezyazimklavuzutr-03.04.2026.pdf

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 2.1 "A4 boyutunda (210 mm × 297 mm)"
  margins_cm: { top: 2.5, bottom: 2.5, left: 2.5, right: 2.5 }   # 2.2 "üst, alt, sağ ve sol kenarlarından 25 mm"

fonts:
  allowed: [Times New Roman]    # 2.3.1

roles:
  body:
    size_pt: 12                 # 2.3.1 "12 punto (pt) boyutunda Times New Roman"
    line_spacing: 1.5           # 2.3.2
    alignment: justify          # 2.3.2 "sağdan aynı hizada"; kontrol listesi "sol ve sağa yaslanmış"
    first_line_indent_cm: 0     # 2.3.2 "paragraf başı için girinti yok"
    space_after_pt: 12          # 2.3.2 "iki paragraf arasında 12 nk"
  heading_1:
    bold: true                  # 2.6 d.5 "başlıklar koyu harflerle"
    all_caps: true              # 2.6 d.6 örnek "BİRİNCİ DERECE BAŞLIK"
    alignment: center           # 2.6 d.2 "ortalanarak"
    space_after_pt: 12          # 2.3.2 "ana bölüm başlığından sonra 12 nk"
    page_break_before: true     # 2.2, 2.6 "tek numaralı sayfadan başlamalı"
  heading_2:
    bold: true                  # 2.6 d.5
    all_caps: true              # 2.6 d.6 örnek "1.1 İKİNCİ DERECE BAŞLIK"
    alignment: left             # 2.6 d.3 "satır başından itibaren"
    space_after_pt: 12          # 2.3.2 "her türlü alt başlıktan sonra 12 nk"
  heading_3:
    bold: true                  # 2.6 d.5
    case: title                 # 2.6 d.6 örnek "1.1.1 Üçüncü Derece Başlık"
    alignment: left             # 2.6 d.3
    space_after_pt: 12          # 2.3.2
  figure_caption:
    line_spacing: 1.0           # 2.3.2, 2.8 d "tek aralıklı"
    case: sentence              # 2.8 d "yalnızca ilk harfi büyük"
    alignment: center           # 2.8 k tek satırlık tanıtım yazıları ortalanır (çok satırlı: iki yana yaslı)
    position: below             # 2.8 d "şekillerin altında"
    space_before_pt: 6          # 2.3.2 "şekil tanıtım yazılarından önce 6 nk"
    space_after_pt: 12          # 2.3.2, 2.8 d "şekil tanımlayıcı yazılarından sonra 12 nk"
  table_caption:
    line_spacing: 1.0           # 2.3.2, 2.8 d
    case: sentence              # 2.8 d
    alignment: center           # 2.8 k
    position: above             # 2.8 d "çizelgelerin ise üstünde"
    space_before_pt: 12         # 2.3.2 "çizelge tanıtım yazılarından önce 12 nk"
    space_after_pt: 6           # 2.3.2, 2.8 d "çizelge tanımlayıcı yazılarından sonra 6 nk"
  block_quote:
    line_spacing: 1.0           # 2.3.2, 2.7.4 "tek aralıklı"
    italic: true                # 2.7.4 "italik yazılmalıdır"
    indent_left_cm: 1.5         # 2.7.4 "sol satır başından itibaren 15 mm içeride"
    space_after_pt: 12          # 2.3.2 "doğrudan alıntıdan sonra 12 nk"
  reference_entry:
    line_spacing: 1.0           # 2.3.2, 2.7.3 "tek aralık"
    first_line_indent_cm: -1.5  # 2.7.3 "ikinci satır 1,5 cm içeriden"
    space_after_pt: 12          # 2.7.3 "kaynak sonrası 12 nk"
  footnote:
    line_spacing: 1.0           # 2.3.2, 2.12 "1 tam aralık"

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # 2.5 ön sayfalar küçük Romen (i, ii, iii), birinci bölümden itibaren Arap
  position: bottom_center       # 2.2 "alt kenarından 10 mm yukarıda ... tam ortada"

document:
  forbid_tracked_changes: true
