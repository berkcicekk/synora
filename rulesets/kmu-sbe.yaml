# Karamanoğlu Mehmetbey Üniversitesi Sosyal Bilimler Enstitüsü — Tez Yazım Kılavuzu (2025)
# Kaynak: https://dosya.kmu.edu.tr/sbe/userfiles/files/2026/kmu-sbe-tez-yazim-klavuzu.pdf
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: kmu-sbe
version: 1
name: "Karamanoğlu Mehmetbey Üniversitesi · Sosyal Bilimler Enstitüsü"
source: "KMÜ Sosyal Bilimler Enstitüsü Tez Yazım Kılavuzu, 2025"
institution: "Karamanoğlu Mehmetbey Üniversitesi"
source_url: https://dosya.kmu.edu.tr/sbe/userfiles/files/2026/kmu-sbe-tez-yazim-klavuzu.pdf

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                                  # 1.2
  margins_cm: { top: 2.5, bottom: 2.5, left: 3.0, right: 2.5 }   # 1.3.1

fonts:
  allowed: [Times New Roman]                # 1.4.1

roles:
  body:
    size_pt: 12                             # 1.4.1
    line_spacing: 1.0                       # 1.4.2 "Satır aralığı 1 (tek) aralık"
    space_before_pt: 0                      # 1.4.2 "önce 0nk"
    space_after_pt: 6                       # 1.4.2 "sonra 6nk"
    alignment: justify                      # 1.3.2 "iki yana yaslanmalıdır"
    first_line_indent_cm: 1.0               # 1.3.3 "ilk satırı soldan 1 cm içeriden"
  heading_1:
    size_pt: 14                             # 1.5
    bold: true                              # 1.5
    all_caps: true                          # 1.5 "tamamı büyük harflerle"
    alignment: center                       # 1.5 "ortalanmış"
    page_break_before: true                 # 1.5 "Sadece ana bölüm başlıkları yeni bir sayfada başlayacaktır"
  heading_2:
    size_pt: 12                             # 1.5
    bold: true                              # 1.5
    alignment: left                         # 1.5 "sola dayalı"
    case: title                             # 1.5 "her kelimesinin ilk harfi büyük"
    line_spacing: 1.0                       # 1.5 "tek (1) satır aralığı"
    space_before_pt: 0                      # 1.5
    space_after_pt: 6                       # 1.5
  heading_3:
    size_pt: 12                             # 1.5
    bold: true                              # 1.5
    alignment: left                         # 1.5
    case: title                             # 1.5
    line_spacing: 1.0                       # 1.5
    space_before_pt: 0                      # 1.5
    space_after_pt: 6                       # 1.5
  figure_caption:
    size_pt: 12                             # 1.13
    alignment: center                       # 1.13 "ortalı"
    case: sentence                          # 1.13 "tümce düzeni"
    line_spacing: 1.0                       # 1.13
    position: below                         # 1.13 "görsel nesnenin altında"
  table_caption:
    size_pt: 12                             # 1.13
    alignment: center                       # 1.13 "ortalı"
    case: sentence                          # 1.13 "tümce düzeni"
    line_spacing: 1.0                       # 1.13
    position: above                         # 1.13 "görsel nesnenin üstüne"
  block_quote:
    line_spacing: 1.0                       # 1.12 "1 tam satır aralığı"
    space_before_pt: 0                      # 1.12 "öncesi ve sonrasında boşluk eklemeden"
    space_after_pt: 0                       # 1.12
  reference_entry:
    size_pt: 12                             # 1.4.1 "Kaynakça dahil ... 12 punto"
    space_before_pt: 0                      # 1.4.2 "kaynakçada önce 0 nk"
    space_after_pt: 6                       # 1.4.2 "sonra 6 nk"
  footnote:
    size_pt: 10                             # 1.4.1, 1.11
    line_spacing: 1.0                       # 1.11 "satır aralığı tek"
    space_before_pt: 0                      # 1.11
    space_after_pt: 0                       # 1.11

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # 1.3.4 başlangıç sayfaları Roma, Giriş'ten itibaren 1, 2, 3
  position: bottom_center                   # 1.3.4 "sayfanın alt ortasına"
  forbid_decoration: true                   # 1.3.4 "parantez, çizgi vb. işaretler kullanılmadan"

document:
  forbid_tracked_changes: true
