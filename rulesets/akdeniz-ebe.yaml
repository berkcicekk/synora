# Akdeniz Üniversitesi Eğitim Bilimleri Enstitüsü Tez Yazım Kılavuzu (26.04.2017 tarihli, 10/97 sayılı Senato kararı)
# Kaynak: https://webis.akdeniz.edu.tr/file/getfile?guid=06bb120c-88ec-485c-9c55-75327b861536
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: akdeniz-ebe
version: 1
name: "Akdeniz Üniversitesi · Eğitim Bilimleri Enstitüsü"
source: "Akdeniz Üniversitesi Eğitim Bilimleri Enstitüsü Tez Yazım Kılavuzu, 2017"
institution: "Akdeniz Üniversitesi"
source_url: https://webis.akdeniz.edu.tr/file/getfile?guid=06bb120c-88ec-485c-9c55-75327b861536

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 3.1 "en uygun kâğıt formatı A4"
  margins_cm: { top: 2.5, bottom: 2.0, left: 3.0, right: 2.0 }   # 3.2

fonts:
  allowed: [Times New Roman]    # 3.4, 3.5

roles:
  body:
    size_pt: 12                 # 3.5
    line_spacing: 1.5           # 3.7
    alignment: justify          # 3.7 "iki yana yasla"
    first_line_indent_cm: 1.25  # 3.7
  heading_1:
    size_pt: 12                 # 3.4
    bold: true                  # 3.4 "kalın"
    all_caps: true              # 3.4 "tümü büyük harf"
    alignment: center           # 3.4 "ortalanmış"
    line_spacing: 1.0           # 3.4 "satır arası 1"
    space_before_pt: 30         # 3.4 "üstten 30 nk"
    space_after_pt: 24          # 3.4 "alttan 24 nk"
    page_break_before: true     # 3.4, 3.5 "yeni sayfadan başlatılmalıdır"
  heading_2:
    size_pt: 12                 # 3.4
    bold: true                  # 3.4
    alignment: left             # 3.4 "sola dayalı"
    case: title                 # 3.4 "baş harfleri büyük"
    line_spacing: 1.0           # 3.4
    space_before_pt: 24         # 3.4
    space_after_pt: 18          # 3.4
  heading_3:
    size_pt: 12                 # 3.4
    bold: true                  # 3.4
    alignment: left             # 3.4
    case: title                 # 3.4
    line_spacing: 1.0           # 3.4
    space_before_pt: 18         # 3.4
    space_after_pt: 12          # 3.4
  figure_caption:
    size_pt: 12                 # 3.8
    alignment: left             # 3.8 "sola dayalı"
    case: title                 # 3.8 "baş harfleri büyük"
    line_spacing: 1.0           # 3.8
    space_before_pt: 6          # 3.8
    space_after_pt: 18          # 3.8
    position: below             # 3.8 "Şekil/Grafik/Harita/Fotoğrafın altında"
  table_caption:
    size_pt: 12                 # 3.6
    italic: true                # 3.6
    alignment: left             # 3.6 "sola dayalı"
    case: title                 # 3.6 "baş harfleri büyük"
    line_spacing: 1.0           # 3.6
    space_before_pt: 12         # 3.6
    space_after_pt: 6           # 3.6

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # 3.3
  # ÇELİŞKİ: 3.2 "yazı bloğunun sağ üst köşesine"; 3.3 "ortalı ve alttan 2.5 cm" / "alt ortasına" (3.3 alındı)
  position: bottom_center       # 3.3
  forbid_decoration: true       # 3.2, 3.3 "ayraç, çizgi gibi bir işaret kullanılmamalıdır"

document:
  forbid_tracked_changes: true
