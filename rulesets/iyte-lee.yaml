# İzmir Yüksek Teknoloji Enstitüsü Lisansüstü Eğitim Enstitüsü — Thesis Guide / Tez Yazım Kılavuzu (İngilizce; 2019 yüklemesi, metinde tarih yok)
# Kaynak: https://lee.iyte.edu.tr/wp-content/uploads/sites/110/2019/12/Tez-yaz%C4%B1m-k%C4%B1lavuzu-n.pdf
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: iyte-lee
version: 1
name: "İzmir Yüksek Teknoloji Enstitüsü · Lisansüstü Eğitim Enstitüsü"
source: "İzmir Institute of Technology Thesis Guide, 2019"
institution: "İzmir Yüksek Teknoloji Enstitüsü"
source_url: https://lee.iyte.edu.tr/wp-content/uploads/sites/110/2019/12/Tez-yaz%C4%B1m-k%C4%B1lavuzu-n.pdf

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 2.1 "A4 (measuring 210 by 297 mm)"
  margins_cm: { top: 2.5, bottom: 2.5, left: 3.5, right: 2.5 }   # 2.2

fonts:
  allowed: [Times New Roman]    # 2.3

figures:
  alignment: center            # 2.7 "All materials must be centered between the text margins"

roles:
  body:
    size_pt: 12                 # 2.3 "Text ...: 12 points"
    line_spacing: 1.5           # 2.4 "Standard 1.5 spacing"
    alignment: justify          # 2.2 "left and right justified"
    first_line_indent_cm: 1.27  # 2.7 "indented by tab of 1.27 cm"
    space_after_pt: 0           # 2.7 "no spaces between two paragraphs"
  heading_1:                    # CHAPTER başlığı
    size_pt: 16                 # 2.3 "Chapter headings: 16 points", 3.2
    all_caps: true              # 3.2.1 "all capitals"
    alignment: center           # 3.2.1 "centered"
    page_break_before: true     # 3.2 "Only chapters should begin with a new page"
  heading_2:
    size_pt: 14                 # 2.3, 3.2.1
    bold: true                  # 3.2.1
    case: title                 # 3.2.1 "First letter of each word must be capital"
  heading_3:
    size_pt: 14                 # 2.3, 3.2.1
    bold: true                  # 3.2.1
    case: title                 # 3.2.1
  figure_caption:
    size_pt: 12                 # 2.3 "figure captions ... 12 points"
    position: below             # 3.2.2 "figure numbers and captions are placed ... below"
  table_caption:
    size_pt: 12                 # 2.3 "table headings ... 12 points"
    position: above             # 3.2.2 "Table numbers and captions are placed ... above"
  reference_entry:
    size_pt: 12                 # 2.3 "references ... 12 points"

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # 2.9
  position: bottom_right        # 2.9 "bottom right corner"
  forbid_decoration: true       # 2.9 "must not be embellished with punctuation"

document:
  forbid_tracked_changes: true
