# İstanbul Kültür Üniversitesi — Tez Yazım Kılavuzu (Eylül 2004; enstitü sitesinde yayımlanan güncel sürüm)
# Kaynak: https://enstitu.iku.edu.tr/sites/fbe/files/inline-files/%C4%B0stanbul%20K%C3%BClt%C3%BCr%20%C3%9Cniversitesi%20Tez%20Yaz%C4%B1m%20K%C4%B1lavuzu.pdf
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
# Not: 3.3 iki yazı tipine izin veriyor (Times New Roman 12 / Arial 11); punto yazı tipine bağlı
# olduğu için gövde puntosu tek değer olarak denetlenmez.
ruleset: kultur-lee
version: 1
name: "İstanbul Kültür Üniversitesi · Lisansüstü Eğitim Enstitüsü"
source: "İstanbul Kültür Üniversitesi Tez Yazım Kılavuzu, 2004"
institution: "İstanbul Kültür Üniversitesi"
source_url: "https://enstitu.iku.edu.tr/sites/fbe/files/inline-files/%C4%B0stanbul%20K%C3%BClt%C3%BCr%20%C3%9Cniversitesi%20Tez%20Yaz%C4%B1m%20K%C4%B1lavuzu.pdf"

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 3.2 "A4 standardında (21 x 29.7 cm)"
  margins_cm: { top: 2.5, bottom: 2.5, left: 4.0, right: 2.5 }   # 3.4

fonts:
  allowed: [Times New Roman, Arial]   # 3.3

roles:
  body:
    line_spacing: 1.5           # 3.5
    alignment: justify          # 3.4, 3.5 "sağ ve sol kenarlara yaslanarak"
  heading_1:
    bold: true                  # 3.4 "büyük harflerle koyu"
    all_caps: true              # 3.4
    space_before_pt: 71         # 3.5 "önce 71 punto"
    space_after_pt: 18          # 3.5 "sonra 18 punto"
  heading_2:
    space_before_pt: 18         # 3.5
    space_after_pt: 12          # 3.5
  heading_3:
    space_before_pt: 12         # 3.5
    space_after_pt: 6           # 3.5
  table_caption:
    line_spacing: 1.0           # 3.5 "tablo ve şekillerin ad ve açıklamaları ... tek aralıkla"
    space_before_pt: 12         # 3.7 "yazıdan önce 12 punto"
    space_after_pt: 6           # 3.7 "sonra 6 puntoyla"
    position: above             # 3.7 "tablonun üstüne"
  figure_caption:
    line_spacing: 1.0           # 3.5
    space_before_pt: 6          # 3.7 "yazıdan önce 6 punto"
    space_after_pt: 12          # 3.7 "sonra 12 puntoyla"
    position: below             # 3.7 "şeklin altına"
  footnote:
    line_spacing: 1.0           # 3.5 "dipnotlar ... tek aralıkla"

page_numbering:
  # 3.6: başlangıç bölümü küçük Romen (i, ii…), ana bölüm Arap (1, 2…)
  # ÇELİŞKİ: 3.1'deki tabloda "Giriş Bölümü" Romen rakamlı gösterilmiş; metindeki (3.6) kural esas alındı
  formats_in_order: [lowerRoman, decimal]
  position: bottom_center       # 3.6 "sayfanın alt orta kısmına"

document:
  forbid_tracked_changes: true
