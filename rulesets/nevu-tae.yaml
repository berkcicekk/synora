# Nevşehir Hacı Bektaş Veli Üniversitesi Turizm Araştırmaları Enstitüsü — Lisansüstü Tez Yazım Kılavuzu, 2025
# Kaynak: https://dosyalar.nevsehir.edu.tr/41efb8f3f8b75fe36cb09b006bae954e/lisansustu-tez-yazim-kilavuzu.pdf
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
# ÇELİŞKİ: 2.5 tablo/şekil başlıkları için "önce ve sonra 0 nk"; 2.7 tablo başlığı "önce 12, sonra 6",
#          şekil alt yazısı "önce 6, sonra 12" diyor. Başlık boşlukları kodlanmadı.
# ÇELİŞKİ: dipnot puntosu 2.4'te "8 punto", 3.8'de "metinden 2 karakter küçük" (10). Kodlanmadı.
ruleset: nevu-tae
version: 1
name: "Nevşehir Hacı Bektaş Veli Üniversitesi · Turizm Araştırmaları Enstitüsü"
source: "NEVÜ Turizm Araştırmaları Enstitüsü Lisansüstü Tez Yazım Kılavuzu, 2025"
institution: "Nevşehir Hacı Bektaş Veli Üniversitesi"
source_url: https://dosyalar.nevsehir.edu.tr/41efb8f3f8b75fe36cb09b006bae954e/lisansustu-tez-yazim-kilavuzu.pdf

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 2.1
  margins_cm: { top: 3.0, bottom: 2.5, left: 4.0, right: 2.5 }   # 2.3

fonts:
  allowed: [Times New Roman]    # 2.4

roles:
  body:
    size_pt: 12                 # 2.4
    line_spacing: 1.5           # 2.5
    alignment: justify          # 2.5 "iki yana yaslanmış"
    first_line_indent_cm: 0     # 2.5 "hiçbir paragrafta girinti yapılmamalıdır"
    space_before_pt: 6          # 2.5
    space_after_pt: 6           # 2.5
  heading_1:
    bold: true                  # 3.1
    all_caps: true              # 3.1 "büyük ve koyu harflerle"
    alignment: justify          # 3.1 "diğer başlıklar ise iki yana yaslanmış"
    page_break_before: true     # 2.2 "Her bölüm yeni sayfadan başlamalı"
    space_before_pt: 72         # 2.5
    space_after_pt: 18          # 2.5
  heading_2:
    bold: true                  # 3.1
    case: title                 # 3.1 "kelimelerin ilk harfleri büyük"
    alignment: justify          # 3.1
    space_before_pt: 18         # 2.5
    space_after_pt: 12          # 2.5
  heading_3:
    bold: true                  # 3.1
    case: sentence              # 3.1 "sadece ilk harfi büyük"
    alignment: justify          # 3.1
    space_before_pt: 12         # 2.5
    space_after_pt: 6           # 2.5
  figure_caption:
    line_spacing: 1.0           # 2.5, 2.7
    alignment: center           # 2.7 "tüm satırları ortalı"
    position: below             # 2.7 "şeklin altına"
  table_caption:
    line_spacing: 1.0           # 2.5, 2.7
    alignment: center           # 2.7
    position: above             # 2.7 "tablonun üstüne"
  block_quote:
    size_pt: 12                 # 2.4, 3.x alıntılar
    indent_left_cm: 1.27        # Alıntılar "soldan 1 sekme (1,27 cm) içerden"
  footnote:
    line_spacing: 1.0           # 2.5
  reference_entry:
    line_spacing: 1.0           # 2.5 "kaynaklar ... 1 satır aralıklı"

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # 2.6
  position: bottom_center       # 2.6 "alt-ortasına"

document:
  forbid_tracked_changes: true
