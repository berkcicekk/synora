# İnönü Üniversitesi — Lisansüstü Tez Yazım Kılavuzu (Yüksek Lisans / Doktora Tezi), Malatya 2026
# Kaynak: https://panel.inonu.edu.tr/servlet/application/ModuleContent/1962/18-05-2026_115231909.pdf
# Kılavuz İnönü Üniversitesi Enstitüleri tarafından ortak hazırlanmıştır (Önsöz).
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: inonu-lee
version: 1
name: "İnönü Üniversitesi · Enstitüler (ortak lisansüstü kılavuz)"
source: "İnönü Üniversitesi Lisansüstü Tez Yazım Kılavuzu, 2026"
institution: "İnönü Üniversitesi"
source_url: https://panel.inonu.edu.tr/servlet/application/ModuleContent/1962/18-05-2026_115231909.pdf

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 2.1, 2.4
  margins_cm: { top: 2.5, bottom: 2.5, left: 2.5, right: 2.5 }   # 2.4

fonts:
  allowed: [Calibri]            # 2.3 "yazı tipi Calibri olmalıdır"

roles:
  body:
    size_pt: 11                 # 2.3
    line_spacing: 1.5           # 2.5
    alignment: justify          # 2.4 "her iki yana yasla"
    first_line_indent_cm: 1.25  # 2.3, 2.5
    space_after_pt: 0           # 2.3, 2.5 "paragraflar arasında ilave boşluk bırakılmamalı"
  heading_1:
    size_pt: 14                 # 2.6
    bold: true                  # 2.6
    all_caps: true              # 2.6 "büyük harflerle"
    alignment: center           # 2.6 "metni ortalayacak şekilde"
    page_break_before: true     # 2.6 "daima yeni bir sayfa ile başlamalıdır"
  heading_2:
    size_pt: 11                 # 2.6 alt başlıklar
    bold: true                  # 2.6
    case: title                 # 2.6 "her kelimenin ilk harfi büyük"
    first_line_indent_cm: 1.25  # 2.6 "1,25 cm içerden başlamalıdır"
    space_before_pt: 12         # 2.5
    space_after_pt: 6           # 2.5
  heading_3:
    size_pt: 11                 # 2.6 alt başlıklar
    bold: true                  # 2.6
    case: title                 # 2.6
    first_line_indent_cm: 1.25  # 2.6
    space_before_pt: 12         # 2.5
    space_after_pt: 6           # 2.5
  figure_caption:
    size_pt: 11                 # 2.3, 2.10
    line_spacing: 1.5           # 2.10
    alignment: center           # 2.10 "Şekil başlıkları sayfayı ortalayacak şekilde"
    case: sentence              # 2.10 "tümce düzeni"
    space_before_pt: 6          # 2.5 "Şekil ile Şekil başlığı arası 6 nk"
    space_after_pt: 12          # 2.5 "Şekil başlığı ile metin arası 12 nk"
    position: below             # 2.10
  table_caption:
    size_pt: 11                 # 2.3, 2.10
    line_spacing: 1.5           # 2.10
    alignment: left             # 2.10 "tablo başlıkları sola yaslı"
    case: sentence              # 2.10 "tümce düzeni"
    space_before_pt: 12         # 2.5
    space_after_pt: 6           # 2.5 "tablo başlığı ile tablo arası 6 nk"
    position: above             # 2.10
  footnote:
    size_pt: 10                 # 2.3, 2.11
    line_spacing: 1.0           # 2.11
  reference_entry:
    size_pt: 11                 # 4.8
    line_spacing: 1.5           # 2.5, 4.8

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # 2.9
  # ÇELİŞKİ: 2.9 önce "alt orta" diyor; ön sayfalar "alt sağ köşe", metin "alt orta". Metin değeri kullanıldı.
  position: bottom_center       # 2.9
  forbid_decoration: true       # 2.9 "parantez veya çizgi gibi işaretler kullanılmamalıdır"

document:
  forbid_tracked_changes: true
