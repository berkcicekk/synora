# Düzce Üniversitesi Lisansüstü Eğitim Enstitüsü — Tez Yazım Kılavuzu (Aralık 2022; "Ocak 2023 sonrası")
# Kaynak: https://cdn.duzce.edu.tr/File/GetFile/5f35e5f6-a5ae-406a-a60c-c34c42c6308c
# (bağlantı sayfası: https://lisansustu.duzce.edu.tr/sayfa/9300/tez-yazim-kilavuzlari)
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
# Konumlar kılavuzun bölüm başlıklarıdır (Yazı Özelliği, Sayfa Düzeni, Satır Aralıkları vb.).
ruleset: duzce-lee
version: 1
name: "Düzce Üniversitesi · Lisansüstü Eğitim Enstitüsü"
source: "Düzce Üniversitesi LEE Tez Yazım Kılavuzu, 2022"
institution: "Düzce Üniversitesi"
source_url: https://cdn.duzce.edu.tr/File/GetFile/5f35e5f6-a5ae-406a-a60c-c34c42c6308c

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # Kağıt Özelliği "A4 standardında (21x29,7 cm)"
  margins_cm: { top: 2.5, bottom: 2.5, left: 3.5, right: 2.5 }  # Sayfa Düzeni "sol 3,5 cm, sağ 2,5 cm, üst 2,5 cm, alt 2,5 cm"

fonts:
  allowed: [Times New Roman]    # Yazı Özelliği "Times New Roman yazı karakteri"

roles:
  body:
    size_pt: 12                 # Yazı Özelliği "12 punto"
    line_spacing: 1.5           # Satır Aralıkları "standart satır aralığı 1,5"
    alignment: justify          # Sayfa Düzeni "iki yana yaslanmış"
    first_line_indent_cm: 0     # Satır Aralıkları "Paragraf girintisi yapılmamalıdır"
    space_before_pt: 6          # Satır Aralıkları "önce ve sonra 6 nk"
    space_after_pt: 6           # Satır Aralıkları
  heading_1:
    size_pt: 14                 # Yazı Özelliği "1. Derece: BÜYÜK HARF, 14 PUNTO, KOYU"
    bold: true                  # Yazı Özelliği
    all_caps: true              # Yazı Özelliği
    alignment: center           # Yazı Özelliği "1. Derece başlıklar ortaya hizalanarak"
    page_break_before: true     # Yazı Özelliği "her zaman sayfa başlarında yer almalıdır"
    space_before_pt: 48         # Satır Aralıkları "Önce 48 nk"
    space_after_pt: 24          # Satır Aralıkları "sonra 24 nk"
  heading_2:
    size_pt: 12                 # Yazı Özelliği "2. Derece: BÜYÜK HARF, 12 PUNTO, KOYU"
    bold: true                  # Yazı Özelliği
    all_caps: true              # Yazı Özelliği
    alignment: left             # Yazı Özelliği "diğer tüm başlıklar sola dayalı"
    space_before_pt: 24         # Satır Aralıkları "Önce 24 nk"
    space_after_pt: 12          # Satır Aralıkları "sonra 12 nk"
  heading_3:
    size_pt: 12                 # Yazı Özelliği "3. Derece: Kelime Baş Harfleri Büyük, 12 Punto, Koyu"
    bold: true                  # Yazı Özelliği
    case: title                 # Yazı Özelliği "Kelime Baş Harfleri Büyük Harf"
    alignment: left             # Yazı Özelliği
    space_before_pt: 12         # Satır Aralıkları "Önce 12 nk"
    space_after_pt: 6           # Satır Aralıkları "sonra 6 nk"
  figure_caption:
    position: below             # Şekiller "Şekil alt yazısı"; Görsel künyeleri "görsellerin altında"
  block_quote:
    size_pt: 11                 # Alıntılar "Times New Roman ve 11 punto"
    line_spacing: 1.0           # Alıntılar "1 satır aralığı"
    italic: true                # Alıntılar "tırnak içerisinde ve italik"
  footnote:
    line_spacing: 1.0           # Dipnot "8-10 punto ve 1 satır aralığı"

page_numbering:
  # Genel yapı tablosu: ön sayfalar Romen (i, ii, iii…), Giriş'ten itibaren Arap (1, 2, 3…), "Sayfanın alt ortasına"
  formats_in_order: [lowerRoman, decimal]
  position: bottom_center       # Genel yapı tablosu "Sayfanın alt ortasına yerleştirilir"

document:
  forbid_tracked_changes: true
