# Kastamonu Üniversitesi Sosyal Bilimler Enstitüsü — Tez ve Seminer Yazım Kılavuzu (2024)
# Kaynak: https://lisansustu.kastamonu.edu.tr/images/Formlar/Tez%20Yazim%20Klavuzu/TEZ%20VE%20SEMINER%20YAZIM%20KILAVUZU.pdf
# (SBE Yönetim Kurulu 17/04/2024; Lisansüstü Eğitim Enstitüsü sitesinde sosyal bilimler kılavuzu olarak yayımlanıyor)
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: kastamonu-sbe
version: 1
name: "Kastamonu Üniversitesi · Sosyal Bilimler (Lisansüstü Eğitim Enstitüsü)"
source: "Kastamonu Üniversitesi Sosyal Bilimler Enstitüsü Tez ve Seminer Yazım Kılavuzu, 2024"
institution: "Kastamonu Üniversitesi"
source_url: https://lisansustu.kastamonu.edu.tr/images/Formlar/Tez%20Yazim%20Klavuzu/TEZ%20VE%20SEMINER%20YAZIM%20KILAVUZU.pdf

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                                  # 2.1
  margins_cm: { top: 3.0, bottom: 2.5, left: 4.0, right: 2.5 }   # 2.2

fonts:
  allowed: [Times New Roman]                # 2.3

roles:
  body:
    size_pt: 12                             # 2.3
    line_spacing: 1.5                       # 2.5 "1,5 satır aralığında"
    alignment: justify                      # 2.4 "iki yana yaslı"
    first_line_indent_cm: 0                 # 2.4 "blok yazım şeklinde (paragraf başında girinti yok)"
  heading_1:
    size_pt: 12                             # 2.9 Tablo 2.4
    bold: true                              # 2.9 b
    all_caps: true                          # 2.9 b "büyük ve koyu harflerle"
    alignment: left                         # 2.9 f "sol sayfa boşluğuna dayalı"
    page_break_before: true                 # 2.4 "Bölümler daima yeni bir sayfada başlamalıdır"
    space_after_pt: 36                      # 2.9 h "2 satır (veya 36 nk)"
  heading_2:
    size_pt: 12                             # 2.9 Tablo 2.4
    bold: true                              # 2.9 c
    case: title                             # 2.9 c "kelimelerin ilk harfleri büyük"
    alignment: left                         # 2.9 f
    space_after_pt: 18                      # 2.9 h "1,5 satır (veya 18 nk)"
  heading_3:
    size_pt: 12                             # 2.9 Tablo 2.4
    bold: true                              # 2.9 c
    case: title                             # 2.9 c
    alignment: left                         # 2.9 f
    space_after_pt: 18                      # 2.9 h
  figure_caption:
    size_pt: 11                             # 3.3
    line_spacing: 1.0                       # 2.5 "Şekil ve Tablo tanıtım yazıları ... tek satır aralığında"
    position: below                         # 3.3 "şeklin alt orta kısmına"
  table_caption:
    size_pt: 11                             # 3.3
    line_spacing: 1.0                       # 2.5
    position: above                         # 3.3 "tablonun üst orta kısmına"
  block_quote:
    size_pt: 10                             # 2.11 — ÇELİŞKİ: 2.3 alıntılar için 11 punto diyor
    line_spacing: 1.0                       # 2.11, 2.5
    indent_left_cm: 1.0                     # 2.11 "sağından ve solundan 1 cm içeri"
    alignment: justify                      # 2.11 "blok hizalama"
  reference_entry:
    line_spacing: 1.0                       # 5.7 "tek satır aralığında"
    space_after_pt: 18                      # 5.7 "kaynaklar arasında 18nk boşluk"
    # 5.7: ikinci satıra taşan metin 1,25 cm asılı girinti (şemada karşılığı yok)
  footnote:
    size_pt: 9                              # 2.3, 2.12
    line_spacing: 1.0                       # 2.12 "tek aralıkla"

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # 2.8 ön kısım Romen, Giriş'ten itibaren Arabi
  position: bottom_center                   # 2.8 "sayfa altında orta kısma"
  forbid_decoration: true                   # 2.8 "ayıraç, çizgi vb. gibi bir karakter kullanılmamalıdır"

document:
  forbid_tracked_changes: true
