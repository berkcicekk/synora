# Muş Alparslan Üniversitesi Fen Bilimleri Enstitüsü — Tez ve Seminer Yazım Kılavuzu, Muş 2018
# Kaynak: https://fenenstitu.alparslan.edu.tr/files/44/FBE/1-1.pdf
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: mus-fbe
version: 1
name: "Muş Alparslan Üniversitesi · Fen Bilimleri Enstitüsü"
source: "Muş Alparslan Üniversitesi Fen Bilimleri Enstitüsü Tez ve Seminer Yazım Kılavuzu, 2018"
institution: "Muş Alparslan Üniversitesi"
source_url: https://fenenstitu.alparslan.edu.tr/files/44/FBE/1-1.pdf

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  margins_cm: { top: 2.5, bottom: 2.5, left: 3.5, right: 2.5 }   # 2.2

fonts:
  allowed: [Times New Roman]    # 2.3

roles:
  body:
    size_pt: 12                 # 2.3
    line_spacing: 1.5           # 2.4
    first_line_indent_cm: 1.25  # 2.4
    space_after_pt: 0           # 2.4 "Paragraflar arasında boşluk bırakılmamalıdır"
  heading_1:
    size_pt: 12                 # 2.4 "Bütün başlıklar ... 12 punto"
    bold: true                  # 2.4 "koyu"
    alignment: left             # 2.4 "sola dayalı"
    all_caps: true              # 2.5 "büyük harf ile"
    page_break_before: true     # 2.5 "sayfa başına"
  heading_2:
    size_pt: 12                 # 2.4
    bold: true                  # 2.4
    alignment: left             # 2.4
    case: title                 # 2.5 "her kelimenin ilk harfi büyük"
  heading_3:
    size_pt: 12                 # 2.4
    bold: true                  # 2.4
    alignment: left             # 2.4
    case: sentence              # 2.5 "ilk kelimenin ilk harfi dışında tüm kelimeler küçük"
  figure_caption:
    size_pt: 10                 # 2.4
    line_spacing: 1.0           # 2.4
    case: sentence              # 3.3
    position: below             # 3.3 "şeklin ise altına"
  table_caption:
    size_pt: 10                 # 2.4
    line_spacing: 1.0           # 2.4
    alignment: center           # 2.4 "Çizelge açıklaması (başlık) ... sayfayı ortalayacak şekilde"
    case: sentence              # 3.3
    position: above             # 3.3 "Açıklama çizelgenin üstüne"
  footnote:
    line_spacing: 1.0           # 2.4
  reference_entry:
    size_pt: 12                 # 2.4
    line_spacing: 1.0           # 2.4

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # 2.6
  # Ön sayfalar "alt orta" (2.3), Giriş'ten itibaren "üst sağ" (2.3, 2.6); tek değer olarak metin sayfaları kodlandı.
  position: top_right           # 2.6
  forbid_decoration: true       # 2.6 "çizgi veya benzeri bir karakter kullanılmamalıdır"

document:
  forbid_tracked_changes: true
