# Aksaray Üniversitesi Fen Bilimleri Enstitüsü — Tez Yazım Kılavuzu (Mayıs 2018, Word belgesi)
# Kaynak: https://fbe.aksaray.edu.tr/indir/57b88357-5f90-4433-b548-1ed0a02770fd.docx
# Sayfa: https://fbe.aksaray.edu.tr/tez-yazim-klavuzlari
# Not: Kenar boşlukları yalnızca Şekil 2.1'de (4 cm / 2,5 cm) gösterilip metinde yazılmadığı için eklenmedi.
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: aksaray-fbe
version: 1
name: "Aksaray Üniversitesi · Fen Bilimleri Enstitüsü"
source: "Aksaray Üniversitesi FBE Tez Yazım Kılavuzu, 2018"
institution: "Aksaray Üniversitesi"
source_url: https://fbe.aksaray.edu.tr/indir/57b88357-5f90-4433-b548-1ed0a02770fd.docx

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 2.1 "A4 (21x29,7 cm)"

fonts:
  allowed: [Times New Roman]    # 2.3

roles:
  body:
    size_pt: 12                 # 2.3 "on iki (12) yazı boyutunda"
    line_spacing: 1.5           # 2.4 "bir buçuk (1,5) satır aralıklı"
    alignment: justify          # 2.4 "iki yana yaslanmış"
    first_line_indent_cm: 0     # 2.4 "Paragraf başları girintisiz"
  heading_1:
    bold: true                  # 3.1 "bütün başlıklar ... koyu"
    all_caps: true              # 3.1 "büyük ve koyu harflerle"
    alignment: justify          # 3.1 "diğer başlıklar ise iki yana yaslanmış"
    page_break_before: true     # 2.2.1, 3.1 "Ana bölüm başlıkları her zaman yeni bir sayfadan"
  heading_2:
    bold: true                  # 3.1
    case: title                 # 3.1 "kelimelerin ilk harfleri büyük"
    alignment: justify          # 3.1
  heading_3:
    bold: true                  # 3.1
    case: sentence              # 3.1 "sadece ilk harfi büyük"
    alignment: justify          # 3.1
  table_caption:
    line_spacing: 1.0           # 2.4, 2.6 "bir satır aralığı"
    alignment: center           # 2.6 "çizelgenin üstüne ortalı" (birden fazla satırsa iki yana yaslı)
    position: above             # 2.6
  figure_caption:
    line_spacing: 1.0           # 2.4
    alignment: center           # 2.6 "şeklin altına ... ortalı"
    position: below             # 2.6
  block_quote:
    line_spacing: 1.0           # 2.4 "alıntılar ... bir (1) satır aralığı"
  footnote:
    size_pt: 10                 # 3.5 "metinden 2 karakter küçük"
    line_spacing: 1.0           # 2.4
  reference_entry:
    line_spacing: 1.0           # 2.4, 3.4.3 "bir satır aralıkla"

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # 2.5
  position: bottom_center       # 2.5 "sayfa altında orta kısma"
  forbid_decoration: true       # 2.5 "ayıraç, çizgi vb. gibi bir karakter kullanılmamalıdır"

document:
  forbid_tracked_changes: true
