# Erzincan Binali Yıldırım Üniversitesi Sağlık Bilimleri Enstitüsü — Lisansüstü Tez Yazım Kılavuzu (Mart 2023; dosya güncellemesi 03.09.2024)
# Kaynak: https://saglikbilimleri.ebyu.edu.tr/wp-content/uploads/2025/08/LISANSUSTU-TEZ-YAZIM-KILAVUZU-GUNCEL-HALI-03.09.2024-SONN.docx
# (bağlantı sayfası: https://saglikbilimleri.ebyu.edu.tr/tez-yazim-kilavuzu/)
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
# Not: Birinci derece bölüm başlığı içeren sayfalarda üst boşluk 5 cm'dir (2.5); burada genel 3 cm değeri denetlenir.
ruleset: ebyu-sabe
version: 1
name: "Erzincan Binali Yıldırım Üniversitesi · Sağlık Bilimleri Enstitüsü"
source: "EBYÜ Sağlık Bilimleri Enstitüsü Lisansüstü Tez Yazım Kılavuzu, 2023 (güncel hali 03.09.2024)"
institution: "Erzincan Binali Yıldırım Üniversitesi"
source_url: https://saglikbilimleri.ebyu.edu.tr/wp-content/uploads/2025/08/LISANSUSTU-TEZ-YAZIM-KILAVUZU-GUNCEL-HALI-03.09.2024-SONN.docx

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 2.1 "standart A4 (210 mm x 297 mm)"
  orientation: portrait         # 2.5 "Tez dikey düzende"
  margins_cm: { top: 3.0, bottom: 3.0, left: 3.5, right: 2.5 }  # 2.5 "üst ve alt 3 cm, sağ 2,5 cm, sol 3,5 cm"

fonts:
  allowed: [Times New Roman]    # 2.4 "yazı tipi Times New Roman"

roles:
  body:
    size_pt: 12                 # 2.4 "metin kısmı 12 punto"
    line_spacing: 1.5           # 2.7 "Ana metinde satır araları 1,5 satır"
    alignment: justify          # 2.5 "iki yana yaslı biçimde"
    first_line_indent_cm: 0     # 2.7 "Paragraf için girinti yapılmamalı"
    space_after_pt: 12          # 2.7 "paragraflar arasında 12 nk boşluk"
  heading_1:
    size_pt: 12                 # 2.4 "Ana bölüm başlıkları ... 12 punto"
    bold: true                  # 2.4 "Tüm bölüm başlıklarında kalın (bold)"
    all_caps: true              # 2.4 "Ana bölüm başlıkları büyük harf"
    alignment: left             # 2.5, 2.7 metin bölümü başlıkları "sola yaslı"
    page_break_before: true     # 2.5 "Bütün ana başlıklar yeni sayfadan başlatılmalıdır"
  heading_2:
    size_pt: 12                 # 2.4 "alt bölüm başlıkları ... 12 punto"
    bold: true                  # 2.4
    case: title                 # 2.4 "her kelimenin ilk harfi büyük", bağlaçlar küçük
    alignment: left             # 2.5 "diğer tüm başlıklar sola yaslı"
  heading_3:
    size_pt: 12                 # 2.4
    bold: true                  # 2.4
    case: title                 # 2.4
    alignment: left             # 2.5
  figure_caption:
    size_pt: 12                 # 2.4, 2.14 "Şekil ve tablo başlıkları 12 punto"
    alignment: justify          # 2.14 "şeklin altına iki yana yaslı"
    line_spacing: 1.0           # 2.7 "Şekil altı yazıları ... tek satır aralığı"
    space_before_pt: 6          # 2.7, 2.14 "Şekil başlığı ile şekil arasında ... 6 nk"
    position: below             # 2.14 "Şekil başlığı şeklin altına"
  table_caption:
    size_pt: 12                 # 2.4, 2.14
    alignment: left             # 2.14 "tablonun üstüne sola yaslı"
    line_spacing: 1.0           # 2.14 "tek satır aralığında"
    space_before_pt: 12         # 2.14 "Tablo başlığı ile metin arasında 12 nk"
    space_after_pt: 6           # 2.14 "Tablo başlığı ile tablo arasında ... 6 nk"
    position: above             # 2.14 "Tablo başlığı tablonun üstüne"
  block_quote:
    size_pt: 10                 # Alıntılar "10 punto"
    indent_left_cm: 1.25        # Alıntılar "sol ve sağ kenardan 1,25 cm içeriden"
    space_before_pt: 12         # Alıntılar "12 nk boşluk bırakılır"
    space_after_pt: 12          # Alıntılar "yine 12 nk boşluk"
  reference_entry:
    line_spacing: 1.0           # 2.7 "Kaynaklar dizininin yazımında tek satır aralığı"
    space_after_pt: 6           # 2.7 "kaynaklar arasında 6 nk boşluk"
  footnote:
    size_pt: 10                 # 2.4, Dipnotlar "10 punto"
    line_spacing: 1.0           # 2.7 "dipnot metinlerinde satır aralığı tek"

page_numbering:
  # 2.6: ön kısım küçük Roma (i, ii, iii…), GİRİŞ–ÖZGEÇMİŞ arası 1, 2, 3…
  formats_in_order: [lowerRoman, decimal]
  position: bottom_center       # 2.6 "sayfanın alt orta kısmında"
  forbid_decoration: true       # 2.6 "parantez, çizgi vb. işaretler olmamalıdır"

document:
  forbid_tracked_changes: true
