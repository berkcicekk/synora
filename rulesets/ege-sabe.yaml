# Ege Üniversitesi Sağlık Bilimleri Enstitüsü — Tez Yazım Kılavuzu v2.1 (Haziran 2018; Senato 11.12.2018)
# Kaynak: http://sbe.ege.edu.tr/files/sbe/icerik/SBE-Tez-Yazim-Kilavuzu-2-1(1).pdf
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
# Kılavuzda madde numarası yok; kaynak olarak "Tezin Biçimsel Özellikleri" alt başlıkları verildi.
ruleset: ege-sabe
version: 1
name: "Ege Üniversitesi · Sağlık Bilimleri Enstitüsü"
source: "Ege Üniversitesi Sağlık Bilimleri Enstitüsü Tez Yazım Kılavuzu v2.1, 2018"
institution: "Ege Üniversitesi"
source_url: http://sbe.ege.edu.tr/files/sbe/icerik/SBE-Tez-Yazim-Kilavuzu-2-1(1).pdf

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # Kullanılacak Kâğıdın Niteliği "A4 boyutunda"
  margins_cm: { top: 2.5, bottom: 2.5, left: 4.0, right: 2.5 }   # aynı başlık: "sol 4 cm, diğer kenarlardan 2,5 cm"

fonts:
  allowed: [Times New Roman]    # Yazı Karakteri ve Boyutu

roles:
  body:
    size_pt: 12                 # Yazı Karakteri ve Boyutu
    line_spacing: 1.5           # Satır Aralıkları, Paragraf Düzeni "1,5 satır aralığı"
    alignment: justify          # aynı başlık "iki yana yaslı"
    first_line_indent_cm: 0     # aynı başlık "paragraflar girintisiz"
  heading_1:
    line_spacing: 2.0           # Başlıklar "Tüm başlıklar için çift satır aralığı"
    alignment: center           # Başlıklar "ortalı"
    case: title                 # Başlıklar "kelimelerinin ilk harfleri büyük"
    page_break_before: true     # Başlıklar "açılacak yeni sayfanın en üstüne"
  heading_2:
    line_spacing: 2.0           # Başlıklar
    alignment: left             # Başlıklar "diğer başlıklar ise sola yaslı"
  heading_3:
    line_spacing: 2.0           # Başlıklar
    alignment: left             # Başlıklar
  reference_entry:
    line_spacing: 1.5           # Kaynaklar "1.5 satır aralığı olan paragraflar" (asılı girinti 1,5 cm)

page_numbering:
  # Ön sayfalar "( I, II, III, IV, V... ) şeklindeki Romen rakamları", Giriş'ten itibaren Arap rakamları
  formats_in_order: [upperRoman, decimal]
  position: bottom_right        # Sayfaların Numaralandırılması "sağ alt köşeye"

document:
  forbid_tracked_changes: true
