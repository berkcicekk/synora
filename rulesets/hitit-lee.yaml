# Hitit Üniversitesi Lisansüstü Eğitim Enstitüsü — Tez Yazım Kılavuzu (09.10.2026)
# Kaynak: https://cdn.hitit.edu.tr/lee/files/hitit-lee-tez-yazim-kilavuzu-20261012163506275.docx
# (bağlantı sayfası: https://hitit.edu.tr/tr/lee/tez-proje-ve-seminer-yazim-yonergesi)
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: hitit-lee
version: 1
name: "Hitit Üniversitesi · Lisansüstü Eğitim Enstitüsü"
source: "Hitit Üniversitesi LEE Tez Yazım Kılavuzu, 2026"
institution: "Hitit Üniversitesi"
source_url: https://cdn.hitit.edu.tr/lee/files/hitit-lee-tez-yazim-kilavuzu-20261012163506275.docx

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 2.1 "A4 standardında (21,0 cm x 29,7 cm)"
  margins_cm: { top: 3.0, bottom: 3.0, left: 3.0, right: 2.5 }  # 2.3 "üst, alt ve sol 3 cm, sağ 2,5 cm"

fonts:
  allowed: [Times New Roman]    # 2.2 "Times New Roman"

roles:
  body:
    size_pt: 12                 # 2.2 "12 punto"
    line_spacing: 1.5           # 2.3 "1,5 satır aralığında"
    alignment: justify          # 2.3 "iki yana yaslı"
    space_before_pt: 0          # 2.3 "önce 0 nk"
    space_after_pt: 6           # 2.3 "sonra 6 nk"
  heading_1:
    size_pt: 12                 # 2.6 "12 PUNTO"
    bold: true                  # 2.6 "KALIN"
    all_caps: true              # 2.6 "bütün sözcükler BÜYÜK HARFLERLE"
    alignment: center           # 2.6 "düşeyde ortada hizalanmalıdır" (sayfanın düşey orta eksenine göre ortalı)
    page_break_before: true     # 2.6 "yazıma sayfa başından başlanmalı"
  heading_2:
    size_pt: 12                 # 2.6
    bold: true                  # 2.6 "Kalın"
    case: title                 # 2.6 "bütün sözcüklerin ilk harfleri Büyük"
  heading_3:
    size_pt: 12                 # 2.6
    bold: true                  # 2.6 "Kalın"
    case: sentence              # 2.6 "sadece başlığın ilk harfi Büyük"
  figure_caption:
    alignment: justify          # 2.13 "görselin altına iki yana yaslı"
    line_spacing: 1.0           # 2.13 "1 satır aralığı"
    space_before_pt: 0          # 2.13 "önce 0 nk"
    space_after_pt: 0           # 2.13 "sonra 0 nk"
    position: below             # 2.13 "diğer görsellerin açıklamaları ise görselin altına"
  table_caption:
    alignment: justify          # 2.13
    line_spacing: 1.0           # 2.13
    space_before_pt: 0          # 2.13
    space_after_pt: 0           # 2.13
    position: above             # 2.13 "Tabloların açıklamaları görselin üstüne"
  block_quote:
    line_spacing: 1.0           # 2.3 "tek satır aralığı"
    indent_left_cm: 1.0         # 2.3 "sol ve sağ taraftan 1 cm içeriden"
  reference_entry:
    size_pt: 12                 # 3.3 "12 punto Times New Roman"
    alignment: justify          # 3.3 "her iki yana hizalanmış"
    line_spacing: 1.0           # 3.3 "tek satır aralığı"
    space_before_pt: 0          # 3.3 "önce 0 nk"
    space_after_pt: 6           # 3.3 "sonra 6 nk"
  footnote:
    size_pt: 10                 # 2.4 "10 punto"
    line_spacing: 1.0           # 2.4 "tek satır aralığı"
    space_before_pt: 0          # 2.4 "önce 0 nk"
    space_after_pt: 4           # 2.4 "sonra 4 nk"
    indent_left_cm: 0.2         # 2.4 "asılı 0,20"
    first_line_indent_cm: -0.2  # 2.4 "asılı 0,20"

page_numbering:
  # 2.5: özel sayfalar küçük Romen (Özet = i), Giriş'ten itibaren 1, 2, 3…
  formats_in_order: [lowerRoman, decimal]
  position: bottom_center       # 2.5 "sayfanın sonuna ortalı"
  forbid_decoration: true       # 2.5 "önünde-arkasında ayraç, çizgi gibi bir işaret bulunmamalı"

document:
  forbid_tracked_changes: true
