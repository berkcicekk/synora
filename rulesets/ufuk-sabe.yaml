# Ufuk Üniversitesi Sağlık Bilimleri Enstitüsü Tez Yazım Yönergesi (2017; 2017-2018 güz yarıyılından itibaren yürürlükte)
# Kaynak: https://ufuk.edu.tr/uploads/saglik_bi%CC%87li%CC%87mleri%CC%87_/yonetmeli%CC%87k_ve_yonerge/saglik_bilimleri_enstitusu_tez_yazim_yonergesi.pdf
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: ufuk-sabe
version: 1
name: "Ufuk Üniversitesi · Sağlık Bilimleri Enstitüsü"
source: "Ufuk Üniversitesi Sağlık Bilimleri Enstitüsü Tez Yazım Yönergesi, 2017"
institution: "Ufuk Üniversitesi"
source_url: https://ufuk.edu.tr/uploads/saglik_bi%CC%87li%CC%87mleri%CC%87_/yonetmeli%CC%87k_ve_yonerge/saglik_bilimleri_enstitusu_tez_yazim_yonergesi.pdf

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 3.1
  margins_cm: { top: 3.0, bottom: 3.0, left: 4.0, right: 2.0 }   # 3.2 Kenar Boşlukları

fonts:
  allowed: [Times New Roman, Arial]   # 3.2 Yazı Tipi ve Boyutu

roles:
  body:
    size_pt: 12                 # 3.2
    line_spacing: 1.5           # 3.2 Satır Araları "1,5 satır (18 pt)"
    alignment: justify          # 3.2 Paragraflar "soldan ve sağdan bloklanmış"
    first_line_indent_cm: 0     # 3.2 "girinti yapılmamalıdır"
    space_after_pt: 6           # 3.2 "Paragraf aralarında 6 nk"
  heading_1:
    size_pt: 12                 # 3.3
    bold: true                  # 3.3
    all_caps: true              # 3.3 "bütün sözcükler büyük harfle"
    # ÇELİŞKİ: 3.2 "Başlıklar dahil bütün metin ... bloklanmış"; 3.3 birinci düzey için "metin ortalanır" (özel kural alındı)
    alignment: center           # 3.3
    page_break_before: true     # 3.3 "yeni bir sayfadan başlar"
    space_before_pt: 24         # 3.3 "önce 2 satır (24 pt)"
    space_after_pt: 18          # 3.3 "sonra 1,5 satır (18 pt)"
  heading_2:
    bold: true                  # 3.3
    all_caps: true              # 3.3 "bütün sözcükler büyük harfle"
    alignment: left             # 3.3 "sol kenardan hizalanır"
    space_before_pt: 24         # 3.3
    space_after_pt: 18          # 3.3
  heading_3:
    bold: true                  # 3.3
    alignment: left             # 3.3
    case: title                 # 3.3 "bütün sözcüklerin ilk harfleri büyük"
    space_before_pt: 24         # 3.3
    space_after_pt: 18          # 3.3
  block_quote:
    line_spacing: 1.0           # 3.2 "bloklanmış alıntılarda 1 satır (12 pt)"
  reference_entry:
    line_spacing: 1.0           # 3.20 "tek satır aralığı"
    space_after_pt: 6           # 3.20 "6 nk boşluk"
  footnote:
    line_spacing: 1.0           # 3.2

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # 3.2 Numaralandırma
  position: top_right           # 3.2 "yazı çerçevesinin sağ üst köşesine"
  forbid_decoration: true       # 3.2 "parantez, çizgi vb. işaretler kullanılmadan"

document:
  forbid_tracked_changes: true
