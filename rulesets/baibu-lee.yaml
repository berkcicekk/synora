# Bolu Abant İzzet Baysal Üniversitesi Lisansüstü Eğitim Enstitüsü — Tez Yazım Şablonu ve Yazım Kılavuzu (versiyon 7, 2025)
# Kaynak: https://lisansustu.ibu.edu.tr/Files/ckFiles/lisansustu-ibu-edu-tr/dosyalar/tr-baibu-lee-tez-yazim-kilavuzu-ve-sablonu-versiyon-7.docx
# (bağlantı sayfası: https://lisansustu.ibu.edu.tr/tr/page/tez-ve-mezuniyet-islemleri/17810)
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
# Kılavuz şablonun içine yazılmıştır; konumlar şablondaki bölüm numaraları/başlıklarıdır.
ruleset: baibu-lee
version: 1
name: "Bolu Abant İzzet Baysal Üniversitesi · Lisansüstü Eğitim Enstitüsü"
source: "BAİBÜ LEE Tez Yazım Şablonu ve Yazım Kılavuzu (versiyon 7), 2025"
institution: "Bolu Abant İzzet Baysal Üniversitesi"
source_url: https://lisansustu.ibu.edu.tr/Files/ckFiles/lisansustu-ibu-edu-tr/dosyalar/tr-baibu-lee-tez-yazim-kilavuzu-ve-sablonu-versiyon-7.docx

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 1.9 "A4 boyutunda (210 x 297 mm)"
  margins_cm: { top: 2.5, bottom: 2.5, left: 4.0, right: 3.0 }  # 1.9 "Sol kenar: 4 cm, Sağ kenar: 3 cm, Üst/Alt kenar: 2,5 cm"

fonts:
  allowed: [Times New Roman]    # 1.9 "Yazı karakteri olarak Times New Roman"

roles:
  body:
    size_pt: 12                 # 1.9 "metin boyunca 12 punto"
    line_spacing: 1.5           # 1.9 "1,5 satır aralığı"
    alignment: justify          # 1.9 "iki yana yaslanmış"
    first_line_indent_cm: 1.25  # 1.9 "sol kenardan 1 tab (1,25 cm) içeriden"
    space_before_pt: 0          # Genel kurallar "Paragraflar arası aralık 0 nk"
    space_after_pt: 0           # Genel kurallar "Paragraflar arası aralık 0 nk"
  heading_1:
    size_pt: 14                 # 1.10.1 "Ana bölüm başlığı: 14 punto"
    line_spacing: 1.5           # 1.10.1 "1.5 satır aralığı"
    all_caps: true              # 1.10.1 "TAMAMI BÜYÜK HARFLERLE"
    alignment: center           # 1.10.1 "ortalanarak yerleştirilmelidir"
    page_break_before: true     # 1.10.1 "tüm ana bölümler yeni bir sayfadan başlamalıdır"
    space_after_pt: 12          # 1.10.1 "takip eden alt başlık ya da paragraf arasında 12 nk"
  heading_2:
    size_pt: 12                 # 1.10.3 Kural 1 "12 punto"
    line_spacing: 1.5           # 1.10.3 Kural 1 "1.5 satır aralığında"
    bold: true                  # 1.10.3 Kural 1 "koyu karakterle"
    case: title                 # 1.10.3 Kural 1-2 her sözcüğün ilk harfi büyük, bağlaçlar küçük
    space_before_pt: 12         # 1.10.1 "alt bölüm başlığı arasında 12 nk"
    space_after_pt: 0           # 1.10.1 "izleyen paragraf ile arasında ise 0 nk"
    # 1.10.3 "sol taraftan bir tab içeriden" — girinti türü belirsiz, denetlenmez
  heading_3:
    size_pt: 12                 # 1.10.3 Kural 1
    line_spacing: 1.5           # 1.10.3 Kural 1
    bold: true                  # 1.10.3 Kural 1
    case: title                 # 1.10.3 Kural 1-2
    space_before_pt: 12         # 1.10.1
    space_after_pt: 0           # 1.10.1
  figure_caption:
    alignment: center           # Şekil/tablo açıklamaları "sayfada ortalanarak yerleştirilmelidir"
    position: below             # "Şekil, resim veya fotoğraf açıklamaları, ilgili görselin altına"
  table_caption:
    alignment: center           # "Açıklamalar sayfada ortalanarak yerleştirilmelidir"
    position: above             # "Tablo açıklamaları ise ilgili tablonun üstüne"
  reference_entry:
    size_pt: 10                 # Kaynakça "Kaynaklar 10 punto"
    line_spacing: 1.0           # Kaynakça "tek satır aralığı"
    indent_left_cm: 1.25        # Kaynakça "ikinci satırı 1,25 cm asılı girintili"
    first_line_indent_cm: -1.25 # Kaynakça asılı girinti
    space_after_pt: 10          # Kaynakça "Kaynaklar arasında 10 nk boşluk"
  footnote:
    size_pt: 10                 # Dipnot Yazımı "10 punto büyüklüğünde"
    line_spacing: 1.0           # Dipnot Yazımı "tek satır aralığında"
    alignment: justify          # Dipnot Yazımı "iki yana yaslı"
    first_line_indent_cm: 0     # Dipnot Yazımı "girintisiz"

page_numbering:
  # 1.5: ilk sayfalar küçük Roma (i, ii…); "1. GİRİŞ"ten itibaren Arap rakamları
  formats_in_order: [lowerRoman, decimal]
  position: bottom_center       # 1.5 "sayfa altında, ortalanmış"

document:
  forbid_tracked_changes: true
