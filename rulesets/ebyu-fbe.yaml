# Erzincan Binali Yıldırım Üniversitesi Fen Bilimleri Enstitüsü — Tez Yazım Kılavuzu (Mayıs 2017)
# Kaynak: https://fenbilimleri.ebyu.edu.tr/wp-content/uploads/2021/09/Tez-Yazim-Kilavuzu.pdf
# (enstitü sayfası https://fenbilimleri.ebyu.edu.tr/tez-yazim-kilavuzu/ şu an yalnızca 2026 açıklamalı şablonu listeliyor;
#  kılavuz PDF'i https://saglikbilimleri.ebyu.edu.tr/tez-kontrol-randevu-sistemi/ sayfasından bağlantılı)
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: ebyu-fbe
version: 1
name: "Erzincan Binali Yıldırım Üniversitesi · Fen Bilimleri Enstitüsü"
source: "EBYÜ Fen Bilimleri Enstitüsü Tez Yazım Kılavuzu, 2017"
institution: "Erzincan Binali Yıldırım Üniversitesi"
source_url: https://fenbilimleri.ebyu.edu.tr/wp-content/uploads/2021/09/Tez-Yazim-Kilavuzu.pdf

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  margins_cm: { top: 3.0, bottom: 3.0, left: 4.0, right: 2.0 }  # 2.4 "sol 4 cm, sağ 2 cm, üst ve alt 3 cm"

fonts:
  allowed: [Times New Roman]    # 2.3 "Times New Roman yazı tipi"

roles:
  body:
    size_pt: 12                 # 2.3 "12 punto"
    line_spacing: 1.5           # 2.3 "Tez metni 1,5 satır aralık"
    alignment: justify          # 2.3 "iki yana yaslı"
    first_line_indent_cm: 0     # 2.3 "Paragraf ilk satırı içeriden başlamamalıdır"
    space_after_pt: 12          # 2.3 "paragrafların kendi aralarında da 12 nk"
  heading_1:
    size_pt: 12                 # 2.3 "başlıkların yazımında ... 12 punto"
    bold: true                  # 2.12 "KALIN"
    alignment: left             # 2.12 "Tüm bölüm başlıkları sol sayfa boşluğuna dayalı"
    line_spacing: 1.0           # 2.3, 2.12 "tek satır aralığı"
    space_before_pt: 0          # 2.12 "önce 0 nk"
    space_after_pt: 24          # 2.12 "sonra 24 nk"
    # 2.12 "HER KELİME BÜYÜK HARFLE ... bağlaçlar küçük harfle" — büyük harf kuralı bağlaç istisnası nedeniyle denetlenmez
  heading_2:
    size_pt: 12                 # 2.3
    bold: true                  # 2.12 "Kalın"
    case: title                 # 2.12 "Her Sözcüğün İlk Harfi Büyük"
    alignment: left             # 2.12
    line_spacing: 1.0           # 2.12
    space_before_pt: 18         # 2.12 "önce 18 nk"
    space_after_pt: 18          # 2.12 "sonra 18 nk"
  heading_3:
    size_pt: 12                 # 2.3
    bold: true                  # 2.12 "kalın"
    case: sentence              # 2.12 "Yalnız ilk sözcüğün ilk harfi büyük"
    alignment: left             # 2.12
    line_spacing: 1.0           # 2.12
    space_before_pt: 18         # 2.12
    space_after_pt: 18          # 2.12
  figure_caption:
    line_spacing: 1.0           # 2.3 "Tablo ve Şekil başlıkları ... tek satır"
    space_before_pt: 6          # 2.10.2 "öncesinde 6 nk"
    space_after_pt: 18          # 2.10.2 "sonrasında ise 18 nk"
    position: below             # 2.10.2 "Şekil açıklama yazıları şekillerin altına"
  table_caption:
    line_spacing: 1.0           # 2.3, 2.10.3 "tek satır aralığı"
    space_before_pt: 18         # 2.10.3 "öncesinde 18 nk"
    space_after_pt: 6           # 2.10.3 "Tablo üst kenarı arasında 6 nk"
    position: above             # 2.10.3 "Tablo açıklama yazıları tablonun üstüne"
  block_quote:
    size_pt: 10                 # 2.6 "10 punto"
    indent_left_cm: 1.0         # 2.6 "sol kenardan 1 cm içeriden"
  reference_entry:
    line_spacing: 1.0           # 2.3 "Kaynaklar ... tek satır aralık"
  footnote:
    size_pt: 10                 # 2.7 "10 punto"
    line_spacing: 1.0           # 2.3 "Dipnotlar ... tek satır aralık"

page_numbering:
  # Tez bölümleri ve sayfa numaraları çizelgesi: ön sayfalar "i" ile, "1. GİRİŞ"ten itibaren "1" ile başlar
  formats_in_order: [lowerRoman, decimal]
  position: bottom_center       # 2.4 "sayfanın alt orta kısmında"
  forbid_decoration: true       # 2.4 "ayraç, çizgi gibi bir işaret kullanılmamalıdır"

document:
  forbid_tracked_changes: true
