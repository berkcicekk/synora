# Recep Tayyip Erdoğan Üniversitesi Lisansüstü Eğitim Enstitüsü — Tez Yazım Kılavuzu (Nisan 2026, .docx)
# Kaynak: https://lisansustu.erdogan.edu.tr/Files/ckFiles/lisansustu-erdogan-edu-tr/Tez%20Yaz%C4%B1m%20K%C4%B1lavuzu%20Nisan%202026/K%C4%B1lavuz/Tez%20Yaz%C4%B1m%20K%C4%B1lavuzu.docx
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
# Not: kenar boşlukları yalnızca Şekil 1 görselinde verildiği için kodlanmadı.
ruleset: rteu-lee
version: 1
name: "Recep Tayyip Erdoğan Üniversitesi · Lisansüstü Eğitim Enstitüsü"
source: "RTEÜ Lisansüstü Eğitim Enstitüsü Tez Yazım Kılavuzu, Nisan 2026"
institution: "Recep Tayyip Erdoğan Üniversitesi"
source_url: https://lisansustu.erdogan.edu.tr/Files/ckFiles/lisansustu-erdogan-edu-tr/Tez%20Yaz%C4%B1m%20K%C4%B1lavuzu%20Nisan%202026/K%C4%B1lavuz/Tez%20Yaz%C4%B1m%20K%C4%B1lavuzu.docx

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

fonts:
  allowed: [Times New Roman]    # 2.2

roles:
  body:
    size_pt: 12                 # 2.2
    line_spacing: 1.5           # 2.3 "1.5 satır aralığında"
    alignment: justify          # 2.3 "iki yana yaslı"
    first_line_indent_cm: 1.25  # 2.3 "ilk satır 1.25 içerden"
  heading_1:
    size_pt: 12                 # 2.2 "başlıklar dâhil ... 12"
    bold: true                  # 2.2, 3.2.2
    all_caps: true              # 3.2.2 "büyük harflerle"
    alignment: left             # 3.2.2 örnek "SOLA HİZALI"
    indent_left_cm: 1.25        # 3.2.2 "girinti ... sol 1.25 cm"
    first_line_indent_cm: 0     # 3.2.2 "ilk satır seçeneği yok"
    line_spacing: 1.5           # 3.2.2
    space_after_pt: 15          # 3.2.2 "sonra 15 nk"
  heading_2:
    size_pt: 12                 # 2.2
    bold: true                  # 2.2, 3.2.2
    alignment: left             # 3.2.2 "sola hizalı"
    case: title                 # 3.2.2 "sadece ilk harfler büyük" (örnek: "İkinci Derece Alt Başlık")
    space_before_pt: 15         # 3.2.2 "öncesinde 15 nk"
  heading_3:
    size_pt: 12                 # 2.2
    bold: true                  # 2.2, 3.2.2
    alignment: left             # 3.2.2
    case: title                 # 3.2.2
    space_before_pt: 15         # 3.2.2
  figure_caption:
    size_pt: 12                 # 2.2
    alignment: center           # 2.3, Şekiller "Şekil adları ortalı"
    first_line_indent_cm: 0     # 2.3
    line_spacing: 1.0           # 2.3 "tek satır"
    space_before_pt: 6          # 2.3 "önce 6 nk"
    space_after_pt: 15          # 2.3 "sonra 15 nk"
    position: below             # 2.4, Şekiller "şeklin altına"
  table_caption:
    size_pt: 12                 # 2.2
    alignment: center           # 2.3, Tablolar "Tablo adları ortalı"
    first_line_indent_cm: 0     # 2.3
    line_spacing: 1.0           # 2.3
    space_before_pt: 15         # 2.3 "önce 15 nk"
    space_after_pt: 6           # 2.3 "sonra 6 nk"
    case: title                 # Tablolar "başlığın her sözcüğü büyük harfle başlamalı"
    position: above             # 2.4, Tablolar "tablonun üstüne"
  footnote:
    size_pt: 10                 # 2.2
    line_spacing: 1.0           # 2.2, 2.3
    alignment: justify          # 2.3
    space_before_pt: 2          # 2.3 "önce 2 nk"

page_numbering:
  formats_in_order: [upperRoman, decimal]   # 2.4 "büyük harf Romen rakamları (I, II ...)"
  position: bottom_center       # 2.4 "ortalanarak, sayfa altına"

document:
  forbid_tracked_changes: true
