# İskenderun Teknik Üniversitesi — Lisansüstü Tez Yazım Kuralları (Temmuz 2018)
# Kaynak: https://iste.edu.tr/files/1049_files_1580196074.pdf
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: iste-lee
version: 1
name: "İskenderun Teknik Üniversitesi · Lisansüstü Eğitim Enstitüsü"
source: "İskenderun Teknik Üniversitesi Lisansüstü Tez Yazım Kuralları, 2018"
institution: "İskenderun Teknik Üniversitesi"
source_url: https://iste.edu.tr/files/1049_files_1580196074.pdf

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 4.1
  margins_cm: { top: 3.0, bottom: 2.0, left: 2.75, right: 2.75 }   # 4.2

fonts:
  allowed: [Times New Roman]    # 4.3 Yazı karakteri ve büyüklüğü

roles:
  body:
    size_pt: 12                 # 4.3
    line_spacing: 1.5           # 4.5
    first_line_indent_cm: 0     # 4.3 "sol kenarından ve girinti verilmeden başlamalıdır"
  heading_1:
    size_pt: 14                 # 4.10 Çizelge 4.3
    bold: true                  # 4.10
    all_caps: true              # 4.10 "Büyük harf"
    page_break_before: true     # 4.5 "Ana bölümlerin yazımına daima yeni bir sayfadan"
  heading_2:
    size_pt: 12                 # 4.10
    bold: true                  # 4.10
    case: title                 # 4.10 "Her sözcüğün ilk harfi büyük"
  heading_3:
    size_pt: 12                 # 4.10
    bold: true                  # 4.10
    case: sentence              # 4.10 "Yalnızca birinci sözcüğün ilk harfi büyük"
  table_caption:
    position: above             # 4.17 "Çizelge açıklamaları çizelgenin üstüne"
    line_spacing: 1.0           # 4.5 "Çizelge üst yazıları tek satır aralığı"
  figure_caption:
    position: below             # 4.17 "açıklamaları bu resimlerin altına"
    line_spacing: 1.0           # 4.5 "Şekil, Resim, Harita alt yazıları … tek satır"
  block_quote:
    line_spacing: 1.0           # 4.5 "alıntı … tek satır aralığı"
  footnote:
    size_pt: 10                 # 4.3, 4.12.4
    line_spacing: 1.0           # 4.5
  reference_entry:
    line_spacing: 1.0           # 4.5 "kaynak listesinin yazımında tek satır aralığı"

page_numbering:
  # ÇELİŞKİ: 4.3 ön kısım "Romen rakamıyla (I, II, III)"; 4.6 "küçük Romen rakamlarıyla" → 4.6 esas alındı
  formats_in_order: [lowerRoman, decimal]   # 4.6
  # 4.6 konum "sağdan 2,75 cm; üstten 2,0 cm ve soldan 2,75 cm" — belirsiz, denetlenmez
  forbid_decoration: true       # 4.6 "ayraç, çizgi gibi bir işaret kullanılmamalıdır"

document:
  forbid_tracked_changes: true
