# Fenerbahçe Üniversitesi Lisansüstü Eğitim Enstitüsü — Lisansüstü Eser Yazım Kılavuzu (son kayıt Ocak 2026; .doc)
# Kaynak: https://www.fbu.edu.tr/media/lisansustu-sayfalar/Lisans%C3%BCst%C3%BC%20Eser%20Yaz%C4%B1m%20K%C4%B1lavuzu_1771917799.doc
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: fbu-lee
version: 1
name: "Fenerbahçe Üniversitesi · Lisansüstü Eğitim Enstitüsü"
source: "Fenerbahçe Üniversitesi Lisansüstü Eğitim Enstitüsü Lisansüstü Eser Yazım Kılavuzu, 2026"
institution: "Fenerbahçe Üniversitesi"
source_url: "https://www.fbu.edu.tr/media/lisansustu-sayfalar/Lisans%C3%BCst%C3%BC%20Eser%20Yaz%C4%B1m%20K%C4%B1lavuzu_1771917799.doc"

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 1 "A4 (21x29.7 cm)"
  orientation: portrait         # 1.1 "dikey format" (bazı şekil/tablo/ekler için yatay serbest)
  margins_cm: { top: 3.0, bottom: 3.0, left: 4.0, right: 2.5 }   # 1.1 "sol 4 cm, sağ 2,5 cm, üst 3 cm, alt 3 cm"

fonts:
  allowed: [Times New Roman]    # 1.1

roles:
  body:
    size_pt: 12                 # 1.1 "Times New Roman fontu 12 punto"
    line_spacing: 1.5           # 1.1 "1,5 satır aralığı"
    alignment: justify          # 1.1 "sayfanın her iki kenarına yaslanmalıdır"
    first_line_indent_cm: 0     # 1.1 "Paragraf girintisi yapılmamalıdır"
    space_before_pt: 6          # 1.1 "nk değeri önce 6"
    space_after_pt: 6           # 1.1 "sonra 6"
  heading_1:
    size_pt: 12                 # 1.3 "12 (koyu/kalın) punto"
    bold: true                  # 1.3
    all_caps: true              # 1.3 "Bölüm başlıkları ... tümüyle büyük harf"
    alignment: center           # 1.3 "Tüm başlıklar ortalanmış"
    space_before_pt: 6          # 1.3 "önce ve sonra 6 nk"
    space_after_pt: 6           # 1.3
  heading_2:
    size_pt: 12                 # 1.3
    bold: true                  # 1.3
    all_caps: true              # 1.3 "alt bölüm başlıklarında (ikinci derece) tümüyle büyük harf"
    alignment: center           # 1.3
    space_before_pt: 6          # 1.3
    space_after_pt: 6           # 1.3
  heading_3:
    size_pt: 12                 # 1.3
    bold: true                  # 1.3
    case: title                 # 1.3 "Diğer başlıklarda yalnızca kelimelerin ilk harfleri büyük", bağlaçlar küçük
    alignment: center           # 1.3
    space_before_pt: 6          # 1.3
    space_after_pt: 6           # 1.3
  table_caption:
    size_pt: 12                 # 1.4 "12 punto, tek satır aralığı ve koyu/kalın"
    bold: true                  # 1.4
    italic: false               # 1.4 "İtalik karakter kullanılmamalıdır"
    alignment: center           # 1.4 "ortalanmış"
    line_spacing: 1.0           # 1.4
    space_before_pt: 6          # 1.4 "önce ve sonra 6 nk"
    space_after_pt: 6           # 1.4
    position: above             # 1.4 "tablonun ise üstünde"
  figure_caption:
    size_pt: 12                 # 1.4
    bold: true                  # 1.4
    italic: false               # 1.4
    alignment: center           # 1.4
    line_spacing: 1.0           # 1.4
    space_before_pt: 6          # 1.4
    space_after_pt: 6           # 1.4
    position: below             # 1.4 "Başlık; şeklin altında"
  footnote:
    size_pt: 10                 # 1.6 "10 punto"
    line_spacing: 1.0           # 1.6 "tek"
  reference_entry:
    line_spacing: 1.0           # 1.1 "kaynakça ... tek satır aralığı"

page_numbering:
  # 1.7: teşekkür bölümünden itibaren sonuna kadar modern rakamlar (1, 2, 3…); Roma rakamı kullanılmıyor
  formats_in_order: [decimal]
  position: bottom_center       # 1.7 "sayfanın alt kısmında ve ortalanmış"

document:
  forbid_tracked_changes: true
