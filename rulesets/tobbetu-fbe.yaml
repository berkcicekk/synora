# TOBB ETÜ Fen Bilimleri Enstitüsü Lisansüstü Tez Yazım Kılavuzu (Ağustos 2015)
# Kaynak: https://etu.edu.tr/files/dosyalar/2017/10/10/c3a347e938a24bac2c132784a7f5e52b.pdf
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı. (Bulunan en güncel FBE sürümü 2015; daha yeni sürüm olabilir.)
ruleset: tobbetu-fbe
version: 1
name: "TOBB Ekonomi ve Teknoloji Üniversitesi · Fen Bilimleri Enstitüsü"
source: "TOBB ETÜ Fen Bilimleri Enstitüsü Lisansüstü Tez Yazım Kılavuzu, 2015"
institution: "TOBB Ekonomi ve Teknoloji Üniversitesi"
source_url: https://etu.edu.tr/files/dosyalar/2017/10/10/c3a347e938a24bac2c132784a7f5e52b.pdf

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 2.1
  margins_cm: { top: 2.5, bottom: 2.5, left: 4.0, right: 2.5 }   # 2.2.2

fonts:
  allowed: [Times New Roman, Arial Narrow]   # 2.2.1

roles:
  body:
    size_pt: 12                 # 2.2.1
    line_spacing: 1.5           # 2.2.3
    alignment: justify          # 2.2.2 "iki yana yaslanır"
    space_before_pt: 6          # 2.2.3
    space_after_pt: 6           # 2.2.3
  heading_1:
    bold: true                  # 2.2.1 "koyu (bold) harfler başlıklarda"
    all_caps: true              # 2.2.3 "büyük harflerle"
    space_before_pt: 72         # 2.2.3
    space_after_pt: 18          # 2.2.3
  heading_2:
    bold: true                  # 2.2.1
    space_before_pt: 18         # 2.2.3
    space_after_pt: 12          # 2.2.3
  heading_3:
    bold: true                  # 2.2.1
    space_before_pt: 12         # 2.2.3
    space_after_pt: 6           # 2.2.3
  figure_caption:
    size_pt: 12                 # 2.2.5
    line_spacing: 1.0           # 2.2.3, 2.2.5
    space_before_pt: 6          # 2.2.5
    space_after_pt: 12          # 2.2.5
    position: below             # 2.2.5 "resmin/şeklin altına"
  table_caption:
    size_pt: 12                 # 2.2.5
    line_spacing: 1.0           # 2.2.3
    space_before_pt: 12         # 2.2.5 — ÇELİŞKİ: 2.2.3 çizelge/şekil adları için önce 6, sonra 6 punto diyor
    space_after_pt: 6           # 2.2.5
    position: above             # 2.2.5 "çizelgenin üstüne"
  reference_entry:
    line_spacing: 1.0           # 2.2.3
    space_before_pt: 6          # 2.2.3
    space_after_pt: 6           # 2.2.3
  footnote:
    line_spacing: 1.0           # 2.2.3

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # 2.2.4
  position: bottom_center       # 2.2.4 "alt-ortasına"

document:
  forbid_tracked_changes: true
