# Giresun Üniversitesi Sosyal Bilimler Enstitüsü — Lisansüstü Tez Yazım Kılavuzu (Giresun 2023)
# Kaynak: https://sbe.giresun.edu.tr/Files/ckFiles/sbe-giresun-edu-tr/%C5%9EABLONLAR/Tez%20yaz%C4%B1m%20k%C4%B1lavuzu2.pdf
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: giresun-sbe
version: 1
name: "Giresun Üniversitesi · Sosyal Bilimler Enstitüsü"
source: "Giresun Üniversitesi Sosyal Bilimler Enstitüsü Lisansüstü Tez Yazım Kılavuzu, 2023"
institution: "Giresun Üniversitesi"
source_url: https://sbe.giresun.edu.tr/Files/ckFiles/sbe-giresun-edu-tr/%C5%9EABLONLAR/Tez%20yaz%C4%B1m%20k%C4%B1lavuzu2.pdf

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 1.3
  margins_cm: { top: 3.0, bottom: 3.0, left: 4.0, right: 2.5 }   # 1.7

fonts:
  allowed: [Times New Roman]    # 1.4

roles:
  body:
    size_pt: 12                 # 1.4
    line_spacing: 1.5           # 1.8
    alignment: justify          # 1.2 "soldan ve sağdan bloklanmış (iki yana yaslı)"
    first_line_indent_cm: 1.25  # 1.2 "bir tab (1,25cm) içeriden"
  heading_1:
    size_pt: 12                 # 1.12
    bold: true                  # 1.12
    all_caps: true              # 1.12 "bütün sözcükler büyük harfle"
    # ÇELİŞKİ: 1.2 "Başlıklar dâhil bütün metin … iki yana yaslı"; 1.12 birinci düzey "ortalanır"
    alignment: center           # 1.12
    page_break_before: true     # 1.12 "yeni bir sayfadan başlar"
  heading_2:
    bold: true                  # 1.12
    all_caps: true              # 1.12 "bütün sözcükler büyük harfle"
    alignment: left             # 1.12 "sol kenardan hizalanır"
  heading_3:
    case: title                 # 1.12 "bütün sözcüklerin ilk harfleri büyük"
    alignment: left             # 1.12
  table_caption:
    position: above             # 1.13 "tablo yazısı tablonun üstünde"
    bold: true                  # 1.13 "koyu"
    size_pt: 10                 # 1.13 "Times New Roman 10"
  figure_caption:
    position: below             # 1.13 "şeklin altında"
    alignment: center           # 1.13 "ortalanmış biçimde"
    bold: true                  # 1.13 "koyu"
    size_pt: 10                 # 1.13
  table_cell:
    size_pt: 10                 # 1.4, 1.13
  block_quote:
    indent_left_cm: 1.0         # 2.x "soldan 1 cm girinti"
  footnote:
    size_pt: 10                 # 1.4
    line_spacing: 1.0           # 1.8

page_numbering:
  formats_in_order: [upperRoman, decimal]   # 1.9 "büyük harf Roma … I, II, III", giriş ile 1, 2, 3
  position: top_center          # 1.9 "yazı çerçevesinin üst ortasına"
  forbid_decoration: true       # 1.9 "parantez, çizgi vb. işaretler kullanılmadan"

document:
  forbid_tracked_changes: true
