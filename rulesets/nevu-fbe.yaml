# Nevşehir Hacı Bektaş Veli Üniversitesi Fen Bilimleri Enstitüsü — Lisansüstü Tez Yazım Kılavuzu (kılavuz+şablon .docx)
# Belgede yıl yok; dosya özellikleri: oluşturma 2023-04, son değişiklik 2024-11.
# Kaynak: https://dosyalar.nevsehir.edu.tr/d10a57ed68a352dcecc61d05ef978352/tez-yazim-klavuzusablonu-2.docx
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: nevu-fbe
version: 1
name: "Nevşehir Hacı Bektaş Veli Üniversitesi · Fen Bilimleri Enstitüsü"
source: "NEVÜ Fen Bilimleri Enstitüsü Lisansüstü Tez Yazım Kılavuzu, tarihsiz (2023-2024)"
institution: "Nevşehir Hacı Bektaş Veli Üniversitesi"
source_url: https://dosyalar.nevsehir.edu.tr/d10a57ed68a352dcecc61d05ef978352/tez-yazim-klavuzusablonu-2.docx

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  margins_cm: { top: 3.5, bottom: 2.0, left: 4.0, right: 2.0 }   # 2.3

fonts:
  allowed: [Times New Roman]    # 2.2

roles:
  body:
    size_pt: 12                 # 2.2
    line_spacing: 1.5           # 2.4
    alignment: justify          # 2.3, 2.4 "iki tarafa yaslanmalı"
    first_line_indent_cm: 0     # 2.3 "paragraf girintisi olmadan başlamalıdır"
  heading_1:
    size_pt: 12                 # 2.6
    bold: true                  # 2.6 "koyu puntolarla"
    all_caps: true              # 2.6 "büyük harflerle"
    alignment: center           # 2.6 "satır ortalanarak"
    page_break_before: true     # 2.4, 2.6 "Her bölüm yeni bir sayfa ile başlamalıdır"
  heading_2:
    bold: true                  # 2.6
    case: title                 # 2.6 "her sözcüğün ilk harfi büyük"
    alignment: justify          # 2.6 "iki yana yaslanmış"
  heading_3:
    bold: true                  # 2.6
    case: sentence              # 2.6 "birinci sözcüğün ilk harfi büyük"
  figure_caption:
    case: sentence              # 2.9 "sadece ilk kelimenin ilk harfi büyük"
    position: below             # 2.9 "şeklin altına"
  table_caption:
    case: sentence              # 2.9
    position: above             # 2.9 "tablonun üstüne"
  block_quote:
    line_spacing: 1.0           # 2.4 "alıntı ... 1 olmalıdır"
  footnote:
    line_spacing: 1.0           # 2.4
  reference_entry:
    line_spacing: 1.5           # 2.4, Kaynaklar "1.5 satır aralığı"

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # 2.5 "(i, ii, iii ...)" ve "1, 2, 3"
  position: bottom_center       # 2.5 "alt kenarlardan 1,5 cm yukarıda ve ortalanmış"

document:
  forbid_tracked_changes: true
