# Yozgat Bozok Üniversitesi Lisansüstü Eğitim Enstitüsü — Tez Yazım Kılavuzu (Yozgat 2021)
# Kaynak: https://bozok.edu.tr/Dosya/691f97af-8.pdf
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
# Başlık eşlemesi (1.3.4.4): "bölüm başlıkları" → heading_1, "birinci düzey başlıklar" → heading_2,
# "ikinci ve daha alt düzey başlıklar" → heading_3.
ruleset: bozok-lee
version: 1
name: "Yozgat Bozok Üniversitesi · Lisansüstü Eğitim Enstitüsü"
source: "Yozgat Bozok Üniversitesi Lisansüstü Eğitim Enstitüsü Tez Yazım Kılavuzu, 2021"
institution: "Yozgat Bozok Üniversitesi"
source_url: https://bozok.edu.tr/Dosya/691f97af-8.pdf

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 1.3.1 "A4 (21 x 29,7 cm)"
  margins_cm: { top: 2.5, bottom: 2.5, left: 3.5, right: 2.0 }   # 1.3.2.2 sol 3,5; üst 2,5; sağ 2,0; alt 2,5 cm

fonts:
  allowed: [Times New Roman, Traditional Arabic]   # 1.3.3 (Arapça metin için Traditional Arabic 14 pt)

roles:
  body:
    size_pt: 12                 # 1.3.3
    line_spacing: 1.5           # 1.3.4.1
    alignment: justify          # 1.3.3, 1.3.4.2 "iki yana yasla"
    first_line_indent_cm: 1.25  # 1.3.4.1, 1.3.4.2 "1,25 cm içeriden"
    space_after_pt: 6           # 1.3.4.1 "her paragraf arası 6 nk"
  heading_1:
    size_pt: 14                 # 1.3.3, 1.3.4.4
    bold: true                  # 1.3.4.4
    all_caps: true              # 1.3.4.4 "bütün sözcükler büyük harfle"
    alignment: center           # 1.3.4.4 "metin ortalanır"; 2.11 "Koyu ve Ortalanmış"
    space_before_pt: 18         # 1.3.4.1 ana başlıklar "önce 18 nk, sonra 12 nk"
    space_after_pt: 12          # 1.3.4.1
  heading_2:
    size_pt: 12                 # 1.3.4.4
    bold: true                  # 1.3.4.4
    all_caps: true              # 1.3.4.4 birinci düzey "bütün sözcükler büyük harfle"
    alignment: left             # 1.3.4.4 "sol kenardan hizalanır"
    space_before_pt: 6          # 1.3.4.4
    space_after_pt: 6           # 1.3.4.4
  heading_3:
    size_pt: 12                 # 1.3.4.4
    bold: true                  # 1.3.4.4
    case: title                 # 1.3.4.4 "bütün sözcüklerin ilk harfleri büyük"
    alignment: left             # 1.3.4.4
    space_before_pt: 6          # 1.3.4.4
    space_after_pt: 6           # 1.3.4.4
  figure_caption:
    size_pt: 12                 # 1.3.3, 1.3.4.3 "12 punto kalın"
    bold: true                  # 1.3.4.3
    case: title                 # 1.3.3 "baş harfleri büyük"
    alignment: justify          # 1.3.4.3 "iki yana yaslı"
    line_spacing: 1.0           # 1.3.4.1
    space_before_pt: 12         # 1.3.4.4
    space_after_pt: 6           # 1.3.4.4
    # ÇELİŞKİ: 1.3.4.4 "başlıklar tablo, şekil vb.'den önce verilir" derken 1.3.4.1 "şekil alt yazıları" diyor; konum denetlenmez.
  table_caption:
    size_pt: 12                 # 1.3.4.3
    bold: true                  # 1.3.4.3
    case: title                 # 1.3.3
    alignment: justify          # 1.3.4.3
    line_spacing: 1.0           # 1.3.4.1 "çizelge açıklamaları ... 1 satır aralığı"
    space_before_pt: 12         # 1.3.4.4
    space_after_pt: 6           # 1.3.4.4
    position: above             # 1.3.4.4 "tablo, şekil vb.'den önce verilir"
  block_quote:
    size_pt: 10                 # 1.3.3; 3. Bölüm s. 36 "10 punto"
    italic: true                # 3. Bölüm s. 36 "alıntı yapılan kısım italik yazılarak"
    line_spacing: 1.0           # 1.3.4.1; 3. Bölüm s. 36 "tek satır aralıklı"
    indent_left_cm: 1.0         # 1.3.4.2 "soldan ve sağdan 1 cm girinti"
  footnote:
    size_pt: 10                 # 1.3.3
    line_spacing: 1.0           # 1.3.4.2
    first_line_indent_cm: 0     # 1.3.4.2 "paragraf başı yapılmaz"
    space_before_pt: 0          # 1.3.4.2
    space_after_pt: 0           # 1.3.4.2

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # 1.3.2.3 iç kapaktan sonra küçük Romen, GİRİŞ'ten itibaren 1, 2, 3
  position: bottom_center       # 1.3.2.3 "sayfa altında ve ortada"
  forbid_decoration: true       # 1.3.2.3 "ayıraç, çizgi vb. karakter kullanılmamalıdır"

document:
  forbid_tracked_changes: true
