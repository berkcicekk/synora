# İstanbul Kent Üniversitesi Lisansüstü Eğitim Enstitüsü — Tez Yazım Kılavuzu (LEE_YD_01, İstanbul 2022)
# Kaynak: https://kent.edu.tr/content/files/LEE_YD_01_Lisansustu_Egitim_Enstitusu_Tez_Yazim_K%C4%B1lavuzu_1.docx
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
# Not: Tezli yüksek lisans ve doktora için ayrı yayımlanan iki dosya aynı kılavuzdur (LEE_YD_01).
ruleset: kent-lee
version: 1
name: "İstanbul Kent Üniversitesi · Lisansüstü Eğitim Enstitüsü"
source: "Lisansüstü Eğitim Enstitüsü Tez Yazım Kılavuzu, 2022"
institution: "İstanbul Kent Üniversitesi"
source_url: https://kent.edu.tr/content/files/LEE_YD_01_Lisansustu_Egitim_Enstitusu_Tez_Yazim_K%C4%B1lavuzu_1.docx

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  margins_cm: { top: 2.5, bottom: 2.5, left: 3.0, right: 2.0 }   # 2.2 (tablo)

fonts:
  allowed: [Times New Roman]    # 2.1.1

roles:
  body:
    size_pt: 12                 # 2.1.4
    line_spacing: 1.5           # 2.1.4
    alignment: justify          # 2.1.4 "iki yana hizalı"
  heading_1:
    size_pt: 14                 # 2.1.2
    bold: true                  # 2.1.2 "koyu"
    all_caps: true              # 2.1.2 "tümü büyük harf"
    alignment: left             # 2.1.2 "sola hizalı"; Bölüm 5 "mutlaka sola hizalanmalıdır"
    page_break_before: true     # 2.1.2 "Her bölüm yeni sayfada başlamalı"
  heading_2:
    size_pt: 12                 # 2.1.3
    bold: true                  # 2.1.3
    alignment: left             # 2.1.3 "sola hizalı"
    case: title                 # 2.1.3 "Baş harfleri büyük"
  heading_3:
    size_pt: 12                 # 2.1.3
    bold: true                  # 2.1.3
    alignment: left             # 2.1.3
    case: title                 # 2.1.3
  table_caption:
    size_pt: 12                 # Tablo Listesi: "Times New Roman ... 12 punto"
    bold: true                  # Tablo Listesi: "koyu olarak"
    alignment: center           # Tablo Listesi: "ortalanarak yazılır"
    position: above             # Tablo Listesi: "Tablo başlıkları, tablo üzerine"
  figure_caption:
    size_pt: 12                 # Şekil Listesi: "12 punto"
    bold: true                  # Şekil Listesi: "koyu olarak"
    alignment: center           # Şekil Listesi: "ortalanarak yazılır"
    position: above             # Şekil Listesi: "Şekil başlıkları, şekil üzerine"
  reference_entry:
    size_pt: 12                 # 6.2 "Kaynaklar ... 12 punto"

page_numbering:
  # 2.3: Kısaltmalar'dan Giriş'e kadar küçük Romen (i, ii…), Giriş'ten itibaren 1, 2, 3…
  formats_in_order: [lowerRoman, decimal]
  position: bottom_center       # 2.3 "kâğıdın altına ortalanarak"
  forbid_decoration: true       # 2.3 "parantez, çizgi vb. işaretler kullanılmadan"

document:
  forbid_tracked_changes: true
