# Pamukkale Üniversitesi Sağlık Bilimleri Enstitüsü — Tez Yazım Kılavuzu (Haziran 2023)
# Kaynak: https://d.pau.edu.tr/c89b265e
# (bağlantı sayfası: https://www.pau.edu.tr/saglikbilimleri/tr/sayfa/yeni-tez-yazim-kilavuzu)
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: pamukkale-sabe
version: 1
name: "Pamukkale Üniversitesi · Sağlık Bilimleri Enstitüsü"
source: "PAÜ Sağlık Bilimleri Enstitüsü Tez Yazım Kılavuzu, 2023"
institution: "Pamukkale Üniversitesi"
source_url: https://d.pau.edu.tr/c89b265e

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 2. "A4 standardında (210 mm X 297 mm)"
  margins_cm: { top: 2.5, bottom: 2.5, left: 4.0, right: 2.0 }  # 3.1 "sol 4 cm, alt ve üst 2,5 cm, sağ 2 cm"

fonts:
  allowed: [Times New Roman]    # 2. "Yazı tipi olarak Times New Roman"

roles:
  body:
    size_pt: 12                 # 2. "on iki (12) punto"
    line_spacing: 1.5           # 3.2, 3.3 "1,5 (bir buçuk) tam satır aralığı"
    alignment: justify          # 3.1, 3.2 "iki yana yaslı"
    first_line_indent_cm: 1.25  # 3.2 "1,25 cm (1 Tab) sekme ile içerden"
    space_before_pt: 6          # 3.2 "paragraftan önce ve sonra 6 nokta (nk)"
    space_after_pt: 6           # 3.2
  heading_1:
    size_pt: 12                 # 3.5 "Times New Roman, 12 punto"
    bold: true                  # 3.5 "Tüm başlıklar koyu harflerle"
    all_caps: true              # 3.5 "Birinci derece başlıklar BÜYÜK HARF ile"
    page_break_before: true     # 3.3, 3.5 "Ana bölümler daima yeni bir sayfanın başından"
  heading_2:
    size_pt: 12                 # 3.5
    bold: true                  # 3.5
    case: title                 # 3.5 her kelimenin "İlk Harfi Büyük", bağlaçlar küçük
  heading_3:
    size_pt: 12                 # 3.5
    bold: true                  # 3.5
    case: sentence              # 3.5 "başlığın ilk harfi Büyük harf, diğerleri küçük harf"
  figure_caption:
    line_spacing: 1.0           # 3.3, 3.11.1 "1 tam aralık"
    alignment: justify          # 3.11.1 "ana metin gibi bloklama tarzında"
    position: below             # 3.11.1 "Şekil başlıkları ise şeklin altına"
  table_caption:
    line_spacing: 1.0           # 3.3, 3.11.1
    alignment: justify          # 3.11.1
    position: above             # 3.11.1 "Tablo başlıkları tablonun üstüne"
  block_quote:
    line_spacing: 1.0           # 3.3 "alıntılar ... 1 (bir) satır aralığı"
    italic: true                # 3.9 "italik harflerle"
    indent_left_cm: 1.25        # 3.9 "her iki taraftan 1,25 cm içeride"
  reference_entry:
    line_spacing: 1.0           # 3.3 "kaynaklar listesinin yazımında ise 1 (bir) satır aralığı"
  footnote:
    size_pt: 9                  # 3.10 "9 punto büyüklüğünde"
    line_spacing: 1.0           # 3.3, 3.10 "1 satır aralığında"

page_numbering:
  # 3.4: ön sayfalar küçük Romen (v, vi…), girişten itibaren 1, 2, 3…
  formats_in_order: [lowerRoman, decimal]
  position: top_right           # 3.4 "sayfanın sağ üst köşesine"
  forbid_decoration: true       # 3.4 "ayıraç, çizgi, parantez vb. gibi bir karakterler kullanılmamalıdır"

document:
  forbid_tracked_changes: true
