# Altınbaş Üniversitesi Lisansüstü Eğitim Enstitüsü — Tez Yazım Kılavuzu (Kaynakça/APA güncellemesi, 14.03.2025; .docx)
# Kaynak: https://enstitu.altinbas.edu.tr/wp-content/uploads/2025/03/Tez-Yazim-Kilavuzu-Kaynakca-APA-ekleme-guncellemesi_14.03.2025.docx
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: altinbas-lee
version: 1
name: "Altınbaş Üniversitesi · Lisansüstü Eğitim Enstitüsü"
source: "Altınbaş Üniversitesi Lisansüstü Eğitim Enstitüsü Tez Yazım Kılavuzu, 2025"
institution: "Altınbaş Üniversitesi"
source_url: "https://enstitu.altinbas.edu.tr/wp-content/uploads/2025/03/Tez-Yazim-Kilavuzu-Kaynakca-APA-ekleme-guncellemesi_14.03.2025.docx"

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 2.1 "A4 boyutunda (21x29,7 cm)"
  margins_cm: { top: 3.0, bottom: 3.0, left: 3.0, right: 2.5 }   # 2.3

fonts:
  allowed: [Times New Roman]    # 2.2

roles:
  body:
    size_pt: 12                 # 2.2 "Times New Roman 12"
    line_spacing: 1.5           # 2.4 "ana metnin 1.5 satır aralığı"
    alignment: justify          # 2.4 "iki yana yaslanmış (justify)"
    first_line_indent_cm: 0     # 2.4 "Satır başı yapılmamalıdır"
  heading_1:
    size_pt: 14                 # 2.6 "kalın, 14 yazı tipi boyutunda"
    bold: true                  # 2.6
    alignment: center           # 2.6 "Ortaya hizalı olmalıdır"
    page_break_before: true     # 2.6 "her defasında yeni bir sayfanın başından başlanır"
  heading_2:
    size_pt: 12                 # 2.6 "2 rakamlı alt başlıklar ... 12"
    bold: true                  # 2.6
    all_caps: true              # 2.6 "BÜYÜK HARFLERLE"
    alignment: left             # 2.6 "sola yaslı"
  heading_3:
    size_pt: 12                 # 2.6 "3 rakamlı alt başlıklar ... 12"
    bold: true                  # 2.6
    case: title                 # 2.6 "sadece Baş Harfler Büyük"
    alignment: left             # 2.6
  figure_caption:
    size_pt: 12                 # 2.2 şekil başlıkları aynı yazı tipi ve boyutunda
  table_caption:
    size_pt: 12                 # 2.2 çizelge başlıkları aynı yazı tipi ve boyutunda
  footnote:
    size_pt: 12                 # 2.2 "dipnotlar ... aynı yazı tipi ve boyutunda"

page_numbering:
  # 2.5: ön sayfalar Romen rakamı ("iii"den), Giriş'ten itibaren Arap rakamı
  formats_in_order: [lowerRoman, decimal]
  position: bottom_center       # 2.5 "sayfanın alt ortasına"

document:
  forbid_tracked_changes: true
