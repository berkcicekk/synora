# Karadeniz Teknik Üniversitesi Sosyal Bilimler Enstitüsü — Tez Yazım Kılavuzu (Ekim 2026; 5 Ekim 2026'dan itibaren geçerli)
# Kaynak: https://www.ktu.edu.tr/dosyalar/sbe_dE6BE.pdf
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: ktu-sbe
version: 1
name: "Karadeniz Teknik Üniversitesi · Sosyal Bilimler Enstitüsü"
source: "KTÜ Sosyal Bilimler Enstitüsü Tez Yazım Kılavuzu, 2026"
institution: "Karadeniz Teknik Üniversitesi"
source_url: https://www.ktu.edu.tr/dosyalar/sbe_dE6BE.pdf

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 1.5 "genişlik 21 cm ve yükseklik 29,7 cm"
  margins_cm: { top: 3.0, bottom: 2.5, left: 3.0, right: 2.5 }   # 1.7 sol ve üst 3 cm, sağ ve alt 2,5 cm

fonts:
  allowed: [Times New Roman]    # 1.6

roles:
  body:
    size_pt: 11                 # 1.6 "metin genelinde 11 punto"
    line_spacing: 1.5           # 1.8
    first_line_indent_cm: 1.0   # 1.8 "paragraf girintisi/ilk satır 1 cm"
    space_before_pt: 6          # 1.8 "önce/sonra boşluğu 6 nk"
    space_after_pt: 6           # 1.8
  heading_1:
    size_pt: 11                 # 1.3.10 "büyük harflerle, 11 punto ve koyu"
    bold: true                  # 1.3.10, 1.10
    all_caps: true              # 1.3.10, 1.10 "tüm harfler büyük"
  heading_2:
    bold: true                  # 1.10 "kelimelerin ilk harfleri büyük ve koyu"
    case: title                 # 1.10
  heading_3:
    bold: true                  # 1.10
    case: title                 # 1.10
  figure_caption:
    alignment: center           # 1.12 şekillerde "aynı kurallar uygulanır" (tablo başlığı: üstte ve ortalanmış)
    position: above             # 1.12 şekillerde "aynı kurallar uygulanır"
    space_after_pt: 6           # 1.8 "sonra boşluğu 6 nk"
  table_caption:
    alignment: center           # 1.12 "tablonun üstünde ve ortalanmış"
    position: above             # 1.12
    space_after_pt: 6           # 1.8, 1.12 "yalnızca 6 nk paragraf sonrası boşluk"
  block_quote:
    size_pt: 10                 # 2 (s. 11) "metin 10 punto"
    line_spacing: 1.0           # 2 (s. 11) "tek satır aralığı"
    indent_left_cm: 1.0         # 2 (s. 11) "sağdan ve soldan 1 cm girintili"
  reference_entry:
    size_pt: 11                 # 2.1.2 h "Kaynakça 11 punto"
    line_spacing: 1.0           # 2.1.2 h "Tek satır aralığı"
    alignment: justify          # 2.1.2 h "iki yana yaslı"
    first_line_indent_cm: -1.0  # 2.1.2 h "1 cm asılı girinti"
    space_after_pt: 6           # 2.1.2 h "paragraf sonrası 6 nk"
  footnote:
    size_pt: 9                  # 1.6, 1.8 "9 punto"
    line_spacing: 1.0           # 1.8 "tek satır aralığı"
    first_line_indent_cm: 0     # 1.8 "girintisiz"
    space_before_pt: 0          # 1.8 "paragraf önce/sonra boşluksuz"
    space_after_pt: 0           # 1.8

page_numbering:
  formats_in_order: [upperRoman, decimal]   # 1.9 giriş bölümüne kadar büyük Romen (I, II, III), sonra Arap
  position: bottom_center       # 1.9 "sayfanın alt orta kısmında"

document:
  forbid_tracked_changes: true
