# Kırşehir Ahi Evran Üniversitesi Sosyal Bilimler Enstitüsü — Tez Şablonu içindeki "Tez Yazımı ile İlgili Kısa Açıklamalar" (2024)
# Kaynak: https://sbe.ahievran.edu.tr/uploads/6554/TEZ_SABLONU_2_1.docx
# (Enstitünün "Tez / Seminer / Dönem Projesi Yazım Kılavuzları" sayfasında; ayrı bir PDF kılavuz yok, kurallar
#  şablonun başındaki açıklama bölümünde. Dosya tarihi Temmuz 2024.)
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: ahievran-sbe
version: 1
name: "Kırşehir Ahi Evran Üniversitesi · Sosyal Bilimler Enstitüsü"
source: "Kırşehir Ahi Evran Üniversitesi SBE Tez Şablonu (Tez Yazımı ile İlgili Kısa Açıklamalar), 2024"
institution: "Kırşehir Ahi Evran Üniversitesi"
source_url: https://sbe.ahievran.edu.tr/uploads/6554/TEZ_SABLONU_2_1.docx

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  margins_cm: { top: 2.5, bottom: 2.5, left: 3.0, right: 2.5 }   # 1.1.1

fonts:
  allowed: [Times New Roman]                # 1.1.1.3

roles:
  body:
    size_pt: 12                             # 1.1.1.3
    line_spacing: 1.5                       # 1.1.1.4 "1,5 satır aralığında"
    alignment: justify                      # 1.1.1.3 "iki yana yaslanacak"
    first_line_indent_cm: 1.25              # 1.1.1 "1,25 cm girinti ile içeriden"
    space_after_pt: 6                       # 1.1.1.4 "paragraflar arasında ... 6 nk"
  heading_1:
    size_pt: 12                             # 2.1
    bold: true                              # 2.1 "koyu"
    all_caps: true                          # 2.1 "bütün sözcükler büyük harfle"
    alignment: center                       # 2.1 "yazı ortalanır"
    page_break_before: true                 # 2.1 "yeni bir sayfadan başlar"
    space_after_pt: 6                       # 1.1.1.4
  heading_2:
    size_pt: 12                             # 2.2
    bold: true                              # 2.2
    all_caps: true                          # 2.2 "Bütün sözcükler büyük harfle"
    first_line_indent_cm: 1.25              # 2.2 "sol kenardan 1,25 cm girinti ile"
    space_before_pt: 6                      # 1.1.1.4 "bir bölümün son satırı ile bir sonraki bölüm başlığı arasında 6 nk"
    space_after_pt: 6                       # 1.1.1.4
  heading_3:
    size_pt: 12                             # 2.2.1
    bold: true                              # 2.2.1
    case: title                             # 2.2.1 "Bütün sözcüklerin ilk harfleri büyük"
    first_line_indent_cm: 1.25              # 2.2.1
    space_before_pt: 6                      # 1.1.1.4
    space_after_pt: 6                       # 1.1.1.4
  figure_caption:
    size_pt: 10                             # 1.1.1.3 "şekiller başlıkları ... 10 punto"
    line_spacing: 1.0                       # 1.1.1.4 "açıklamaları ... 1 (tek) satır"
    alignment: center                       # 3 "açıklamaları ise ortalı"
    position: below                         # 3 "alt tarafa"
  table_caption:
    size_pt: 10                             # 1.1.1.3
    line_spacing: 1.0                       # 1.1.1.4
    alignment: center                       # 3
    position: above                         # 3 "üst tarafa"
  block_quote:
    line_spacing: 1.0                       # 1.1.1.4 "doğrudan alıntılar ... 1 (tek) satır"
  footnote:
    size_pt: 10                             # 1.1.1.3
    line_spacing: 1.0                       # 1.1.1.4

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # 1.1.1.2
  position: bottom_center                   # 1.1.1.2 "sayfanın alt ortasına"
  forbid_decoration: true                   # 1.1.1.2 "ayraç, çizgi vb. karakter kullanılmamalıdır"

document:
  forbid_tracked_changes: true
