# Hatay Mustafa Kemal Üniversitesi Sosyal Bilimler Enstitüsü — Lisansüstü Tez ve Proje Yazım Kılavuzu (29.05.2019; ek 18.12.2024)
# Kaynak: https://files.mku.edu.tr/uploads/website/files/b5b920a7-b089-48c6-a3f4-36c5d2b1437c.pdf
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: mku-sbe
version: 1
name: "Hatay Mustafa Kemal Üniversitesi · Sosyal Bilimler Enstitüsü"
source: "HMKÜ Sosyal Bilimler Enstitüsü Lisansüstü Tez ve Proje Yazım Kılavuzu, 2019 (ek 2024)"
institution: "Hatay Mustafa Kemal Üniversitesi"
source_url: https://files.mku.edu.tr/uploads/website/files/b5b920a7-b089-48c6-a3f4-36c5d2b1437c.pdf

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # Kâğıt
  margins_cm: { top: 2.5, bottom: 2.5, left: 4.0, right: 2.5 }   # Kenar Boşlukları

fonts:
  allowed: [Times New Roman]    # Yazı Tipi ve Boyutu

roles:
  body:
    size_pt: 12                 # Yazı Tipi ve Boyutu
    line_spacing: 1.5           # Satır Aralıkları
    alignment: justify          # Paragraflar "iki yana yaslı"
    first_line_indent_cm: 1.25  # Paragraflar "1,25 cm (1 tab tuşu) içeriden"
  heading_1:
    size_pt: 12                 # Başlıklar
    bold: true                  # Başlıklar
    all_caps: true              # "bütün sözcükler büyük harfle"
    line_spacing: 1.5           # Başlıklar
    alignment: center           # "metin ortalanarak"
    page_break_before: true     # "her biri yeni bir sayfada başlamalıdır"
  heading_2:
    size_pt: 12                 # Başlıklar, birinci düzey alt başlık
    bold: true                  # Başlıklar
    all_caps: true              # "bütün sözcükler büyük harfle"
    line_spacing: 1.5           # Başlıklar
    alignment: left             # "sol kenardan hizalanır"
    first_line_indent_cm: 1.25  # "1.25 cm (1 tab tuşu) içeriden"
  heading_3:
    size_pt: 12                 # Başlıklar, ikinci ve alt düzey
    bold: true                  # Başlıklar
    case: title                 # "ilk harfleri büyük, diğerleri küçük"
    line_spacing: 1.5           # Başlıklar
    alignment: left             # Başlıklar
    first_line_indent_cm: 1.25  # Başlıklar
  table_caption:
    position: above             # Görsel Ögeler "başlıkları görsel ögenin üst kısmında"
    size_pt: 10                 # Görsel Ögeler "başlıkları … 10 punto"
  figure_caption:
    position: above             # Görsel Ögeler (tüm görsel ögeler için üstte)
    size_pt: 10                 # Görsel Ögeler
  table_cell:
    size_pt: 10                 # Yazı Tipi ve Boyutu, Görsel Ögeler
    line_spacing: 1.0           # Satır Aralıkları "tablolar … 1 satır aralığı"
  block_quote:
    # ÇELİŞKİ: Yazı Tipi bölümü "11 punto"; Kaynak Gösterme bölümü "10 punto" → punto denetlenmez
    italic: true                # Yazı Tipi ve Boyutu "italik olarak yazılmalı"
    line_spacing: 1.0           # Satır Aralıkları
    indent_left_cm: 1.0         # "sağ ve soldan birer cm içeriye"
  footnote:
    size_pt: 10                 # Yazı Tipi ve Boyutu
    line_spacing: 1.0           # Satır Aralıkları

page_numbering:
  formats_in_order: [upperRoman, decimal]   # Sayfa Numaraları "Romen rakamlarıyla (I, II, III…)", metin Arap
  position: bottom_right        # Sayfa Numaraları "sağ alt köşesine"
  forbid_decoration: true       # "parantez, çizgi vb. işaretler kullanılmadan"

document:
  forbid_tracked_changes: true
