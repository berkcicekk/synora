# Antalya Bilim Üniversitesi Lisansüstü Eğitim Enstitüsü — Tez / Dönem Projesi Yazım Kılavuzu (Ağustos 2022)
# Kaynak: https://admin.antalya.edu.tr/files/793/ABU_LEE_Tez_Yazim_KILAVUZ__TR_.docx
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: antalyabilim-lee
version: 1
name: "Antalya Bilim Üniversitesi · Lisansüstü Eğitim Enstitüsü"
source: "Antalya Bilim Üniversitesi Lisansüstü Eğitim Enstitüsü Tez / Dönem Projesi Yazım Kılavuzu, 2022"
institution: "Antalya Bilim Üniversitesi"
source_url: https://admin.antalya.edu.tr/files/793/ABU_LEE_Tez_Yazim_KILAVUZ__TR_.docx

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 3.3 Şekil 3.1 "A4 kağıdına göre sayfa düzeni"
  margins_cm: { top: 3.0, bottom: 3.0, left: 4.0, right: 2.0 }   # 3.3

fonts:
  allowed: [Times New Roman]    # 3.2

roles:
  body:
    size_pt: 12                 # 3.2
    line_spacing: 1.0           # 3.6 "TEK satır aralığı"
    alignment: justify          # 3.6 sola dayalı, "sağ kenarda ... aynı hizada"
    first_line_indent_cm: 1.25  # 3.6 "1 sekme (1.25 cm)"
    space_before_pt: 0          # 3.6 "önce 0 nk"
    space_after_pt: 12          # 3.6 "sonra 12 nk"
  heading_1:
    size_pt: 12                 # 3.4
    bold: true                  # 3.4 "koyu"
    all_caps: true              # 3.4 "TÜMÜ BÜYÜK HARF"
    # ÇELİŞKİ: 3.6 "bölüm ve alt bölüm başlıkları ... sola dayandırılmalıdır"; 3.4 birinci derece için "ortalanmış" (3.4 alındı)
    alignment: center           # 3.4
    line_spacing: 1.0           # 3.6
    space_before_pt: 0          # 3.6
    space_after_pt: 12          # 3.6
    page_break_before: true     # 3.6 "Bölümler daima yeni bir sayfanın başından başlamalıdır"
  heading_2:
    size_pt: 12                 # 3.4
    bold: true                  # 3.4
    alignment: left             # 3.6
    case: title                 # 3.4 "HER KELİMENİN İLK HARFİ BÜYÜK"
    line_spacing: 1.0           # 3.6
    space_before_pt: 0          # 3.6
    space_after_pt: 12          # 3.6
  heading_3:
    size_pt: 12                 # 3.4
    bold: true                  # 3.4
    alignment: left             # 3.6
    case: title                 # 3.4 "aynen ikinci derece alt bölüm başlığı gibi"
    line_spacing: 1.0           # 3.6
    space_before_pt: 0          # 3.6
    space_after_pt: 12          # 3.6
  figure_caption:
    line_spacing: 1.0           # 3.7.2 "bir satır aralığı"
    space_before_pt: 0          # 3.7.2 "öncesi ve sonrası 0 nk"
    space_after_pt: 0           # 3.7.2
    case: sentence              # 3.7.2 "ilk harfi büyük olmak koşulu ile küçük harfle"
    position: below             # 3.7.2 "şeklin altında"
  table_caption:
    position: above             # 3.7.1 "tablonun üstüne"
  reference_entry:
    size_pt: 12                 # 3.11
    line_spacing: 1.0           # 3.6, 3.11
    space_before_pt: 0          # 3.6, 3.11
    space_after_pt: 6           # 3.6, 3.11
  footnote:
    line_spacing: 1.0           # 3.9 "bir aralık"
    alignment: justify          # 3.9 "her iki yöne hizalı"

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # 3.5
  position: bottom_center       # 3.5 "sayfa altında orta kısma"
  forbid_decoration: true       # 3.5 "ayıraç, çizgi vb. ... kullanılmamalıdır"

document:
  forbid_tracked_changes: true
