# Başkent Üniversitesi Fen Bilimleri Enstitüsü Tez Yazım Kılavuzu (Aralık 2024)
# Kaynak: https://fbe.baskent.edu.tr/kw/upload/910/dosyalar/tez-klavuzu-1-1.pdf
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: baskent-fbe
version: 1
name: "Başkent Üniversitesi · Fen Bilimleri Enstitüsü"
source: "Başkent Üniversitesi Fen Bilimleri Enstitüsü Tez Yazım Kılavuzu, 2024"
institution: "Başkent Üniversitesi"
source_url: https://fbe.baskent.edu.tr/kw/upload/910/dosyalar/tez-klavuzu-1-1.pdf

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 2.1
  # 2.2: sol 3 cm, alt/üst/sağ 2,5 cm. ÇELİŞKİ: 5.4 dipnot için "alt kenarda 3 cm'lik boşluk" diyor.
  margins_cm: { top: 2.5, bottom: 2.5, left: 3.0, right: 2.5 }

fonts:
  allowed: [Times New Roman]    # 2.3

roles:
  body:
    size_pt: 12                 # 2.3
    line_spacing: 1.5           # 2.4
    alignment: justify          # 2.2 "iki yana yaslı"
    first_line_indent_cm: 1.0   # 2.4, 4.4
    # Paragraf aralığı yazılmadı. ÇELİŞKİ: 2.4 "iki paragraf arasında 1,5 satır aralığı", 4.4 "paragraflar arası ekstra boşluk bırakılmaz"
  heading_1:
    size_pt: 14                 # 4.4
    bold: true                  # 4.4
    all_caps: true              # 4.4 "BÜYÜK HARF"
    alignment: center           # 4.4 "satır ortalanmalı"
    page_break_before: true     # 2.4 "sayfa başı yapılmalı"
  heading_2:
    size_pt: 12                 # 4.4
    bold: true                  # 4.4
    alignment: left             # 4.4 "sol kenara yaslı"
    case: title                 # 4.4 her sözcüğün ilk harfi büyük
  heading_3:
    size_pt: 12                 # 4.4
    bold: true                  # 4.4
    indent_left_cm: 1.0         # 4.4 "1 cm içeriden (girinti)"
    case: sentence              # 4.4 yalnızca ilk sözcüğün ilk harfi büyük
  figure_caption:
    size_pt: 10                 # 5.6.4
    line_spacing: 1.0           # 5.6.4 "1 satır aralık"
    alignment: center           # 5.6.4 "şeklin altına ortalayarak"
    position: below             # 5.6.2, 5.6.4
  table_caption:
    size_pt: 10                 # 5.6.4
    line_spacing: 1.0           # 5.6.4
    alignment: center           # 5.6.4 "tablonun üstüne ortalanmalıdır"
    position: above             # 5.6.2, 5.6.4
  block_quote:
    size_pt: 10                 # 5.3
  reference_entry:
    line_spacing: 1.5           # 4.5
  footnote:
    size_pt: 10                 # 2.3, 5.4
    line_spacing: 1.0           # 5.4 "1 tam satır aralığı"

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # 4.3
  position: bottom_center       # 2.2, 4.3 "alt ortada"
  forbid_decoration: true       # 4.3 "-" ve "_" gibi işaretler kullanılmamalıdır

document:
  forbid_tracked_changes: true
