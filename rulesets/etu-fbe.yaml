# Erzurum Teknik Üniversitesi Fen Bilimleri Enstitüsü — Lisansüstü Tez Yazım Kılavuzu (2025)
# Kaynak: https://erzurum.edu.tr/Content/etugeneldosyalar/919699e0-e95d-493f-88f8-0fc4c111d078.pdf
# (bağlantı sayfası: https://erzurum.edu.tr/menu/tez-yazim-klavuzu)
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: etu-fbe
version: 1
name: "Erzurum Teknik Üniversitesi · Fen Bilimleri Enstitüsü"
source: "ETÜ Fen Bilimleri Enstitüsü Lisansüstü Tez Yazım Kılavuzu, 2025"
institution: "Erzurum Teknik Üniversitesi"
source_url: https://erzurum.edu.tr/Content/etugeneldosyalar/919699e0-e95d-493f-88f8-0fc4c111d078.pdf

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 1.2.1 "A4 (210 mm x 297 mm)"
  margins_cm: { top: 2.5, bottom: 2.5, left: 4.0, right: 2.0 }  # 1.2.2 "üst ve alt (2,5 cm), sol (4 cm), sağ (2 cm)"

fonts:
  allowed: [Times New Roman]    # 1.2.5 "Times New Roman yazı karakteri"

roles:
  body:
    line_spacing: 1.5           # 1.2.3, Tablo 1 "1,5 satır aralığı"
    alignment: justify          # 1.2.3 "her iki yana yasla"
    first_line_indent_cm: 1.25  # 1.2.3, Tablo 1 "ilk satır soldan 1,25 cm girintili"
    space_before_pt: 6          # 1.2.3 "paragraf öncesi 6 nk"
    space_after_pt: 6           # 1.2.3 "sonrasında 6 nk"
  heading_1:
    size_pt: 12                 # Tablo 1 "12 punto"; 1.2.7 "Ana başlıkların büyüklüğü 12 punto"
    bold: true                  # Tablo 1 "kalın"
    all_caps: true              # Tablo 1 "Tamamı büyük harflerle"
    line_spacing: 1.5           # Tablo 1 "1,5 satır aralığı"
    space_before_pt: 0          # Tablo 1 "Öncesinde 0 nk"
    space_after_pt: 24          # Tablo 1 "sonrasında 24 nk"
    page_break_before: true     # 1.2.7 "Ana başlıklar daima yeni bir sayfa ile başlamalıdır"
  heading_2:
    size_pt: 12                 # 1.2.7 "alt başlıkların ise 12 punto"
    bold: true                  # Tablo 1 "kalın"
    case: title                 # Tablo 1 "her sözcüğün ilk harfi büyük (bağlaçlar hariç)"
    alignment: left             # Tablo 1 "sola yaslı"
    first_line_indent_cm: 0     # Tablo 1 "Paragraf girintisi olmadan"
    line_spacing: 1.5           # Tablo 1
    space_before_pt: 12         # Tablo 1 "Öncesinde 12 nk"
    space_after_pt: 12          # Tablo 1 "sonrasında 12 nk"
  heading_3:
    size_pt: 12                 # 1.2.7
    case: title                 # Tablo 1 "Her sözcüğün ilk harfi büyük (bağlaçlar hariç)"
    first_line_indent_cm: 1.25  # Tablo 1 "ilk satır soldan 1,25 cm içeriden"
    space_before_pt: 12         # Tablo 1
    space_after_pt: 12          # Tablo 1
  figure_caption:
    size_pt: 12                 # Şekiller "Şekiller ortalı ve 12 punto ile yazılmalıdır"
    line_spacing: 1.5           # "Şekil başlığı 1,5 satır aralıklı"
    space_before_pt: 12         # "Şekil yazılarından önce 12 nk"
    space_after_pt: 12          # "sonrasında 12 nk"
    case: sentence              # "normal tümce kuralları ... ilk harf büyük ... diğerleri küçük"
  table_caption:
    line_spacing: 1.5           # "Tablo başlığı 1,5 satır aralıklı"
    space_before_pt: 12         # "öncesinde ve sonrasında 12 nk"
    space_after_pt: 12          # "öncesinde ve sonrasında 12 nk"
    case: sentence              # "normal tümce kuralları"
    alignment: center           # "Tablolar ve tablo başlığı ortalı olmalıdır"
    position: above             # "Tablonun numarası ve adı tablonun üzerinde"

page_numbering:
  # 1.2.4: ön sayfalar küçük Romen (i, ii, iii…), Giriş'ten itibaren 1, 2, 3…
  formats_in_order: [lowerRoman, decimal]
  position: bottom_center       # 1.2.4 "sayfanın ortasına" (alt kenardan 1,25 cm)
  forbid_decoration: true       # 1.2.4 "parantez veya çizgi gibi işaretler kullanılmaz"

document:
  forbid_tracked_changes: true
