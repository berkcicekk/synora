# Kayseri Üniversitesi Lisansüstü Eğitim Enstitüsü — Lisansüstü Tez Yazım ve Tez Teslim Kılavuzu (Mayıs 2024)
# Kaynak: https://enstitu.kayseri.edu.tr/EditorUpload/Files/d487bed3-f5ff-4ed9-b25a-f9af6379d437.pdf
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: kayseri-lee
version: 1
name: "Kayseri Üniversitesi · Lisansüstü Eğitim Enstitüsü"
source: "Kayseri Üniversitesi Lisansüstü Tez Yazım ve Tez Teslim Kılavuzu, 2024"
institution: "Kayseri Üniversitesi"
source_url: https://enstitu.kayseri.edu.tr/EditorUpload/Files/d487bed3-f5ff-4ed9-b25a-f9af6379d437.pdf

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                                  # 1.2
  margins_cm: { top: 3.5, bottom: 2.0, left: 4.0, right: 2.0 }   # 1.3

fonts:
  allowed: [Times New Roman]                # 1.4 "Tezin tamamı (kaynakça dâhil) Times New Roman"

roles:
  body:
    size_pt: 12                             # 1.4
    line_spacing: 1.5                       # 1.5 "1,5 (bir buçuk)"
    alignment: justify                      # 1.4, 1.5 "iki yana yaslı"
    first_line_indent_cm: 0                 # 1.5 "paragraflarda girinti olmayacak şekilde"
    space_before_pt: 6                      # 1.5 "Metin içinde önce 6 nk"
    space_after_pt: 6                       # 1.5 "sonra 6 nk"
  heading_1:
    size_pt: 14                             # 1.4
    bold: true                              # 1.4 "kalın"
    all_caps: true                          # 1.4 "tamamı büyük harflerle"
    alignment: center                       # 1.4 "ortalı"
    page_break_before: true                 # 1.9 "her bir bölüm ... yeni bir sayfada başlamalıdır"
  heading_2:
    size_pt: 12                             # 1.4
    bold: true                              # 1.4
    alignment: left                         # 1.4 "sola dayalı"
    case: title                             # 1.4 "kelimelerin ilk harfleri büyük", bağlaçlar küçük
  heading_3:
    size_pt: 12                             # 1.4
    bold: true                              # 1.4
    alignment: left                         # 1.4
    case: title                             # 1.4
  figure_caption:
    size_pt: 12                             # 1.6
    italic: true                            # 1.6 "italik"
    alignment: center                       # 1.6 "ortalı"
    case: sentence                          # 1.6 "tümce düzeni"
    line_spacing: 1.0                       # 1.6 "satır aralığı 1 (tek)"
    position: above                         # 1.6 "ilgili görsel nesnenin üstüne" (şekiller dahil)
  table_caption:
    size_pt: 12                             # 1.6
    italic: true                            # 1.6
    alignment: center                       # 1.6
    case: sentence                          # 1.6
    line_spacing: 1.0                       # 1.6
    position: above                         # 1.6
  block_quote:
    line_spacing: 1.0                       # 1.16 "1 tam satır aralığı"
    space_before_pt: 0                      # 1.16 "öncesi ve sonrasında boşluk eklemeden"
    space_after_pt: 0                       # 1.16
  reference_entry:
    line_spacing: 1.5                       # 1.5 "kaynaklar listesinin ... satır aralığı 1,5"
    space_before_pt: 6                      # 1.5 "kaynakçada önce 6 nk"
    space_after_pt: 6                       # 1.5 "sonra 6 nk"
    # 1.5: her kaynak 1,25 cm asılı girinti (şemada karşılığı yok)
  footnote:
    size_pt: 10                             # 1.8
    line_spacing: 1.0                       # 1.8 "satır aralığı tek"
    space_before_pt: 0                      # 1.8
    space_after_pt: 0                       # 1.8

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # 1.9
  position: top_right                       # 1.9 "sayfanın sağ üst kısmına"
  forbid_decoration: true                   # 1.9 "parantez, çizgi vb. işaretler kullanılmadan"

document:
  forbid_tracked_changes: true
