# Kastamonu Üniversitesi Sağlık Bilimleri Enstitüsü — Tez Yazım Kılavuzu (2022)
# Kaynak: https://lisansustu.kastamonu.edu.tr/images/2025/FBESAGBETEZ/sagbeTez_yazim_kilavuzu.docx
# (Lisansüstü Eğitim Enstitüsü sitesinde .docx olarak yayımlanıyor; kapakta "KASTAMONU 2022",
#  Senato kabul tarihi boş bırakılmış. Bölüm numarası olmadığı için kaynak yerleri bölüm adıyla verildi.)
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: kastamonu-sabe
version: 1
name: "Kastamonu Üniversitesi · Sağlık Bilimleri (Lisansüstü Eğitim Enstitüsü)"
source: "Kastamonu Üniversitesi Sağlık Bilimleri Enstitüsü Tez Yazım Kılavuzu, 2022"
institution: "Kastamonu Üniversitesi"
source_url: https://lisansustu.kastamonu.edu.tr/images/2025/FBESAGBETEZ/sagbeTez_yazim_kilavuzu.docx

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                                  # Kâğıt Özelliği
  margins_cm: { top: 3.0, bottom: 2.5, left: 4.0, right: 2.5 }   # Sayfa Düzeni

fonts:
  allowed: [Times New Roman]                # Yazı Özelliği

roles:
  body:
    size_pt: 12                             # Yazı Özelliği
    line_spacing: 1.5                       # Satırlar ve Aralıklar "1,5 satır aralığında"
    alignment: justify                      # Paragraf Düzeni "iki yana yaslı"
    first_line_indent_cm: 0                 # Paragraf Düzeni "paragraf başında girinti yok"
    space_after_pt: 18                      # Satırlar ve Aralıklar "Paragraflar arasında ... bir satır boşluk (18 nk)"
  heading_1:
    size_pt: 12                             # Bölüm Düzeni tablosu
    bold: true                              # Bölüm Düzeni
    all_caps: true                          # Bölüm Düzeni "büyük, koyu harflerle"
    alignment: left                         # Bölüm Düzeni "sol sayfa boşluğuna dayalı"
    page_break_before: true                 # Paragraf Düzeni "Bölümler daima yeni bir sayfada başlamalıdır"
    space_after_pt: 36                      # Bölüm Düzeni "2 satır (veya 36 nk)"
  heading_2:
    size_pt: 12                             # Bölüm Düzeni tablosu
    bold: true                              # Bölüm Düzeni
    case: title                             # Bölüm Düzeni "kelimelerin ilk harfleri büyük"
    alignment: left                         # Bölüm Düzeni
    space_before_pt: 18                     # Satırlar ve Aralıklar "her türlü başlıktan önce ve sonra ... (18 nk)"
    space_after_pt: 18                      # Bölüm Düzeni "1 satır (veya 18 nk)"
  heading_3:
    size_pt: 12                             # Bölüm Düzeni tablosu
    bold: true                              # Bölüm Düzeni
    case: title                             # Bölüm Düzeni
    alignment: left                         # Bölüm Düzeni
    space_before_pt: 18                     # Satırlar ve Aralıklar
    space_after_pt: 18                      # Bölüm Düzeni
  figure_caption:
    size_pt: 12                             # Şekil ve Tablo Açıklamaları "12 puntoyla"
    line_spacing: 1.0                       # Satırlar ve Aralıklar; Şekil ve Tablo Açıklamaları
    position: below                         # "şeklin alt orta kısmına"
  table_caption:
    line_spacing: 1.0                       # Satırlar ve Aralıklar "Tablo başlık yazıları ... tek satır"
    position: above                         # "tablo başlığı üst kısımda"
  block_quote:
    size_pt: 10                             # Yazı Özelliği "Alıntılarda ve dipnotlarda ... 10 punto"
    line_spacing: 1.0                       # Satırlar ve Aralıklar "doğrudan alıntılar ... tek satır"
  reference_entry:
    line_spacing: 1.0                       # Kaynakların Yazımı "tek satır aralığında"
    # Kaynakların Yazımı: kaynaklar arasında bir satır boşluk; taşan satır 1,25 cm asılı girinti
  footnote:
    size_pt: 10                             # Yazı Özelliği
    line_spacing: 1.0                       # Satırlar ve Aralıklar

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # Sayfaların Numaralandırılması
  position: top_right                       # Sayfaların Numaralandırılması "sağ üst köşeye"
  forbid_decoration: true                   # "ayıraç, çizgi vb. gibi bir karakter kullanılmamalıdır"

document:
  forbid_tracked_changes: true
