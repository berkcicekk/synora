# Eskişehir Teknik Üniversitesi — Lisansüstü Tez Yazım Kılavuzu (Temmuz 2018)
# Kaynak: https://lee.eskisehir.edu.tr/Uploads/lee/files/Eski%c5%9fehir%20Teknik%20%c3%9cniversitesi%20Lisans%c3%bcst%c3%bc%20Tez%20Yaz%c4%b1m%20K%c4%b1lavuzu.pdf
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: estu-lee
version: 1
name: "Eskişehir Teknik Üniversitesi · Lisansüstü Eğitim Enstitüsü"
source: "Eskişehir Teknik Üniversitesi Lisansüstü Tez Yazım Kılavuzu, 2018"
institution: "Eskişehir Teknik Üniversitesi"
source_url: https://lee.eskisehir.edu.tr/Uploads/lee/files/Eski%c5%9fehir%20Teknik%20%c3%9cniversitesi%20Lisans%c3%bcst%c3%bc%20Tez%20Yaz%c4%b1m%20K%c4%b1lavuzu.pdf

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 2.1
  margins_cm: { top: 3.0, bottom: 2.5, left: 3.5, right: 2.5 }   # 2.1

fonts:
  allowed: [Times New Roman]    # 2.2

roles:
  body:
    size_pt: 12                 # 2.2
    line_spacing: 1.5           # 2.6
    alignment: justify          # 2.6 "iki yana yaslanmış biçimde (blok)"
    first_line_indent_cm: 1.0   # 2.7 "soldan 1 cm içeriden"
    space_after_pt: 0           # 2.7 "Paragraflar arasında boşluk bırakılmaz"
  heading_1:
    bold: true                  # 2.3 Tablo 2.1 düzey 1
    all_caps: true              # 2.3 Tablo 2.1 "tamamı büyük harf"
    alignment: left             # 2.3 "başlıkların tamamı sola dayalı"
    space_after_pt: 3           # 2.3 "başlıklardan sonra 3 nk"
    page_break_before: true     # 3.2 "her bir bölüm yeni bir sayfadan başlar"
  heading_2:
    bold: true                  # 2.3 Tablo 2.1 düzey 2
    alignment: left             # 2.3
    case: title                 # 2.3 "her sözcüğün baş harfi büyük"
    space_after_pt: 3           # 2.3
  heading_3:
    bold: true                  # 2.3 Tablo 2.1 düzey 3
    alignment: left             # 2.3
    case: sentence              # 2.3 "sadece ilk sözcüğün baş harfi büyük"
    space_after_pt: 3           # 2.3
  table_caption:
    position: above             # 2.4 "tablo/çizelgenin üstüne sola dayalı"
    alignment: left             # 2.4
  figure_caption:
    position: below             # 2.4 "şeklin ve görselin altına ortalı"
    alignment: center           # 2.4
  table_cell:
    size_pt: 10                 # 2.4 "ana metinden 2 punto küçük"
    line_spacing: 1.0           # 2.4 "satır aralığı tek"
    space_before_pt: 0          # 2.4 "önce ve sonra alanı sıfır (0)"
    space_after_pt: 0           # 2.4
  block_quote:
    size_pt: 10                 # 2.2, 4.1.2 "2 punto küçük"
    indent_left_cm: 2.0         # 2.6, 4.1.2 "soldan 2 cm içeriden"
  footnote:
    size_pt: 10                 # 2.5
    line_spacing: 1.0           # 2.5 "tek satır aralığı"

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # 2.8 ön bölüm i, ii, iii…; ana metin 1, 2, 3…
  position: bottom_center       # 2.8 "sayfanın alt ve ortasında"
  forbid_decoration: true       # 2.8 "rakam dışında herhangi bir işaret kullanılmaz"

document:
  forbid_tracked_changes: true
