# İzmir Tınaztepe Üniversitesi Lisansüstü Eğitim Enstitüsü — Tez Yazım Kılavuzu (İzmir, 2024)
# Kaynak: https://tinaztepe.edu.tr/uploads/tez_yazim_kilavuzu/iztu-lee-tez-yazim-kilavuzu.docx
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
# Kılavuz .docx; kaynak olarak "Tezin Yazım Kuralları" alt başlıkları verildi.
ruleset: tinaztepe-lee
version: 1
name: "İzmir Tınaztepe Üniversitesi · Lisansüstü Eğitim Enstitüsü"
source: "İzmir Tınaztepe Üniversitesi Lisansüstü Eğitim Enstitüsü Tez Yazım Kılavuzu, 2024"
institution: "İzmir Tınaztepe Üniversitesi"
source_url: https://tinaztepe.edu.tr/uploads/tez_yazim_kilavuzu/iztu-lee-tez-yazim-kilavuzu.docx

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # Kullanılacak Kâğıdın Niteliği "A4 boyutlarında (21 cm x 29.7 cm)"
  margins_cm: { top: 3.0, bottom: 3.0, left: 4.0, right: 2.5 }   # Kenar Boşlukları ve Sayfa Düzeni

fonts:
  allowed: [Times New Roman]    # Yazıların Niteliği

roles:
  body:
    size_pt: 12                 # Yazıların Niteliği "metin içeriği 12 punto"
    line_spacing: 1.5           # Yazıların Niteliği; Yazım Planı ve Satır Aralıkları
    alignment: justify          # Kenar Boşlukları ve Sayfa Düzeni "iki yana yaslı"
    first_line_indent_cm: 0     # Yazım Planı ve Satır Aralıkları "Paragraf için girinti yapılmaz"
    space_after_pt: 6           # Yazım Planı ve Satır Aralıkları "paragraflar arasında 6 nk"
  heading_1:
    size_pt: 14                 # Yazıların Niteliği, Yazım Planı ve Satır Aralıkları
    bold: true                  # Yazım Planı ve Satır Aralıkları "büyük koyu harflerle"
    all_caps: true              # Yazım Planı ve Satır Aralıkları
    alignment: center           # Yazım Planı ve Satır Aralıkları "ortaya hizalanarak"
    space_after_pt: 12          # Yazım Planı ve Satır Aralıkları "Ana başlıklardan sonra 12nk"
    page_break_before: true     # Yazım Planı ve Satır Aralıkları "Her ana başlık ayrı sayfadan başlamalı"
  heading_2:
    size_pt: 12                 # Yazım Planı ve Satır Aralıkları
    bold: true                  # Yazım Planı ve Satır Aralıkları
    case: title                 # Yazım Planı ve Satır Aralıkları "kelimelerin ilk harfleri büyük"
    alignment: left             # Yazım Planı ve Satır Aralıkları "sola yaslanarak"
    space_before_pt: 12         # Yazım Planı ve Satır Aralıkları "son satırı ile sonraki alt bölüm başlığı arasında 12 nk"
  heading_3:
    size_pt: 12                 # Yazım Planı ve Satır Aralıkları
    bold: true                  # Yazım Planı ve Satır Aralıkları
    case: title                 # Yazım Planı ve Satır Aralıkları
    alignment: left             # Yazım Planı ve Satır Aralıkları
    space_before_pt: 12         # Yazım Planı ve Satır Aralıkları
  figure_caption:
    size_pt: 10                 # Yazıların Niteliği "şekil, resim, tablo ve çizelge başlığı ... 10 punto"
    line_spacing: 1.0           # Yazım Planı ve Satır Aralıkları "açıklamaları ... 1 satır aralığı"
    alignment: justify          # Resimlemeler "satıra iki yana yaslı şekilde"
    position: below             # Resimlemeler "Şekil başlıkları şeklin altına"
  table_caption:
    size_pt: 10                 # Yazıların Niteliği
    line_spacing: 1.0           # Yazım Planı ve Satır Aralıkları
    alignment: justify          # Resimlemeler
    position: above             # Resimlemeler "Çizelge-Tablo başlıkları çizelge-tablo üstüne"
  block_quote:
    line_spacing: 1.0           # Yazım Planı ve Satır Aralıkları "alıntılar ... 1 satır aralığı"
  reference_entry:
    size_pt: 10                 # Yazıların Niteliği; Kaynaklar "10 punto"
    line_spacing: 1.0           # Yazıların Niteliği; Kaynaklar "1 satır aralığı"
  footnote:
    size_pt: 9                  # Yazıların Niteliği "tüm dipnotlar ise 9 punto"
    line_spacing: 1.0           # Yazım Planı ve Satır Aralıkları

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # Sayfa Numaraları
  position: bottom_center       # Sayfa Numaraları "sayfanın alt ortasına"
  forbid_decoration: true       # Sayfa Numaraları "parantez, çizgi gibi işaretler olmamalıdır"

document:
  forbid_tracked_changes: true
