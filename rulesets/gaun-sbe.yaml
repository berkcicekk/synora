# Gaziantep Üniversitesi Sosyal Bilimler Enstitüsü — Tez Yazım Kılavuzu (2026)
# Kaynak: https://sbe.gaziantep.edu.tr/upload/files/TEZ%20YAZIM%20KILAVUZU%202026(2).docx
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: gaun-sbe
version: 1
name: "Gaziantep Üniversitesi · Sosyal Bilimler Enstitüsü"
source: "Gaziantep Üniversitesi Sosyal Bilimler Enstitüsü Tez Yazım Kılavuzu, 2026"
institution: "Gaziantep Üniversitesi"
source_url: https://sbe.gaziantep.edu.tr/upload/files/TEZ%20YAZIM%20KILAVUZU%202026(2).docx

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # Bölüm 1, Kâğıt
  margins_cm: { top: 2.5, bottom: 2.5, left: 4.0, right: 2.5 }   # Kenar boşlukları "sol 4 cm, diğer kenarlarda 2.5 cm"

fonts:
  allowed: [Times New Roman]    # Yazı Karakteri ve Boyutu

roles:
  body:
    size_pt: 12                 # Yazı Karakteri ve Boyutu
    line_spacing: 1.5           # Satır Aralığı "diğer bölümleri 1.5"
    alignment: justify          # Hizalama "iki yana yaslı"
    first_line_indent_cm: 1.5   # "Paragraflar 1.5 cm içeriden başlamalı"
    space_before_pt: 6          # "önce 6nk"
    space_after_pt: 0           # "sonra 0nk"
  heading_1:
    bold: true                  # Başlık Düzeni, 1. derece "kalın"
    all_caps: true              # "harflerin hepsi büyük"
    alignment: center           # "ortalanmış"
    page_break_before: true     # Satır Aralığı Not: "ana bölümlerin daima yeni bir sayfa ile başlaması"
  heading_2:
    bold: true                  # Başlık Düzeni, 2. derece
    alignment: center           # "ortalanmış"
    case: title                 # "sözcüklerin ilk harfleri büyük"
  heading_3:
    bold: true                  # Başlık Düzeni, 3. derece
    alignment: left             # "sola yaslı"
    case: title                 # "sözcüklerin ilk harfleri büyük"
  table_caption:
    position: above             # Tablo ve şekiller "tablonun üstüne"
    size_pt: 12                 # Yazı Karakteri ve Boyutu "tabloların başlıkları 12 punto"
    italic: true                # "başlıklar italik yazılmalıdır"
    case: sentence              # "yalnızca ilk sözcüğün ilk harfi büyük"
  figure_caption:
    position: below             # "şeklin … numarası ve açıklaması altına"
    italic: true                # "başlıklar italik yazılmalıdır"
    case: sentence              # "yalnızca ilk sözcüğün ilk harfi büyük"
  table_cell:
    size_pt: 10                 # Yazı Karakteri ve Boyutu "tablo içi 10 punto"
  block_quote:
    size_pt: 10                 # Yazı Karakteri ve Boyutu; Alıntılar
    line_spacing: 1.0           # Satır Aralığı "bloklanmış alıntılar 1 satır aralığı"
    indent_left_cm: 2.0         # Alıntılar "satırbaşından 2 cm içeriden"
  footnote:
    size_pt: 10                 # Dipnotlar "metinden 2 karakter küçük"
    line_spacing: 1.0           # Satır Aralığı
  reference_entry:
    line_spacing: 1.0           # Satır Aralığı "kaynakların yazımında 1 satır aralığı"

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # Sayfa Numarası
  position: top_right           # "sağ üst köşeye, sağdan 2.5 cm içe"
  forbid_decoration: true       # "parantez, çizgi vb. işaretler kullanılmadan"

document:
  forbid_tracked_changes: true
