# İbn Haldun Üniversitesi — Tez/Proje Yazım Kılavuzu (İstanbul, 2026); lisansüstü programlar (Lisansüstü Eğitim Enstitüsü)
# Kaynak: https://fs.ihu.edu.tr/siteler/sgs.ihu.edu.tr/6244590c317c5/files/1-tr-ihu-tez-proje-yazim-kilavuzu-pdf.pdf
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: ihu-lee
version: 1
name: "İbn Haldun Üniversitesi · Lisansüstü Eğitim Enstitüsü"
source: "İbn Haldun Üniversitesi Tez/Proje Yazım Kılavuzu, 2026"
institution: "İbn Haldun Üniversitesi"
source_url: "https://fs.ihu.edu.tr/siteler/sgs.ihu.edu.tr/6244590c317c5/files/1-tr-ihu-tez-proje-yazim-kilavuzu-pdf.pdf"

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 2.1 "297 mm x 210 mm boyutunda, A4 kâğıdı"
  margins_cm: { top: 2.5, bottom: 2.5, left: 4.0, right: 2.5 }   # 2.2 "soldan 4 cm ... diğer üç taraftan 2,5 cm"

fonts:
  allowed: [Times New Roman]    # 2.3

roles:
  body:
    size_pt: 12                 # 2.3 "Times New Roman yazı tipi ve 12 punto"
    line_spacing: 1.5           # 2.4 "Satır aralığı 1,5 satır"
    alignment: justify          # 2.8 "iki yana yaslanmalıdır"
    first_line_indent_cm: 0     # 2.4 "Paragraf başında girinti yapılmaz"
    space_before_pt: 0          # 2.4 "aralık nk değeri ise 0"
    space_after_pt: 0           # 2.4 (paragraflar arasında bir boş satır bırakılır)
  heading_1:
    size_pt: 16                 # 3.2.1 "Bölüm başlığı 16 punto"
    bold: true                  # 3.2.1 "kalın harflerle"
    all_caps: true              # 3.2.1 "tümü büyük harf ile"
    line_spacing: 1.5           # 3.2.1 "bir buçuk satır aralığı ile"
    page_break_before: true     # 3.2.1 "Her bölüm yeni bir sayfadan başlamalıdır"
  table_caption:
    size_pt: 12                 # 3.3.2/ii "kalın harfle 12 punto"
    bold: true                  # 3.3.2/ii
    line_spacing: 1.5           # 2.4 "tablo/resim başlıkları bir buçuk satır aralığı"
    position: above             # 3.3.2/ii "tablonun en üst sınırının ... üstüne"
  figure_caption:
    size_pt: 12                 # 3.3.2/ii
    bold: true                  # 3.3.2/ii
    line_spacing: 1.5           # 2.4
    position: below             # 3.3.2/ii "şeklin en alt sınırının ... altına"
  block_quote:
    line_spacing: 1.0           # 3.5 "tek satır aralığı ile" — ÇELİŞKİ: 2.4 "blok alıntılar ... bir buçuk satır aralığı"
  footnote:
    line_spacing: 1.5           # 2.4 "dipnotlar ... bir buçuk satır aralığı"
  reference_entry:
    line_spacing: 1.5           # 2.4 "referanslar ... bir buçuk satır aralığı"

page_numbering:
  # 2.10: Öz ile Bölüm I arası küçük Roma (iv'ten görünür), Bölüm I'den itibaren Arap rakamı
  formats_in_order: [lowerRoman, decimal]
  position: bottom_right        # 2.10 "sayfanın sağ alt köşesinde"

document:
  forbid_tracked_changes: true
