# Eskişehir Osmangazi Üniversitesi Sağlık Bilimleri Enstitüsü — Tez Yazım Kılavuzu (Güncelleme Mart 2019)
# Kaynak: https://sbe.ogu.edu.tr/Storage/Sbe/Uploads/Sa%C4%9Fl%C4%B1kBilimleriEnstis%C3%BCs%C3%BCTezYaz%C4%B1mK%C4%B1lavuzu2019.pdf
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: esogu-sabe
version: 1
name: "Eskişehir Osmangazi Üniversitesi · Sağlık Bilimleri Enstitüsü"
source: "ESOGÜ Sağlık Bilimleri Enstitüsü Tez Yazım Kılavuzu, 2019"
institution: "Eskişehir Osmangazi Üniversitesi"
source_url: https://sbe.ogu.edu.tr/Storage/Sbe/Uploads/Sa%C4%9Fl%C4%B1kBilimleriEnstis%C3%BCs%C3%BCTezYaz%C4%B1mK%C4%B1lavuzu2019.pdf

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # Kağıt
  # Yazım/Sayfa düzeni: dört kenar 2,5 cm; ayrıca "Cilt payı sol kenardan 0,5 cm" (ayrı cilt payı, burada denetlenmez)
  margins_cm: { top: 2.5, bottom: 2.5, left: 2.5, right: 2.5 }

fonts:
  allowed: [Century Schoolbook] # Metin özellikleri "tüm bölümlerinde Century Schoolbook"

roles:
  body:
    size_pt: 12                 # Metin özellikleri
    line_spacing: 1.5           # Metin özellikleri
    alignment: justify          # Sayfa düzeni "sağ ve sol kenara yaslı"
    first_line_indent_cm: 1.0   # "Paragraf başlangıçları 1 cm içerden"
    space_before_pt: 6          # "paragraf öncesi ve sonrası 6 nk"
    space_after_pt: 6           # "paragraf öncesi ve sonrası 6 nk"
  heading_1:
    size_pt: 14                 # Yazım, birinci derece
    bold: true                  # Yazım
    all_caps: true              # "büyük harf ile"
    alignment: justify          # Sayfa düzeni "Tez metni ve başlıklar sağ ve sol kenara yaslı"
    page_break_before: true     # "Bölümler daima yeni bir sayfa ile başlamalıdır"
  heading_2:
    size_pt: 14                 # Yazım, ikinci derece
    bold: true                  # Yazım
    alignment: justify          # Sayfa düzeni
    case: title                 # "her kelimenin ilk harfi büyük"
  heading_3:
    size_pt: 12                 # Yazım, üçüncü ve ileri derece
    bold: true                  # Yazım
    italic: true                # Yazım
    alignment: justify          # Sayfa düzeni
    case: sentence              # "birinci kelimenin ilk harfi büyük"
  table_caption:
    position: above             # Tablo ve Şekiller "tablonun üstüne"
    alignment: center           # Sayfa düzeni "Tablo ve şekil açıklamaları ise ortalı"
  figure_caption:
    position: below             # Tablo ve Şekiller "şekil altına"
    alignment: center           # Sayfa düzeni
  footnote:
    size_pt: 10                 # Dipnotlar

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # Sayfa Numaraları
  position: bottom_center       # "alt kenarında ortaya gelecek şekilde"
  forbid_decoration: true       # "parantez veya çizgi gibi işaretler kullanılmamalıdır"

document:
  forbid_tracked_changes: true
