# Isparta Uygulamalı Bilimler Üniversitesi Lisansüstü Eğitim Enstitüsü — Tez Yazım Kılavuzu (Mayıs 2024)
# Kaynak: https://lisansustu.isparta.edu.tr/assets/uploads/sites/413/files/tez-yazim-kilavuzu-16052024.pdf
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: isubu-lee
version: 1
name: "Isparta Uygulamalı Bilimler Üniversitesi · Lisansüstü Eğitim Enstitüsü"
source: "ISUBÜ Lisansüstü Eğitim Enstitüsü Tez Yazım Kılavuzu, 2024"
institution: "Isparta Uygulamalı Bilimler Üniversitesi"
source_url: https://lisansustu.isparta.edu.tr/assets/uploads/sites/413/files/tez-yazim-kilavuzu-16052024.pdf

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 2.1
  margins_cm: { top: 2.5, bottom: 2.5, left: 4.0, right: 2.5 }   # 2.2

fonts:
  allowed: [Times New Roman]    # 2.3

roles:
  body:
    size_pt: 12                 # 2.3
    line_spacing: 1.5           # 2.4 ana metin "1.5 (BİR BUÇUK) SATIR ARALIĞI"
    alignment: justify          # 2.3 "paragraflar iki yana yaslı"
    first_line_indent_cm: 0     # 2.4 "Paragraf başları GİRİNTİSİZ"
    space_before_pt: 0          # 2.4 "önce ve sonra gelen aralık değeri … 0 nk"
    space_after_pt: 0           # 2.4
  heading_1:
    bold: true                  # 2.3, 2.6
    all_caps: true              # 2.6 "TAMAMI BÜYÜK HARF"
    alignment: justify          # 2.3 "Bölüm ve alt bölüm başlıkları … iki yana yaslı"
    space_before_pt: 0          # 2.4
    space_after_pt: 0           # 2.4
    page_break_before: true     # 2.4 "Ana bölümler daima YENİ BİR SAYFA İLE"
  heading_2:
    bold: true                  # 2.6
    case: title                 # 2.6 "Kelimelerin İlk Harfi Büyük"
    alignment: justify          # 2.3
    space_before_pt: 0          # 2.4
    space_after_pt: 0           # 2.4
  heading_3:
    bold: true                  # 2.6
    case: sentence              # 2.6 "İlk kelimenin ilk harfi büyük, diğerleri küçük"
    alignment: justify          # 2.3
    space_before_pt: 0          # 2.4
    space_after_pt: 0           # 2.4
  table_caption:
    position: above             # 2.7 "çizelge isimleri, çizelgenin ÜSTÜNE"
    case: sentence              # 2.7 "cümlenin ilk harfi BÜYÜK diğer harfler küçük"
    line_spacing: 1.0           # 2.4, 2.7
    # 2.7 hizalama: tek satırsa ortalı, çok satırsa iki yana yaslı → denetlenmez
  figure_caption:
    position: below             # 2.7 "Şekil isimleri, şeklin ALTINA"
    case: sentence              # 2.7
    line_spacing: 1.0           # 2.4, 2.7
  table_cell:
    line_spacing: 1.0           # 2.4 "çizelgeler içindeki metinler"
  footnote:
    size_pt: 10                 # 2.3 "yazı karakterinden 2 punto küçük"
    line_spacing: 1.0           # 2.4
  reference_entry:
    line_spacing: 1.0           # 2.4 "kaynaklar … 1 (BİR) SATIR ARALIĞI"

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # 2.5
  position: bottom_center       # 2.5 "SAYFA SONUNDA ORTALI"
  forbid_decoration: true       # 2.5 "parantez veya çizgi gibi işaretler konulmamalıdır"

document:
  forbid_tracked_changes: true
