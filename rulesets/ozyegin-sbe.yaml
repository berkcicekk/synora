# Özyeğin Üniversitesi Sosyal Bilimler Enstitüsü — Thesis and Dissertation Preparation Guidelines (January 2026)
# Kaynak: https://www.ozyegin.edu.tr/sites/default/files/upload/Mimarlik/thesis_and_dissertation_preparation_guidelines-sbe-revize_2026.docx
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: ozyegin-sbe
version: 1
name: "Özyeğin Üniversitesi · Sosyal Bilimler Enstitüsü"
source: "Thesis and Dissertation Preparation Guidelines, Graduate School of Social Sciences, 2026"
institution: "Özyeğin Üniversitesi"
source_url: https://www.ozyegin.edu.tr/sites/default/files/upload/Mimarlik/thesis_and_dissertation_preparation_guidelines-sbe-revize_2026.docx

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 4.1 "Standard A4 paper: 21,0 x 29,7 cm"
  margins_cm: { top: 3.5, bottom: 2.5, left: 3.5, right: 2.5 }   # 1.1 (dikey sayfalar)

fonts:
  allowed: [Times New Roman]    # 1.2 "Times New Roman should be used throughout"

roles:
  body:
    size_pt: 12                 # Table 1.2.1 "The main text 12 pt."
    line_spacing: 2.0           # Table 1.2.1 "Double-spaced, justified"
    alignment: justify          # Table 1.2.1, 1.4
    first_line_indent_cm: 1.25  # 1.6 "indented 1 tab (1.25 cm)"
    space_after_pt: 0           # 1.3 "Do not leave extra spacing between paragraphs"
  heading_1:
    size_pt: 12                 # Table 1.7.1
    bold: true                  # Table 1.7.1
    all_caps: true              # Table 1.7.1 "uppercase"
    alignment: center           # Table 1.7.1, 1.4
    line_spacing: 2.0           # Table 1.7.1 "double-spaced"
    space_after_pt: 12          # Table 1.7.1 "12 pt. space between the heading and the text"
    page_break_before: true     # 3.4 "Each chapter ... begins on a new page"
  heading_2:
    size_pt: 12                 # Table 1.7.1
    bold: true                  # Table 1.7.1
    alignment: left             # Table 1.7.1
    line_spacing: 2.0           # Table 1.7.1
    case: title                 # Table 1.7.1 "title case"
    space_before_pt: 12         # Table 1.7.1
    space_after_pt: 0           # Table 1.7.1 "no extra space after the heading"
  heading_3:
    size_pt: 12                 # Table 1.7.1
    bold: true                  # Table 1.7.1
    italic: true                # Table 1.7.1
    alignment: left             # Table 1.7.1
    line_spacing: 2.0           # Table 1.7.1
    case: title                 # Table 1.7.1
    space_before_pt: 12         # Table 1.7.1
    space_after_pt: 0           # Table 1.7.1
  figure_caption:
    size_pt: 12                 # 2.1 "Titles and captions should be 12 pt."
    italic: true                # 2.1
    bold: false                 # 2.1 "titles and captions are not bold"
    alignment: left             # 2.1, 1.4
    line_spacing: 2.0           # 2.1 "double-spaced"
    case: title                 # 2.1 "title case"
    space_before_pt: 12         # Table 1.2.1 "12 pt. space before a table title and figure caption"
  table_caption:
    size_pt: 12                 # 2.1
    italic: true                # 2.1
    bold: false                 # 2.1
    alignment: left             # 2.1, 1.4
    line_spacing: 2.0           # 2.1
    case: title                 # 2.1
    space_before_pt: 12         # Table 1.2.1
  reference_entry:
    size_pt: 12                 # Table 1.2.1 "References list 12 pt."
    line_spacing: 2.0           # Table 1.2.1 "Double-spaced, left-aligned"
    alignment: left             # Table 1.2.1
  footnote:
    size_pt: 10                 # Table 1.2.1 "Footnotes ... 10 pt."
    line_spacing: 1.0           # Table 1.2.1 "Single-spaced, justified"
    alignment: justify          # Table 1.2.1, 1.4

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # 1.5
  position: bottom_center       # 1.5 "at the bottom and the center of the page"

document:
  forbid_tracked_changes: true
