# Polis Akademisi Güvenlik Bilimleri Enstitüsü — Tez Yazım Kılavuzu Şekilsel Özellikleri (Ankara 2026, Word belgesi)
# Kaynak: https://gbe.pa.edu.tr/Upload/editor/files/Tez%20Yaz%C4%B1m%20K%C4%B1lavuzu%20%C5%9Eekilsel%20%C3%96zellikleri(1).docx
# Sayfa: https://gbe.pa.edu.tr/tez-yazim-kilavuzu.html (Trafik ve Adli Bilimler enstitülerinin ayrı kılavuzlarına bakılmadı)
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: pa-gbe
version: 1
name: "Polis Akademisi · Güvenlik Bilimleri Enstitüsü"
source: "Polis Akademisi GBE Tez Yazım Kılavuzu, 2026"
institution: "Polis Akademisi"
source_url: https://gbe.pa.edu.tr/Upload/editor/files/Tez%20Yaz%C4%B1m%20K%C4%B1lavuzu%20%C5%9Eekilsel%20%C3%96zellikleri(1).docx

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 1.1 "A4 (210 x 297 mm)"
  margins_cm: { top: 3.0, bottom: 3.0, left: 4.0, right: 2.5 }   # 1.2 Kenar Boşlukları

fonts:
  allowed: [Times New Roman]    # 1.2 "Times New Roman, 12 punto"

roles:
  body:
    size_pt: 12                 # 1.2
    line_spacing: 1.5           # 1.2 "Satır Aralıkları: 1,5"
    alignment: justify          # 1.2 "İki yana yaslanmış (Justified)"
    first_line_indent_cm: 1.25  # 1.2 "Paragraf Girintisi: 1,25" (başlıktan sonraki ilk paragraf hariç)
    space_after_pt: 6           # 1.2 "Başlıklar ve paragraflardan sonra ayrıca yarım (6nk) boşluk"
  heading_1:
    # Bölüm başlığı
    size_pt: 14                 # 1.3 "Bölüm başlığı ... 14 punto"
    bold: true                  # 1.3 "BÜYÜK HARFLERLE ve KOYU (BOLD)"
    all_caps: true              # 1.3
    alignment: left             # 1.2 "Başlıklar: En sol baştan"
    space_after_pt: 6           # 1.2
  heading_2:
    # Birinci derece alt başlık
    bold: true                  # 1.3 "BÜYÜK HARFLERLE ve KOYU (BOLD)"
    all_caps: true              # 1.3
    alignment: left             # 1.2
    space_after_pt: 6           # 1.2
  heading_3:
    # İkinci derece alt başlık
    bold: true                  # 1.3 "Koyu (Bold) ve İlk Harfleri Büyük"
    case: title                 # 1.3
    alignment: left             # 1.2
    space_after_pt: 6           # 1.2
  block_quote:
    line_spacing: 1.0           # 1.2 "doğrudan alıntılarda 1,0"
  footnote:
    size_pt: 10                 # 1.5.1 "Times New Roman 10 punto"
    line_spacing: 1.0           # 1.2 "Dipnotlarda ... 1,0"
  table_caption:
    size_pt: 12                 # 1.7 "Tablo başlığı ... tezin puntosu ile aynı"
    bold: false                 # 1.7 "koyu (bold) olmadan" (Tablo kelimesi ve numarası koyu)
    case: title                 # 1.7 "her kelimenin ilk harfi büyük"
    position: above             # 1.7 "tablonun bir aralık üstünde"
  figure_caption:
    size_pt: 12                 # 1.7 "Genel kurallar tablo ile aynıdır"
    bold: false                 # 1.7
    case: title                 # 1.7
    position: above             # 1.7 "Şekil numarası ve başlığı, şeklin üstünde"
  # Kaynakça: ikinci satır 1,25 cm asılı (madde 11) — şemada karşılığı yok

page_numbering:
  formats_in_order: [upperRoman, decimal]   # 1.6 "büyük harf Romen rakamları" / Giriş'ten 1, 2, 3
  position: bottom_right        # 1.2, 1.6 "sağ alt köşe"

document:
  forbid_tracked_changes: true
