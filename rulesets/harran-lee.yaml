# Harran Üniversitesi — Web Tabanlı Tez Yazım Yönergesi (Lisansüstü Eğitim Enstitüsü sitesinde yayımlanan HTML metin; tarih belirtilmemiş)
# Kaynak: https://www.harran.edu.tr/akademik/enstituler/lisansustu-egitim-enstitusu/baglantilar/tez-yazim-yonergesi
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: harran-lee
version: 1
name: "Harran Üniversitesi · Lisansüstü Eğitim Enstitüsü"
source: "Harran Üniversitesi Web Tabanlı Tez Yazım Yönergesi, tarihsiz (erişim 2026)"
institution: "Harran Üniversitesi"
source_url: https://www.harran.edu.tr/akademik/enstituler/lisansustu-egitim-enstitusu/baglantilar/tez-yazim-yonergesi

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # Madde 33 "beyaz A4 boyutlu (210x297) kâğıtlar"
  orientation: portrait         # Madde 14 "dikey yönlendirme yapılmalıdır"
  margins_cm: { top: 3.0, bottom: 3.0, left: 4.0, right: 2.5 }   # Madde 14 sol 4 cm, alt ve üst 3 cm, sağ 2,5 cm

fonts:
  allowed: [Times New Roman]    # Madde 15

roles:
  body:
    size_pt: 12                 # Madde 15 "12 punto"
    line_spacing: 1.5           # Madde 17 "satır aralığı 1,5"
    alignment: justify          # Madde 17 "iki yana yaslı"
    first_line_indent_cm: 1.25  # Madde 17 "bir sekme (1,25 cm) içeriden"
    space_before_pt: 0          # Madde 17 "öncesinde 0nk"
    space_after_pt: 6           # Madde 17 "sonrasında 6nk"
  heading_1:
    size_pt: 12                 # Madde 18
    bold: true                  # Madde 18 "kalın"
    all_caps: true              # Madde 18 "büyük harf"
    alignment: left             # Madde 18 "sola yaslı" — ÇELİŞKİ: aynı maddede bölüm adı "büyük harflerle ve ortalanarak yazılır"
    line_spacing: 1.5           # Madde 18
    space_before_pt: 0          # Madde 18 "önce 0nk"
    space_after_pt: 6           # Madde 18 "sonra 6nk"
    page_break_before: true     # Madde 18 "her yeni bölüm, yeni bir sayfadan başlamalıdır"
  heading_2:
    size_pt: 12                 # Madde 18
    bold: true                  # Madde 18
    case: title                 # Madde 18 "kelimelerin ilk harfi büyük"
    alignment: left             # Madde 18
    line_spacing: 1.5           # Madde 18
    space_before_pt: 0          # Madde 18
    space_after_pt: 6           # Madde 18
  heading_3:
    size_pt: 12                 # Madde 18
    bold: true                  # Madde 18
    italic: true                # Madde 18 "eğik"
    case: title                 # Madde 18
    alignment: left             # Madde 18
    line_spacing: 1.5           # Madde 18
    space_before_pt: 0          # Madde 18
    space_after_pt: 6           # Madde 18
  reference_entry:
    size_pt: 12                 # Madde 31 "yazı boyutu 12 punto"
    line_spacing: 1.0           # Madde 31 "satır arası boşluk 1,0"
  footnote:
    size_pt: 10                 # Madde 30 "büyüklüğü 10 punto"
    line_spacing: 1.0           # Madde 30 "bir satır aralıklı"

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # Madde 16 Giriş'e kadar küçük Romen, Giriş'ten itibaren 1, 2, 3
  position: bottom_center       # Madde 16 "sayfa altına ortalanarak"

document:
  forbid_tracked_changes: true
