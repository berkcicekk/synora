# Zonguldak Bülent Ecevit Üniversitesi Sosyal Bilimler Enstitüsü — Tez Yazım ve Basım Yönergesi (Senato 07.03.2025, 2025/08-11)
# Kaynak: https://cdn3.beun.edu.tr/sbe/0a21dcbf2899d483e05005bc1e3005b8/205545.pdf
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: zbeu-sbe
version: 1
name: "ZBEÜ · Sosyal Bilimler Enstitüsü"
source: "ZBEÜ Sosyal Bilimler Enstitüsü Tez Yazım ve Basım Yönergesi, 2025"
institution: "Zonguldak Bülent Ecevit Üniversitesi"
source_url: https://cdn3.beun.edu.tr/sbe/0a21dcbf2899d483e05005bc1e3005b8/205545.pdf

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # Madde 5(1) "A4 (21x29,7 cm)"
  margins_cm: { top: 2.5, bottom: 2.5, left: 3.5, right: 3.5 }   # Madde 6(2) sol ve sağ 3,5 cm, üst ve alt 2,5 cm

fonts:
  allowed: [Times New Roman]    # Madde 9(1)

roles:
  body:
    size_pt: 12                 # Madde 9(2)
    line_spacing: 1.5           # Madde 6(4)
    alignment: justify          # Madde 6(6) "iki yana yaslı"
    first_line_indent_cm: 1.0   # Madde 6(5) "ilk satırları 1 cm içerden"
    space_before_pt: 12         # Madde 6(5) "paragraf öncesi ve paragraf sonrası 12nk"
    space_after_pt: 12          # Madde 6(5)
  heading_1:
    size_pt: 14                 # Madde 8(2), 9(2)
    bold: true                  # Madde 8(2)
    all_caps: true              # Madde 8(2) "tamamı büyük harfle"
    alignment: center           # Madde 8(4) "birinci düzey başlıklar ortalı"
    line_spacing: 1.0           # Madde 8(4) "başlık satırları arası tek satır aralığı"
    space_before_pt: 12         # Madde 8(3)
    space_after_pt: 18          # Madde 8(3)
    page_break_before: true     # Madde 6(4) "ana bölümleri yeni bir sayfada başlatılır"
  heading_2:
    size_pt: 12                 # Madde 8(2)
    bold: true                  # Madde 8(2)
    case: title                 # Madde 8(2) "baş harfleri büyük"
    alignment: justify          # Madde 8(4) "iki yana yaslı"
    line_spacing: 1.0           # Madde 8(4)
    space_before_pt: 12         # Madde 8(3)
    space_after_pt: 6           # Madde 8(3)
  heading_3:
    size_pt: 12                 # Madde 8(2)
    bold: true                  # Madde 8(2)
    case: title                 # Madde 8(2)
    alignment: justify          # Madde 8(4)
    line_spacing: 1.0           # Madde 8(4)
    space_before_pt: 12         # Madde 8(3)
    space_after_pt: 6           # Madde 8(3)
  figure_caption:
    size_pt: 12                 # Madde 9(2), 9(3) "12 punto kalın"
    bold: true                  # Madde 9(3)
    alignment: justify          # Madde 9(3) "iki yana yaslı"
    line_spacing: 1.0           # Madde 6(4) "başlıkları ... tek aralıklı"
    space_before_pt: 12         # Madde 8(5)
    space_after_pt: 6           # Madde 8(5)
    position: above             # Madde 8(5) "başlıklar tablo, şekil ve grafiklerden önce verilir"
  table_caption:
    size_pt: 12                 # Madde 9(2), 9(3)
    bold: true                  # Madde 9(3)
    alignment: justify          # Madde 9(3)
    line_spacing: 1.0           # Madde 6(4)
    space_before_pt: 12         # Madde 8(5)
    space_after_pt: 6           # Madde 8(5)
    position: above             # Madde 8(5)
  block_quote:
    size_pt: 10                 # Madde 23(7) "10 punto"
    italic: true                # Madde 23(7) "italik olacak biçimde"
    line_spacing: 1.0           # Madde 23(7) "tek satır aralıklı"
    indent_left_cm: 1.0         # Madde 23(7) "sağdan ve soldan 1 er cm girinti"
  reference_entry:
    size_pt: 12                 # Madde 25(1)
    line_spacing: 1.0           # Madde 25(1) "tek satır aralıklı"
    first_line_indent_cm: -1.0  # Madde 25(1) "soldan 1 cm asılı"
    space_before_pt: 12         # Madde 25(1) "paragraflar öncesi ve sonrası 12 nk"
    space_after_pt: 12          # Madde 25(1)
  footnote:
    size_pt: 10                 # Madde 9(2), 24(1)
    line_spacing: 1.0           # Madde 6(4)
    alignment: justify          # Madde 24(1) "iki yana yaslı"
    first_line_indent_cm: 0     # Madde 24(1) "paragraf başı yapılmadan"
    space_before_pt: 0          # Madde 24(1)
    space_after_pt: 3           # Madde 24(1)

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # Madde 7(1) ön kısım küçük Romen, girişten itibaren Batı-Arap
  position: bottom_center       # Madde 7(2), 7(3) "sayfanın alt orta kısmına"
  forbid_decoration: true       # Madde 7(3) "parantez, çizgi vb. kullanılmadan"

document:
  forbid_tracked_changes: true
