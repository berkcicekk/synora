# Erzincan Binali Yıldırım Üniversitesi Sosyal Bilimler Enstitüsü — Tez Yazım Kılavuzu (03.04.2023 sürümü)
# Kaynak: https://sosyalbilimler.ebyu.edu.tr/wp-content/uploads/2026/07/Tez-Yazim-Kilavuzu-03.04.2023.docx
# (bağlantı sayfası: https://sosyalbilimler.ebyu.edu.tr/tez-sureci/)
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
# Not: Ana bölüm başlığı içeren sayfalarda üst boşluk 7 cm'dir (1.4); burada genel 3 cm değeri denetlenir.
ruleset: ebyu-sbe
version: 1
name: "Erzincan Binali Yıldırım Üniversitesi · Sosyal Bilimler Enstitüsü"
source: "EBYÜ Sosyal Bilimler Enstitüsü Tez Yazım Kılavuzu, 2023"
institution: "Erzincan Binali Yıldırım Üniversitesi"
source_url: https://sosyalbilimler.ebyu.edu.tr/wp-content/uploads/2026/07/Tez-Yazim-Kilavuzu-03.04.2023.docx

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 1.3 "A4 boyutunda (210 x 297 mm)"
  margins_cm: { top: 3.0, bottom: 3.0, left: 3.0, right: 3.0 }  # 1.4 "Sayfanın tüm kenarlarından 3'er cm"

fonts:
  allowed: [Times New Roman]    # 1.5 "Times New Roman yazı tipi"

roles:
  body:
    size_pt: 12                 # 1.5 "12 punto"
    line_spacing: 1.5           # 1.5 "Metin 1,5 satır aralıklı"
    alignment: justify          # 1.5 "iki yana yaslanmalıdır"
    first_line_indent_cm: 1.25  # 1.5 "paragrafın ilk satırında 1,25 cm girinti"
    space_before_pt: 6          # 1.5 "metin içinde önce 6 nk"
    space_after_pt: 6           # 1.5 "sonra 6 nk"
  heading_1:
    size_pt: 14                 # 1.5 "Bölüm başlıkları ... 14 punto"
    bold: true                  # 1.5 "koyu"
    all_caps: true              # 1.5 "tamamı büyük harflerle"
    alignment: center           # 1.5 "ortalı"
    page_break_before: true     # 1.6 "her bir bölüm ... yeni bir sayfada başlamalıdır"
  heading_2:
    size_pt: 12                 # 1.5 "Ana başlıklar ve alt başlıklar ... 12 punto"
    bold: true                  # 1.5 "koyu"
    case: title                 # 1.5 "her kelimesinin ilk harfi büyük"
    space_before_pt: 6          # 1.5 "başlıklarda ... önce 6 nk"
    space_after_pt: 6           # 1.5 "sonra 6 nk"
  heading_3:
    size_pt: 12                 # 1.5
    bold: true                  # 1.5
    case: title                 # 1.5
    space_before_pt: 6          # 1.5
    space_after_pt: 6           # 1.5
  figure_caption:
    size_pt: 12                 # 1.7 "başlıkları Times New Roman yazı tipinde ve 12 punto"
    alignment: center           # 1.7 "Şekiller, tablolar ve açıklamaları sayfaya ortalanarak"
    case: title                 # 1.7 "her kelimenin ilk harfi büyük"
    line_spacing: 1.0           # 1.5 "şekil altı ... 1 satır aralıklı"
    space_before_pt: 0          # 1.5 "şekil altı ve tablo açıklamalarında ise önce 0 nk"
    space_after_pt: 0           # 1.5 "sonra 0 nk"
    position: below             # 1.5 "şekil altı"; Şekiller Listesi "alt yazı"
  table_caption:
    size_pt: 12                 # 1.7
    alignment: center           # 1.7
    case: title                 # 1.7
    line_spacing: 1.0           # 1.5 "tabloların açıklamaları ise 1 satır aralıklı"
    space_before_pt: 0          # 1.5
    space_after_pt: 0           # 1.5
    position: above             # Tablolar Listesi "tabloların numara, üst yazı"
  block_quote:
    size_pt: 11                 # 1.8 "11 punto"
    italic: true                # 1.8 "Alıntı italik yazılmalı"
    indent_left_cm: 1.25        # 1.8 "her iki kenardan 1,25 cm içeride"
  reference_entry:
    size_pt: 12                 # 1.5 "Tezin tüm metni (kaynakça dâhil) ... 12 punto"
    alignment: justify          # 1.5
    space_before_pt: 3          # 1.5 "kaynakçada önce 3 nk"
    space_after_pt: 3           # 1.5 "sonra 3 nk"
  footnote:
    size_pt: 10                 # 1.5 "Dipnotlar ... 10 punto"
    alignment: justify          # 1.5 "iki yana yaslanmalıdır"
    line_spacing: 1.0           # 1.5, Dipnotlar "satır aralığı tek"
    space_before_pt: 0          # Dipnotlar "aralık önce 0nk"
    space_after_pt: 0           # Dipnotlar "sonra 0nk"

page_numbering:
  # 1.6: ön kısım küçük Roma (i, ii, iii…), Giriş'ten sona kadar 1, 2, 3…
  formats_in_order: [lowerRoman, decimal]
  position: bottom_center       # 1.6 "sayfanın altına ... ortalanarak"
  forbid_decoration: true       # 1.6 "parantez, çizgi vb. işaretler kullanılmadan"

document:
  forbid_tracked_changes: true
