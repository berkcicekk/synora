# Fırat Üniversitesi Sağlık Bilimleri Enstitüsü — Tez Yazım Kılavuzu (Ocak 2024)
# Kaynak: https://saglik.firat.edu.tr/subdomain_files/saglik.firat.edu.tr/files/143/tez%20yaz%C4%B1m%20klavuzu/1_FU_SBE_Tez-Yazim-Kilavuzu.pdf
# (bağlantı sayfası: https://saglik.firat.edu.tr/tr/page/2772)
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: firat-sabe
version: 1
name: "Fırat Üniversitesi · Sağlık Bilimleri Enstitüsü"
source: "Fırat Üniversitesi Sağlık Bilimleri Enstitüsü Tez Yazım Kılavuzu, 2024"
institution: "Fırat Üniversitesi"
source_url: https://saglik.firat.edu.tr/subdomain_files/saglik.firat.edu.tr/files/143/tez%20yaz%C4%B1m%20klavuzu/1_FU_SBE_Tez-Yazim-Kilavuzu.pdf

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 3. "A4 boyutunda (en 210 mm boy 297 mm)"
  margins_cm: { top: 2.5, bottom: 2.5, left: 3.5, right: 2.5 }  # 4.3 "Sol kenar 3.5 cm, diğer üç kenar 2.5 cm"

fonts:
  allowed: [Times New Roman]    # 4.1 "tüm yazılar Times New Roman"

roles:
  body:
    size_pt: 12                 # 4.1 "12-punto"
    line_spacing: 2.0           # 4.2 "çift aralık (2.0)"
    alignment: justify          # 4.3, 4.5 "İki Yana Yasla"
    first_line_indent_cm: 1.225 # 4.5 "1.225 cm (≈0.5 inç)"
    space_after_pt: 6           # 4.5 "Paragraflar arasında 6 nk boşluk"
  heading_1:
    bold: true                  # 5. Seviye 1 "KOYU"
    all_caps: true              # 5. "büyük harfle"
    alignment: center           # 5. "ortalanmış"
    page_break_before: true     # 5. "her bölüm yeni ayrı bir sayfada başlamalıdır"
  heading_2:
    bold: true                  # 5. Seviye 2 "Koyu"
    case: title                 # 5. Seviye 2 "İlk Harfler Büyük"
    alignment: left             # 5. Seviye 2 "Sola Dayalı"
  heading_3:
    bold: true                  # 5. Seviye 3 "Koyu"
    italic: true                # 5. Seviye 3 "İtalik"
    case: title                 # 5. Seviye 3 "İlk Harfler Büyük"
    alignment: left             # 5. Seviye 3 "Sola Dayalı"
  figure_caption:
    case: sentence              # Şekiller/Tablolar bölümü "ilk kelimeden sonraki tüm kelimeler küçük"
    space_before_pt: 3          # 4.2, Şekiller/Tablolar bölümü "şekil altlığı ile şekil arasında 3 nk"
    position: below             # Şekiller/Tablolar bölümü "Şeklin altındaki satırda"
  table_caption:
    space_after_pt: 3           # 4.2, Şekiller/Tablolar bölümü "Tablo başlığı ile tablo üst çizgisi arasında 3 nk"
    position: above             # Şekiller/Tablolar bölümü "Tablonun üzerindeki satırda"
  reference_entry:
    size_pt: 10                 # 4.1 "Kaynaklar listesinde ... 10 punto"
    # 4.2 "1.5 satır aralığında yazılabilir" (zorunlu değil) → satır aralığı denetlenmez

page_numbering:
  # 4.6: öncül sayfalar küçük Romen (i, ii…), Giriş'ten itibaren Arap rakamı
  formats_in_order: [lowerRoman, decimal]
  position: bottom_center       # 4.6 "her sayfanın altında, ortada"
  forbid_decoration: true       # 4.6 "ayraç, çizgi gibi işaretler kullanılmamalıdır"

document:
  forbid_tracked_changes: true
