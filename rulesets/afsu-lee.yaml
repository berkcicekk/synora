# Afyonkarahisar Sağlık Bilimleri Üniversitesi Lisansüstü Eğitim Enstitüsü — Tez Yazım Kılavuzu (Şubat 2026, Word belgesi)
# Kaynak: https://legens.afsu.edu.tr/wp-content/uploads/sites/18/2026/06/Tez-Yazim-Kilavuzu-1.docx
# Duyuru: https://legens.afsu.edu.tr/2026/02/10/guncel-tez-yazim-kilavuzumuz-hakkinda/ (16.02.2026'dan itibaren geçerli)
# Madde numarası yok; yorumlar bölüm 2'nin alt başlıklarını anar.
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: afsu-lee
version: 1
name: "Afyonkarahisar Sağlık Bilimleri Üniversitesi · Lisansüstü Eğitim Enstitüsü"
source: "AFSÜ LEE Tez Yazım Kılavuzu, 2026"
institution: "Afyonkarahisar Sağlık Bilimleri Üniversitesi"
source_url: https://legens.afsu.edu.tr/wp-content/uploads/sites/18/2026/06/Tez-Yazim-Kilavuzu-1.docx

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  margins_cm: { top: 2.5, bottom: 2.5, left: 4.0, right: 2.5 }   # 2 Sayfa Düzeni

fonts:
  allowed: [Times New Roman]    # 2 Yazım Şekli ve Karakteri

roles:
  body:
    size_pt: 12                 # 2 Yazım Şekli "12 punto"
    line_spacing: 1.5           # 2 Yazım Şekli "1,5 satır aralığı"
    alignment: justify          # 2 Sayfa Düzeni "iki yana yasla"
    first_line_indent_cm: 0     # 2 Yazım Şekli "Paragraf girintisi yapılmamalıdır"
    space_before_pt: 6          # 2 Yazım Şekli "paragraf öncesi ve sonrası 6 nk"
    space_after_pt: 6           # 2 Yazım Şekli
  heading_1:
    size_pt: 14                 # 2 Bölüm Başlıkları "büyük harf, kalın (bold), 14 punto ve sayfa ortasında"
    bold: true                  # 2 Bölüm Başlıkları
    all_caps: true              # 2 Bölüm Başlıkları
    alignment: center           # 2 Bölüm Başlıkları "sayfa ortasında"
    page_break_before: true     # 2 Bölüm Başlıkları "Bütün ana bölümler yeni bir sayfadan"
  heading_2:
    size_pt: 14                 # 2 Bölüm Başlıkları "14 punto ve kalın, sola dayalı"
    bold: true                  # 2 Bölüm Başlıkları
    case: title                 # 2 Bölüm Başlıkları "her kelimenin ilk harfi büyük"
    alignment: left             # 2 Bölüm Başlıkları
  heading_3:
    size_pt: 12                 # 2 Bölüm Başlıkları "kalın olarak 12 punto"
    bold: true                  # 2 Bölüm Başlıkları
    case: sentence              # 2 Bölüm Başlıkları "birinci kelimenin ilk harfi büyük"
    alignment: left             # 2 Bölüm Başlıkları
  table_caption:
    size_pt: 12                 # 2 Tablo ve Şekiller "Tablo ve şekil başlıkları 12 punto"
    alignment: left             # 2 Tablo ve Şekiller "tablonun üstüne sol tarafa yaslanmış" — ÇELİŞKİ: Sayfa Düzeni "tablo ve şekil açıklamaları iki yana yasla"
    position: above             # 2 Tablo ve Şekiller
  figure_caption:
    size_pt: 12                 # 2 Tablo ve Şekiller
    alignment: center           # 2 Tablo ve Şekiller "şeklin altına ve ortalanmış" — ÇELİŞKİ: Sayfa Düzeni "iki yana yasla"
    position: below             # 2 Tablo ve Şekiller
  reference_entry:
    size_pt: 10                 # 2 Yazım Şekli "KAYNAKLAR'ın yazımında 10 punto"
    line_spacing: 1.0           # 2 Yazım Şekli "tek satır aralığı"
  footnote:
    size_pt: 10                 # Kontrol listesi "Dipnot harf büyüklüğü 10 punto"

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # 2 Sayfaların Numaralandırılması
  position: bottom_right        # 2 Sayfa Düzeni "sağ alt köşede"

document:
  forbid_tracked_changes: true
