# Gaziantep İslam Bilim ve Teknoloji Üniversitesi Lisansüstü Eğitim Enstitüsü — Tez Yazım Kılavuzu (Gaziantep 2020)
# Kaynak: https://www.gibtu.edu.tr/Medya/Birim/Dosya/20260728112040_a67c0cc3.pdf
# (Enstitü sayfası: https://www.gibtu.edu.tr/lisansustu/icerik/33919/tez-yazim-kilavuzu)
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: gibtu-lee
version: 1
name: "Gaziantep İslam Bilim ve Teknoloji Üniversitesi · Lisansüstü Eğitim Enstitüsü"
source: "GİBTÜ Lisansüstü Eğitim Enstitüsü Tez Yazım Kılavuzu, 2020"
institution: "Gaziantep İslam Bilim ve Teknoloji Üniversitesi"
source_url: https://www.gibtu.edu.tr/Medya/Birim/Dosya/20260728112040_a67c0cc3.pdf

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 2.1
  margins_cm: { top: 2.5, bottom: 2.5, left: 4.0, right: 2.5 }   # 2.2

fonts:
  allowed: [Times New Roman]    # 2.4

roles:
  body:
    size_pt: 12                 # 2.4
    line_spacing: 1.5           # 2.6 "bir buçuk satır aralıklı"
    alignment: justify          # 2.6 "iki yana yaslı"
    first_line_indent_cm: 1.0   # 2.6 "1 cm ilk satır girintisi"
    space_after_pt: 6           # 2.6 "Her paragraftan sonra 6 nk"
  heading_1:
    size_pt: 14                 # 2.4 "bölüm başlıkları 14 punto"
    bold: true                  # 2.4, 2.5
    all_caps: true              # 2.5 "BÜTÜN HARFLERİ BÜYÜK"
    # 2.5: "iki yana dayalı", ancak "istenirse … ortalanabilir" → hizalama denetlenmez
    first_line_indent_cm: 1.0   # 2.5 "1 cm ilk satır girintisi"
    space_before_pt: 6          # 2.5 "önce ve sonra 6 nk"
    space_after_pt: 6           # 2.5
    page_break_before: true     # 2.5 "her ana bölümü yeni bir sayfada başlar"
  heading_2:
    size_pt: 12                 # 2.4 "alt başlıklar metinle aynı büyüklükte"
    bold: true                  # 2.5
    alignment: justify          # 2.5 "iki yana dayalı"
    case: title                 # 2.5 "Sadece Baş Harfleri Büyük"
    first_line_indent_cm: 1.0   # 2.5
    space_before_pt: 6          # 2.5
    space_after_pt: 6           # 2.5
  heading_3:
    size_pt: 12                 # 2.4
    bold: true                  # 2.5
    alignment: justify          # 2.5
    case: title                 # 2.5
    first_line_indent_cm: 1.0   # 2.5
    space_before_pt: 6          # 2.5
    space_after_pt: 6           # 2.5
  table_caption:
    position: above             # 2.7 "Tablo başlığı, tablo üstüne"
    alignment: center           # 2.7 "satırı ortalayacak biçimde"
    size_pt: 10                 # 2.7 "tek satır aralıkla, 10 punto"
    line_spacing: 1.0           # 2.6, 2.7
  figure_caption:
    position: below             # 2.7 "şekil altına"
    alignment: center           # 2.7
    size_pt: 10                 # 2.7
    line_spacing: 1.0           # 2.6, 2.7
  table_cell:
    size_pt: 10                 # 2.7 "tablo içi … 10 punto"
    line_spacing: 1.0           # 2.6
  block_quote:
    size_pt: 10                 # 2.6
    line_spacing: 1.0           # 2.6
    alignment: justify          # 2.6 "iki yana dayalı"
    indent_left_cm: 2.0         # 2.6 "soldan 2 cm … ek girinti"
    first_line_indent_cm: 0.5   # 2.6 "paragraf başı olarak 0.5 cm"
    space_after_pt: 6           # 2.6 "6 nk boşluğu"
  footnote:
    size_pt: 10                 # 2.4, 2.8
    line_spacing: 1.0           # 2.8
    alignment: justify          # 2.8 "iki yana yaslı"
    space_before_pt: 0          # 2.8 "sıfır nk"
    space_after_pt: 0           # 2.8
  reference_entry:
    line_spacing: 1.0           # 2.4, 3.2.3.1 "satır aralığı 1 (tek)"
    size_pt: 11                 # 3.2.3.1 "11 punto"
    alignment: justify          # 3.2.3.1 "iki yana dayalı"
    space_after_pt: 6           # 3.2.3.1 "paragraf boşluğu 6 nk"

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # 2.3
  position: bottom_center       # 2.3 "altında ve ortalanmış"

document:
  forbid_tracked_changes: true
