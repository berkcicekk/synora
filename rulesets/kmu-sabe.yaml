# Karamanoğlu Mehmetbey Üniversitesi Sağlık Bilimleri Enstitüsü — Tez Yazım Kılavuzu (2026)
# Kaynak: https://dosya.kmu.edu.tr/sabe/userfiles/files/KM%C3%9C_SABE_tez%20yaz%C4%B1m%20k%C4%B1lavuzu_10_03(1).pdf
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: kmu-sabe
version: 1
name: "Karamanoğlu Mehmetbey Üniversitesi · Sağlık Bilimleri Enstitüsü"
source: "KMÜ Sağlık Bilimleri Enstitüsü Tez Yazım Kılavuzu, 2026"
institution: "Karamanoğlu Mehmetbey Üniversitesi"
source_url: https://dosya.kmu.edu.tr/sabe/userfiles/files/KM%C3%9C_SABE_tez%20yaz%C4%B1m%20k%C4%B1lavuzu_10_03(1).pdf

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                                  # 1.2
  margins_cm: { top: 2.5, bottom: 2.5, left: 4.0, right: 2.5 }   # 1.3.1

fonts:
  allowed: [Times New Roman]                # 1.4.1

roles:
  body:
    size_pt: 12                             # 1.4.1
    line_spacing: 1.5                       # 1.4.2 "1,5 (bir buçuk)"
    space_before_pt: 0                      # 1.4.2 "önce 0 nk"
    space_after_pt: 6                       # 1.4.2 "sonra 6 nk"
    alignment: justify                      # 1.3.2 "iki yana yaslı"
    first_line_indent_cm: 1.25              # 1.3.3 "soldan 1,25 cm içeriden"
  heading_1:
    size_pt: 12                             # 1.5
    bold: true                              # 1.5
    all_caps: true                          # 1.5 "büyük harflerle"
    alignment: center                       # 1.5 "ortaya hizalanmış"
    page_break_before: true                 # 1.3.4 "ana başlıklar (1. Düzey) yeni bir sayfada başlamalıdır"
    space_before_pt: 12                     # 1.4.2 "Her düzeydeki başlıktan önce ve sonra 12 nk"
    space_after_pt: 12                      # 1.4.2
  heading_2:
    size_pt: 12                             # 1.5
    bold: true                              # 1.5
    alignment: justify                      # 1.5 "sağa sola yaslı"
    case: sentence                          # 1.5 "sadece ilk kelimenin ilk harfi büyük"
    space_before_pt: 12                     # 1.4.2
    space_after_pt: 12                      # 1.4.2
  heading_3:
    size_pt: 12                             # 1.5
    bold: true                              # 1.5
    alignment: justify                      # 1.5
    case: sentence                          # 1.5
    space_before_pt: 12                     # 1.4.2
    space_after_pt: 12                      # 1.4.2
  figure_caption:
    size_pt: 12                             # 1.10
    alignment: center                       # 1.10 "ortalı"
    case: sentence                          # 1.10
    line_spacing: 1.5                       # 1.10 "satır aralığı 1,5"
    position: below                         # 1.10 "görsel nesnenin altında"
  table_caption:
    size_pt: 12                             # 1.10
    alignment: justify                      # 1.10 "Tablo başlıkları iki yana yaslı"
    case: sentence                          # 1.10
    line_spacing: 1.5                       # 1.10
    position: above                         # 1.10 "tablo nesnesinin üstüne"
  block_quote:
    line_spacing: 1.5                       # 1.9 "1,5 tam satır aralığı"
    space_before_pt: 0                      # 1.9 "öncesi ve sonrasında boşluk eklemeden"
    space_after_pt: 0                       # 1.9
  reference_entry:
    size_pt: 10                             # 1.4.1 "Kaynaklar ... 10 punto"
    line_spacing: 1.0                       # 1.4.2 "Kaynaklarda satır aralığı 1"
    space_before_pt: 0                      # 1.4.2
    space_after_pt: 6                       # 1.4.2
  footnote:
    size_pt: 10                             # 1.4.1
    space_before_pt: 0                      # 1.4.2
    space_after_pt: 0                       # 1.4.2

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # 1.3.4
  position: bottom_right                    # 1.3.4 "sayfanın sağ alt tarafına"
  forbid_decoration: true                   # 1.3.4 "parantez, çizgi vb. işaretler kullanılmadan"

document:
  forbid_tracked_changes: true
