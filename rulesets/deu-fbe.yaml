# Dokuz Eylül Üniversitesi Fen Bilimleri Enstitüsü — Tez Yazım Kuralları / Tez Yazım Kılavuzu (2025, v3)
# Kaynak: https://fbe.deu.edu.tr/wp-content/uploads/2026/01/Tez-yazim-kilavuzu-2025v3.pdf
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: deu-fbe
version: 1
name: "Dokuz Eylül Üniversitesi · Fen Bilimleri Enstitüsü"
source: "DEÜ Fen Bilimleri Enstitüsü Tez Yazım Kılavuzu, 2025"
institution: "Dokuz Eylül Üniversitesi"
source_url: https://fbe.deu.edu.tr/wp-content/uploads/2026/01/Tez-yazim-kilavuzu-2025v3.pdf

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 2.1 "A4 (210x297 mm)"
  margins_cm: { top: 3.0, bottom: 3.0, left: 4.0, right: 2.5 }   # 2.2

fonts:
  allowed: [Times New Roman]    # 2.3

roles:
  body:
    size_pt: 12                 # 2.3
    line_spacing: 1.5           # 2.4 "1.5 aralık"
    alignment: justify          # 2.4 "sayfanın iki yanına yaslanmış"
    first_line_indent_cm: 0.5   # 2.4 "0,5 cm (5 boşluk/space) içeriden"
    # 2.4 "Paragraflar arasında bir boş satır" — punto değeri yok, denetlenmez
  heading_1:                    # ana bölüm (chapter) başlığı
    size_pt: 12                 # 3.2.1
    bold: true                  # 3.2.1
    all_caps: true              # 3.2.1 "büyük harfle"
    alignment: center           # 3.2.1 "ortaya hizalı" (aynı maddede "Tüm başlıklar sola yaslı" — ÇELİŞKİ: ana bölüm için özel kural kullanıldı)
  heading_2:
    size_pt: 12                 # 3.2.1 "2. Derece başlık"
    bold: true                  # 3.2.1
    alignment: left             # 3.2.1 "Sola dayalı"
    case: title                 # 3.2.1 "kelime baş harfleri büyük"
  heading_3:
    size_pt: 12                 # 3.2.1 "3. Derece başlık"
    bold: true                  # 3.2.1
    italic: true                # 3.2.1
    alignment: left             # 3.2.1
    case: title                 # 3.2.1
  figure_caption:
    size_pt: 10                 # 3.2.2
    line_spacing: 1.5           # 3.2.2 "altyazı yazımında 1,5 satır aralığı"
    case: sentence              # 3.2.2 "ilk kelimenin baş harfi büyük"
    position: below             # 3.2.2 "şeklin altına" (tek satırsa ortalı, çok satırsa iki yana yaslı)
  table_caption:
    size_pt: 10                 # 3.2.2
    line_spacing: 1.5           # 3.2.2
    case: sentence              # 3.2.2
    position: above             # 3.2.2 "Tablo ... üstyazısı" (tek satırsa sola dayalı)
  block_quote:
    italic: true                # Bölüm 3, "Bir Başka Kaynaktan Direkt Alıntı Yapma" (s. 20): 40 kelimeyi geçen alıntı
    alignment: justify          # s. 20 "blok hizalama"
    indent_left_cm: 0.5         # s. 20 "sol ve sağ kenardan bir tab (0,5 cm) içeride"
  footnote:
    size_pt: 10                 # 3.2.4
    line_spacing: 1.0           # 3.2.4 "tek satır aralık"

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # 2.5
  position: bottom_center       # 2.5 "sayfanın alt-ortasına"

document:
  forbid_tracked_changes: true
