# İstanbul Nişantaşı Üniversitesi Lisansüstü Eğitim Enstitüsü — Tez ve Proje Yazım Kılavuzu (Eylül 2022; dosya 2024'te yayımlanmış)
# Kaynak: https://lee.nisantasi.edu.tr/wp-content/uploads/2024/12/aTEZ-YAZIM-KILAVUZU-2024-1.pdf
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: nisantasi-lee
version: 1
name: "İstanbul Nişantaşı Üniversitesi · Lisansüstü Eğitim Enstitüsü"
source: "Tez ve Proje Yazım Kılavuzu, Eylül 2022"
institution: "İstanbul Nişantaşı Üniversitesi"
source_url: https://lee.nisantasi.edu.tr/wp-content/uploads/2024/12/aTEZ-YAZIM-KILAVUZU-2024-1.pdf

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 2.1 "A4 (21 × 29,7 cm)"
  # 2.2: dış ve iç kapakta sol/sağ 3 cm, alt/üst 2 cm; diğer tüm sayfalar aşağıdaki gibi
  margins_cm: { top: 3.0, bottom: 3.0, left: 4.0, right: 2.0 }   # 2.2

fonts:
  allowed: [Times New Roman]    # 2.3 "Tezin tamamında Times New Roman"

roles:
  body:
    size_pt: 12                 # 2.3
    line_spacing: 1.5           # 2.4
    alignment: justify          # 2.5 "iki yana yaslanmış"
    first_line_indent_cm: 0     # 2.5 "ilk satırında soldan girinti verilmemelidir"
    space_before_pt: 6          # 2.5 "önce ve sonra 6 punto aralık"
    space_after_pt: 6           # 2.5
  heading_1:
    size_pt: 12                 # 2.3 "başlıklarda ... 12 punto"
    bold: true                  # 2.7.1
    all_caps: true              # 2.7.1 "tamamı büyük harfe"
    alignment: left             # 2.7 "sola hizalanmış"
    first_line_indent_cm: 0     # 2.7 "soldan girintili olmamalıdır"
    line_spacing: 1.0           # 2.4, 2.7
    page_break_before: true     # 2.7.1 "yeni sayfadan başlamalıdır"
  heading_2:
    size_pt: 12                 # 2.3
    bold: true                  # 2.7.2
    alignment: left             # 2.7
    first_line_indent_cm: 0     # 2.7
    line_spacing: 1.0           # 2.7
    case: title                 # 2.7.2 "tüm kelimelerin ilk harfi büyük"
  heading_3:
    size_pt: 12                 # 2.3
    alignment: left             # 2.7
    first_line_indent_cm: 0     # 2.7
    line_spacing: 1.0           # 2.7
    case: title                 # 2.7.3
  table_caption:
    bold: true                  # 2.10 "kalın karakterle"
    alignment: center           # 2.10 "metin bloğuna ortalanmış"
    line_spacing: 1.0           # 2.10
    space_before_pt: 6          # 2.10 "önce ve sonra 6 punto"
    space_after_pt: 6           # 2.10
    position: above             # 2.10 "Tablo başlıkları tablonun üstünde"
  figure_caption:
    bold: true                  # 2.10
    alignment: center           # 2.10
    line_spacing: 1.0           # 2.10
    space_before_pt: 6          # 2.10
    space_after_pt: 6           # 2.10
    position: below             # 2.10 "şekil başlıkları şeklin altında"
  footnote:
    size_pt: 10                 # 2.3 "dipnotlarda 10 punto"
    line_spacing: 1.0           # 2.4
  block_quote:
    line_spacing: 1.0           # 2.4 "bloklanmış alıntılar ... 1 satır aralıklı"
    indent_left_cm: 1.0         # 2.5 "soldan ve sağdan 1 cm girinti"
  reference_entry:
    line_spacing: 1.0           # 2.4 "kaynaklar ... 1 satır aralıklı"

page_numbering:
  # 2.6: kabul ve onaydan girişe kadar küçük Roma (i, ii…), girişten itibaren Arap (1, 2…)
  formats_in_order: [lowerRoman, decimal]
  position: bottom_right        # 2.6 "alt kenardan 1,5 cm yukarıya ve sağa hizalanmış"

document:
  forbid_tracked_changes: true
