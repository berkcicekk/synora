# Çanakkale Onsekiz Mart Üniversitesi Lisansüstü Eğitim Enstitüsü — Tez ve Dönem Projesi Yazım Kılavuzu (2020)
# Kaynak: https://cdn.comu.edu.tr/cms/lee/files/1140-comu-lisansustu-egitim-enstitusu-tez-ve-donem-proj.pdf
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
# Konumlar kılavuzdaki madde numaralarıdır (ör. 14. Bölüm Başlıkları).
ruleset: comu-lee
version: 1
name: "Çanakkale Onsekiz Mart Üniversitesi · Lisansüstü Eğitim Enstitüsü"
source: "ÇOMÜ Lisansüstü Eğitim Enstitüsü Tez ve Dönem Projesi Yazım Kılavuzu, 2020"
institution: "Çanakkale Onsekiz Mart Üniversitesi"
source_url: https://cdn.comu.edu.tr/cms/lee/files/1140-comu-lisansustu-egitim-enstitusu-tez-ve-donem-proj.pdf

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 1. "A4 (210x297 mm)"
  margins_cm: { top: 3.0, bottom: 2.5, left: 3.0, right: 2.5 }  # Kenar boşlukları "sol ve üst kenardan 3 cm, sağ ve alt kenardan 2.5 cm"

fonts:
  allowed: [Times New Roman]    # Yazı "Times New Roman yazı karakteri"

roles:
  body:
    size_pt: 12                 # Yazı "12 punto büyüklükte"
    line_spacing: 1.5           # Yazı, 15. "1.5 satır aralığıyla"
    alignment: justify          # Yazı "iki yana yaslanmış"
    first_line_indent_cm: 1.25  # 15. "Paragraflar 1,25 cm içeriden başlatılır"
    # 15. paragraflar arasında "bir satır boşluk" (nk değeri yok, denetlenmez)
  heading_1:
    size_pt: 12                 # 14. "12 punto büyüklüğünde"
    bold: true                  # 14. "koyu (bold)"
    all_caps: true              # 14. "büyük harfli"
    alignment: center           # 14. "sayfaya ortalı"
    page_break_before: true     # 15. "Ana bölüm başlıkları yeni sayfadan başlar"
  heading_2:
    size_pt: 12                 # 14.
    bold: true                  # 14. "ilk harfleri büyük ve kalın"
    case: title                 # 14. "ilk harfleri büyük" (örnek: "2.1. Çevresel Faktörler")
    # 14. "Tüm alt başlıklar 1,25 cm girintili" — girinti türü belirsiz, denetlenmez
  heading_3:
    size_pt: 12                 # 14.
    bold: true                  # 14.
    case: title                 # 14. (örnek: "2.1.1. Su Sıcaklığı")
  figure_caption:
    size_pt: 12                 # 17. "Şekil alt yazısı ... 12 punto"
    alignment: justify          # 17. "iki yana yaslı"
    case: sentence              # 17. "ilk kelimenin baş harfi büyük, diğer kelimelerin baş harfleri küçük"
    position: below             # 17. "Şekil alt yazısı"
  table_caption:
    size_pt: 12                 # 17. "tablo üst yazısı 12 punto"
    alignment: justify          # 17.
    case: sentence              # 17.
    position: above             # 17. "Tablo açıklayıcı bilgileri tablonun üstünde"
  footnote:
    size_pt: 10                 # 20. "Dipnotlar Times New Roman 10 punto"

page_numbering:
  # 16.: girişe kadar küçük Romen, metin Arap, son kısım (Ekler, Özgeçmiş, Dizin) büyük Romen
  formats_in_order: [lowerRoman, decimal, upperRoman]
  position: bottom_center       # 16. "kâğıdın altında ortalı"
  forbid_decoration: true       # 16. "parantez ve çizgi kullanmadan"

document:
  forbid_tracked_changes: true
