# Ege Üniversitesi Fen Bilimleri Enstitüsü — Lisansüstü Tez Yazım Kılavuzu (Kasım 2018; Senato 11/12/2018)
# Kaynak: https://fenbilimleri.ege.edu.tr/files/fenbilimleri/icerik/TezYazimsablonu%20(word).docx
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: ege-fbe
version: 1
name: "Ege Üniversitesi · Fen Bilimleri Enstitüsü"
source: "Ege Üniversitesi Fen Bilimleri Enstitüsü Lisansüstü Tez Yazım Kılavuzu, 2018"
institution: "Ege Üniversitesi"
source_url: https://fenbilimleri.ege.edu.tr/files/fenbilimleri/icerik/TezYazimsablonu%20(word).docx

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 2.1 "A4 (210x297)"
  orientation: portrait        # 2.2 "dikey yönlendirilmiş"
  # 2.2: sol 3 cm + ayrıca 2 cm cilt payı (toplam/gutter yorumu belirsiz → sol denetlenmez), üst/alt 2,5 cm, sağ 2 cm
  margins_cm: { top: 2.5, bottom: 2.5, right: 2.0 }

fonts:
  allowed: [Times New Roman]    # 2.5

roles:
  body:
    size_pt: 12                 # 2.5 "Tez metninde 12 pt"
    line_spacing: { exact_pt: 18 }   # 2.6 "Tez metninde ... 18 pt aralık" ("tam"/"en az" belirtilmemiş)
    first_line_indent_cm: 1.0   # 2.6 "Paragraflara 1 cm içeriden başlanır"
    space_after_pt: 18          # 2.6 "Paragraf aralarında ... 18 pt"
  heading_1:
    size_pt: 13                 # 2.5 "Bölüm başlıklarında 13 pt (koyu)"
    bold: true                  # 2.5
    all_caps: true              # 2.7 "Birinci derece bölüm başlıklarının tamamı ... büyük"
    alignment: left             # 2.7 "Başlıklar sola dayalı"
    page_break_before: true     # 2.7 "Anabölümler daima yeni bir sayfa ile başlamalıdır"
  heading_2:
    alignment: left             # 2.7
    case: title                 # 2.7 "her sözcüğün ilk harfi büyük"
  heading_3:
    alignment: left             # 2.7
    case: sentence              # 2.7 "başlığın ve özel isimlerin ilk harfleri büyük"
  figure_caption:
    size_pt: 10                 # 2.5, 3.3 "10 punto"
    line_spacing: { exact_pt: 12 }   # 3.3 "Açıklamanın kendi satırları arasında 12 pt"
  table_caption:
    line_spacing: { exact_pt: 12 }   # 3.3
    position: above             # 3.3 "Çizelge açıklamaları çizelgenin üstünde"
  block_quote:
    font: [Arial]               # 2.11 "“Arial” yazı karakterinde"
    size_pt: 10                 # 2.5, 2.11
    line_spacing: { exact_pt: 12 }   # 2.6 "Alıntı satırları arasında 12 pt"
  reference_entry:
    space_after_pt: 6           # 5.3.2 "Ardışık iki kaynak arasında 6 pt"
  footnote:
    size_pt: 10                 # 2.5
    line_spacing: { exact_pt: 12 }   # 2.6, 2.12 "satırları arasında 12 pt"
    first_line_indent_cm: 0.6   # 2.12 "ilk satırı 0,6 cm içeriden"

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # 2.3
  position: top_center          # 2.3 "üst kenarına 1 cm ... sayfanın ortasına"
  forbid_decoration: true       # 2.3 "parantez veya çizgi gibi işaretler kullanılmaz"

document:
  forbid_tracked_changes: true
