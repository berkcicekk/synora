# Atatürk Üniversitesi Sağlık Bilimleri Enstitüsü — Tez Yazım Kılavuzu (Son güncelleme: Mart 2023)
# Kaynak: https://birimler.atauni.edu.tr/saglik-bilimleri-enstitusu/wp-content/uploads/sites/799/2025/04/Tez-Yazim-Kilavuzu.pdf
# (bağlantı sayfası: https://atauni.edu.tr/saglik-bilimleri-enstitusu/oneri-ve-tez-yazim-kilavuzlari/)
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: ataturk-sabe
version: 1
name: "Atatürk Üniversitesi · Sağlık Bilimleri Enstitüsü"
source: "Atatürk Üniversitesi Sağlık Bilimleri Enstitüsü Tez Yazım Kılavuzu, 2023"
institution: "Atatürk Üniversitesi"
source_url: https://birimler.atauni.edu.tr/saglik-bilimleri-enstitusu/wp-content/uploads/sites/799/2025/04/Tez-Yazim-Kilavuzu.pdf

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # Kâğıt "standart A4 (210 x 297 mm)"; Kenar Boşlukları "A4 boyutunda"
  margins_cm: { top: 2.5, bottom: 2.5, left: 3.5, right: 2.5 }  # Kenar Boşlukları "sol 3.5 cm, üst, alt ve sağ 2.5 cm"

fonts:
  allowed: [Times New Roman]    # Yazım a) "yazı tipi Times New Roman olmalıdır"

roles:
  body:
    size_pt: 12                 # Yazım a) "metin kısmı 12 punto"
    line_spacing: 2.0           # Satır Başı ve Satır Aralığı "çift (2) satır aralığı"
    alignment: justify          # Kenar Boşlukları "Metin bloğu hem sol hem de sağ kenar boşluklarına hizalanmalıdır"
    first_line_indent_cm: 1.2   # Satır Başı "Paragrafın ilk satırı 1.2 cm içeriden"
  heading_1:
    size_pt: 14                 # Yazım a) "Ana bölüm başlıkları ... 14 punto"
    bold: true                  # Yazım b) "Tüm bölüm başlıklarında kalın (bold)"
    all_caps: true              # Yazım b) "Ana bölüm başlıkları büyük harf"
    alignment: center           # Başlık Numaralandırma "metni ortalayacak şekilde"
    page_break_before: true     # Başlık Numaralandırma "daima yeni bir sayfa ile başlamalıdır"
  heading_2:
    size_pt: 12                 # Yazım a) "alt bölüm başlıkları ... 12 punto"
    bold: true                  # Yazım b)
    case: title                 # Yazım b) "her kelimenin ilk harfi büyük", bağlaçlar küçük
  heading_3:
    size_pt: 12                 # Yazım a)
    bold: true                  # Yazım b)
    case: title                 # Yazım b)
  figure_caption:
    size_pt: 12                 # Yazım c) "Şekil ve tablo adları / başlıkları 12 punto"
    line_spacing: 1.0           # Satır Başı "Şekil ve tablo başlık yazıları ... tek (1) satır aralığı"
    position: below             # Şekil ve Tablolar "şekil açıklamaları ise şeklin altına"
  table_caption:
    size_pt: 12                 # Yazım c)
    line_spacing: 1.0           # Satır Başı
    position: above             # Şekil ve Tablolar "Tablo başlıkları tabloların üstüne"
  reference_entry:
    indent_left_cm: 1.25        # Kaynaklar "ikinci ve daha sonraki satırlar ... 1.25 cm içeriden"
    first_line_indent_cm: -1.25 # Kaynaklar "sol kenar boşluğundan başlanarak"
  footnote:
    size_pt: 10                 # Dipnotlar "10 punto ile"
    line_spacing: 1.0           # Satır Başı "dipnot yazılarında tek (1) satır aralığı"

page_numbering:
  # Sayfa Numaralandırma: ön sayfalar Roma "(I, II, III, IV gibi)", Giriş'ten itibaren Arap rakamı
  formats_in_order: [upperRoman, decimal]
  position: bottom_right        # Sayfa Numaralandırma "sayfaların alt sağ köşesine"
  forbid_decoration: true       # "parantez veya çizgi gibi işaretler kullanılmamalıdır"

document:
  forbid_tracked_changes: true
