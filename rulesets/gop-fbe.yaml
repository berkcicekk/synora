ruleset: gop-fbe
version: 1
name: "Tokat Gaziosmanpaşa Üniversitesi · Lisansüstü Eğitim Enstitüsü (Fen Bilimleri)"
source: "TOGÜ Lisansüstü Eğitim Enstitüsü Tez Yazım Kılavuzu (Fen, Mühendislik, Ziraat), 2025"
institution: "Tokat Gaziosmanpaşa Üniversitesi"
source_url: https://lisansustu.gop.edu.tr/depo/menuler/birim_12112/formlar_ve_belgeler_v2_955/dosya_icerik/3423499/formlar_ve_belgeler_v2_20250929135326.docx

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # Kullanılacak Kağıdın Özelliği "A4 boyutunda (210x297mm)"
  margins_cm: { top: 3.5, bottom: 2.5, left: 3.5, right: 2.5 }   # Sayfa Düzeni: soldan ve üstten 3,5 cm, sağdan ve alttan 2,5 cm

fonts:
  allowed: [Times New Roman]    # Yazı Özelliği

roles:
  body:
    size_pt: 12                 # Yazı Özelliği "yazı büyüklüğü 12 punto"
    line_spacing: 1.5           # Satır Aralıkları
    alignment: justify          # Yazım Planı "blok sistemine (justified)"
    first_line_indent_cm: 0     # Yazım Planı "paragraflar sol bloklu şekilde başlamalı"
  heading_1:
    size_pt: 12                 # Bölüm Başlıkları "yazımda kullanılan puntoda (12 punto)"
    bold: true                  # Bölüm Başlıkları "tüm bölüm başlıkları koyu"
    all_caps: true              # Bölüm Başlıkları "tümüyle büyük harflerle"
    alignment: justify          # Yazım Planı "bölüm, alt bölüm başlıkları ... blok sistemine (justified)"
    page_break_before: true     # Satır Aralıkları "ana başlıklar yeni bir sayfadan başlayarak"
  heading_2:
    bold: true                  # Bölüm Başlıkları
    case: title                 # Bölüm Başlıkları "her kelimenin ilk harfi büyük"
    alignment: justify          # Yazım Planı
  heading_3:
    bold: true                  # Bölüm Başlıkları
    case: sentence              # Bölüm Başlıkları "yalnız ilk harfi büyük"
    alignment: justify          # Yazım Planı
  figure_caption:
    line_spacing: 1.0           # Satır Aralıkları "şekil ve çizelge adları ... 1 satır aralığı"
    case: sentence              # Şekil ve Çizelge İsimleri "birinci kelimenin baş harfi büyük"
    position: below             # Şekil ve Çizelge İsimleri "şeklin altına"
  table_caption:
    line_spacing: 1.0           # Satır Aralıkları
    case: sentence              # Şekil ve Çizelge İsimleri
    position: above             # Şekil ve Çizelge İsimleri "çizelgenin üstüne"
  block_quote:
    line_spacing: 1.0           # Satır Aralıkları "alıntılar ... 1 satır aralığı"
  reference_entry:
    line_spacing: 1.0           # Satır Aralıkları; Kaynaklar "1 satır aralığı"
  footnote:
    size_pt: 10                 # Dipnotlar "10 punto"
    line_spacing: 1.0           # Dipnotlar "1 satır aralıklı"

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # Sayfa Numaraları: ön sayfalar küçük Romen, girişten itibaren 1, 2, 3
  position: bottom_center       # Sayfa Numaraları "sayfa altında ve ortada"
  forbid_decoration: true       # Sayfa Numaraları "ayıraç, çizgi vb. karakter kullanılmamalıdır"

document:
  forbid_tracked_changes: true
