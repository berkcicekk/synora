# Kafkas Üniversitesi Sağlık Bilimleri Enstitüsü — Yüksek Lisans ve Doktora Tez Yazım Kılavuzu (2022)
# Kaynak: https://www.kafkas.edu.tr/dosyalar/sabe/file/TEZ%20YAZIM%20KLAVUZU%2029_12_2022.pdf
# (Enstitü Yönetim Kurulu 19/09/2022)
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: kafkas-sabe
version: 1
name: "Kafkas Üniversitesi · Sağlık Bilimleri Enstitüsü"
source: "Kafkas Üniversitesi Sağlık Bilimleri Enstitüsü Tez Yazım Kılavuzu, 2022"
institution: "Kafkas Üniversitesi"
source_url: https://www.kafkas.edu.tr/dosyalar/sabe/file/TEZ%20YAZIM%20KLAVUZU%2029_12_2022.pdf

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                                  # 2.2
  margins_cm: { top: 3.0, bottom: 3.0, left: 4.0, right: 2.5 }   # 2.4

fonts:
  allowed: [Times New Roman]                # 2.3

roles:
  body:
    size_pt: 12                             # 2.3
    line_spacing: 1.5                       # 2.6 "Ana metin 1,5 satır aralığında"
    first_line_indent_cm: 1.25              # 2.6 "Her yeni paragrafa 1,25 cm içeriden"
  heading_1:
    size_pt: 12                             # 2.3, 2.7 "metin ile aynı büyüklükte"
    bold: true                              # 2.3, 2.7
    all_caps: true                          # 2.7 "Birinci derecede bölüm başlıkları büyük harf ile"
    alignment: left                         # 2.7 "metin bloğunun sola yaslanmış"
    page_break_before: true                 # 2.7 "Ana başlıklar her zaman yeni sayfadan başlamalıdır"
  heading_2:
    size_pt: 12                             # 2.3
    bold: true                              # 2.7
    case: title                             # 2.7 "her sözcüğün ilk harfi büyük, bağlaçlar ... küçük"
    alignment: left                         # 2.7
  heading_3:
    size_pt: 12                             # 2.3
    bold: true                              # 2.7
    case: title                             # 2.7
    alignment: left                         # 2.7
  figure_caption:
    size_pt: 10                             # 2.3, 2.8
    line_spacing: 1.0                       # 2.6 "şekil ve resim altı yazılarda satır aralığı 1"
    alignment: left                         # 2.8 "sol alt köşesi hizasından başlanarak"
    first_line_indent_cm: 0                 # 2.6 "açıklamalarında paragraf girintisi kullanılmamalıdır"
    position: below                         # 2.8 "alt kenarının 1 satır altına"
  table_caption:
    size_pt: 10                             # 2.3, 2.8
    line_spacing: 1.0                       # 2.6 "tablo üstü ... satır aralığı 1"
    alignment: left                         # 2.8 "sola hizalanarak"
    first_line_indent_cm: 0                 # 2.6
    position: above                         # 2.8 "tablonun üstüne"
  reference_entry:
    size_pt: 10                             # 2.3, 4.x Kaynaklar
    line_spacing: 1.5                       # Kaynaklar "1,5 satır aralığı"
    space_after_pt: 12                      # Kaynaklar "her iki kaynak arasındaki satır aralığı 12nk"
    alignment: left                         # Kaynaklar "tüm satırları sola tam yaslanmalıdır"
    first_line_indent_cm: 0                 # Kaynaklar
  footnote:
    size_pt: 10                             # 2.11
    line_spacing: 1.0                       # 2.6, 2.11

page_numbering:
  formats_in_order: [upperRoman, decimal]   # 2.5 ön sayfalar "büyük Romen", girişten itibaren Arap
  position: top_center                      # 2.5 "üst ortada"

document:
  forbid_tracked_changes: true
