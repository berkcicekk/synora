# Sağlık Bilimleri Üniversitesi Gülhane/Sağlık Bilimleri Enstitüsü — Lisansüstü Eğitim-Öğretim Tez Yazım Kılavuzu (2018)
# Kaynak: https://www.sbu.edu.tr/FileFolder/Dosyalar/Qwm9gor5/2022_12/5tezlerde-atiflarin-yapilamasi-936d0663.pdf
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: sbu-sabe
version: 1
name: "Sağlık Bilimleri Üniversitesi · Gülhane/Sağlık Bilimleri Enstitüsü"
source: "SBÜ Gülhane/Sağlık Bilimleri Enstitüsü Lisansüstü Eğitim-Öğretim Tez Yazım Kılavuzu, 2018"
institution: "Sağlık Bilimleri Üniversitesi"
source_url: "https://www.sbu.edu.tr/FileFolder/Dosyalar/Qwm9gor5/2022_12/5tezlerde-atiflarin-yapilamasi-936d0663.pdf"

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 2.2 "standart A4 (21,0 cm x 29,7 cm)"
  # 2.13: sol/sağ 2,5 cm, üst/alt 3 cm; ayrıca 1,5 cm cilt payı (tek sayfada solda, çift sayfada sağda) → sol 4 cm
  margins_cm: { top: 3.0, bottom: 3.0, left: 4.0, right: 2.5 }

fonts:
  allowed: [Times New Roman]    # 2.5

roles:
  body:
    size_pt: 12                 # 2.5 "Ana metnin harf büyüklüğü 12 punto"
    line_spacing: 1.5           # 2.6, 2.13
    alignment: justify          # 2.13 "tüm satırlar aynı hizada bloklanmalıdır"
    first_line_indent_cm: 1.25  # 2.13 "her yeni paragraf 1,25 cm içeriden"
  heading_1:
    size_pt: 14                 # 2.14 a
    bold: true                  # 2.14 a
    all_caps: true              # 2.14 a "büyük harfler ile"
    alignment: center           # 2.14 a "sayfa ortalanarak"
    page_break_before: true     # 2.2 "bölüm başları daima ön sayfada (tek sayfa numarasında)"
  heading_2:
    size_pt: 12                 # 2.14 b
    bold: true                  # 2.14 b
    all_caps: true              # 2.14 b "koyu ve büyük harflerle"
    first_line_indent_cm: 1.25  # 2.14 b "1,25 cm içeriden"
  heading_3:
    size_pt: 12                 # 2.14 c
    bold: true                  # 2.14 c
    case: title                 # 2.14 c "her kelimenin ilk harfi büyük"
    first_line_indent_cm: 1.25  # 2.14 c
  table_caption:
    line_spacing: 1.0           # 2.6 "çizelge üst yazıları ... tek satır aralığı"
    position: above             # 2.6 "çizelge üst yazıları"
  figure_caption:
    line_spacing: 1.0           # 2.6 "Şekil, resim, harita alt yazıları ... tek satır"
    position: below             # 2.6 "alt yazıları"
  block_quote:
    line_spacing: 1.0           # 2.6 "alıntılar ... tek satır aralığı"
  footnote:
    size_pt: 10                 # 2.5, 2.11
  reference_entry:
    size_pt: 10                 # 2.5 "dipnotlar ve kaynaklar 10 punto"
    line_spacing: 1.0           # 2.6, 3.x "Kaynaklar dizininin yazımında tek satır aralığı"

page_numbering:
  # 2.4: ön sayfalar küçük Roma rakamı (iv'den), tez metni 1, 2, 3…
  formats_in_order: [lowerRoman, decimal]
  position: top_right           # 2.4 tek sayfalar üstten 2 cm, sağdan 2,75 cm (çift sayfalarda solda)
  forbid_decoration: true       # 2.4 "önüne ve arkasına çizgi vb. bir karakter konulmaz"

document:
  forbid_tracked_changes: true
