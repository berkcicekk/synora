# Bitlis Eren Üniversitesi Lisansüstü Eğitim Enstitüsü — Lisansüstü Tez Yazım Kılavuzu (Temmuz 2022)
# Kaynak: https://www.beu.edu.tr/Dosyalar/Birimler/30/Tez_Yaz%C4%B1m_K%C4%B1kavuzu_1_.pdf
# (bağlantı sayfası: https://www.beu.edu.tr/akademik/enstituler/lisansustu-egitim-enstitusu)
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: bitlis-lee
version: 1
name: "Bitlis Eren Üniversitesi · Lisansüstü Eğitim Enstitüsü"
source: "BEÜ Lisansüstü Eğitim Enstitüsü Lisansüstü Tez Yazım Kılavuzu, 2022"
institution: "Bitlis Eren Üniversitesi"
source_url: https://www.beu.edu.tr/Dosyalar/Birimler/30/Tez_Yaz%C4%B1m_K%C4%B1kavuzu_1_.pdf

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 2.2.1 "A4 (21 x 29,7 cm)"
  margins_cm: { top: 2.5, bottom: 2.5, left: 4.0, right: 2.0 }  # 2.2.5 "sol 4 cm, sağ 2 cm, üstten ve alttan 2,5 cm"

fonts:
  allowed: [Times New Roman]    # 2.2.3 "Times New Roman yazı karakteri"

roles:
  body:
    size_pt: 12                 # 2.2.3 "12 punto"
    line_spacing: 1.5           # 2.2.6 "Tez metninin bütününde 1,5 satır aralığı"
    first_line_indent_cm: 1.25  # 2.2.4 "1 tab (1,25 cm) içeriden"
    space_after_pt: 6           # 2.2.4 "Paragraflar arasındaki geçişte 6 nk boşluk"
  heading_1:
    space_after_pt: 18          # 2.2.6 "Bölüm başlıklarından sonra 18 nk"
    page_break_before: true     # 2.2.6 "Ana bölümlerin yazımına daima yeni bir sayfadan başlanır"
  heading_2:
    space_before_pt: 6          # 2.2.6 "alt bölüm başlıklarından önce ve sonra 6 nk"
    space_after_pt: 6           # 2.2.6
  heading_3:
    space_before_pt: 6          # 2.2.6
    space_after_pt: 6           # 2.2.6
  figure_caption:
    size_pt: 12                 # 2.2.12 "Açıklamalarda 12 punto"
    line_spacing: 1.0           # 2.2.6, 2.2.12 "tek satır aralığı"
    case: sentence              # 2.2.12 "birinci kelimenin baş harfi büyük, diğerleri küçük"
    position: below             # 2.2.12 "Şekil ... açıklamaları bu resimlerin altına"
  table_caption:
    size_pt: 12                 # 2.2.12
    line_spacing: 1.0           # 2.2.6 "çizelge üst yazıları tek satır aralığıyla"
    case: sentence              # 2.2.12
    position: above             # 2.2.12 "Çizelge açıklamaları çizelgenin üstüne" (ÇELİŞKİ: aynı paragraf "Şekil, çizelge, fotoğraf ve harita açıklamaları bu resimlerin altına" diyor)
  footnote:
    size_pt: 10                 # 2.2.3 "Dipnotlar, 10 punto"
    line_spacing: 1.0           # 2.2.6 "dipnot ... tek satır aralığıyla"

page_numbering:
  # 2.2.2: Özet'ten Giriş'e büyük Romen (I, II, III…), Giriş'ten itibaren 1, 2, 3…
  formats_in_order: [upperRoman, decimal]
  position: bottom_center       # 2.2.2 "sayfa altına ve ortaya hizalanarak"
  forbid_decoration: true       # 2.2.2 "ayraç, çizgi gibi herhangi bir işaret kullanılmaz"

document:
  forbid_tracked_changes: true
