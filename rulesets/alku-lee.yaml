# Alanya Alaaddin Keykubat Üniversitesi Lisansüstü Eğitim Enstitüsü — Lisansüstü Tez ve Dönem Projesi Yazım Kılavuzu
# (KL.001, ilk yayın 01.07.2020)
# Kaynak: https://enstitu.alanya.edu.tr/media/5wlhqxxt/kl-001-lisansustu-egitim-enstitusu-tez-ve-donem-projesi-yazim-kilavuzu.docx
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: alku-lee
version: 1
name: "Alanya Alaaddin Keykubat Üniversitesi · Lisansüstü Eğitim Enstitüsü"
source: "ALKÜ Lisansüstü Eğitim Enstitüsü Lisansüstü Tez ve Dönem Projesi Yazım Kılavuzu (KL.001), 2020"
institution: "Alanya Alaaddin Keykubat Üniversitesi"
source_url: https://enstitu.alanya.edu.tr/media/5wlhqxxt/kl-001-lisansustu-egitim-enstitusu-tez-ve-donem-projesi-yazim-kilavuzu.docx

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 2.1
  margins_cm: { top: 2.5, bottom: 2.5, left: 3.5, right: 2.5 }   # 2.3

fonts:
  allowed: [Times New Roman]    # 2.2

roles:
  body:
    size_pt: 12                 # 2.2
    line_spacing: 1.5           # 2.4
    alignment: justify          # 2.3, 2.4 "iki tarafa yaslanmalı"
    first_line_indent_cm: 1.25  # 2.3
    space_after_pt: 0           # 2.4 "paragraflar arasında boşluk bırakılmamalıdır"
  heading_1:
    size_pt: 12                 # 2.6
    bold: true                  # 2.2, 2.6 "koyu puntolarla"
    all_caps: true              # 2.6 "büyük harflerle"
    alignment: center           # 2.6 "satır ortalanarak"
    space_before_pt: 18         # 2.4
    space_after_pt: 12          # 2.4
    page_break_before: true     # 2.4, 2.6 "yeni bir sayfa ile başlamalıdır"
  heading_2:
    bold: true                  # 2.6
    alignment: justify          # 2.6 "iki yana yaslanmış"
    case: title                 # 2.6 "her sözcüğün ilk harfi büyük"
    space_before_pt: 12         # 2.4
    space_after_pt: 6           # 2.4
  heading_3:
    bold: true                  # 2.6
    case: sentence              # 2.6 "birinci sözcüğün ilk harfi büyük"
    space_after_pt: 6           # 2.4 "diğer düzeydeki başlıklar ... 6 nk"
  figure_caption:
    line_spacing: 1.0           # 2.4, 2.10
    case: sentence              # 2.10 "sadece ilk kelimenin ilk harfi büyük"
    position: below             # 2.10 "şeklin altına"
  table_caption:
    line_spacing: 1.0           # 2.4, 2.10
    case: sentence              # 2.10
    position: above             # 2.10 "tablonun üstüne"
  block_quote:
    size_pt: 10                 # 2.2 "doğrudan alıntılarda ... on (10) punto"
    line_spacing: 1.0           # 2.4
  reference_entry:
    line_spacing: 1.0           # 2.9
    space_after_pt: 6           # 2.9 "kaynaklar arasında 6 nk"
  footnote:
    size_pt: 9                  # 2.2, 2.11
    line_spacing: 1.0           # 2.4, 2.11

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # 2.5
  position: bottom_center       # 2.5 "alt kenarlarından 1,5 cm yukarıda ve ortalanmış"

document:
  forbid_tracked_changes: true
