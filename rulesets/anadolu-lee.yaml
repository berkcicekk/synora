# Anadolu Üniversitesi Lisansüstü Eğitim Enstitüsü — Tez Yazım Kılavuzu (12.06.2024)
# Kaynak: https://cdn.anadolu.edu.tr/files/anadolu-cms/GVz7XYek/file/lee-tez-yazim-kilavuzu-12-06-2024-mobil-78a788919db84666.pdf
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: anadolu-lee
version: 1
name: "Anadolu Üniversitesi · Lisansüstü Eğitim Enstitüsü"
source: "Anadolu Üniversitesi Lisansüstü Eğitim Enstitüsü Tez Yazım Kılavuzu, 2024"
institution: "Anadolu Üniversitesi"
source_url: https://cdn.anadolu.edu.tr/files/anadolu-cms/GVz7XYek/file/lee-tez-yazim-kilavuzu-12-06-2024-mobil-78a788919db84666.pdf

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 1.1
  margins_cm: { top: 3.0, bottom: 2.5, left: 3.5, right: 2.5 }   # 1.1 dikey sayfalar

fonts:
  allowed: [Times New Roman]    # 1.2

roles:
  body:
    size_pt: 12                 # 1.2
    line_spacing: 1.5           # 1.3
    alignment: justify          # 1.3 "iki yana yaslanmış"
    first_line_indent_cm: 0     # 1.3 "Paragraflar başlıklarla aynı hizadan başlar"
    space_before_pt: 6          # 1.3 "önce ve sonra 6 punto"
    space_after_pt: 6           # 1.3
  heading_1:
    bold: true                  # 1.4 Tablo 1.1 düzey 1
    all_caps: true              # 1.4 "tamamı büyük harf"
    alignment: left             # 1.4 "başlıkların tamamı sola dayalı"
    space_before_pt: 6          # 1.4 "tüm başlıklardan önce ve sonra 6 nk"
    space_after_pt: 6           # 1.4
    page_break_before: true     # 2.3.1 "her bir ana başlık yeni bir sayfadan başlar"
  heading_2:
    bold: true                  # 1.4 Tablo 1.1 düzey 2
    alignment: left             # 1.4
    case: title                 # 1.4 "her sözcüğün baş harfi büyük"
    space_before_pt: 6          # 1.4
    space_after_pt: 6           # 1.4
  heading_3:
    bold: true                  # 1.4 Tablo 1.1 düzey 3
    alignment: left             # 1.4
    case: sentence              # 1.4 "sadece ilk sözcüğün baş harfi büyük"
    space_before_pt: 6          # 1.4
    space_after_pt: 6           # 1.4
  table_caption:
    position: above             # 1.6 "numarası ve açıklaması tablonun üstünde"
    alignment: left             # 1.6 "paragraf girintisi olmadan, sola dayalı"
    first_line_indent_cm: 0     # 1.6
    case: title                 # 1.6 başlık "her sözcüğün ilk harfi büyük (bağlaçlar hariç)"
  figure_caption:
    position: above             # 1.6 "şeklin/görselin üstünde" (APA-7 düzeni)
    alignment: left             # 1.6
    first_line_indent_cm: 0     # 1.6
    case: title                 # 1.6
  table_cell:
    size_pt: 10                 # 1.6 "2 punto küçültülerek … 10 punto"
    line_spacing: 1.0           # 1.6 "tek satır aralığı"
  block_quote:
    size_pt: 10                 # 1.3, 2.4 "10 punto"
    indent_left_cm: 2.0         # 1.3 "soldan, 2 cm içeriden"
  footnote:
    size_pt: 10                 # 1.7
  reference_entry:
    line_spacing: 1.0           # Kaynakça "tek satır aralıkları"
    space_before_pt: 0          # Kaynakça "Paragraf öncesi 0 nk"
    space_after_pt: 6           # Kaynakça "sonrasında ise 6 nk"

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # 1.5
  position: bottom_center       # 1.5 "sayfanın altında ve ortasında"
  forbid_decoration: true       # 1.5 "rakam dışında herhangi bir işaret kullanılmaz"

document:
  forbid_tracked_changes: true
