# Adıyaman Üniversitesi Lisansüstü Eğitim Enstitüsü — Tez/Proje/Seminer/Sanatta Yeterlik Yazım Kılavuzu (2022)
# Kaynak: https://static.adiyaman.edu.tr/files/68/tr/sayfalar/ogrenci/tez-yazim-kilavuzu/tez%20proje%20seminer%20sanatta%20yeterlik%20yaz%C4%B1m%20k%C4%B1lavuzu.pdf
# Not: Enstitü Kasım 2025'te yeni kılavuz için toplantı haberi yayımladı; yeni sürüm bulunamadı.
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: adiyaman-lee
version: 1
name: "Adıyaman Üniversitesi · Lisansüstü Eğitim Enstitüsü"
source: "ADYÜ LEE Tez/Proje/Seminer/Sanatta Yeterlik Yazım Kılavuzu, 2022"
institution: "Adıyaman Üniversitesi"
source_url: https://static.adiyaman.edu.tr/files/68/tr/sayfalar/ogrenci/tez-yazim-kilavuzu/tez%20proje%20seminer%20sanatta%20yeterlik%20yaz%C4%B1m%20k%C4%B1lavuzu.pdf

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 2.1
  margins_cm: { top: 3.0, bottom: 2.5, left: 3.0, right: 2.5 }   # 2.1

fonts:
  allowed: [Times New Roman]    # 2.2

roles:
  body:
    size_pt: 12                 # 2.2 "metin kısmı 12 punto"
    line_spacing: 1.5           # 2.6 "1,5 satır aralığında"
    alignment: justify          # 2.6 "iki yana yaslanmış biçimde (blok)"
    first_line_indent_cm: 1.0   # 2.7 "soldan 1 cm içeriden"
    space_before_pt: 0          # 2.7 "Paragraflar arasında boşluk bırakılmaz"
    space_after_pt: 0           # 2.7
  heading_1:
    size_pt: 14                 # 2.2 "Ana bölüm başlıkları ... 14 punto"
    bold: true                  # 2.3 Tablo 2.1 düzey 1
    all_caps: true              # 2.3 Tablo 2.1 "tamamı büyük harf"
    alignment: left             # 2.3 "başlıkların tamamı sola dayalı"
    space_after_pt: 3           # 2.3 "başlıklardan sonra 3 nokta (nk)"
  heading_2:
    size_pt: 12                 # 2.2 "alt bölüm başlıkları ... 12 punto"
    bold: true                  # 2.3 Tablo 2.1 düzey 2
    case: title                 # 2.3 "her sözcüğün baş harfi büyük"
    alignment: left             # 2.3
    space_after_pt: 3           # 2.3
  heading_3:
    size_pt: 12                 # 2.2
    bold: true                  # 2.3 Tablo 2.1 düzey 3
    case: sentence              # 2.3 "sadece ilk sözcüğün baş harfi büyük"
    alignment: left             # 2.3
    space_after_pt: 3           # 2.3
  table_caption:
    size_pt: 12                 # 2.2 "Şekil ve tablo adları / başlıkları 12 punto"
    alignment: left             # 2.4 "tablo/çizelgenin üstüne sola dayalı"
    position: above             # 2.4
    space_after_pt: 6           # 2.4 "başlığı ile tablo/çizelge ... arasında ise 6 nk"
  figure_caption:
    size_pt: 12                 # 2.2
    alignment: center           # 2.4 "şeklin ve görselin altına ortalı"
    position: below             # 2.4
    space_before_pt: 6          # 2.4 "6 nk boşluk verilir"
  block_quote:
    indent_left_cm: 2.0         # 2.6 "3 satırdan uzun ... soldan 2 cm içeriden"
  footnote:
    size_pt: 10                 # 2.5 "tek satır aralığı ve 10 puntoyla"
    line_spacing: 1.0           # 2.5

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # 2.8 ön bölüm i, ii, iii; ana metin 1, 2, 3
  position: bottom_right        # 2.8 "sayfanın alt ve sağ alanında"
  forbid_decoration: true       # 2.8 "rakam dışında herhangi bir işaret kullanılmaz"

document:
  forbid_tracked_changes: true
