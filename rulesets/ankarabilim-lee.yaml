# Ankara Bilim Üniversitesi Lisansüstü Eğitim Enstitüsü — Tez Yazım Yönergesi (Senato 06.02.2023; Word belgesi, son değişiklik 2025-02)
# Kaynak: https://ankarabilim.edu.tr/Uploads/menu/department/galeri/tez-yazim-yonergesi1-1-75491765897836.docx
# Sayfa: https://ankarabilim.edu.tr/lisansustu-egitim-enstitusu/formlar/formlar
# Yazı boyutu aralık olarak verilmiş (metin 11-12 pt, bölüm başlığı 13-14 pt, dipnot/alıntı 9-11 pt) → size_pt verilmedi.
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: ankarabilim-lee
version: 1
name: "Ankara Bilim Üniversitesi · Lisansüstü Eğitim Enstitüsü"
source: "Ankara Bilim Üniversitesi LEE Tez Yazım Yönergesi, 2023"
institution: "Ankara Bilim Üniversitesi"
source_url: https://ankarabilim.edu.tr/Uploads/menu/department/galeri/tez-yazim-yonergesi1-1-75491765897836.docx

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 1.1 SAYFALARIN KULLANIMI "A4"
  margins_cm: { top: 3.0, bottom: 3.0, left: 4.0, right: 2.0 }   # 1.2 KENAR BOŞLUKLARI

fonts:
  allowed: [Times New Roman, Arial]   # 1.5 YAZI TİPİ VE BOYUTU "Times New Roman ya da Arial"

roles:
  body:
    line_spacing: 1.5           # 1.6 SATIR ARALARI "1,5 satır (18 pt)"
    alignment: justify          # 1.7 PARAGRAFLAR "soldan ve sağdan bloklanmış hizalı"
    first_line_indent_cm: 0     # 1.7 PARAGRAFLAR "girinti yapılmamalıdır"
  heading_1:
    # Bölüm ana başlıkları
    bold: true                  # 2.1 "büyük harfle, koyu"
    all_caps: true              # 2.1
    alignment: center           # 2.1 "metin ortalanır"
    page_break_before: true     # 2.1 "Yeni bölüm başlıkları yeni bir sayfadan başlar"
    space_before_pt: 24         # 2.4 "başlıklardan önce 2 satır (24 pt), sonra 1,5 satır (18 pt)"
    space_after_pt: 18          # 2.4
  heading_2:
    # Birinci düzey başlıklar
    bold: true                  # 2.2 "büyük harfle ve koyu"
    all_caps: true              # 2.2
    indent_left_cm: 1.0         # 2.2 "sol kenardan 1 cm hizalanır"
    space_before_pt: 24         # 2.4
    space_after_pt: 18          # 2.4
  heading_3:
    # İkinci düzey başlıklar
    bold: true                  # 2.3 "koyu"
    case: title                 # 2.3 "Bütün sözcüklerin ilk harfleri büyük"
    indent_left_cm: 1.0         # 2.3 "sol kenardan 1 cm hizalanır"
    space_before_pt: 24         # 2.4
    space_after_pt: 18          # 2.4
  block_quote:
    line_spacing: 1.0           # 1.6 SATIR ARALARI "bloklanmış alıntılarda 1 satır (12 pt)"
    indent_left_cm: 1.0         # 1.7 PARAGRAFLAR "soldan ve sağdan 1 cm girinti"
  footnote:
    line_spacing: 1.0           # 1.6 SATIR ARALARI "dipnotlarda ... 1 satır"

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # 1.4 NUMARALANDIRMA "küçük harf Romen" / girişten "1, 2, 3"
  position: top_right           # 1.3 SAYFA NUMARALARI "yazı çerçevesinin sağ üst köşesine"
  forbid_decoration: true       # 1.3 SAYFA NUMARALARI "parantez, çizgi vb. işaretler kullanılmadan"

document:
  forbid_tracked_changes: true
