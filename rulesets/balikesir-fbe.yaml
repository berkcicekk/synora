# Balıkesir Üniversitesi Fen Bilimleri Enstitüsü Lisansüstü Tez Yazım Kılavuzu (Balıkesir, Kasım 2024)
# Kaynak: https://baunwebapi.balikesir.edu.tr/uploads/1773814293153.docx
# (fbe.balikesir.edu.tr/tez-yazim-kilavuzu sayfasındaki "Lisansüstü Tez Yazım Kılavuzu")
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: balikesir-fbe
version: 1
name: "Balıkesir Üniversitesi · Fen Bilimleri Enstitüsü"
source: "Balıkesir Üniversitesi Fen Bilimleri Enstitüsü Lisansüstü Tez Yazım Kılavuzu, 2024"
institution: "Balıkesir Üniversitesi"
source_url: https://baunwebapi.balikesir.edu.tr/uploads/1773814293153.docx

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 1.1
  orientation: portrait         # 1.2 "dikey yönlendirilmiş"
  margins_cm: { top: 2.5, bottom: 2.5, left: 3.0, right: 2.5 }   # 1.2

fonts:
  allowed: [Times New Roman]    # 1.5

roles:
  body:
    size_pt: 12                 # 1.5
    line_spacing: 1.5           # 1.6
    alignment: justify          # 1.2, 1.6 "iki yana yaslı"
    first_line_indent_cm: 0     # 1.6 "satır ve paragraflar sayfanın sol kenarından başlamalıdır"
    space_before_pt: 0          # 1.2 "önce ve sonra ... 0 nk"
    space_after_pt: 0           # 1.2
  heading_1:
    size_pt: 14                 # 1.5 "Bölüm başlıklarında 14 pt (koyu)"
    bold: true                  # 1.5
    all_caps: true              # 1.7 "bağlaçlar dahil büyük harfle"
    alignment: left             # 1.7 "sayfanın sol kenarından başlamalıdır"
  heading_2:
    size_pt: 12                 # 1.5 "Alt Başlıklar 12 pt (koyu)"
    bold: true                  # 1.5
    alignment: left             # 1.7
    case: title                 # 1.7 "her sözcüğün ilk harfi büyük"
  heading_3:
    size_pt: 12                 # 1.5
    bold: true                  # 1.5
    alignment: left             # 1.7
    case: sentence              # 1.7 "ilk harf büyük diğer harfler küçük"
  figure_caption:
    size_pt: 12                 # 1.5 — ÇELİŞKİ: 2 "açıklamaların yazım boyutu 8-12pt arasındadır"
    line_spacing: 1.0           # 1.6
    alignment: center           # 2 "sayfa ortalanarak"
    case: sentence              # 2 "yalnızca baştaki sözcüğün ilk harfi büyük"
    position: below             # 2 "şeklin altında"
  table_caption:
    size_pt: 12                 # 1.5 — ÇELİŞKİ: 2 "8-12pt"
    line_spacing: 1.0           # 1.6
    alignment: center           # 2
    case: sentence              # 2
    position: above             # 2 "tablonun üstünde"
  block_quote:
    font: [Arial]               # 1.11 "“Arial” yazı karakterinde"
    size_pt: 10                 # 1.5, 1.11
    line_spacing: 1.0           # 1.6 "alıntı satırları arasında tek satır aralığı"
  footnote:
    size_pt: 10                 # 1.5 — ÇELİŞKİ: 1.12 "harf büyüklüğü 8pt-10pt"
    line_spacing: 1.0           # 1.6, 1.12

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # 1.3
  position: bottom_center       # 1.3 "sayfanın altında ve ortalanmış"
  forbid_decoration: true       # 1.3 "parantez veya çizgi gibi işaretler kullanılmamalıdır"

document:
  forbid_tracked_changes: true
