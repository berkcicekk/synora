# Nuh Naci Yazgan Üniversitesi Lisansüstü Eğitim Enstitüsü — Tez/Proje Yazım Kılavuzu (Kayseri, 2026)
# Kaynak: https://lisansustu.nny.edu.tr/files/files/icerik/k%C4%B1lavuzlar/tez-proje-yazim-kilavuzu.pdf
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: nny-lee
version: 1
name: "Nuh Naci Yazgan Üniversitesi · Lisansüstü Eğitim Enstitüsü"
source: "NNYÜ Lisansüstü Eğitim Enstitüsü Tez/Proje Yazım Kılavuzu, 2026"
institution: "Nuh Naci Yazgan Üniversitesi"
source_url: https://lisansustu.nny.edu.tr/files/files/icerik/k%C4%B1lavuzlar/tez-proje-yazim-kilavuzu.pdf

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                                  # 3.1, 3.5
  margins_cm: { top: 3.0, bottom: 3.0, left: 3.5, right: 2.5 }   # 3.5

fonts:
  allowed: [Times New Roman]                # 3.4

roles:
  body:
    size_pt: 12                             # 3.4
    line_spacing: 1.5                       # 3.5.2 "1,5 satır"
    alignment: justify                      # 3.5 "iki yana yaslı formatında"
    first_line_indent_cm: 1.25              # 3.5.2 "her yeni paragraf 1,25 cm içeriden"
  heading_1:
    size_pt: 12                             # 3.5.3 "metin ile aynı büyüklükte"
    bold: true                              # 3.5.3 "Tüm bölüm başlıkları koyu"
    all_caps: true                          # 3.5.3 "büyük harf"
    alignment: center                       # 3.5.2 "sayfayı ortalayacak şekilde"
    page_break_before: true                 # 3.5.2 "sayfa başı yapılmalı"; 3.5.3
    space_after_pt: 12                      # 3.5.2 "Başlıklardan sonra ... 12 nk"
  heading_2:
    size_pt: 12                             # 3.5.3
    bold: true                              # 3.5.3
    case: title                             # 3.5.3 "her kelimenin ilk harfi büyük", bağlaçlar küçük
    first_line_indent_cm: 1.25              # 3.5.2 "1,25 cm içeriden başlatılmalıdır"
    space_before_pt: 12                     # 3.5.2 "son satırı ile sonraki alt bölüm başlığı arasında 12 nk"
    space_after_pt: 12                      # 3.5.2
  heading_3:
    size_pt: 12                             # 3.5.3
    bold: true                              # 3.5.3
    case: title                             # 3.5.3
    first_line_indent_cm: 1.25              # 3.5.2
    space_before_pt: 12                     # 3.5.2
    space_after_pt: 12                      # 3.5.2
  figure_caption:
    size_pt: 12                             # 3.12.2
    bold: true                              # 3.12.2 "kalın"
    alignment: center                       # 3.12.1, 3.12.2 "ortalı"
    line_spacing: 1.0                       # 3.5.2, 3.12.2 "tek satır aralığı"
    position: below                         # 3.12.1 "şeklin altında"
  table_caption:
    size_pt: 12                             # 3.12.2
    bold: true                              # 3.12.2
    alignment: center                       # 3.12.1, 3.12.2
    line_spacing: 1.0                       # 3.5.2, 3.12.2
    position: above                         # 3.12.1 "tablonun üstüne"
  block_quote:
    line_spacing: 1.0                       # 3.5.2 "alıntılar ... 1 satır"
    italic: true                            # 3.10 "italik harflerle"
    indent_left_cm: 1.25                    # 3.10 "her iki taraftan 1,25 cm içeride"
  reference_entry:
    line_spacing: 1.0                       # 3.5.2 "Kaynaklar dizininin yazımında 1 satır aralığı"
    space_before_pt: 6                      # 3.5.2 "alt-üst 6 nk"
    space_after_pt: 6                       # 3.5.2
  footnote:
    size_pt: 10                             # 3.4, 3.11
    line_spacing: 1.0                       # 3.5.2, 3.11

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # 3.5.1
  position: top_right                       # 3.5.1 "yukarı kısmına metin bloğunun sağ kenar hizasında"
  forbid_decoration: true                   # 3.5.1 "parantez, çizgi gibi işaretler kullanılmamalıdır"

document:
  forbid_tracked_changes: true
