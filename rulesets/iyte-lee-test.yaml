# TEST — İzmir Yüksek Teknoloji Enstitüsü (IZTECH) Lisansüstü Eğitim Enstitüsü
# "Guide to Writing Theses" (İngilizce). Kullanıcının verdiği PDF, enstitü sitesindeki
# resmî dosyayla bayt bayt aynı (SHA-256 eşleşti; site yüklemesi 2019/12).
# Kaynak: https://lee.iyte.edu.tr/wp-content/uploads/sites/110/2019/12/Tez-yaz%C4%B1m-k%C4%B1lavuzu-n.pdf
# (Enstitü sayfası: https://lee.iyte.edu.tr/en/thesis/)
# Erişim: 2026-10-20
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı. Kullanıcı isteğiyle TEST işaretli.
ruleset: iyte-lee-test
version: 1
name: "İzmir Yüksek Teknoloji Enstitüsü · Lisansüstü Eğitim Enstitüsü — TEST"
source: "IZTECH Guide to Writing Theses (site yüklemesi 2019/12)"
institution: "İzmir Yüksek Teknoloji Enstitüsü"
source_url: https://lee.iyte.edu.tr/wp-content/uploads/sites/110/2019/12/Tez-yaz%C4%B1m-k%C4%B1lavuzu-n.pdf
uyari: "TEST kural seti: kullanıcı isteğiyle deneme amaçlı eklendi, enstitü tarafından doğrulanmadı. Bulguları danışmanınızla teyit edin. (Aynı kılavuzun olağan seti: iyte-lee.)"

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 2.1 "A4 (210 by 297 mm)"
  margins_cm: { top: 2.5, bottom: 2.5, left: 3.5, right: 2.5 }   # 2.2

fonts:
  allowed: [Times New Roman]    # 2.3 "use Times New Roman"

roles:
  body:
    size_pt: 12                 # 2.3 "Text (body text ... ): 12 points"
    line_spacing: 1.5           # 2.4 "Standard 1.5 spacing must be used throughout the text"
    alignment: justify          # 2.2 "left and right justified"
    first_line_indent_cm: 1.27  # 2.7 "Paragraphs must be indented by tab of 1.27 cm"
    space_after_pt: 0           # 2.7 "there must be no spaces between two paragraphs"
  heading_1:
    size_pt: 16                 # 2.3 "Chapter headings: 16 points"; 3.2.1
    all_caps: true              # 3.2.1 "in all capital letters"
    alignment: center           # 3.2.1 "centered between the text margins"
    page_break_before: true     # 3.2 "Only chapters should begin with a new page"
  heading_2:
    size_pt: 14                 # 2.3 "Headings and subheadings: 14 points"
    bold: true                  # 3.2.1 "must be written bold"
    case: title                 # 3.2.1 "First letter of each word must be capital"
  heading_3:
    size_pt: 14                 # 2.3
    bold: true                  # 3.2.1
    case: title                 # 3.2.1
  table_caption:
    size_pt: 12                 # 2.3 "table headings ... 12 points"
    position: above             # 3.2.2 "Table numbers and captions are placed ... above"
    line_spacing: 1.0           # 2.4 "Single spacing is allowed ... table titles"
  figure_caption:
    size_pt: 12                 # 2.3 "figure captions ... 12 points"
    position: below             # 3.2.2 "figure numbers and captions are placed ... below"
    line_spacing: 1.0           # 2.4 "figure captions"
  block_quote:
    line_spacing: 1.0           # 2.4 "block quotations"
  footnote:
    line_spacing: 1.0           # 2.4 "notes"
  reference_entry:
    size_pt: 12                 # 2.3 "references ... 12 points"
    line_spacing: 1.0           # 2.4 "bibliography/reference list"

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # 2.9 ön sayfalar roman, metin "1"den başlar
  position: bottom_right        # 2.9 "bottomright-corner"
  forbid_decoration: true       # 2.9 "must not be embellished with punctuation"

document:
  forbid_tracked_changes: true
