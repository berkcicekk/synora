# İzmir Kâtip Çelebi Üniversitesi Fen Bilimleri Enstitüsü — Tez Hazırlama ve Yazım Kılavuzu (Ocak 2024)
# Kaynak: https://fenbilimleri.ikcu.edu.tr/Share/42FD3269D68E16DFC5879C02B86732C9
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
# Not: Kılavuz, tez şablonu biçiminde yazılmış bir .docx dosyasıdır.
ruleset: ikcu-fbe
version: 1
name: "İzmir Kâtip Çelebi Üniversitesi · Fen Bilimleri Enstitüsü"
source: "İKÇÜ Fen Bilimleri Enstitüsü Tez Hazırlama ve Yazım Kılavuzu, 2024"
institution: "İzmir Kâtip Çelebi Üniversitesi"
source_url: https://fenbilimleri.ikcu.edu.tr/Share/42FD3269D68E16DFC5879C02B86732C9

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 2.5 "A4 (210 x 297 mm)"
  margins_cm: { top: 2.5, bottom: 2.5, left: 4.0, right: 2.5 }   # 2.1

fonts:
  allowed: [Times New Roman]    # 2.2.1 "tamamen Times New Roman"

roles:
  body:
    size_pt: 12                 # 2.2.2.1
    line_spacing: 1.5           # 2.2.3 "Satır aralığı: 1,5 satır"
    alignment: justify          # 2.1 "Normal metinler iki yana yaslanmış"
    first_line_indent_cm: 0     # 2.2.1 "paragraf başı girintisi kullanılmayacaktır"
    space_before_pt: 12         # 2.2.3 "Önce: 12 nk"
    space_after_pt: 12          # 2.2.3 "Sonra: 12 nk"
  heading_1:
    size_pt: 26                 # 2.2.2.2, 2.4 "Bölüm başlıkları 26 punto"
    bold: false                 # 2.2.2.2 "Başlıkların hiçbiri kalın değildir"
    alignment: left             # 2.1, 2.4 "sola hizalanmalıdır"
    line_spacing: 1.5           # 2.2.3
    space_before_pt: 18         # 2.2.3 "Önce: 18 nk"
    space_after_pt: 12          # 2.2.3 "Sonra: 12 nk"
    page_break_before: true     # 2.1 "Tüm bölüm başlıkları yeni sayfadan başlamalıdır"
  heading_2:
    size_pt: 18                 # 2.2.2.2 "birincil alt bölüm başlıkları 18 punto"
    bold: false                 # 2.2.2.2
    alignment: left             # 2.4
    line_spacing: 1.5           # 2.2.3
    space_before_pt: 18         # 2.2.3
    space_after_pt: 12          # 2.2.3
  heading_3:
    size_pt: 16                 # 2.2.2.2 "ikincil alt bölüm başlıkları 16 punto"
    bold: false                 # 2.2.2.2
    alignment: left             # 2.4
    line_spacing: 1.5           # 2.2.3
    space_before_pt: 18         # 2.2.3
    space_after_pt: 12          # 2.2.3
  figure_caption:
    size_pt: 12                 # 2.2.2.3 "etiketleri 12 punto"
    alignment: center           # 2.2.2.3 "ortalanmalıdır"
    line_spacing: 1.0           # 2.2.3 "Satır aralığı: Tek"
    space_before_pt: 6          # 2.2.3 "Önce: 6 nk"
    space_after_pt: 6           # 2.2.3 "Sonra: 6 nk"
    position: below             # 2.6.1 "şekil etiketi şeklin altına"
  table_caption:
    size_pt: 12                 # 2.2.2.3
    alignment: center           # 2.2.2.3
    line_spacing: 1.0           # 2.2.3
    space_before_pt: 6          # 2.2.3
    space_after_pt: 6           # 2.2.3
    position: above             # 2.6.1 "Tablo etiketi ... tablonun üstüne"
  block_quote:
    italic: true                # 2.10 Alıntılar "italik harflerle"
    alignment: justify          # 2.10 "iki yana hizalanmalıdır"
    indent_left_cm: 1.0         # 2.10 "sağ ve sol kenar çizgilerinden 1 cm içeride"
  reference_entry:
    size_pt: 12                 # 2.2.2.1 "Kaynakların yazımında da aynı boyut"

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # 2.3
  position: bottom_center       # 2.3 "sayfanın alt ortasında"

document:
  forbid_tracked_changes: true
