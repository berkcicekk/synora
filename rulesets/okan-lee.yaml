# İstanbul Okan Üniversitesi Lisansüstü Eğitim Enstitüsü — Lisansüstü Tez Yazım Kılavuzu (Mart 2026, rev. 05)
# Kaynak: https://www.okan.edu.tr/uploads/pages/tez-proje-yazim-kilavuzu/lisansustu-tez-yazim-kilavuzurev05.docx
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: okan-lee
version: 1
name: "İstanbul Okan Üniversitesi · Lisansüstü Eğitim Enstitüsü"
source: "Lisansüstü Tez Yazım Kılavuzu, Mart 2026"
institution: "İstanbul Okan Üniversitesi"
source_url: https://www.okan.edu.tr/uploads/pages/tez-proje-yazim-kilavuzu/lisansustu-tez-yazim-kilavuzurev05.docx

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 4 (basım) "A4 boyutunda (210x297 mm)"
  margins_cm: { top: 3.5, bottom: 2.5, left: 3.5, right: 2.5 }   # 1.1

fonts:
  allowed: [Times New Roman]    # 1.2 "Tezin tamamında Times New Roman"

roles:
  body:
    size_pt: 12                 # 1.2, Tablo 1.1 "Ana Metin 12 punto"
    line_spacing: 1.5           # 1.3, Tablo 1.1 "Bir buçuk aralık"
    alignment: justify          # 1.4 "ana metin ... iki yana yaslı"
    first_line_indent_cm: 1.25  # 1.6 "1 sekme (1,25 cm) girintili"
  heading_1:
    size_pt: 12                 # Tablo 1.2
    bold: true                  # Tablo 1.2 "kalın"
    all_caps: true              # Tablo 1.2 "büyük harfler ile"
    alignment: center           # Tablo 1.1, 1.2 "ortalanmış"
    line_spacing: 2.0           # Tablo 1.1 "Çift aralık"
    space_after_pt: 12          # Tablo 1.1, 1.2 "Başlık ile metin arasında 12 nk"
    page_break_before: true     # 3.3 "Her ana bölüm yeni bir sayfada başlar"
  heading_2:
    size_pt: 12                 # Tablo 1.2
    bold: true                  # Tablo 1.2
    alignment: justify          # Tablo 1.2 "iki yana yaslı"
    line_spacing: 2.0           # Tablo 1.2 "çift aralıklı"
    space_before_pt: 12         # Tablo 1.1 "ikinci derece ve üzeri başlıklardan önce 12 nk"
    case: title                 # Tablo 1.2 "her bir kelimenin ilk harfi büyük"
  heading_3:
    size_pt: 12                 # Tablo 1.2
    bold: true                  # Tablo 1.2
    italic: true                # Tablo 1.2 "kalın, italik"
    alignment: justify          # Tablo 1.2
    line_spacing: 2.0           # Tablo 1.2
    space_before_pt: 12         # Tablo 1.1
    case: title                 # Tablo 1.2
  table_caption:
    size_pt: 12                 # Tablo 1.1
    alignment: justify          # 1.4 "Tablo ve şekil başlıkları ... iki yana yaslı"
    position: above             # 2.1 "Tablo Başlığı, tablonun üstüne yazılır"
  figure_caption:
    size_pt: 12                 # Tablo 1.1
    alignment: justify          # 1.4
    position: below             # 2.1 "Şekil Başlığı ise, şeklin altına yazılır"
  footnote:
    size_pt: 10                 # Tablo 1.1 "Dipnot ... 10 punto"
    line_spacing: 1.0           # Tablo 1.1 "Tek aralık"
    alignment: justify          # Tablo 1.1, 1.4
  block_quote:
    alignment: justify          # 3.3.3 "iki yana yaslı"
    indent_left_cm: 1.0         # 3.3.3 "sağ ve soldan birer cm girinti"
  reference_entry:
    size_pt: 12                 # Tablo 1.1 "Kaynakça 12 punto"
    line_spacing: 2.0           # Tablo 1.1 "Çift aralık"
    alignment: justify          # Tablo 1.1

page_numbering:
  # 1.5: ön sayfalar küçük Romen, "Giriş"ten itibaren 1, 2, 3…
  formats_in_order: [lowerRoman, decimal]
  position: bottom_center       # 1.5 "sayfanın alt ortasında"
  forbid_decoration: true       # 1.5 "önünde ve arkasında parantez, çizgi vb. işaretler olmaz"

document:
  forbid_tracked_changes: true
