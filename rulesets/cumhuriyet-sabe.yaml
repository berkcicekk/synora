# Sivas Cumhuriyet Üniversitesi Sağlık Bilimleri Enstitüsü — Tez Yazım Kılavuzu (Sivas 2023)
# Kaynak: https://saglikbilenst.cumhuriyet.edu.tr/webdosya/217_tez_yazim_kilavuzu3d657c7fb8fa416870a82369d462407d.docx
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
# Not: Kılavuzda sayfa numaralandırma kuralı yok.
ruleset: cumhuriyet-sabe
version: 1
name: "Sivas Cumhuriyet Üniversitesi · Sağlık Bilimleri Enstitüsü"
source: "Sivas Cumhuriyet Üniversitesi Sağlık Bilimleri Enstitüsü Tez Yazım Kılavuzu, 2023"
institution: "Sivas Cumhuriyet Üniversitesi"
source_url: https://saglikbilenst.cumhuriyet.edu.tr/webdosya/217_tez_yazim_kilavuzu3d657c7fb8fa416870a82369d462407d.docx

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 1.1 "A4 boyutunda (21x29,7 cm)"
  margins_cm: { top: 3.0, bottom: 3.0, left: 4.0, right: 2.5 }   # 1.3 sol 4 cm, alt ve üst 3 cm, sağ 2,5 cm

fonts:
  allowed: [Times New Roman]    # 1.4

roles:
  body:
    size_pt: 12                 # 1.4 "12 punto"
    line_spacing: 1.5           # 1.4 "1.5 satır aralığı"
    alignment: justify          # 1.3 "iki yana yaslı formatında"
    first_line_indent_cm: 1.0   # 1.4 "paragraf başlangıçları 1 cm içerden"
  heading_1:
    size_pt: 12                 # 1.4 Başlık Şekilleri tablosu
    bold: true                  # 1.4
    all_caps: true              # 1.4 "sözcüklerin her harfi büyük"
    alignment: left             # 1.4 ana bölüm başlıkları "sola yaslı"
    page_break_before: true     # 1.4 "her biri yeni sayfadan başlamalıdır"
  heading_2:
    size_pt: 12                 # 1.4
    bold: true                  # 1.4
    case: title                 # 1.4 "sözcüklerin ilk harfi büyük", bağlaçlar küçük
    first_line_indent_cm: 1.0   # 1.4 "birinci ve ikinci alt başlıklar 1 cm içeriden"
  heading_3:
    size_pt: 12                 # 1.4
    bold: true                  # 1.4
    case: title                 # 1.4
    first_line_indent_cm: 1.0   # 1.4
  figure_caption:
    line_spacing: 1.5           # 1.8 "tüm açıklamaların yazımında 1.5 satır aralığı"
    position: below             # 1.8 "şeklin altına"
    space_before_pt: 6          # 1.4, 1.8 "şeklin alt kenarı arasında 6 nk"
  table_caption:
    line_spacing: 1.5           # 1.8
    position: above             # 1.8 "tablonun üstüne"
    space_after_pt: 6           # 1.4, 1.8 "tablonun üst kenarı arasında 6 nk"
  footnote:
    size_pt: 12                 # 1.7 "ana metin ile aynı puntoda"
    line_spacing: 1.0           # 1.7 "1.0 satır aralığı"

document:
  forbid_tracked_changes: true
