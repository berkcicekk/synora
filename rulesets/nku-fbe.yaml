# Tekirdağ Namık Kemal Üniversitesi Fen Bilimleri Enstitüsü — Lisansüstü Tez Yazım Kuralları Kılavuzu (Eylül 2021)
# Kaynak: http://euniversite.nku.edu.tr/kullanicidosyalari/581/files/YENI%20TEZ%20YAZIM%20KILAVUZU.pdf
#   (fbe.nku.edu.tr "Tez Yazım Kuralları Kılavuzu" sayfasındaki bağlantı)
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: nku-fbe
version: 1
name: "Tekirdağ Namık Kemal Üniversitesi · Fen Bilimleri Enstitüsü"
source: "TNKÜ Fen Bilimleri Enstitüsü Lisansüstü Tez Yazım Kuralları Kılavuzu, 2021"
institution: "Tekirdağ Namık Kemal Üniversitesi"
source_url: http://euniversite.nku.edu.tr/kullanicidosyalari/581/files/YENI%20TEZ%20YAZIM%20KILAVUZU.pdf

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 2.2 "A4 ebadındadır, (210x297 mm)"
  margins_cm: { top: 2.5, bottom: 2.5, left: 3.0, right: 2.0 }   # 2.3 üst ve alt 2,5 cm, sol 3,0 cm, sağ 2,0 cm

fonts:
  allowed: [Times New Roman]    # 5.4

roles:
  body:
    size_pt: 12                 # 5.4 "Times New Roman, 12 punto"
    line_spacing: 1.5           # 5.5 "12 nk ve 1,5 satır aralığı"
    alignment: justify          # 5.4 "iki yana yasla"
    first_line_indent_cm: 1.25  # 5.4 "ilk satır girintisi sol boşluk çerçevesinden 1,25 cm"
  heading_1:
    size_pt: 12                 # 5.2
    bold: true                  # 5.2 "koyu/kalın"
    all_caps: true              # 5.2 "tamamı büyük harf"
    alignment: justify          # 5.2 "iki yana yasla"
    line_spacing: 1.5           # 5.2 "12 nk ve 1,5 satır aralığı"
    page_break_before: true     # 5.3 "ana bölümler her zaman yeni sayfadan başlar"
  heading_2:
    size_pt: 12                 # 5.2
    bold: true                  # 5.2
    case: sentence              # 5.2 "sadece ilk harf büyük"
    alignment: justify          # 5.2
    line_spacing: 1.5           # 5.2
  heading_3:
    size_pt: 12                 # 5.2
    bold: false                 # 5.2 (üçüncü/dördüncü derece) "normal yazı karakteri ile italik"
    italic: true                # 5.2
    case: sentence              # 5.2 "sadece ilk harf büyük"
    alignment: justify          # 5.2
    line_spacing: 1.5           # 5.2
  figure_caption:
    size_pt: 12                 # 5.8
    bold: false                 # 5.8 "normal yazı karakteri"
    case: sentence              # 5.8 "sadece açıklamanın ilk kelimesinin ilk harfi büyük"
    alignment: justify          # 5.8 "iki yana yasla"
    first_line_indent_cm: 0     # 5.8 "girinti kullanılmaz"
    line_spacing: 1.0           # 5.8 "1(tek)"
    position: below             # 5.8 "şeklin altında"
  table_caption:
    size_pt: 12                 # 5.7
    bold: false                 # 5.7
    case: sentence              # 5.7
    alignment: justify          # 5.7
    first_line_indent_cm: 0     # 5.7
    line_spacing: 1.0           # 5.7
    position: above             # 5.7 "çizelgenin üzerinde"
  block_quote:
    size_pt: 12                 # 5.9
    line_spacing: 1.5           # 5.9 "12 nk ve 1,5 satır aralığı"
    alignment: justify          # 5.9
    indent_left_cm: 1.5         # 5.9 "sol boşluk çerçevesinden 1,5 cm girintili"
  reference_entry:
    size_pt: 12                 # 6.1
    first_line_indent_cm: -0.5  # 6.1 "ilk satırdan sonraki satırlar ... 0,5 cm girintili" (asılı)
  footnote:
    size_pt: 10                 # 5.10
    line_spacing: 1.0           # 5.10 "1 (tek) satır aralığı"
    alignment: justify          # 5.10
    first_line_indent_cm: 1.25  # 5.10 "ilk satır girintisi ... 1,25 cm"

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # 4.1.3 ön sayfalar küçük Romen; 5.6 GİRİŞ'ten itibaren 1, 2, 3
  position: bottom_center       # 4.1.3, 5.6 "sayfa sonunda ortalı"
  forbid_decoration: true       # 5.6 "önünde ve arka yanında ayıraç ..." kullanılmaz

document:
  forbid_tracked_changes: true
