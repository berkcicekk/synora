# Afyon Kocatepe Üniversitesi Fen Bilimleri Enstitüsü — Lisansüstü Tez / Proje Yazım Kılavuzu (2020)
# Kaynak: https://fenbil.aku.edu.tr/wp-content/uploads/sites/115/2020/12/FBE-Tez-Yazim-Kilavuzu-2020_WEB_icin-3.pdf
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: aku-fbe
version: 1
name: "Afyon Kocatepe Üniversitesi · Fen Bilimleri Enstitüsü"
source: "AKÜ FBE Lisansüstü Tez / Proje Yazım Kılavuzu, 2020"
institution: "Afyon Kocatepe Üniversitesi"
source_url: https://fenbil.aku.edu.tr/wp-content/uploads/sites/115/2020/12/FBE-Tez-Yazim-Kilavuzu-2020_WEB_icin-3.pdf

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 2.1 "A4 boyutlarında (21 cm x 29.7 cm)"
  margins_cm: { top: 3.0, bottom: 3.0, left: 3.0, right: 3.0 }   # 2.3 "sayfa kenarlarından 3 cm boşluk"

fonts:
  allowed: [Times New Roman]    # 2.2

roles:
  body:
    size_pt: 12                 # 2.2 "tezin tamamında 12 punto"
    line_spacing: 1.5           # 2.4 "1,5 satır aralığı"
    alignment: justify          # 2.3 "iki yana yaslı"
    first_line_indent_cm: 0     # 2.4 "paragraf başları sayfanın sol çerçeve kenarından ve boşluk bırakılmadan"
  heading_1:
    size_pt: 12                 # 2.8 "yazımda kullanılan punto (12 punto)"
    bold: true                  # 2.8 "koyu olarak"
    all_caps: true              # 2.8 "birinci derece bölüm başlıkları BÜYÜK HARF"
    alignment: left             # 4.3.1 "başlık sola yaslı olmalıdır"
    page_break_before: true     # 2.6, 2.8 "sayfa başından başlamalıdır"
  heading_2:
    size_pt: 12                 # 2.8
    bold: true                  # 2.8
    case: title                 # 2.8 "İlk Harfleri Büyük", bağlaçlar küçük
    alignment: left             # 2.4/2.8 "sol çerçeve kenarından ve boşluk bırakılmadan"
  heading_3:
    size_pt: 12                 # 2.8 "Tüm bölüm başlıkları ... 12 punto"
    bold: true                  # 2.8 "Tüm bölüm başlıkları ... koyu"
    alignment: left             # 2.8
  table_caption:
    size_pt: 11                 # 3.3 "1 aralık ve 11 punto"
    line_spacing: 1.0           # 3.3
    alignment: justify          # 3.3 "iki yana yaslı"
    position: above             # 3, 3.3 "Çizelge başlıkları çizelgenin üstüne"
  figure_caption:
    size_pt: 11                 # 3.3
    line_spacing: 1.0           # 3.3
    alignment: justify          # 3.3
    position: below             # 3, 3.3 "şekil ve resimlerin başlıkları ise bunların altına"
  reference_entry:
    # 4.x Kaynaklar: 2. ve sonraki satırlar asılı 1.25 cm — şemada karşılığı yok
    alignment: justify          # Kaynaklar "hizalama iki yana yaslı"
    line_spacing: 1.5           # Kaynaklar "Satır aralıkları 1.5 satır"
    space_before_pt: 6          # Kaynaklar "satır öncesinde 6 nk"
    space_after_pt: 0           # Kaynaklar "satır sonrasında 0 nk"

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # 2.7 ön sayfalar küçük Romen, Giriş'ten itibaren 1, 2, 3
  position: bottom_center       # 2.7 "sayfanın alt orta kısmına"
  forbid_decoration: true       # 2.7 "parantez ve çizgi kullanmadan"

document:
  forbid_tracked_changes: true
