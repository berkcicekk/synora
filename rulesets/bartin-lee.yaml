# Bartın Üniversitesi Lisansüstü Eğitim Enstitüsü Tez Yazım Kılavuzu (tezyazimkilavuzu4.docx; örnek tarihler 2025)
# Kaynak: https://cdn.bartin.edu.tr/lisansustu/3f1a0e3ef0ddba9bd4242dfbd8d952f4/tezyazimkilavuzu4.docx
# (lisansustu.bartin.edu.tr "Tez Yazım Kılavuzu" sayfası)
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: bartin-lee
version: 1
name: "Bartın Üniversitesi · Lisansüstü Eğitim Enstitüsü"
source: "Bartın Üniversitesi Lisansüstü Eğitim Enstitüsü Tez Yazım Kılavuzu, 2025"
institution: "Bartın Üniversitesi"
source_url: https://cdn.bartin.edu.tr/lisansustu/3f1a0e3ef0ddba9bd4242dfbd8d952f4/tezyazimkilavuzu4.docx

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 1.1.1
  margins_cm: { top: 2.5, bottom: 2.5, left: 3.0, right: 2.5 }   # 1.1.2

fonts:
  allowed: [Times New Roman]    # 1.1.3

roles:
  body:
    size_pt: 12                 # 1.1.3
    line_spacing: 1.5           # 1.1.3 "1,5 satır aralığında"
    first_line_indent_cm: 0     # 1.1.3 "paragraf başı için girinti yok"
    space_before_pt: 0          # 1.1.3 "önce ve sonra 0 nk"
    space_after_pt: 0           # 1.1.3
  heading_1:
    size_pt: 14                 # 1.1.6
    bold: true                  # 1.1.6
    all_caps: true              # 1.1.6 "tamamı" büyük harf
    alignment: center           # 1.1.6 "sayfaya ortalanarak"
  heading_2:
    size_pt: 12                 # 1.1.6
    bold: true                  # 1.1.6
    alignment: justify          # 1.1.6 "her iki yana yaslanarak"
    case: title                 # 1.1.6 "her kelimesinin yalnızca ilk harfi büyük"
  heading_3:
    size_pt: 12                 # 1.1.6
    bold: true                  # 1.1.6
    alignment: justify          # 1.1.6
    case: title                 # 1.1.6
  figure_caption:
    size_pt: 12                 # 1.1.3 (tanıtım yazıları küçültülemez)
    bold: false                 # 1.1.8 "koyu yazılmamalıdır"
    line_spacing: 1.0           # 1.1.3 "tek satır aralığında"
    case: sentence              # 1.1.8 "sadece cümle başlangıç kelimesinin ilk harfi büyük"
    position: below             # 1.1.8 "şekillerin altında"
  table_caption:
    size_pt: 12                 # 1.1.3
    bold: false                 # 1.1.8
    line_spacing: 1.0           # 1.1.3
    case: sentence              # 1.1.8
    position: above             # 1.1.8 "tabloların ise üstünde"
  block_quote:
    size_pt: 10                 # 1.1.3 "Kırk kelimeden uzun ... 10 punto"
  reference_entry:
    line_spacing: 1.0           # 1.1.3
  footnote:
    line_spacing: 1.0           # 1.1.3

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # 1.1.5
  position: bottom_center       # 1.1.5 "alt kısmında yazım alanına göre tam ortalanarak"

document:
  forbid_tracked_changes: true
