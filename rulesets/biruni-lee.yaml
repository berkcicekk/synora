# Biruni Üniversitesi Lisansüstü Eğitim Enstitüsü — Tez Yazım Kılavuzu (2025)
# Kaynak: https://lisansustu.biruni.edu.tr/wp-content/uploads/2025/04/SON-Lisansustu-Egitim-Enstitusu-Tez-Yazim-Kilavuzu.pdf
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: biruni-lee
version: 1
name: "Biruni Üniversitesi · Lisansüstü Eğitim Enstitüsü"
source: "Biruni Üniversitesi Lisansüstü Eğitim Enstitüsü Tez Yazım Kılavuzu, 2025"
institution: "Biruni Üniversitesi"
source_url: "https://lisansustu.biruni.edu.tr/wp-content/uploads/2025/04/SON-Lisansustu-Egitim-Enstitusu-Tez-Yazim-Kilavuzu.pdf"

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 1.1 "standart A4 boyutunda"
  margins_cm: { top: 2.5, bottom: 2.5, left: 4.0, right: 2.5 }   # 1.2

fonts:
  allowed: [Times New Roman]    # 1.4

roles:
  body:
    size_pt: 12                 # 1.4 "Times New Roman yazı tipi ve 12 punto"
    line_spacing: 1.5           # 1.3 "standart satır aralığı 1.5"
    alignment: justify          # 1.3 "iki yana yaslanmış"
    first_line_indent_cm: 1.2   # 1.3 "ilk satırı ... 1.2 cm girinti"
    space_before_pt: 0          # 1.3 "satır aralık değeri 0 nk"
    space_after_pt: 0           # 1.3
  heading_1:
    size_pt: 14                 # 1.4 "ön ve ana bölüm başlıkları 14"
    bold: true                  # 1.5 "Tüm başlıklar koyu"
    all_caps: true              # 1.5 "ana bölüm başlıklarının tamamı büyük harflerle"
    alignment: center           # 1.5 "sayfa ortalanarak"
    page_break_before: true     # 1.5 "Her bir bölüm ayrı sayfadan başlamalıdır"
  heading_2:
    size_pt: 12                 # 1.4 "diğer bütün başlıklar 12 punto"
    bold: true                  # 1.5
    alignment: left             # 1.5 "diğer tüm başlıklar ise satır başına dayalı"
    # 1.5 tablosu PDF'te kaymış görünüyor; büyük/küçük harf kuralı güvenle okunamadı → denetlenmez
  heading_3:
    size_pt: 12                 # 1.4
    bold: true                  # 1.5
    alignment: left             # 1.5
  figure_caption:
    position: below             # 1.8 "şekil ve/veya resmin altına"
  table_caption:
    position: above             # 1.8 "tablonun üstüne"
  block_quote:
    size_pt: 11                 # 1.9 "tek satır aralığı ve 11 punto"
    line_spacing: 1.0           # 1.9
  footnote:
    size_pt: 10                 # 1.9 "10 puntoyla tek satır aralığı"
    line_spacing: 1.0           # 1.9

page_numbering:
  # 1.6: ön sayfalar küçük Romen (iii'den), Giriş ve Amaç'tan itibaren 1, 2, 3
  formats_in_order: [lowerRoman, decimal]
  position: bottom_right        # 1.6 ana bölümler "alt kısmına, sağ kenara" (ön bölümlerde "sağ üst köşe")
  forbid_decoration: true       # 1.6 "ayıraç, çizgi gibi işaretler kullanılmamalı"

document:
  forbid_tracked_changes: true
