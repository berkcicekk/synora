ruleset: cag-sbe
version: 1
name: "Çağ Üniversitesi · Sosyal Bilimler Enstitüsü"
source: "Çağ Üniversitesi Sosyal Bilimler Enstitüsü Tez Yazım Kılavuzu, tarihsiz (2025 sonrası)"
institution: "Çağ Üniversitesi"
source_url: https://www.cag.edu.tr/uploads/site/users-special/d1c38a09acc34845c6be3a127a5aacaf/files/Tez%20Yaz%C4%B1m%20K%C4%B1lavuzu(1).pdf

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 1.1
  margins_cm: { top: 2.54, bottom: 2.54, left: 3.54, right: 2.54 }   # 1.2 (sol 2,54 + 1 cm cilt payı)

fonts:
  allowed: [Times New Roman]    # 1.4

roles:
  body:
    size_pt: 12                 # 1.4
    line_spacing: 1.5           # 1.5
    alignment: justify          # 1.5 "İki yana yaslı"
    first_line_indent_cm: 0.5   # 1.6
  heading_1:
    bold: true                  # 2.1 "kalın/bold"
    all_caps: true              # 2.1 "TAMAMI BÜYÜK HARF"
    alignment: left             # 2.1 "Sola yaslı"
  heading_2:
    bold: true                  # 2.1
    case: title                 # 2.1 "Her sözcüğün yalnızca ilk harfi büyük"
  heading_3:
    bold: true                  # 2.1 alt başlıklar
    case: title                 # 2.1
  table_caption:
    position: above             # Tablo ve Şekiller "Tablonun üstünde kalın tablo numarası"
  footnote:
    size_pt: 10                 # 1.4
    line_spacing: 1.0           # 1.4 "tek satır aralığı"
  reference_entry:
    line_spacing: 1.5           # 1.5 "Metin ve kaynakça: 1,5 satır aralığı"

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # 1.3
  position: top_right           # 1.3 "Sağ üst köşede"

document:
  forbid_tracked_changes: true
