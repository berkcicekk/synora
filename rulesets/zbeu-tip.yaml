# ZBEÜ Tıp Fakültesi — Tıpta Uzmanlık Öğrencileri için Tez Yazım Kılavuzu (2019)
# Kaynak: https://cdn3.beun.edu.tr/tip//zbeu-tipta-uzmanlik-ogrencileri-icin-tez-yazim-kilavuzu.pdf
# Madde madde eşleme, kapsanmayan kurallar ve kılavuzdaki çelişkiler: rulesets/zbeu-tip.md
ruleset: zbeu-tip
version: 1
name: ZBEÜ Tıp Fakültesi · Tıpta Uzmanlık Tezi
source: ZBEÜ Tıp Fakültesi Tez Yazım Kılavuzu, Zonguldak 2019

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 3.1
  orientation: portrait
  # 3.4: sol 4 cm, üst/alt 3 cm, sağ 2,5 cm. (Şekil 1'de "Soldan 3 cm" yazıyor: çelişki, md'ye bakın.)
  margins_cm: { top: 3.0, bottom: 3.0, left: 4.0, right: 2.5 }

fonts:
  allowed: [Times New Roman]    # 3.3

roles:
  body:
    size_pt: 12                 # 3.3
    line_spacing: 1.5           # 3.6
    alignment: justify          # 3.4 "her iki yanda aynı hizada bloklanmalı"
    first_line_indent_cm: 1.0   # 3.6 (Şekil 1'de "1.5 cm": çelişki, md'ye bakın)
  heading_1:
    size_pt: 14                 # 3.3 (3.8 "metinle aynı puntoda" ile çelişiyor)
    bold: true                  # 3.8
    all_caps: true              # 3.8 "tamamı büyük harf"
    alignment: center           # 3.8 "sayfa ortalanarak"
    page_break_before: true     # 3.6 "sayfa başı yapılmalıdır"
  heading_2:
    size_pt: 12                 # 3.3
    bold: true                  # 3.8
    alignment: left             # 3.8 "sol bloğa yaslanarak"
  heading_3:
    size_pt: 12                 # 3.3
    bold: true                  # 3.8
    alignment: left             # 3.8
  figure_caption:
    line_spacing: 1.5           # 3.6
  table_caption:
    line_spacing: 1.5           # 3.6
  block_quote:
    line_spacing: 1.5           # 3.6
  reference_entry:
    line_spacing: 1.5           # 3.6 "kaynaklar diziminin yazımında 1.5"
  footnote:
    size_pt: 10                 # 3.3
    line_spacing: 1.0           # 3.6, 3.13

page_numbering:
  # 3.5: ön sayfalar küçük Roma rakamı (ii, iii…), "Giriş"ten itibaren 1, 2, 3…
  formats_in_order: [lowerRoman, decimal]

document:
  forbid_tracked_changes: true
