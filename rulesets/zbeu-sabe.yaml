# Zonguldak Bülent Ecevit Üniversitesi Sağlık Bilimleri Enstitüsü — Tez Yazım Kılavuzu (Haziran 2008)
# Kaynak: http://cdn1.beun.edu.tr/sabe//tezyazimkilvuzuzbeu.pdf  (enstitü sitesinde güncel bağlantı olarak duruyor)
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: zbeu-sabe
version: 1
name: "ZBEÜ · Sağlık Bilimleri Enstitüsü"
source: "ZBEÜ Sağlık Bilimleri Enstitüsü Tez Yazım Kılavuzu, 2008"
institution: "Zonguldak Bülent Ecevit Üniversitesi"
source_url: http://cdn1.beun.edu.tr/sabe//tezyazimkilvuzuzbeu.pdf

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 1.1 "A4 boyutlarında (210 mm x 297 mm)"
  margins_cm: { top: 2.5, bottom: 2.5, left: 4.0, right: 2.5 }   # 1.3 sol 4 cm, alt ve üst 2,5 cm, sağ 2,5 cm

fonts:
  allowed: [Times New Roman]    # 1.2

roles:
  body:
    size_pt: 12                 # 1.2 "ana metnin harf büyüklüğü 12 punto"
    line_spacing: 1.5           # 1.5
    alignment: justify          # 1.3 "tüm satırlar çerçeve hizasında ... aynı hizada bloklanmalıdır"
    first_line_indent_cm: 1.25  # 1.3 "paragrafın ilk satırları 1,25 cm içeriden"
  heading_1:
    bold: true                  # 1.7 "kalın yazılmalıdır"
    all_caps: true              # 1.7 "BÜYÜK HARF"
    alignment: left             # 1.7 "başlık sola hizalanır"
    page_break_before: true     # 1.5 "sayfa başında yer almalı"
  heading_2:
    bold: true                  # 1.7
    case: title                 # 1.7 "her sözcüğün ilk harf büyük"
    alignment: left             # 1.7
  heading_3:
    bold: true                  # 1.7
    case: sentence              # 1.7 "yalnızca ilk sözcüğün ilk harf büyük"
    alignment: left             # 1.7
  figure_caption:
    line_spacing: 1.5           # 1.5, 5.3 "1,5 tam satır aralığı"
    position: below             # 5.3 "şeklin altına"
    space_before_pt: 6          # 1.5, 5.3 "şeklin alt kenarı arasında 6 punto"
  table_caption:
    line_spacing: 1.5           # 1.5, 5.3
    position: above             # 5.3 "tablonun üstüne"
    space_after_pt: 6           # 1.5, 5.3 "tablonun üst kenarı arasında 6 punto"
  block_quote:
    line_spacing: 1.5           # 1.5 "alıntılar ... aynı aralık"
  reference_entry:
    line_spacing: 1.5           # 1.5 "kaynaklar dizininin yazımında da aynı aralık"
  footnote:
    size_pt: 10                 # 1.2, 1.11
    line_spacing: 1.0           # 1.5, 1.11

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # 1.4 ön sayfalar küçük Romen, girişten itibaren 1, 2, 3
  position: bottom_center       # 1.4 "sayfa altında kalarak metin bloğu ortasına"
  forbid_decoration: true       # 1.4 "yanlarında parantez vb. bulunmamalıdır"

document:
  forbid_tracked_changes: true
