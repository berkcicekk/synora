# Kütahya Sağlık Bilimleri Üniversitesi Lisansüstü Eğitim Enstitüsü — Tez Yazım Kılavuzu (2024)
# Kaynak: https://medya.ksbu.edu.tr/duyuru_medya/uploads/18/1869ef266f5b05d_LEE%20Tez%20Yazim%20Kilavuzu%20(1).docx
# (LEE "Tez Yazım Kılavuzu" sayfasından bağlanan .docx; kapakta yıl "20..", dosya tarihi Ocak 2024)
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: ksbu-lee
version: 1
name: "Kütahya Sağlık Bilimleri Üniversitesi · Lisansüstü Eğitim Enstitüsü"
source: "KSBÜ Lisansüstü Eğitim Enstitüsü Tez Yazım Kılavuzu, 2024"
institution: "Kütahya Sağlık Bilimleri Üniversitesi"
source_url: https://medya.ksbu.edu.tr/duyuru_medya/uploads/18/1869ef266f5b05d_LEE%20Tez%20Yazim%20Kilavuzu%20(1).docx

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                                  # 2.1
  # 2.13: sol 3, sağ 2,5, üst/alt 3 cm; ayrıca tek sayfalarda soldan, çift sayfalarda sağdan 1,5 cm cilt payı (gutter)
  margins_cm: { top: 3.0, bottom: 3.0, left: 3.0, right: 2.5 }

fonts:
  allowed: [Times New Roman]                # 2.4

roles:
  body:
    size_pt: 12                             # 2.4
    line_spacing: 1.5                       # 2.5 "Ana metinde satır araları 1,5 satır"
    alignment: justify                      # 2.5 "iki yana yaslı"
    space_after_pt: 12                      # 2.13 "her paragraftan sonra 12 puntoluk aralık"
    # ÇELİŞKİ: 2.5 "paragraflar girintisiz", 2.13 "her yeni paragraf 1,25 cm içeriden" → girinti denetlenmez
  heading_1:
    size_pt: 14                             # 2.14
    bold: true                              # 2.14
    all_caps: true                          # 2.14 "büyük harfler ile"
    alignment: left                         # 2.14 "metin bloğu sol kenarından"
  heading_2:
    size_pt: 12                             # 2.14
    bold: true                              # 2.14
    all_caps: true                          # 2.14 "büyük harflerle"
    alignment: left                         # 2.14
  heading_3:
    size_pt: 12                             # 2.14
    bold: true                              # 2.14
    case: title                             # 2.14 "her kelimenin ilk harfi büyük"
    alignment: left                         # 2.14
  figure_caption:
    size_pt: 12                             # 2.9 "Tüm açıklamaların yazımında 12 punto"
    line_spacing: 1.0                       # 2.5, 2.9 "tek satır aralığı"
    alignment: center                       # 2.9 "sol ve sağ kenarları arasında ortalanmalıdır"
    space_before_pt: 6                      # 2.9 "şeklin alt kenarı arasında 6 nk"
    position: below                         # 2.9 "şeklin altında"
  table_caption:
    size_pt: 12                             # 2.9
    line_spacing: 1.0                       # 2.5, 2.9
    alignment: left                         # 2.9 "metin alanı satır başından başlatılmalıdır"
    space_after_pt: 6                       # 2.9 "tablonun üst kenarı arasında 6 nk"
    position: above                         # 2.9 "tablonun üstüne"
  block_quote:
    line_spacing: 1.0                       # 2.5 "alıntılar ... tek satır aralığı"
  footnote:
    size_pt: 10                             # 2.4, 2.12

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # 2.3
  position: bottom_center                   # 2.3 "sayfanın alt kısmında ve ortalı"
  forbid_decoration: true                   # 2.3 "çizgi vb. bir karakter konulmaz"

document:
  forbid_tracked_changes: true
