# Akdeniz Üniversitesi Fen Bilimleri Enstitüsü Tez Yazım Kılavuzu (Ağustos 2017)
# Kaynak: https://webis.akdeniz.edu.tr/file/getfile?guid=5c06d90e-2c44-4e6a-b5ac-a4af700fe773
# (fenbilim.akdeniz.edu.tr "Tez Yazım Kuralları" sayfasındaki "TEZ YAZIM KILAVUZU (Pdf)")
# Erişim: 2026-10-18
# Otomatik çıkarıldı; enstitü tarafından doğrulanmadı.
ruleset: akdeniz-fbe
version: 1
name: "Akdeniz Üniversitesi · Fen Bilimleri Enstitüsü"
source: "Akdeniz Üniversitesi Fen Bilimleri Enstitüsü Tez Yazım Kılavuzu, 2017"
institution: "Akdeniz Üniversitesi"
source_url: https://webis.akdeniz.edu.tr/file/getfile?guid=5c06d90e-2c44-4e6a-b5ac-a4af700fe773

tolerance:
  length_cm: 0.05
  size_pt: 0.25
  spacing_pt: 0.5
  line_multiple: 0.05

page:
  size: A4                      # 2.1
  margins_cm: { top: 3.0, bottom: 3.0, left: 4.0, right: 2.0 }   # 2.3

fonts:
  allowed: [Times New Roman]    # 2.2

roles:
  body:
    size_pt: 12                 # 2.2
    line_spacing: 1.0           # 2.6 "TEK satır aralığı"
    alignment: justify          # 2.4 sola dayalı, "sağ kenarda ... aynı hizada"
    first_line_indent_cm: 1.25  # 2.4 "1 sekme (1.25 cm)"
    space_before_pt: 0          # 2.6 "önce 0 nk"
    space_after_pt: 12          # 2.6 "sonra 12 nk"
  heading_1:
    size_pt: 12                 # 2.8
    all_caps: true              # 2.8 "BÜYÜK HARF"
    alignment: left             # 2.4 "başlıkları ... sola dayandırılmalıdır"
    line_spacing: 1.0           # 2.6
    space_before_pt: 0          # 2.6
    space_after_pt: 12          # 2.6
    page_break_before: true     # 2.6 "Bölümler daima yeni bir sayfanın başından başlamalıdır"
  heading_2:
    size_pt: 12                 # 2.2
    alignment: left             # 2.4
    case: title                 # 2.8 "her kelimenin ilk harfi büyük"
    line_spacing: 1.0           # 2.6
    space_before_pt: 0          # 2.6
    space_after_pt: 12          # 2.6
  heading_3:
    size_pt: 12                 # 2.2
    alignment: left             # 2.4
    case: sentence              # 2.8 "başlığın ilk harfi BÜYÜK HARF, diğerleri küçük"
    line_spacing: 1.0           # 2.6
    space_before_pt: 0          # 2.6
    space_after_pt: 12          # 2.6
  figure_caption:
    line_spacing: 1.0           # 3.3 "bir satır aralığı"
    position: below             # 2.4 Şekil 2.1, 3.3 "şekil altyazısı"
  table_caption:
    line_spacing: 1.0           # 3.3
    position: above             # 3.3 "çizelgenin üstüne"
  block_quote:
    line_spacing: 1.0           # 2.10 "bir aralık"
    indent_left_cm: 1.25        # 2.10 "normal paragrafın satırbaşı hizasından"
  reference_entry:
    line_spacing: 1.0           # 2.6
    space_before_pt: 0          # 2.6
    space_after_pt: 6           # 2.6 "önce 0 nk sonra 6 nk"
  footnote:
    line_spacing: 1.0           # 2.11 "bir aralık"

page_numbering:
  formats_in_order: [lowerRoman, decimal]   # 2.7
  position: bottom_center       # 2.7 "sayfa altında orta kısma"
  forbid_decoration: true       # 2.7 "ayıraç, çizgi vb. ... kullanılmamalıdır"

document:
  forbid_tracked_changes: true
