[project]
name = "synora"
version = "0.1.0"
description = ".docx tezleri enstitü yazım kılavuzuna göre denetleyen ve düzelten araç"
requires-python = ">=3.12"
dependencies = [
    "lxml>=5.3",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
synora = "synora.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "lxml-stubs>=0.5",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synora"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "TID"]
# S101: assert testlerde serbest. RUF001-003: Türkçe metinde ı, İ gibi harfler meşru.
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"xml.etree".msg = "XML yalnızca synora.xmlsafe.parse() ile okunur."
"xml.dom".msg = "XML yalnızca synora.xmlsafe.parse() ile okunur."
"xml.sax".msg = "XML yalnızca synora.xmlsafe.parse() ile okunur."

[tool.ruff.lint.extend-per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
plugins = ["pydantic.mypy"]
